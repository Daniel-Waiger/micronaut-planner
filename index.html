// (engine/llmschema.js built the schema) into the SAME proposal shape
// engine/freetext.js already produces, so ui/steps/describe.js's existing
// review list renders both without knowing which tier a proposal came from.
//
// Every proposal is tagged 'llm_freetext' (PROVISIONAL, core/provenance.js).
// This module NEVER writes to the store -- canOverwrite then structurally
// guarantees a model proposal can never clobber a value the user actually
// typed, exactly as freetext.js's WEAK 'freetext' tier already relies on.
//
// BELT AND BRACES, deliberately: constrained decoding should already make
// an out-of-vocabulary value impossible, but every value is re-checked
// against the question's own `options` here anyway. Three reasons that is
// not redundant: a provider may not honor `format` (the manual-paste
// adapter definitely does not -- a human pastes that reply back by hand),
// a schema can be mis-built, and a future provider may be added that
// silently ignores the constraint. The vocabulary check belongs where the
// data enters the app, not where we hope it was enforced.
//
// Leaf module: import nothing (the question list is passed in, from
// interview.js's loadQuestions, rather than read from a global here) --
// same discipline as freetext.js's `index` parameter.

const PROPOSAL_TAG = 'llm_freetext';

function proposalIssue(field, message) {

/**
 * Index the question bank by the field path each question writes to. The
 * model's descriptors address a `path`, not a question id (that is what
 * llmschema.js pins with `const`), so this is the lookup that reconnects a
 * returned descriptor to the question whose vocabulary it must satisfy.
 */

  const map = new Map();
  for (const question of Array.isArray(questions) ? questions : []) {
    if (question && typeof question.field === 'string') {

 * a non-empty options array is the ONLY case that constrains the value --
 * matching valueSchemaFor in engine/llmschema.js exactly, so what the schema
 * asks for and what this accepts can never disagree.
 *
 * `allowOther` deliberately does NOT relax this. A human picking "Other..."
 * is asserting a fact about their own experiment; a model emitting a value
 * outside the curated list is doing the one thing this whole tier exists to
 * prevent. The escape hatch is the user's, not the model's.

    Array.isArray(question.options) &&

 * `questions` is engine/interview.js's loadQuestions(...).questions.
 *
 * TOTAL: never throws. A malformed reply, a descriptor addressing an unknown
 * path, or a value outside the question's vocabulary is DROPPED and reported
 * in `issues` -- never silently kept, and never fatal to the other
 * proposals in the same reply. Same posture as loadQuestions: one bad entry
 * costs you that entry, not the whole batch.

 * model's, so the review list's ordering is a property of the app (stable,
 * reproducible) rather than of whatever order a model happened to emit.

  const rawList = reply && typeof reply === 'object' && Array.isArray(reply.proposals) ? reply.proposals : null;
  if (!rawList) {
    return {
      proposals: [],
      issues: [proposalIssue('proposals', 'model reply had no `proposals` array')],
    };

  const accepted = new Map();
  rawList.forEach((entry, index) => {
    if (entry === null || typeof entry !== 'object' || Array.isArray(entry)) {
      issues.push(proposalIssue(`[${index}]`, 'proposal entry is not an object'));
      return;
    }
    const path = typeof entry.path === 'string' ? entry.path.trim() : '';
    if (!path) {
      issues.push(proposalIssue(`[${index}]`, 'proposal is missing a non-empty path'));
      return;

    const question = questionByField.get(path);
    if (!question) {
      issues.push(proposalIssue(path, `no question writes to '${path}' -- proposal dropped`));
      return;

    if (entry.value === undefined || entry.value === null || entry.value === '') {
      issues.push(proposalIssue(path, 'proposal has no value'));
      return;

    if (value === null) {
      issues.push(proposalIssue(path, `'${String(entry.value)}' is not a number -- proposal dropped`));
      return;
    }

    // ways. Keeping the first and reporting the rest is the only choice that
    // does not silently pick a winner.
    if (accepted.has(path)) {
      issues.push(proposalIssue(path, 'duplicate proposal for this path -- kept the first'));
      return;
    }

    accepted.set(path, {
      path,
      value,
      // Always this module's own tag, never `entry.tag` -- a reply is data,
      // not an authority on its own trust level. Echoing a model-supplied
      // tag would let a malformed (or adversarial) reply claim 'user' and
      // walk straight past canOverwrite's provenance gate.
      tag: PROPOSAL_TAG,

      prompt: question.prompt,
      // Shaped like freetext.js's proposals so describe.js's row renderer
      // needs no branch: `evidence` is what justified this value. The model
      // reasoned over the user's own paragraph, so the honest evidence
      // string is the question it answered, not a text span it never cited.
      evidence: question.prompt,
      confidence: 0.5,
    });
  });

  // Question-bank order, not model order (see the docstring).
  const proposals = [];
  for (const question of Array.isArray(questions) ? questions : []) {
    const hit = question && accepted.get(question.field);
    if (hit) proposals.push(hit);
  }

  return { proposals, issues };
}

// Advisory items never write to the store, so they need none of the
// vocabulary/provenance machinery above -- there is no field to clobber and
// no tag to launder. What they DO need is a size cap: this is the one place
// in the app that renders raw model-sourced text (via textContent, never
// innerHTML -- see ui/steps/describe.js), and a hostile or malfunctioning
// reply padding this array is a rendering-cost problem, not a write-safety
// one. The caps exist for that reason alone.
const MAX_ASKS = 12;
const MAX_ASK_TEXT_CHARS = 300;

function clampAskText(value, maxChars) {
  if (typeof value !== 'string') return '';
  const trimmed = value.trim();
  return trimmed.length > maxChars ? `${trimmed.slice(0, maxChars)}…` : trimmed;
}

/**
 * Parse the advisory half of a model reply: things the researcher still
 * needs to decide or measure that engine/render/llmdraftprompt.js's prompt
 * asked the model to name (the study question, Nyquist sampling, controls
 * fit, spectral overlap) plus anything else it flags. `reply` is the SAME
 * parsed object parseLlmProposals(reply, ...) receives -- call both over one
 * reply, independently; a malformed `asks` array does not affect proposals
 * or vice versa.
 *
 * TOTAL: never throws. Returns `{asks, issues}`, same issue shape as
 * parseLlmProposals, so a caller can render both lists' problems through one
 * code path.
 */
function parseLlmAsks(reply) {
  const issues = [];
  const rawList = reply && typeof reply === 'object' && Array.isArray(reply.asks) ? reply.asks : null;
  if (!rawList) {
    // No `asks` key, or the wrong shape, is a normal and common reply --
    // engine/render/llmdraftprompt.js's contract states "asks: [] is valid
    // if nothing applies" -- so this is reported only when the key was
    // present but malformed, never for a simple absence.
    if (reply && typeof reply === 'object' && 'asks' in reply) {
      issues.push(proposalIssue('asks', "'asks' was present but was not an array"));
    }
    return { asks: [], issues };
  }

  const asks = [];
  rawList.forEach((entry, index) => {
    if (entry === null || typeof entry !== 'object' || Array.isArray(entry)) {
      issues.push(proposalIssue(`asks[${index}]`, 'ask entry is not an object'));
      return;
    }
    const topic = clampAskText(entry.topic, MAX_ASK_TEXT_CHARS);
    if (!topic) {
      issues.push(proposalIssue(`asks[${index}]`, 'ask is missing a non-empty topic'));
      return;
    }
    if (asks.length >= MAX_ASKS) {
      // Reported once, not once per excess entry: a reply padding this
      // array with dozens of entries should not also pad `issues` in
      // lockstep -- one clear "the rest were dropped" beats a wall of them.
      if (!issues.some((issue) => issue.field === 'asks')) {
        issues.push(proposalIssue('asks', `more than ${MAX_ASKS} asks -- the rest were dropped`));
      }
      return;
    }
    asks.push({
      topic,
      why: clampAskText(entry.why, MAX_ASK_TEXT_CHARS),
    });
  });

  return { asks, issues };
}
  // ---- src/engine/llmreply.js ----
// Pulls a JSON object out of whatever a chat LLM actually pasted back.
//
// The Ollama path gets clean JSON because `format` constrains decoding at the
// token level (engine/llmschema.js -> llm/ollama.js). A human pasting a reply
// from ChatGPT/Claude/Gemini has no such guarantee: real replies arrive
// wrapped in ```json fences, prefixed with "Sure! Here's the JSON:", followed
// by "Let me know if you'd like me to adjust anything!", and occasionally
// with curly quotes courtesy of an intermediate rich-text paste. This module
// is the one place that mess is dealt with, so engine/llmproposals.js can go
// on receiving an already-parsed object and stay exactly as strict as it is.
//
// DELIBERATELY NOT A RELAXED JSON PARSER. `{proposals:[...]}` (unquoted keys)
// fails here with a reported issue rather than being accepted. A permissive
// hand-rolled parser is both an attack surface and a silent-corruption risk on
// untrusted input, and the copy-out prompt (engine/render/llmdraftprompt.js)
// exists precisely to stop that case arising. The repairs below are narrow,
// last-resort, gated on the repaired text actually parsing, and every one of
// them is REPORTED rather than applied silently.
//
// Leaf module: imports nothing.

// A paste this big is not a model reply, and step "balanced scan" below is
// O(n * starts) -- the cap is what keeps a pathological paste from hanging
// the tab rather than a guess about how much anyone would legitimately paste.
const MAX_PASTE_CHARS = 1000000;

// How many `{`/`[` positions the balanced scan will try before giving up.
// Prose containing many braces is the case this bounds.
const MAX_CANDIDATE_STARTS = 200;

// Matches engine/llmproposals.js's issue shape exactly, so a caller can render
// issues from both modules through one code path. The codebase only uses
// 'error' and 'fatal'; a repair is NOT an error and goes in `repairs` instead.
function replyIssue(field, message) {
  return { field, message, severity: 'error' };
}

function isJsonObject(value) {
  return value !== null && typeof value === 'object' && !Array.isArray(value);
}

function tryParseJson(text) {
  try {
    return { ok: true, value: JSON.parse(text) };
  } catch {
    return { ok: false, value: null };
  }
}

// Edges only, never the interior: a BOM or stray zero-width character from a
// rich-text paste breaks JSON.parse at position 0, but the same characters
// inside a string value are legitimate content we must not touch.
function trimReplyEdges(text) {
  return text.replace(/^[﻿​‌‍\s]+/, '').replace(/[﻿​‌‍\s]+$/, '');
}

// Bodies of ``` fences, with or without a language tag. Tried before the
// free-text scan because prose routinely contains stray braces and a fence is
// a much stronger signal of "the model meant this part as code".
function fencedReplyBodies(text) {
  const bodies = [];
  const fence = /```[^\n`]*\n([\s\S]*?)```/g;
  let match = fence.exec(text);
  while (match !== null) {
    bodies.push(match[1]);
    match = fence.exec(text);
  }
  return bodies;
}

/**
 * The slice from `startIndex` to its matching close, or null if unbalanced.
 *
 * String-literal and escape aware, which is the entire point: a naive
 * "find the last }" truncates `{"value":"n=3 }} weird"}` at the wrong place,
 * and a naive depth counter that ignores \" mis-tracks `{"value":"the \" mark"}`.
 * Only the delimiter that opened the slice is counted, so a `]` inside an
 * object cannot close it.
 */
function scanBalancedSlice(text, startIndex) {
  const open = text[startIndex];
  const close = open === '{' ? '}' : ']';
  let depth = 0;
  let inString = false;
  let escaped = false;

  for (let i = startIndex; i < text.length; i += 1) {
    const ch = text[i];
    if (escaped) {
      escaped = false;
      continue;
    }
    if (ch === '\\') {
      if (inString) escaped = true;
      continue;
    }
    if (ch === '"') {
      inString = !inString;
      continue;
    }
    if (inString) continue;
    if (ch === open) {
      depth += 1;
    } else if (ch === close) {
      depth -= 1;
      if (depth === 0) return text.slice(startIndex, i + 1);
    }
  }
  return null;
}

// Every balanced {...} / [...] slice in the text, outermost-first by position.
// `truncated` reports that the start cap was hit, so the caller can say "gave
// up looking" instead of silently reporting "no JSON found".
function balancedReplyCandidates(text) {
  const slices = [];
  let starts = 0;
  for (let i = 0; i < text.length; i += 1) {
    const ch = text[i];
    if (ch !== '{' && ch !== '[') continue;
    starts += 1;
    if (starts > MAX_CANDIDATE_STARTS) return { slices, truncated: true };
    const slice = scanBalancedSlice(text, i);
    if (slice !== null) {
      slices.push(slice);
      // Skip past this slice: its interior braces are part of a candidate we
      // already captured, and re-scanning them is what would make this
      // quadratic on deeply nested input.
      i += slice.length - 1;
    }
  }
  return { slices, truncated: false };
}

// Curly DOUBLE quotes only. Curly SINGLE quotes are deliberately left alone:
// an apostrophe inside a string value ("doesn't") is perfectly valid JSON, so
// "fixing" it would corrupt content to solve a problem that does not exist.
function repairCurlyQuotes(text) {
  return text.replace(/[“”]/g, '"');
}

// A comma directly before } or ] -- the single most common hand-edit and
// small-model mistake. String-aware, so a comma inside "a, b" survives.
function repairTrailingCommas(text) {
  let out = '';
  let inString = false;
  let escaped = false;

  for (let i = 0; i < text.length; i += 1) {
    const ch = text[i];
    if (escaped) {
      out += ch;
      escaped = false;
      continue;
    }
    if (ch === '\\') {
      out += ch;
      if (inString) escaped = true;
      continue;
    }
    if (ch === '"') {
      inString = !inString;
      out += ch;
      continue;
    }
    if (!inString && ch === ',') {
      let j = i + 1;
      while (j < text.length && /\s/.test(text[j])) j += 1;
      if (text[j] === '}' || text[j] === ']') continue; // drop the comma
    }
    out += ch;
  }
  return out;
}

/**
 * Pick the best parsed candidate.
 *
 * Order is deliberate. An object carrying `requireKey` beats everything --
 * that is the reply we asked for. A bare array beats a keyless object next,
 * because "the model returned just the array" is a common and recoverable
 * mistake while a stray `{}` in prose is noise that would otherwise win by
 * position alone.
 */
function chooseReplyCandidate(values, requireKey) {
  if (requireKey) {
    const keyed = values.find((v) => isJsonObject(v) && Object.prototype.hasOwnProperty.call(v, requireKey));
    if (keyed) return { value: keyed, wrapped: false };

    const array = values.find((v) => Array.isArray(v));
    if (array) return { value: { [requireKey]: array }, wrapped: true };
  }
  const object = values.find(isJsonObject);
  if (object) return { value: object, wrapped: false };
  return null;
}

// All parseable candidates from one body of text, in priority order:
// the whole thing, then fenced blocks, then balanced slices.
function collectReplyCandidates(text) {
  const values = [];
  const whole = tryParseJson(text);
  if (whole.ok) values.push(whole.value);

  for (const body of fencedReplyBodies(text)) {
    const parsed = tryParseJson(trimReplyEdges(body));
    if (parsed.ok) values.push(parsed.value);
  }

  const { slices, truncated } = balancedReplyCandidates(text);
  for (const slice of slices) {
    const parsed = tryParseJson(slice);
    if (parsed.ok) values.push(parsed.value);
  }
  return { values, truncated };
}

/**
 * Extract a JSON object from a pasted model reply.
 *
 * `requireKey` (e.g. 'proposals') is a PREFERENCE, not a filter: a reply that
 * parses but lacks the key is still returned, so the caller can report
 * "that JSON has no proposals" rather than the much less useful "no JSON
 * found". Callers must therefore still validate the shape -- which
 * engine/llmproposals.js does anyway.
 *
 * Returns {json, issues, repairs}:
 * - json: a plain object, or null when nothing usable was found.
 * - issues: [{field, message, severity}] -- llmproposals.js's shape.
 * - repairs: plain strings describing anything this module changed to make
 *   the paste parse. Never silent: if we touched it, we say so.
 *
 * TOTAL: never throws, for any input including non-strings.
 */
function extractJsonReply(text, { requireKey = null } = {}) {
  const issues = [];
  const repairs = [];

  if (typeof text !== 'string') {
    return { json: null, issues: [replyIssue('reply', 'nothing was pasted')], repairs };
  }
  if (text.length > MAX_PASTE_CHARS) {
    return {
      json: null,
      issues: [replyIssue('reply', `that paste is too large to scan (over ${MAX_PASTE_CHARS} characters)`)],
      repairs,
    };
  }

  const cleaned = trimReplyEdges(text);
  if (!cleaned) {
    return { json: null, issues: [replyIssue('reply', 'nothing was pasted')], repairs };
  }

  const first = collectReplyCandidates(cleaned);
  const picked = chooseReplyCandidate(first.values, requireKey);
  if (picked) {
    if (picked.wrapped) repairs.push(`wrapped a bare list as {"${requireKey}": [...]}`);
    return { json: picked.value, issues, repairs };
  }

  // Last resort only -- reached exclusively when every strict attempt above
  // failed, so a repair can never corrupt a reply that was already valid.
  // Each pass is kept only if it actually yields something usable.
  const passes = [
    { label: 'converted curly quotes to straight quotes', apply: repairCurlyQuotes },
    { label: 'removed a trailing comma', apply: repairTrailingCommas },
  ];
  let repaired = cleaned;
  for (const pass of passes) {
    const next = pass.apply(repaired);
    if (next === repaired) continue;
    const attempt = collectReplyCandidates(next);
    const choice = chooseReplyCandidate(attempt.values, requireKey);
    repaired = next;
    if (choice) {
      repairs.push(pass.label);
      if (choice.wrapped) repairs.push(`wrapped a bare list as {"${requireKey}": [...]}`);
      return { json: choice.value, issues, repairs };
    }
  }

  issues.push(
    replyIssue(
      'reply',
      first.truncated
        ? 'gave up looking for JSON in that paste -- too many candidate blocks'
        : "couldn't find a JSON object in that paste"
    )
  );
  return { json: null, issues, repairs };
}
  // ---- src/engine/llmschema.js ----
// Builds a JSON Schema for constrained decoding (Ollama's `format` field,
// or any OpenAI-compatible `response_format: json_schema`) from an
// already-loaded question bank (engine/interview.js's loadQuestions
// output). This is the mechanism that makes "the model can only choose from
// vocabulary the app supplies" true at the token level, not by prompt
// instruction alone: a choice/multi question's `value` schema is an `enum`
// built from that question's own `options` array, so the sampler cannot
// produce anything outside it.
//
// Leaf module: import nothing. Takes `questions` -- loadQuestions'
// normalized output array, never a raw question bank -- so a malformed
// entry has already been dropped and reported there, not silently
// re-validated (or mis-validated) here.

/**
 * The schema for one question's answer value.
 * - choice/multi WITH a non-empty options array -> {type:'string', enum}.
 * - number -> {type:'number'}.
 * - text, or a choice/multi with no options (loadQuestions rejects that
 *   combination, but this module does not trust that upstream guarantee) ->
 *   plain {type:'string'}, deliberately with NO enum -- an unconstrained
 *   free-text answer is still allowed to be free text; only vocabulary the
 *   app actually curated gets locked down.
 */
function valueSchemaFor(question) {
  const hasOptions =
    (question.type === 'choice' || question.type === 'multi') &&
    Array.isArray(question.options) &&
    question.options.length > 0;
  if (hasOptions) {
    return { type: 'string', enum: question.options.slice() };
  }
  if (question.type === 'number') {
    return { type: 'number' };
  }
  return { type: 'string' };
}

/**
 * One write-descriptor schema for `question`, mirroring the exact shape
 * engine/interview.js's recordAnswer returns: {path, value, tag}. `path`
 * and `tag` are fixed with `const` to the question's OWN field/tag rather
 * than left open -- the model is offered a slot to fill, not a free choice
 * of which slot to write or what provenance to claim for it.
 */
function descriptorSchemaFor(question) {
  return {
    type: 'object',
    properties: {
      path: { const: question.field },
      value: valueSchemaFor(question),
      tag: { const: 'llm_freetext' },
    },
    required: ['path', 'value', 'tag'],
    additionalProperties: false,
  };
}

/**
 * `questions` is loadQuestions(...).questions (or any array shaped the same
 * way). Returns a JSON Schema for `{ proposals: [descriptor, ...] }`, one
 * descriptor variant per question via `anyOf` -- so a proposal that claims
 * to answer question A can only carry question A's own options, never
 * question B's.
 *
 * An empty `questions` array yields a schema whose `proposals` can only be
 * an empty array (`items: false`, meaning "no item shape is valid") --
 * there is nothing this study could be asked about, so nothing should be
 * emitted, rather than leaving the shape unconstrained.
 */
function buildProposalSchema(questions) {
  const list = Array.isArray(questions) ? questions : [];
  const variants = list.map(descriptorSchemaFor);
  return {
    type: 'object',
    properties: {
      proposals: {
        type: 'array',
        items: variants.length > 0 ? { anyOf: variants } : false,
      },
    },
    required: ['proposals'],
    additionalProperties: false,
  };
}
  // ---- src/engine/render/benchcard.js ----
// The bench card: a compact, print-oriented SINGLE-ASSAY summary -- the
// thing that goes next to the microscope, as opposed to render/markdown.js's
// whole-study walkthrough. Deliberately deferred out of the original
// Exports pass (docs/plans/planner-web-exports.md) because it needed real
// UX/content design, not just another renderer over the existing model;
// this is that design, done minimally: modality/specimen/readout, the
// channel table (target/fluorophore/ex-em/detection filter, from
// studydoc.js's panelRows --
// see its header for why that array exists), the recommended controls with
// their reasons (never a bare checklist -- see controls.json's own
// discipline: "a control the user does not understand is a control they
// will delete"), the condition count, and two worked filename examples.
//
// Markdown output, same format family as render/markdown.js, so it opens
// and prints cleanly from any editor/browser with zero new dependencies.
//
// Pure function: no DOM. Takes ONE assay from a studydoc (engine/
// studydoc.js's buildStudyDocument), not the whole document -- see this
// module's own name. TOTAL: a missing/malformed assay renders a one-line
// explanatory string, never throws.

// Prefixed `cardX` rather than the bare `heading`/`controlsSection`
// render/markdown.js already uses: the single-file build concatenates every
// module into ONE scope, so two top-level symbols of the same name across
// web/src is a hard build error (tools/build_single_file.py). These are
// deliberately NOT shared with markdown.js -- that renderer's own
// controlsSection produces a different, whole-study shape; only the names
// collided, not the behavior.
function cardHeading(level, text) {
  return `${'#'.repeat(level)} ${text}`;
}

function channelsTable(panelRows) {
  const rows = Array.isArray(panelRows) ? panelRows : [];
  if (rows.length === 0) {
    return '_No channels declared yet -- fill in the markers field or the structured panel on the Color panel step._';
  }
  const lines = [
    '| Target | Fluorophore | Ex/Em (nm) | Detection filter (center/bandwidth nm) |',
    '| --- | --- | --- | --- |',
  ];
  for (const row of rows) {
    const target = row.target && row.target.trim() ? row.target.trim() : '--';
    const fluorophore = row.fluorophore && row.fluorophore.trim() ? row.fluorophore.trim() : '_(not named)_';
    const exEm = row.excitationPeakNm != null && row.emissionPeakNm != null ? `${row.excitationPeakNm}/${row.emissionPeakNm}` : '_(unresolved)_';
    const hasFilter =
      typeof row.filterCenterNm === 'number' &&
      Number.isFinite(row.filterCenterNm) &&
      typeof row.filterBandwidthNm === 'number' &&
      Number.isFinite(row.filterBandwidthNm) &&
      row.filterBandwidthNm > 0;
    const detectionFilter = hasFilter ? `${row.filterCenterNm}/${row.filterBandwidthNm}` : '_(not set)_';
    lines.push(`| ${target} | ${fluorophore} | ${exEm} | ${detectionFilter} |`);
  }
  return lines.join('\n');
}

function cardControlsSection(controls) {
  const all = [...((controls && controls.panel) || []), ...((controls && controls.readout) || [])];
  if (all.length === 0) return '_No controls recommended yet -- answer the readout and markers fields to see them._';
  return all.map((c) => `- **${c.title}** -- ${c.why}`).join('\n');
}

/**
 * `assay` is ONE entry from `studydoc.assays` (buildStudyDocument's output),
 * not the whole document -- callers pass `doc.assays.find(a => a.id ===
 * assayId)`. Returns a one-line explanatory string (never throws) if
 * `assay` is missing or malformed.
 */
function renderBenchCard(assay) {
  if (!assay || typeof assay !== 'object') {
    return '_No such assay -- nothing to show on a bench card._';
  }

  const specimenBits = [
    assay.specimen && assay.specimen.organism,
    assay.specimen && assay.specimen.sampleType,
    assay.specimen && assay.specimen.preparation,
  ].filter(Boolean);

  const lines = [
    cardHeading(1, `Bench card -- ${assay.label || 'Untitled assay'}`),
    '',
    `**Readout:** ${(assay.readout && assay.readout.text) || 'not answered yet'}`,
    `**Modality:** ${assay.modality || 'not answered yet'}`,
    `**Specimen:** ${specimenBits.length > 0 ? specimenBits.join(', ') : 'not answered yet'}`,
    `**Conditions:** ${(assay.design && assay.design.conditionCount) || 0} planned row(s)`,
    '',
    cardHeading(2, 'Channels'),
    channelsTable(assay.panelRows),
    '',
    cardHeading(2, 'Controls'),
    cardControlsSection(assay.controls),
    '',
    cardHeading(2, 'Filename pattern'),
  ];

  const examples = (Array.isArray(assay.filenames) ? assay.filenames : []).filter((f) => f.filename).slice(0, 2);
  if (examples.length === 0) {
    lines.push('_No planned filenames yet -- see the issues on the Design step._');
  } else {
    for (const entry of examples) lines.push(`\`${entry.filename}\``);
  }

  return lines.join('\n') + '\n';
}
  // ---- src/engine/render/csv.js ----
// CSV renderer over engine/studydoc.js's document model -- a fourth thin
// renderer over the same single model already consumed by the HTML view,
// renderMarkdown, and renderMermaid (see studydoc.js's header for why one
// model / many renderers). Pure function: no DOM, no store.
//
// One row per planned file across every assay in the study, so this is a
// bench-usable manifest: which physical file goes with which condition.
// Crossing factors are flattened into one "factors" column (`name=level;
// name2=level2`) rather than one CSV column per factor name, because
// different assays in the same study can declare different factors --
// a fixed column set would either go ragged across assays or force a
// union-of-all-assays header that is mostly blank for most rows. This
// keeps the CSV rectangular regardless of how many assays/factors exist.
//
// TOTAL: never throws. A malformed/empty document renders as a
// header-only CSV, never a blank string and never a thrown error.

const HEADER = [
  'assay',
  'modality',
  'group',
  'factors',
  'biological_replicate',
  'technical_replicate',
  'planned_filename',
  'error',
];

// A leading =, +, -, or @ makes Excel/Sheets/LibreOffice interpret the cell
// as a FORMULA on open, not text -- "formula injection", the CSV-equivalent
// of an XSS payload. This manifest is built to be handed to collaborators
// (assay labels and factor levels are free text the user typed), so a value
// like "=HYPERLINK(...)" must not execute in whoever opens it. Prefixing a
// leading apostrophe is the standard neutralizer: every mainstream
// spreadsheet app renders it as plain text and drops the apostrophe itself,
// so the visible cell content is unchanged for the overwhelming common case
// (nothing starts with these characters) and merely inert for the rare one.
const FORMULA_PREFIX = /^[=+\-@]/;

// RFC 4180 minimal quoting: only quote a field that needs it, so the common
// case (a plain filename) stays readable unquoted.
function csvField(value) {
  const text = value === null || value === undefined ? '' : String(value);
  const safe = FORMULA_PREFIX.test(text) ? `'${text}` : text;
  if (/[",\n\r]/.test(safe)) {
    return `"${safe.replace(/"/g, '""')}"`;
  }
  return safe;
}

function factorsCell(factorLevels) {
  const entries = factorLevels && typeof factorLevels === 'object' ? Object.entries(factorLevels) : [];
  return entries.map(([name, level]) => `${name}=${level}`).join('; ');
}

function renderCsv(doc) {
  const assays = doc && Array.isArray(doc.assays) ? doc.assays : [];
  const lines = [HEADER.join(',')];

  for (const assay of assays) {
    const label = assay.label || '';
    const modality = assay.modality || '';
    const filenames = Array.isArray(assay.filenames) ? assay.filenames : [];
    for (const entry of filenames) {
      const row = entry.row || {};
      lines.push(
        [
          csvField(label),
          csvField(modality),
          csvField(row.group ?? ''),
          csvField(factorsCell(row.factorLevels)),
          csvField(row.bioRep ?? ''),
          csvField(row.techRep ?? ''),
          csvField(entry.filename ?? ''),
          csvField(entry.error ?? ''),
        ].join(',')
      );
    }
  }

  // CRLF line endings: the conventional CSV wire format (RFC 4180), so the
  // export opens cleanly in spreadsheet tools that assume it.
  return lines.join('\r\n') + '\r\n';
}

  '',

  '  correct and expected; a guess is not. Do not infer a value to be helpful.',
  '- Never invent a marker, filter, control, instrument setting, or option that is',
  '  not in the list you were given.',
  '- Separately from the questions: name anything a careful researcher would still',
  '  need to decide or measure before running this, that is not one of the supplied',
  '  questions and that you cannot answer from the description. Use the "asks" list',
  '  for this -- never guess a value to fill a gap. In particular, always check:',
  '  the actual research question this experiment is meant to answer, whether the',
  '  smallest feature that matters has been named (this sets how finely to sample',
  '  the image), whether the planned controls fit the readout, and whether any two',
  '  planned fluorophores/channels risk spectral overlap.',

 * so the local and chat paths can never describe a question differently.

 * engine/llmproposals.js:63 compares with `String(a) === String(b)`, no trim,

    .map((q) => {

    ANSWER_FORMAT_BLOCK,

// Renders a study document (engine/studydoc.js) to a mermaid flowchart
// SOURCE STRING -- Study branching to every Assay, each Assay branching to
// its readout/modality, design axis, controls, and planned-filename count.
// This is "all the branches" the user asked to visualize: every assay and
// every imaging group in one diagram, sized to what they actually entered.
//
// This module renders TEXT, not a diagram -- no mermaid library is loaded
// (the app is one self-contained file with zero deps, so mermaid cannot run
// inside it). The text is embedded in a ```mermaid fenced block by
// render/markdown.js, where GitHub/Notion/the Artifact viewer render it.
//
// GitHub's mermaid dialect is stricter than some renderers: every label is
// quoted, and quotes/newlines inside a label are escaped rather than passed
// through raw -- see mermaidLabel below.
//
// Pure module: no DOM. Takes the studydoc model, nothing else.

/** Quote and escape one label for a mermaid node/edge. Never throws. */
function mermaidLabel(text) {
  const raw = text === null || text === undefined ? '' : String(text);
  // Collapse newlines (a multi-line narrative or note would otherwise break
  // the diagram's line-oriented syntax) and escape the one character that
  // would end the quoted label early.
  const flat = raw.replace(/\s+/g, ' ').trim().replace(/"/g, "'");
  return `"${flat}"`;
}

/** A safe, unique mermaid node id -- alnum/underscore only, mermaid IDs cannot contain spaces or punctuation. */
function nodeId(...parts) {
  return parts.join('_').replace(/[^A-Za-z0-9_]/g, '_');
}

function truncate(text, max) {
  return text.length > max ? `${text.slice(0, max - 1)}…` : text;
}

function designSummary(design) {
  const parts = [];
  if (design.arms.length > 0) parts.push(`${design.arms.length} arm(s)`);
  for (const factor of design.factors) {
    parts.push(`${factor.name || 'factor'} × ${factor.levels.length}`);
  }
  if (design.biologicalReplicates) parts.push(`${design.biologicalReplicates} bio rep(s)`);
  if (design.technicalReplicates) parts.push(`${design.technicalReplicates} tech rep(s)`);
  return parts.length > 0 ? parts.join(', ') : 'no design axes set yet';
}

/**
 * Render `doc` (buildStudyDocument's output) to a mermaid flowchart source
 * string. TOTAL: a document with zero assays still renders a valid (if
 * sparse) diagram -- an empty flowchart is not an error, just an empty study.
 */
function renderMermaid(doc) {
  const lines = ['flowchart TD'];
  const studyTitle = doc.study.title || doc.study.researchQuestion || 'Study';
  lines.push(`  STUDY[${mermaidLabel(truncate(studyTitle, 80))}]`);

  for (const assay of doc.assays) {
    const aId = nodeId('assay', assay.index);
    lines.push(`  STUDY --> ${aId}[${mermaidLabel(assay.label)}]`);

    const readoutId = nodeId(aId, 'readout');
    const readoutText =
      assay.readout.state === 'known'
        ? `Readout: ${assay.readout.label}`
        : assay.readout.state === 'unrecognized'
          ? `Readout: ${assay.readout.text} (unrecognized)`
          : 'Readout: not answered yet';
    lines.push(`  ${aId} --> ${readoutId}(${mermaidLabel(readoutText)})`);

    const modId = nodeId(aId, 'modality');
    lines.push(`  ${aId} --> ${modId}(${mermaidLabel(`Modality: ${assay.modality || 'not answered yet'}`)})`);

    const designId = nodeId(aId, 'design');
    lines.push(`  ${aId} --> ${designId}[${mermaidLabel(designSummary(assay.design))}]`);

    const controlsId = nodeId(aId, 'controls');
    const controlCount = assay.controls.panel.length + assay.controls.readout.length;
    lines.push(`  ${designId} --> ${controlsId}{${mermaidLabel(`${controlCount} control(s)`)}}`);

    const filesId = nodeId(aId, 'files');
    lines.push(`  ${controlsId} --> ${filesId}([${mermaidLabel(`${assay.filenames.length} planned filename(s)`)}])`);
  }

  return lines.join('\n');
}
  // ---- src/engine/render/markdown.js ----
// Renders a study document (engine/studydoc.js) to a Markdown string,
// embedding the mermaid diagram (render/mermaid.js) as a fenced code block.
// This is the deterministic, no-LLM textual walkthrough: idea -> pilot ->
// validate controls -> fix acquisition settings -> advanced modality, per
// assay, built entirely from the SAME model the in-app HTML view renders --
// see studydoc.js's header for why that matters.
//
// Every sentence in the output either restates a parameter the user entered
// (modality, readout, design axes) or an authored KB string (a control's
// `why`, a stage's `body`/`note`) -- nothing here is generated text.
//
// Pure module: no DOM. Takes the studydoc model plus the mermaid renderer.


function heading(level, text) {
  return `${'#'.repeat(level)} ${text}`;
}

function bulletList(items) {
  return items.map((item) => `- ${item}`).join('\n');
}

function readoutSection(readout) {
  if (readout.state === 'known') return `**Readout:** ${readout.label}`;
  if (readout.state === 'unrecognized') {
    return `**Readout:** "${readout.text}" -- not a readout this app recognizes yet; controls for it are yours to specify.`;
  }
  return '**Readout:** not answered yet.';
}

function designSection(design) {
  const lines = [];
  lines.push(`**Design:** ${design.conditionCount} planned condition row(s).`);
  if (design.arms.length > 0) lines.push(`- Arm (mutually exclusive): ${design.arms.join(', ')}`);
  for (const factor of design.factors) {
    lines.push(`- Crossing factor "${factor.name}": ${factor.levels.join(', ')}`);
  }
  if (design.biologicalReplicates) lines.push(`- Biological replicates: ${design.biologicalReplicates}`);
  if (design.technicalReplicates) lines.push(`- Technical replicates: ${design.technicalReplicates}`);
  if (design.issues.length > 0) {
    lines.push('- **Design issues:**');
    for (const issue of design.issues) lines.push(`  - (${issue.severity}) ${issue.field}: ${issue.message}`);
  }
  return lines.join('\n');
}

/**
 * Controls section: the three(-plus-one)-state rendering is mandatory
 * (Decision 5, docs/plans/planner-web-assay-tier.md) -- an empty list must
 * never render as silence, since silence reads as "this assay needs no
 * controls," the most dangerous false negative a controls advisor can
 * produce. `controls.readoutMessage` is the SINGLE resolved string for
 * whichever state applies (studydoc.js's readoutMessageFor) -- read here
 * verbatim rather than re-derived, so this can never disagree with
 * ui/steps/overview.js's rendering of the identical fact (an adversarial
 * pass on an earlier version of this commit found exactly that divergence).
 */
function controlsSection(controls) {
  const lines = ['**Controls:**'];
  if (controls.panel.length > 0) {
    lines.push('- Panel-derived:');
    for (const c of controls.panel) lines.push(`  - **${c.title}** -- ${c.why}`);
  }
  lines.push('- Readout-specific:');
  if (controls.readout.length > 0) {
    for (const c of controls.readout) lines.push(`  - **${c.title}** -- ${c.why}`);
  } else {
    lines.push(`  - ${controls.readoutMessage}`);
  }
  return lines.join('\n');
}

/** The fixed 5-stage backbone, rendered ONCE for the whole study -- see studydoc.js's stageNotes comment for why. */
function ladderSection(ladder) {
  const lines = [];
  for (const stage of ladder) {
    lines.push(heading(3, stage.title));
    lines.push(stage.body);
    lines.push('');
  }
  return lines.join('\n').trimEnd();
}

/** Per-assay STUDY-SPECIFIC notes only -- omitted entirely when an assay has none, per studydoc.js's stageNotes. */
function stageNotesSection(stageNotes) {
  if (stageNotes.length === 0) return null;
  const lines = ['**Notes for this assay:**'];
  for (const stage of stageNotes) {
    lines.push(`- ${stage.stageTitle}:`);
    for (const note of stage.notes) lines.push(`  - ${note}`);
  }
  return lines.join('\n');
}

function filenamesSection(filenames) {
  if (filenames.length === 0) return '_No planned filenames yet -- fill in the naming fields on the Naming step._';
  return '```\n' + filenames.map((f) => f.filename || `(${f.error})`).join('\n') + '\n```';
}

/** Render `doc` (buildStudyDocument's output) to a Markdown string. TOTAL: never throws on a well-formed doc. */
function renderMarkdown(doc) {
  const sections = [];

  sections.push(heading(1, doc.study.title || 'Study overview'));
  sections.push(`_${doc.generatedFrom}_`);
  if (doc.study.researchQuestion) {
    sections.push(heading(2, 'Research question'));
    sections.push(doc.study.researchQuestion);
  }
  if (doc.study.armVocabulary.length > 0) {
    sections.push(`**Study-wide arm vocabulary:** ${doc.study.armVocabulary.join(', ')}`);
  }

  sections.push(heading(2, 'Study diagram'));
  sections.push('```mermaid\n' + renderMermaid(doc) + '\n```');

  if (doc.crossAssayIssues.length > 0) {
    sections.push(heading(2, 'Cross-assay issues'));
    sections.push(bulletList(doc.crossAssayIssues.map((i) => `(${i.severity}) ${i.field}: ${i.message}`)));
  }

  // Rendered ONCE for the whole study, not per assay -- see studydoc.js's
  // stageNotes comment. Assay-specific extras follow inside each assay's
  // own section below.
  sections.push(heading(2, 'How to run this project'));
  sections.push(ladderSection(doc.ladder));

  for (const assay of doc.assays) {
    sections.push(heading(2, `Assay ${assay.index}: ${assay.label}`));
    sections.push(readoutSection(assay.readout));
    sections.push(`**Modality:** ${assay.modality || 'not answered yet'}`);
    const specimenBits = [assay.specimen.organism, assay.specimen.sampleType, assay.specimen.preparation].filter(Boolean);
    if (specimenBits.length > 0) sections.push(`**Specimen:** ${specimenBits.join(', ')}`);

    sections.push(designSection(assay.design));
    sections.push(controlsSection(assay.controls));

    const notes = stageNotesSection(assay.stageNotes);
    if (notes) sections.push(notes);

    sections.push(heading(3, 'Planned filenames'));
    sections.push(filenamesSection(assay.filenames));
  }

  return sections.join('\n\n') + '\n';
}

// others (see engine/studydoc.js's header): it cannot disagree with them
// because it reads the identical facts.
//
// WHY A MODEL, NOT AN SVG STRING: the mermaid renderer emits text because a
// downstream viewer draws it; this one is drawn by us, in the browser, with
// zero libraries (the app is one self-contained file, no npm deps, and
// bundling mermaid would blow the build's 2 MB size gate). Returning a pure
// {nodes, edges} layout keeps ALL geometry testable here and lets the UI
// layer (ui/steps/overview.js) build real SVG DOM with createElementNS +
// textContent -- never innerHTML with user data, matching shell.js's rule.
//
// SHAPE: it linearizes the mermaid graph into one readable top-down column
// per assay (Study -> each Assay -> Readout -> Modality -> Design ->
// Controls -> Filenames). The mermaid export remains the exact branching
// form; this is the at-a-glance visual, sized to what the user entered.
//
// Pure module: no DOM. Takes the studydoc model, nothing else.

// Geometry. All coordinates are computed here so the UI is a dumb painter.
const PAD = 24;
const NODE_W = 188;
const NODE_H = 48;
const COL_GAP = 22;
const ROW_GAP = 28;
const STUDY_GAP = 44; // extra room between the study row and the assay row for the fan-out edges
const STUDY_MAX_W = 300;

// The five per-assay attribute rows, in top-down order under the assay node.
const ATTR_ROWS = ['readout', 'modality', 'design', 'controls', 'files'];

function clip(text, max) {
  const s = text === null || text === undefined ? '' : String(text);
  return s.length > max ? `${s.slice(0, max - 1)}…` : s;
}

function summarizeDesign(design) {
  const d = design || {};
  const parts = [];
  if (Array.isArray(d.arms) && d.arms.length > 0) parts.push(`${d.arms.length} arm(s)`);
  for (const factor of Array.isArray(d.factors) ? d.factors : []) {
    parts.push(`${(factor && factor.name) || 'factor'} ×${(factor && factor.levels ? factor.levels.length : 0)}`);
  }
  if (d.biologicalReplicates) parts.push(`${d.biologicalReplicates} bio`);
  if (d.technicalReplicates) parts.push(`${d.technicalReplicates} tech`);
  return parts.length > 0 ? parts.join(', ') : 'no axes set yet';
}

function readoutValue(readout) {
  const r = readout || {};
  if (r.state === 'known') return r.label || 'known';
  if (r.state === 'unrecognized') return `${r.text || '?'} (unrecognized)`;
  return 'not answered yet';
}

/** Caption + value for one attribute row of an assay. */
function attrNodeContent(kind, assay) {
  switch (kind) {
    case 'readout':
      return { caption: 'Readout', value: clip(readoutValue(assay.readout), 22) };
    case 'modality':
      return { caption: 'Modality', value: clip(assay.modality || 'not answered yet', 22) };
    case 'design':
      return { caption: 'Design', value: clip(summarizeDesign(assay.design), 22) };
    case 'controls': {
      const controls = assay.controls || {};
      const n = (Array.isArray(controls.panel) ? controls.panel.length : 0) + (Array.isArray(controls.readout) ? controls.readout.length : 0);
      return { caption: 'Controls', value: `${n} control(s)` };
    }
    case 'files':
      return { caption: 'Filenames', value: `${Array.isArray(assay.filenames) ? assay.filenames.length : 0} planned` };
    default:
      return { caption: '', value: '' };
  }
}

function colX(index) {
  return PAD + index * (NODE_W + COL_GAP);
}

function rowY(assayRowY, rowIndex) {
  return assayRowY + rowIndex * (NODE_H + ROW_GAP);
}

/**
 * Build the diagram layout model for `doc` (buildStudyDocument's output).
 * TOTAL: a document with zero assays yields just the study node -- an empty
 * study is a valid, if sparse, map, never a throw (matching the mermaid
 * renderer's own totality).
 *
 * Returns { width, height, nodes, edges }:
 *   node  = { id, type, x, y, w, h, caption, value }
 *   edge  = { from, to, x1, y1, x2, y2 }
 */
function buildDiagramLayout(doc) {
  const study = (doc && doc.study) || {};
  const assays = doc && Array.isArray(doc.assays) ? doc.assays : [];
  const cols = assays.length;

  const contentWidth = cols > 0 ? cols * NODE_W + (cols - 1) * COL_GAP : Math.round(NODE_W * 1.4);
  const width = contentWidth + PAD * 2;

  const studyY = PAD;
  const studyW = Math.min(contentWidth, STUDY_MAX_W);
  const studyX = PAD + (contentWidth - studyW) / 2;
  const assayRowY = studyY + NODE_H + STUDY_GAP;

  const nodes = [];
  const edges = [];

  const studyTitle = study.title || study.researchQuestion || 'Study';
  nodes.push({
    id: 'study',
    type: 'study',
    x: studyX,
    y: studyY,
    w: studyW,
    h: NODE_H,
    caption: 'Study',
    value: clip(studyTitle, 46),
  });

  const studyCx = studyX + studyW / 2;
  const studyBottom = studyY + NODE_H;

  assays.forEach((assay, i) => {
    const x = colX(i);
    const cx = x + NODE_W / 2;
    const assayId = `assay-${i}`;

    nodes.push({
      id: assayId,
      type: 'assay',
      x,
      y: rowY(assayRowY, 0),
      w: NODE_W,
      h: NODE_H,
      caption: `Assay ${assay.index != null ? assay.index : i + 1}`,
      value: clip(assay.label || `Assay ${i + 1}`, 22),
    });

    // Study fans out to each assay.
    edges.push({
      from: 'study',
      to: assayId,
      x1: studyCx,
      y1: studyBottom,
      x2: cx,
      y2: rowY(assayRowY, 0),
    });

    // The per-assay attribute chain, one node per row, each linked to the one above.
    let prevId = assayId;
    let prevRow = 0;
    ATTR_ROWS.forEach((kind, r) => {
      const rowIndex = r + 1;
      const { caption, value } = attrNodeContent(kind, assay);
      const nodeId = `${assayId}-${kind}`;
      nodes.push({
        id: nodeId,
        type: kind,
        x,
        y: rowY(assayRowY, rowIndex),
        w: NODE_W,
        h: NODE_H,
        caption,
        value,
      });
      edges.push({
        from: prevId,
        to: nodeId,
        x1: cx,
        y1: rowY(assayRowY, prevRow) + NODE_H,
        x2: cx,
        y2: rowY(assayRowY, rowIndex),
      });
      prevId = nodeId;
      prevRow = rowIndex;
    });
  });

  const height =
    cols > 0 ? rowY(assayRowY, ATTR_ROWS.length) + NODE_H + PAD : studyY + NODE_H + PAD;

  return { width, height, nodes, edges };
}
  // ---- src/engine/spectralView.js ----
// Pure model for the Color panel's explanatory spectrum plot.
//
// IMPORTANT: spectra.json currently contains peak positions (plus, as of the
// color-panel curve-shape patch, a per-fluorophore emissionFwhmNm), not
// measured curve samples. These normalized Gaussian curves are therefore
// still SCHEMATIC -- useful for showing why nearby emissions can occupy the
// same user-entered detection window, but never a quantitative spillover
// integral, and a single symmetric Gaussian is itself an approximation of
// real (often asymmetric, red-tailed) emission bands. Each curve's width
// comes from its own fluorophore's emissionFwhmNm when the spectra pack has
// one, else from overlapRules.schematicEmissionFwhmNm -- both reviewable
// data, not an invisible renderer constant.

const SPECTRAL_VIEW_MIN_NM = 300;
const SPECTRAL_VIEW_MAX_NM = 900;
const SPECTRAL_VIEW_SAMPLE_STEP_NM = 5;
const SPECTRAL_VIEW_DEFAULT_FWHM_NM = 50;

const SPECTRAL_VIEW_MIN_FILTER_WIDTH_NM = 1;
const SPECTRAL_VIEW_MAX_FILTER_WIDTH_NM = 300;
// Not named module-level constants: the single-file build (tools/
// build_single_file.py) concatenates every web/src module into one scope and
// rejects two top-level declarations sharing a name, and spectra.js already
// declares its OWN same-valued SPECTRAL_VIEW_MIN_FWHM_NM/MAX_FWHM_NM for its
// schematicEmissionFwhmNm validation -- inline literals here, not a second
// top-level name for the same 5-300 nm bound.
const SPECTRAL_VIEW_FWHM_BOUNDS_NM = [5, 300];

function spectralViewFiniteNumber(value) {
  return typeof value === 'number' && Number.isFinite(value);
}

// Shared by the pack-wide schematicEmissionFwhmNm and every per-curve
// emissionFwhmNm below -- ONE plausibility bound so an out-of-range width
// can't reach the renderer from either path, including an entry that
// bypassed spectra.js's own loader (e.g. a hand-built test entry).
function spectralViewPlausibleFwhm(value) {
  const [minNm, maxNm] = SPECTRAL_VIEW_FWHM_BOUNDS_NM;
  return spectralViewFiniteNumber(value) && value >= minNm && value <= maxNm;
}

function spectralViewFwhm(overlapRules) {
  const value = overlapRules && overlapRules.schematicEmissionFwhmNm;
  return spectralViewPlausibleFwhm(value) ? value : SPECTRAL_VIEW_DEFAULT_FWHM_NM;
}

const SPECTRAL_VIEW_COLOR_PATTERN = /^#[0-9a-f]{6}$/i;

// A curve/filter's own color (color-panel patch: ui/steps/panel.js's
// effectiveChannelColor -- the user's override or the wavelength-derived
// default), threaded through so the plot can render each channel in ITS
// color instead of an arbitrary rotating series palette. `null` when the
// caller didn't supply one (or supplied something malformed) -- the
// renderer's own series-N fallback is what draws in that case, never a
// fabricated color here.
function spectralViewValidColor(value) {
  return typeof value === 'string' && SPECTRAL_VIEW_COLOR_PATTERN.test(value) ? value : null;
}

/** Normalized Gaussian intensity: 1 at peak and 0.5 at ±FWHM/2. */
function spectralViewIntensityAt(wavelengthNm, peakNm, fwhmNm) {
  if (
    !spectralViewFiniteNumber(wavelengthNm) ||
    !spectralViewFiniteNumber(peakNm) ||
    !spectralViewFiniteNumber(fwhmNm) ||
    fwhmNm <= 0
  ) {
    return 0;
  }
  const offset = (wavelengthNm - peakNm) / fwhmNm;
  return Math.exp(-4 * Math.log(2) * offset * offset);
}

function spectralViewFilterBand(entry) {
  const centerNm = entry && entry.filterCenterNm;
  const bandwidthNm = entry && entry.filterBandwidthNm;
  const valid =
    spectralViewFiniteNumber(centerNm) &&
    spectralViewFiniteNumber(bandwidthNm) &&
    centerNm >= SPECTRAL_VIEW_MIN_NM &&
    centerNm <= SPECTRAL_VIEW_MAX_NM &&
    bandwidthNm >= SPECTRAL_VIEW_MIN_FILTER_WIDTH_NM &&
    bandwidthNm <= SPECTRAL_VIEW_MAX_FILTER_WIDTH_NM;
  if (!valid) return null;
  const rawStartNm = centerNm - bandwidthNm / 2;
  const rawEndNm = centerNm + bandwidthNm / 2;
  const startNm = Math.max(SPECTRAL_VIEW_MIN_NM, rawStartNm);
  const endNm = Math.min(SPECTRAL_VIEW_MAX_NM, rawEndNm);
  if (endNm <= startNm) return null;
  return {
    channelId: typeof entry.channelId === 'string' ? entry.channelId : '',
    token: typeof entry.token === 'string' ? entry.token : '',
    centerNm,
    bandwidthNm,
    startNm,
    endNm,
    clipped: startNm !== rawStartNm || endNm !== rawEndNm,
    color: spectralViewValidColor(entry.color),
  };
}

/**
 * Build a deterministic, renderer-ready view model. TOTAL and immutable.
 * `entries` may be free-text resolved entries or structured-channel entries;
 * only state:'known' entries get curves, while every complete user-entered
 * filter gets a band even if its fluorophore is unresolved.
 */
function buildSpectralViewModel(entries, overlapRules) {
  const source = Array.isArray(entries) ? entries : [];
  // The pack-wide schematic width: the FALLBACK for a fluorophore with no
  // emissionFwhmNm of its own (an older/synthetic spectra pack, or a real
  // entry whose width was implausible and dropped by spectra.js), not the
  // width every curve shares -- see the per-curve fallback just below.
  const fwhmNm = spectralViewFwhm(overlapRules);
  const curves = source
    .map((entry, sourceIndex) => ({ entry, sourceIndex }))
    .filter(({ entry }) => entry && entry.state === 'known' && spectralViewFiniteNumber(entry.emissionPeakNm))
    .map(({ entry, sourceIndex }) => {
      const curveFwhmNm = spectralViewPlausibleFwhm(entry.emissionFwhmNm) ? entry.emissionFwhmNm : fwhmNm;
      const points = [];
      for (
        let wavelengthNm = SPECTRAL_VIEW_MIN_NM;
        wavelengthNm <= SPECTRAL_VIEW_MAX_NM;
        wavelengthNm += SPECTRAL_VIEW_SAMPLE_STEP_NM
      ) {
        points.push({
          wavelengthNm,
          intensity: spectralViewIntensityAt(wavelengthNm, entry.emissionPeakNm, curveFwhmNm),
        });
      }
      return {
        channelId: typeof entry.channelId === 'string' ? entry.channelId : '',
        token:
          typeof entry.token === 'string' && entry.token.trim()
            ? entry.token.trim()
            : typeof entry.canonical === 'string' && entry.canonical.trim()
              ? entry.canonical.trim()
              : 'Unnamed',
        canonical:
          typeof entry.canonical === 'string' && entry.canonical.trim() ? entry.canonical.trim() : null,
        emissionPeakNm: entry.emissionPeakNm,
        excitationPeakNm: spectralViewFiniteNumber(entry.excitationPeakNm) ? entry.excitationPeakNm : null,
        reviewStatus: entry.reviewStatus || null,
        fwhmNm: curveFwhmNm,
        color: spectralViewValidColor(entry.color),
        points,
        sourceIndex,
      };
    });

  curves.sort(
    (a, b) =>
      a.emissionPeakNm - b.emissionPeakNm ||
      a.token.localeCompare(b.token) ||
      a.channelId.localeCompare(b.channelId) ||
      a.sourceIndex - b.sourceIndex
  );
  for (const curve of curves) delete curve.sourceIndex;

  const filters = source.map(spectralViewFilterBand).filter(Boolean);
  filters.sort(
    (a, b) =>
      a.centerNm - b.centerNm || a.token.localeCompare(b.token) || a.channelId.localeCompare(b.channelId)
  );

  return {
    domain: { minNm: SPECTRAL_VIEW_MIN_NM, maxNm: SPECTRAL_VIEW_MAX_NM },
    fwhmNm,
    curves,
    filters,
  };
}

// Prefilled link-outs for the chat-LLM round trip: a degenerate,
// human-in-the-loop "provider" -- open a hosted chat site with the copy-out
// prompt (engine/render/llmdraftprompt.js) already in its composer, instead
// of the user pasting it in by hand. Lives in llm/ rather than engine/
// because that is what this directory already is: not the prompt content,
// but how the app reaches a model.
//
// ONLY two targets, and this must stay a short, deliberately-curated list
// rather than growing every time another chat product ships one. ChatGPT
// and Claude both have a documented, stable `?q=` param that auto-populates
// the composer. Gemini has no documented prefill param as of writing.
// Perplexity's `?q=` runs a SEARCH, not a composer prefill -- wrong shape
// for a task that needs the model to follow an output contract, so it is
// deliberately excluded even though the param exists.
//
// THESE ARE UNVERIFIED, UNVERSIONED THIRD-PARTY URL CONTRACTS. Any of them
// can change or vanish without notice; that is exactly why buildChatUrl
// below always degrades to "open the site with nothing prefilled" rather
// than failing, and why describe.js's caller must ALWAYS copy the prompt to
// the clipboard before opening any of these -- the prefill is a bonus, the
// clipboard is the contract.
//
// Leaf module: imports nothing. No DOM here, so this stays importable
// (and testable) from plain Node -- window.open belongs to the UI call site.

const CHAT_TARGETS = [
  { id: 'chatgpt', label: 'Open in ChatGPT', origin: 'https://chatgpt.com/', param: 'q' },
  { id: 'claude', label: 'Open in Claude', origin: 'https://claude.ai/new', param: 'q' },
];

// A conservative cross-browser ceiling for a full URL's length. Chosen as a
// budget for the ENCODED url (see buildChatUrl below), not the raw prompt --
// most browsers/servers tolerate more, but staying well under keeps this
// robust rather than tuned to one implementation's exact limit.
const MAX_PREFILL_URL_CHARS = 2000;

/**
 * Build the URL to open for `target`, prefilling `prompt` if it fits.
 *
 * The length check is against the FULLY ENCODED url, not the raw prompt
 * length -- encodeURIComponent inflates prompt text roughly 1.5-2x (every
 * newline becomes %0A, every quote %22, every space %20), so a prompt that
 * looks well within budget as raw text routinely is not once encoded. This
 * is deliberate, not a bug to "fix" by loosening the check: the point is to
 * know honestly whether prefill will actually work, not to optimistically
 * guess from the wrong number.
 *
 * NEVER truncates the prompt to force a fit. A truncated copy of the output
 * contract is worse than no prefill at all -- the model would never see the
 * full vocabulary, every value it guesses would be silently dropped by
 * engine/llmproposals.js, and the user would have no way to tell why. The
 * only permitted outcome when over budget is `prefilled: false`, with the
 * bare origin returned instead.
 *
 * TOTAL: never throws. An unknown/malformed target or a non-string prompt
 * still returns a usable result rather than throwing into a click handler.
 */
function buildChatUrl(target, prompt, maxChars = MAX_PREFILL_URL_CHARS) {
  const origin = target && typeof target.origin === 'string' ? target.origin : '';
  const param = target && typeof target.param === 'string' ? target.param : '';
  const text = typeof prompt === 'string' ? prompt : '';

  if (!origin || !param || !text) {
    return { url: origin || '', prefilled: false };
  }

  const encoded = encodeURIComponent(text);
  const url = `${origin}${origin.includes('?') ? '&' : '?'}${param}=${encoded}`;
  if (url.length > maxChars) {
    return { url: origin, prefilled: false };
  }
  return { url, prefilled: true };
}
  // ---- src/llm/config.js ----
// Persisted LLM settings: whether the local-model provider is enabled, and
// its endpoint/model. Same idiom as ui/shell.js's THEME_KEY and
// ui/advice.js's ADVISOR_DEBUG_KEY -- localStorage, read through a
// try/catch so a disabled/unavailable localStorage degrades to "off"
// (manual-paste, the always-available provider) rather than throwing.
//
// OFF by default: a fresh install never calls out anywhere until the user
// explicitly opts in and points it at their own server.

const ENABLED_KEY = 'micronaut.llm.enabled';
const ENDPOINT_KEY = 'micronaut.llm.endpoint';
const MODEL_KEY = 'micronaut.llm.model';
// Separate from ENABLED_KEY on purpose: ENABLED_KEY governs the Ollama path,
// where nothing leaves the user's own network by construction (LAN-only,
// see llm/ollama.js's header). A chat-LLM link-out is different in kind --
// it puts the study's narrative into a third-party URL -- so it gets its
// own explicit opt-in rather than riding along with a flag that means
// something narrower. Copying the prompt to the clipboard needs neither
// flag: that sends nothing anywhere.
const LINK_OUTS_KEY = 'micronaut.llm.linkouts';

const DEFAULT_ENDPOINT = 'http://localhost:11434';
const DEFAULT_MODEL = 'llama3.1:8b';

function readLS(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? fallback : value;
  } catch {
    return fallback;
  }
}

function writeLS(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch {
    // Persistence here is a convenience, matching THEME_KEY's own comment:
    // a failed write only means the setting won't survive a reload.
  }
}

function loadLlmConfig() {
  return {
    enabled: readLS(ENABLED_KEY, '0') === '1',
    endpoint: readLS(ENDPOINT_KEY, DEFAULT_ENDPOINT),
    model: readLS(MODEL_KEY, DEFAULT_MODEL),
    linkOuts: readLS(LINK_OUTS_KEY, '0') === '1',
  };
}

function saveLlmConfig({ enabled, endpoint, model, linkOuts }) {
  if (typeof enabled === 'boolean') writeLS(ENABLED_KEY, enabled ? '1' : '0');
  if (typeof endpoint === 'string') writeLS(ENDPOINT_KEY, endpoint);
  if (typeof model === 'string') writeLS(MODEL_KEY, model);
  if (typeof linkOuts === 'boolean') writeLS(LINK_OUTS_KEY, linkOuts ? '1' : '0');
}
  // ---- src/llm/manualPaste.js ----
// The manual-paste provider: wraps today's copy-paste workflow behind the
// same Provider interface (provider.js) a real network adapter uses, so the
// app has two WORKING providers from day one -- one that needs no server at
// all -- rather than the seam existing only on paper until Ollama is
// configured. This is also the automatic fallback when the Ollama provider
// is unavailable (server down, not configured): the feature degrades to
// "here is the text, go paste it yourself" instead of erroring.
//
// There is no model on this side of a copy-paste, so complete() cannot
// actually complete anything: it resolves with the composed prompt as
// `text` and `json: null`. The caller is responsible for presenting that
// text for the user to copy (ui/clipboard.js) and for accepting whatever
// the user pastes back through its own channel -- this provider's job stops
// at "produce the exact text a human should paste".
//
// isAvailable() is always true: there is no server that could be down.

/**
 * `composeMessage({system, user})` turns the two message parts into the one
 * block a human copies; defaults to the two parts joined with a blank line,
 * matching how engine/render/llmprompt.js already composes its own preamble
 * + payload.
 */
function createManualPasteProvider({ composeMessage } = {}) {
  const compose =
    typeof composeMessage === 'function'
      ? composeMessage
      : ({ system, user }) => [system, user].filter(Boolean).join('\n\n');

  return {
    id: 'manual-paste',
    label: 'Copy to my own LLM',
    isAvailable: () => true,
    async complete({ system, user } = {}) {
      return { text: compose({ system, user }), json: null };
    },
  };
}
  // ---- src/llm/ollama.js ----
// The Ollama provider: calls a local Ollama server's /api/chat directly,
// requesting constrained decoding via the `format` field whenever a schema
// is supplied (engine/llmschema.js builds those schemas). LAN-only by
// design (see docs/plans/ -- local-llm-guidance): this module never guesses
// an endpoint or reaches beyond what the caller configures.
//
// isAvailable() does NOT make a network call: matching this repo's TOTAL
// discipline for anything network-facing, "available" here means
// "configured" (an endpoint and a model were given), not "reachable" --
// reachability is complete()'s problem alone, surfaced as a rejected
// promise the caller already has to handle (e.g. by falling back to the
// manual-paste provider).
//
// `fetchImpl` is injectable so this module is testable with a stub instead
// of a running server.

const DEFAULT_TIMEOUT_MS = 30000;

// Ollama loads a model at its own native context length (131072 for
// llama3.1:8b) unless told otherwise, which burns VRAM on KV cache far
// beyond what a single study's worth of text ever needs and forces a
// partial CPU/GPU split on cards that would otherwise fit the model
// entirely. 8192 is generous for this app's prompts (a full study plus the
// question bank) while staying small enough to keep even an 8B model
// fully GPU-resident on a 16GB card.
const DEFAULT_NUM_CTX = 8192;

// The most recently used {endpoint, model}, shared across every provider
// instance in this page load (guidance.js and describe.js each mint their
// own via createOllamaProvider). Module-level rather than per-instance so
// the single pagehide listener below can unload whichever model was
// actually warm, regardless of which call site last used it.
let lastUsed = null;

function unloadLastUsed() {
  if (!lastUsed || typeof fetch !== 'function') return;
  const { endpoint, model } = lastUsed;
  // `keepalive: true`, not navigator.sendBeacon: verified directly against a
  // real Ollama server that sendBeacon's actual POST fails with
  // net::ERR_FAILED after a successful CORS preflight (Ollama's CORS
  // middleware and beacon's transport apparently do not get along), while a
  // keepalive fetch carrying the identical body succeeds and does unload the
  // model. keepalive fetch is also allowed to keep running past the page
  // already unloading, same guarantee sendBeacon exists for.
  fetch(`${endpoint.replace(/\/+$/, '')}/api/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model, messages: [], keep_alive: 0 }),
    keepalive: true,
  }).catch(() => {});
}

// Registered once per page load -- this module is an ES module singleton,
// so top-level code here runs exactly once regardless of how many
// createOllamaProvider() calls follow. The point is to dump the model on
// tab close rather than leave it resident until Ollama's own keep-alive
// timeout.
if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
  window.addEventListener('pagehide', unloadLastUsed);
}

function createOllamaProvider({
  endpoint,
  model,
  keepAlive = -1,
  numCtx = DEFAULT_NUM_CTX,
  timeoutMs = DEFAULT_TIMEOUT_MS,
  fetchImpl,
} = {}) {
  const doFetch = fetchImpl || (typeof fetch === 'function' ? fetch : undefined);

  return {
    id: 'ollama',
    label: model ? `Local model (${model})` : 'Local model',
    isAvailable: () => Boolean(endpoint) && Boolean(model),

    async complete({ system, user, schema, signal } = {}) {
      if (!endpoint || !model) {
        throw new Error('Ollama provider is not configured (missing endpoint or model).');
      }
      if (!doFetch) {
        throw new Error('No fetch implementation available for the Ollama provider.');
      }
      // Recorded before the request settles: worst case an unload beacon
      // fires for a model that never actually finished loading, which is a
      // harmless no-op, and this is the only point every call path shares.
      lastUsed = { endpoint, model };

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      // Propagate an external abort (e.g. the user navigating away mid-call)
      // into the same controller that also enforces the timeout, so either
      // reason aborts the same in-flight request rather than needing two
      // independent cancellation paths.
      if (signal) {
        if (signal.aborted) controller.abort();
        else signal.addEventListener('abort', () => controller.abort(), { once: true });
      }

      try {
        const body = {
          model,
          stream: false,
          keep_alive: keepAlive,
          options: { num_ctx: numCtx },
          messages: [
            ...(system ? [{ role: 'system', content: system }] : []),
            { role: 'user', content: user || '' },
          ],
        };
        if (schema) {
          body.format = schema;
        }

        const response = await doFetch(`${endpoint.replace(/\/+$/, '')}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: controller.signal,
        });

        if (!response.ok) {
          throw new Error(`Ollama request failed: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        const text = data && data.message && typeof data.message.content === 'string' ? data.message.content : '';

        let json = null;
        if (schema && text) {
          try {
            json = JSON.parse(text);
          } catch {
            // A schema was requested but the reply didn't parse as JSON.
            // Surfaced as json: null rather than thrown: a caller that only
            // wanted `text` (the guidance feature) is unaffected, and a
            // caller that needed `json` (the proposal feature) can treat a
            // miss as "nothing usable came back" rather than crash the UI.
            json = null;
          }
        }

        return { text, json };
      } finally {
        clearTimeout(timer);
      }
    },
  };
}
  // ---- src/llm/provider.js ----
// The LLM provider seam: a common interface so the app can swap between
// "the user pastes into their own model" (manualPaste.js) and "the app
// calls a local Ollama server directly" (ollama.js) without either caller
// or the two adapters knowing about each other. This is the seam
// engine/render/llmprompt.js's header always said stayed deferred until
// after the alpha pilot -- this is that seam, opened.
//
// A provider is: { id, label, isAvailable(), complete({system, user,
// schema, signal}) }. complete() returns a Promise resolving to
// {text, json}: `text` is always the model's raw reply (or, for the
// manual-paste provider, the prompt text itself -- see manualPaste.js);
// `json` is populated only when `schema` was supplied AND the reply parsed
// against it, so a caller that asked for structured proposals can tell
// "the model said nothing usable" (json: null) apart from "the model said
// something, just not machine-readable" -- the caller decides what to do
// with either, this layer only reports which one happened.
//
// This module (web/src/llm/) does network I/O, which engine/ may never do
// (see conformance.js's header). It still knows nothing about localStorage
// or the DOM -- that belongs to ui/, one layer further out.

/** True if `candidate` structurally satisfies the Provider interface. */
function isProvider(candidate) {
  return (
    candidate != null &&
    typeof candidate.id === 'string' &&
    typeof candidate.label === 'string' &&
    typeof candidate.isAvailable === 'function' &&
    typeof candidate.complete === 'function'
  );
}
  // ---- src/ui/clipboard.js ----
// Shared clipboard-copy helper. Extracted from ui/steps/naming.js (its
// "Copy full name" button), which had the only implementation of this until
// shell.js's "Copy feedback report" button (Wave 1 of alpha-pilot-
// readiness) needed the exact same fallback behavior -- one implementation,
// not two independently-maintained copies of the same file:// workaround.

/**
 * Copy `text` to the clipboard. navigator.clipboard can be restricted under
 * file:// or by permissions policy even when it exists, so fall back to the
 * classic hidden-textarea + execCommand('copy') trick.
 */
async function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      // fall through to the execCommand fallback
    }
  }
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  let ok = false;
  try {
    ok = document.execCommand('copy');
  } catch {
    ok = false;
  }
  document.body.removeChild(textarea);
  return ok;
}

// App shell: header, an always-visible assay switcher, left step nav, main
// content mount, theme toggle, and a toast/status area. Vanilla DOM only --
// every node is built with createElement/textContent, never innerHTML with
// dynamic or user data.


const THEME_KEY = 'micronaut.theme';

// Alpha-pilot feedback destinations (Wave 1 of alpha-pilot-readiness).
// Both are placeholders -- Daniel fills them in once the form/alias exist;
// until then the links simply don't render (a broken link is worse than no
// link). The "Copy feedback report" button below works either way, since it
// only builds text -- it doesn't depend on either destination existing.
//
// FEEDBACK_FORM_URL: a Google Form (or similar) -- no account needed from a
// tester, lands in a Sheet.
// FEEDBACK_EMAIL: a non-personal address (a DuckDuckGo Email Protection
// alias, or a dedicated project inbox) -- NOT a GitHub noreply address,
// which silently discards mail sent to it.
const FEEDBACK_FORM_URL = '';
const FEEDBACK_EMAIL = '';
const FEEDBACK_ISSUES_URL = 'https://github.com/Daniel-Waiger/micronaut-planner/issues/new';

function loadTheme() {
  try {
    return localStorage.getItem(THEME_KEY);
  } catch {
    return null;
  }
}

function saveTheme(theme) {
  try {
    localStorage.setItem(THEME_KEY, theme);
  } catch {
    // localStorage is a convenience; a failed write here only means the
    // toggle won't persist across reloads, which isn't worth surfacing.
  }
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
}

function osPrefersLight() {

}

function renderShell(root, store, router, { onReset, onNewBlank, kbIssueCount } = {}) {
  root.textContent = '';

  const header = document.createElement('header');
  header.className = 'shell-header';

  const title = document.createElement('div');
  title.className = 'shell-title';
  title.textContent = 'Micronaut Planner';
  header.appendChild(title);

  const themeToggle = document.createElement('button');
  themeToggle.type = 'button';
  themeToggle.className = 'theme-toggle';
  // Only stamp data-theme when the user has made an EXPLICIT choice before.
  // Stamping it unconditionally (even to 'dark', matching the app's own
  // :root default) would always win over the
  // @media (prefers-color-scheme: light) rule, so a first-time visitor on a
  // light-OS machine would always see dark regardless of their system
  // preference -- the toggle is meant to override the OS default, not
  // replace it before the user has ever touched it.
  const storedTheme = loadTheme();
  if (storedTheme) {
    applyTheme(storedTheme);
  }
  let currentTheme = storedTheme || (osPrefersLight() ? 'light' : 'dark');
  themeToggle.textContent = currentTheme === 'dark' ? 'Light mode' : 'Dark mode';
  themeToggle.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(currentTheme);
    saveTheme(currentTheme);
    themeToggle.textContent = currentTheme === 'dark' ? 'Light mode' : 'Dark mode';
  });
  const headerActions = document.createElement('div');
  headerActions.className = 'header-actions';

  // Everything is autosaved to localStorage, so a page refresh deliberately
  // RESTORES the previous session rather than clearing it. That is the right
  // default (nobody wants to lose a design to a stray F5) but it leaves no
  // way to start a genuinely new experiment -- hence explicit controls.
  // TWO distinct actions, because a first-time user lands on the seeded
  // oregano EXAMPLE study and needs an unambiguous way to plan their own:
  //   "New study"        -> a genuinely blank experiment they fill in
  //   "Reset to example" -> reload the oregano example (undo their edits)
  // Both are confirmed: they are destructive and unrecoverable.
  if (onNewBlank) {
    const newBtn = document.createElement('button');
    newBtn.type = 'button';
    newBtn.className = 'theme-toggle reset-button';
    newBtn.textContent = 'New study';
    newBtn.title = 'Start a blank study of your own (clears the current one)';
    newBtn.addEventListener('click', () => {
      const ok = window.confirm(
        'Start a new, blank study of your own?\n\nThis clears the current experiment (including the example study) and starts from an empty slate. It cannot be undone.'
      );
      if (ok) onNewBlank();
    });
    headerActions.appendChild(newBtn);
  }

  if (onReset) {
    const resetBtn = document.createElement('button');
    resetBtn.type = 'button';
    resetBtn.className = 'theme-toggle reset-button';
    resetBtn.textContent = 'Reset to example';
    // "the example study," not "an empty one" -- core/defaultStudy.js seeds
    // a fresh session with the oregano study's real research question and
    // 4 assays (weakly tagged, freely overwritable). "New study" above is
    // the blank-slate path; this one restores the example.
    resetBtn.title = 'Discard this experiment and reload the example (oregano) study';
    resetBtn.addEventListener('click', () => {
      const ok = window.confirm(
        'Discard the current experiment and reload the example (oregano) study?\n\nThis clears every answer, factor, and naming field. It cannot be undone.'
      );
      if (ok) onReset();
    });
    headerActions.appendChild(resetBtn);
  }

  // Feedback (Wave 1, alpha-pilot-readiness): the button always works --
  // it only builds and copies text, no destination required. The two links
  // are conditional on Daniel having filled in the corresponding constant
  // above; a link to nowhere is worse than no link.
  const feedbackBtn = document.createElement('button');
  feedbackBtn.type = 'button';
  feedbackBtn.className = 'theme-toggle';
  feedbackBtn.textContent = 'Copy feedback report';
  feedbackBtn.title =
    'Copies the current step, browser, knowledge-pack status, and your full study as text -- paste it into the feedback form or email.';
  feedbackBtn.addEventListener('click', async () => {
    const report = buildFeedbackReport({
      currentStepId: router.current(),
      kbIssueCount,
      userAgent: typeof navigator !== 'undefined' ? navigator.userAgent : undefined,
      experiment: store.get(),
    });
    const ok = await copyToClipboard(report);
    showToast(ok ? 'Copied a feedback report -- paste it into the form or an email.' : 'Could not copy automatically -- select and copy the report text yourself.');
  });
  headerActions.appendChild(feedbackBtn);

  if (FEEDBACK_FORM_URL) {
    const formLink = document.createElement('a');
    formLink.className = 'theme-toggle';
    formLink.href = FEEDBACK_FORM_URL;
    formLink.target = '_blank';
    formLink.rel = 'noopener noreferrer';
    formLink.textContent = 'Report an issue';
    headerActions.appendChild(formLink);
  }

  if (FEEDBACK_EMAIL) {
    const mailLink = document.createElement('a');
    mailLink.className = 'theme-toggle';
    mailLink.href = `mailto:${FEEDBACK_EMAIL}?subject=${encodeURIComponent('Micronaut Planner feedback')}`;
    mailLink.textContent = 'Email feedback';
    headerActions.appendChild(mailLink);
  }

  const issuesLink = document.createElement('a');
  issuesLink.className = 'theme-toggle';
  issuesLink.href = FEEDBACK_ISSUES_URL;
  issuesLink.target = '_blank';
  issuesLink.rel = 'noopener noreferrer';
  issuesLink.textContent = 'GitHub issue';
  headerActions.appendChild(issuesLink);

  headerActions.appendChild(themeToggle);
  header.appendChild(headerActions);
