// The Overview step: the shareable study diagram + the deterministic,
// no-LLM textual walkthrough (engine/studydoc.js -- one document model,
// three renderers: this HTML tree, the Markdown export, and the mermaid
// diagram embedded inside it). Last in main.js's steps array -- everything
// it shows is a READ over the other steps' data, never a place new facts
// are entered.
//
// The study map at the top is a self-drawn inline SVG (buildDiagramSvg
// below, over engine/render/svgDiagram.js's pure layout) -- no diagramming
// library, since the app is one self-contained file with zero npm deps and
// a strict no-external-asset rule (bundling mermaid would also blow the
// build's 2 MB size gate). The Markdown export additionally embeds a
// ```mermaid block, the exact-branching form GitHub/Notion/the Artifact
// viewer render natively; the in-app SVG is the at-a-glance visual. Both are
// renderers over the one studydoc model, so they cannot disagree.
//
// No advice panel here, matching study.js's own reasoning: every advisor
// rule keys on a per-assay fact already shown on Describe/Design/Naming;
// this step summarizes, it does not re-surface guidance a second time.


const SVG_NS = 'http://www.w3.org/2000/svg';

/**
 * Paint the diagram layout (engine/render/svgDiagram.js) into a real SVG
 * element via createElementNS + textContent -- never innerHTML with the
 * user's own study title / labels (shell.js's standing rule). The returned
 * <svg> is self-contained (its own xmlns + viewBox), so serializing it for
 * the download button below yields a valid standalone .svg file.
 */
function buildDiagramSvg(layout) {
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('xmlns', SVG_NS);
  svg.setAttribute('viewBox', `0 0 ${layout.width} ${layout.height}`);
  svg.setAttribute('width', String(layout.width));
  svg.setAttribute('height', String(layout.height));
  svg.setAttribute('class', 'study-map-svg');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Study map: the study branching to each assay and its readout, modality, design, controls, and planned filenames.');

  // One arrowhead marker, referenced by every edge.
  const defs = document.createElementNS(SVG_NS, 'defs');
  const marker = document.createElementNS(SVG_NS, 'marker');
  marker.setAttribute('id', 'study-map-arrow');
  marker.setAttribute('viewBox', '0 0 10 10');
  marker.setAttribute('refX', '9');
  marker.setAttribute('refY', '5');
  marker.setAttribute('markerWidth', '6');
  marker.setAttribute('markerHeight', '6');
  marker.setAttribute('orient', 'auto-start-reverse');
  const arrowPath = document.createElementNS(SVG_NS, 'path');
  arrowPath.setAttribute('d', 'M 0 0 L 10 5 L 0 10 z');
  arrowPath.setAttribute('class', 'study-map-arrowhead');
  marker.appendChild(arrowPath);
  defs.appendChild(marker);
  svg.appendChild(defs);

  // Edges first, so nodes paint on top of the lines.
  for (const edge of layout.edges) {
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', String(edge.x1));
    line.setAttribute('y1', String(edge.y1));
    line.setAttribute('x2', String(edge.x2));
    line.setAttribute('y2', String(edge.y2));
    line.setAttribute('class', 'study-map-edge');
    line.setAttribute('marker-end', 'url(#study-map-arrow)');
    svg.appendChild(line);
  }

  for (const node of layout.nodes) {
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('class', `study-map-node study-map-node-${node.type}`);

    const rect = document.createElementNS(SVG_NS, 'rect');
    rect.setAttribute('x', String(node.x));
    rect.setAttribute('y', String(node.y));
    rect.setAttribute('width', String(node.w));
    rect.setAttribute('height', String(node.h));
    rect.setAttribute('rx', '8');
    rect.setAttribute('class', 'study-map-box');
    g.appendChild(rect);

    const caption = document.createElementNS(SVG_NS, 'text');
    caption.setAttribute('x', String(node.x + node.w / 2));
    caption.setAttribute('y', String(node.y + 18));
    caption.setAttribute('text-anchor', 'middle');
    caption.setAttribute('class', 'study-map-caption');
    caption.textContent = node.caption;
    g.appendChild(caption);

    const value = document.createElementNS(SVG_NS, 'text');
    value.setAttribute('x', String(node.x + node.w / 2));
    value.setAttribute('y', String(node.y + 36));
    value.setAttribute('text-anchor', 'middle');
    value.setAttribute('class', 'study-map-value');
    value.textContent = node.value;
    g.appendChild(value);

    svg.appendChild(g);
  }

  return svg;
}

function readoutLine(readout) {
  if (readout.state === 'known') return `Readout: ${readout.label}`;
  if (readout.state === 'unrecognized') return `Readout: "${readout.text}" (not recognized yet)`;
  return 'Readout: not answered yet';
}

function designLine(design) {
  const parts = [];
  if (design.arms.length > 0) parts.push(`arms: ${design.arms.join(', ')}`);
  for (const factor of design.factors) parts.push(`${factor.name}: ${factor.levels.join(', ')}`);
  if (design.biologicalReplicates) parts.push(`${design.biologicalReplicates} bio rep(s)`);
  if (design.technicalReplicates) parts.push(`${design.technicalReplicates} tech rep(s)`);
  const base = parts.length > 0 ? parts.join(' · ') : 'no design axes set yet';
  return `${design.conditionCount} planned row(s) — ${base}`;
}

function appendLabeledNode(parent, className, text) {
  const node = document.createElement('div');
  node.className = className;
  node.textContent = text;
  parent.appendChild(node);
  return node;
}

/**
 * The controls sub-tree: THREE(-plus-one)-STATE rendering is mandatory
 * (Decision 5, docs/plans/planner-web-assay-tier.md) -- an empty controls
 * list must never look identical to "nothing to show", since silence there
 * reads as "this assay needs no controls," the most dangerous false
 * negative a controls advisor can produce. `controls.readoutMessage` is the
 * SINGLE resolved string for whichever state applies
 * (engine/studydoc.js's readoutMessageFor) -- read here verbatim, never
 * re-derived, so this can never disagree with render/markdown.js's
 * rendering of the identical fact. An adversarial pass on an earlier
 * version of this commit found exactly that divergence (a recognized
 * readout with zero matching rules read as "not recognized" in one
 * renderer and "no guidance yet" in the other) -- lesson 49/50's failure
 * shape recurring inside the commit that names those lessons as its
 * motivation. This is the structural fix, not a second discipline.
 */
function renderControlsNode(parent, controls) {
  const box = document.createElement('div');
  box.className = 'overview-controls';

  const heading = document.createElement('div');
  heading.className = 'overview-node-title';
  heading.textContent = 'Controls';
  box.appendChild(heading);

  if (controls.panel.length > 0) {
    const groupLabel = document.createElement('div');
    groupLabel.className = 'overview-controls-group-label';
    groupLabel.textContent = 'Panel-derived';
    box.appendChild(groupLabel);

    const list = document.createElement('ul');
    list.className = 'overview-controls-list';
    for (const control of controls.panel) {
      const li = document.createElement('li');
      const strong = document.createElement('strong');
      strong.textContent = control.title;
      li.appendChild(strong);
      li.appendChild(document.createTextNode(` — ${control.why}`));
      list.appendChild(li);
    }
    box.appendChild(list);
  }

  const readoutLabel = document.createElement('div');
  readoutLabel.className = 'overview-controls-group-label';
  readoutLabel.textContent = 'Readout-specific';
  box.appendChild(readoutLabel);

  if (controls.readout.length > 0) {
    const list = document.createElement('ul');
    list.className = 'overview-controls-list';
    for (const control of controls.readout) {
      const li = document.createElement('li');
      const strong = document.createElement('strong');
      strong.textContent = control.title;
      li.appendChild(strong);
      li.appendChild(document.createTextNode(` — ${control.why}`));
      list.appendChild(li);
    }
    box.appendChild(list);
  } else {
    const empty = document.createElement('p');
    empty.className = 'overview-controls-empty';
    empty.textContent = controls.readoutMessage;
    box.appendChild(empty);
  }

  parent.appendChild(box);
}

/** The fixed 5-stage backbone, rendered ONCE for the whole study -- see engine/studydoc.js's stageNotes comment for why. */
function renderLadderNode(parent, ladder) {
  const box = document.createElement('div');
  box.className = 'overview-ladder';

  const heading = document.createElement('div');
  heading.className = 'overview-node-title';
  heading.textContent = 'How to run this project';
  box.appendChild(heading);

  const ol = document.createElement('ol');
  ol.className = 'overview-ladder-list';
  for (const stage of ladder) {
    const li = document.createElement('li');
    const title = document.createElement('div');
    title.className = 'overview-ladder-title';
    title.textContent = stage.title;
    li.appendChild(title);

    const body = document.createElement('p');
    body.className = 'overview-ladder-body';
    body.textContent = stage.body;
    li.appendChild(body);

    ol.appendChild(li);
  }
  box.appendChild(ol);
  parent.appendChild(box);
}

/** Per-assay STUDY-SPECIFIC notes only -- omitted entirely when an assay has none, per engine/studydoc.js's stageNotes. */
function renderStageNotesNode(parent, stageNotes) {
  if (stageNotes.length === 0) return;
  const box = document.createElement('div');
  box.className = 'overview-ladder';

  const heading = document.createElement('div');
  heading.className = 'overview-node-title';
  heading.textContent = 'Notes for this assay';
  box.appendChild(heading);

  for (const stage of stageNotes) {
    const title = document.createElement('div');
    title.className = 'overview-ladder-title';
    title.textContent = stage.stageTitle;
    box.appendChild(title);

    const notes = document.createElement('ul');
    notes.className = 'overview-ladder-notes';
    for (const note of stage.notes) {
      const li = document.createElement('li');
      li.textContent = note;
      notes.appendChild(li);
    }
    box.appendChild(notes);
  }
  parent.appendChild(box);
}

function renderAssayNode(parent, assay, onDownloadBenchCard) {
  const box = document.createElement('div');
  box.className = 'overview-assay';

  const headerRow = document.createElement('div');
  headerRow.className = 'overview-assay-header';

  const heading = document.createElement('div');
  heading.className = 'overview-assay-title';
  heading.textContent = `Assay ${assay.index}: ${assay.label}`;
  headerRow.appendChild(heading);

  // Per-assay, not a single study-wide button -- a bench card is a
  // SINGLE-ASSAY document by design (render/benchcard.js's own header), and
  // a multi-assay study has no one obvious "current" assay to default to
  // here the way the Color panel step can (this is a pure read over every
  // assay, not scoped to whichever one is active in the switcher).
  const benchCardBtn = document.createElement('button');
  benchCardBtn.type = 'button';
  benchCardBtn.className = 'copy-button overview-assay-benchcard-btn';
  benchCardBtn.textContent = 'Download bench card (.md)';
  benchCardBtn.addEventListener('click', () => onDownloadBenchCard(assay));
  headerRow.appendChild(benchCardBtn);

  box.appendChild(headerRow);

  appendLabeledNode(box, 'overview-node', readoutLine(assay.readout));
  appendLabeledNode(box, 'overview-node', `Modality: ${assay.modality || 'not answered yet'}`);
  const specimenBits = [assay.specimen.organism, assay.specimen.sampleType, assay.specimen.preparation].filter(Boolean);
  if (specimenBits.length > 0) {
    appendLabeledNode(box, 'overview-node', `Specimen: ${specimenBits.join(', ')}`);
  }
  appendLabeledNode(box, 'overview-node', designLine(assay.design));
  if (assay.design.issues.length > 0) {
    const issuesList = document.createElement('ul');
    issuesList.className = 'issues-list';
    for (const issue of assay.design.issues) {
      const li = document.createElement('li');
      li.className = 'issue issue-' + issue.severity;
      li.textContent = `${issue.field}: ${issue.message}`;
      issuesList.appendChild(li);
    }
    box.appendChild(issuesList);
  }

  renderControlsNode(box, assay.controls);
  renderStageNotesNode(box, assay.stageNotes);

  const filesHeading = document.createElement('div');
  filesHeading.className = 'overview-node-title';
  filesHeading.textContent = `Planned filenames (${assay.filenames.length})`;
  box.appendChild(filesHeading);
  const filesList = document.createElement('div');
  filesList.className = 'planned-list';
  if (assay.filenames.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'planned-empty';
    empty.textContent = 'No names to show -- see the issues in the Design step.';
    filesList.appendChild(empty);
  }
  for (const entry of assay.filenames) {
    const line = document.createElement('code');
    line.className = 'planned-name';
    line.textContent = entry.filename || `(${entry.error})`;
    filesList.appendChild(line);
  }
  box.appendChild(filesList);

  parent.appendChild(box);
}

function createOverviewStep(kb) {
  return {
    id: 'overview',
    title: 'Overview',
    render(main, store, { showToast } = {}) {
      main.textContent = '';

      const heading = document.createElement('h1');
      heading.className = 'step-heading';
      heading.textContent = 'Study overview';
      main.appendChild(heading);

      const explainer = document.createElement('p');
      explainer.className = 'proposals-empty';
      explainer.textContent =
        'A deterministic summary of this study, built entirely from what you’ve entered on the other steps -- nothing here is LLM-generated.';
      main.appendChild(explainer);

      const actions = document.createElement('div');
      actions.className = 'overview-actions';

      // One button-wiring path for every export: build a fresh doc (never
      // the one this render() closed over, since a download can fire long
      // after typing continued to change the store), derive the filename
      // from the study title, hand the text to downloadTextFile, toast.
      // Four near-identical copies of this used to live inline here --
      // each new export format (CSV, then JSON) meant copy-pasting an
      // eleven-line block, so the title-sanitizing regex alone was
      // duplicated four times over with three chances to fix it in only
      // one place. `render` takes the fresh doc and returns the file text;
      // everything format-specific (renderMarkdown, the SVG serialization,
      // renderCsv, renderJson) stays a one-line argument.
      function addDownloadButton({ label, fallbackName, ext, mime, render, toastMessage }) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'copy-button';
        btn.textContent = label;
        btn.addEventListener('click', () => {
          const freshDoc = buildStudyDocument(store.get(), kb, NAMING_CONFIG, BASE_TEMPLATE);
          const filename = `${(freshDoc.study.title || fallbackName).replace(/[^A-Za-z0-9_-]+/g, '-')}.${ext}`;
          downloadTextFile(render(freshDoc), filename, mime);
          if (showToast) showToast(toastMessage);
        });
        actions.appendChild(btn);
      }

      addDownloadButton({
        label: 'Download Markdown (.md)',
        fallbackName: 'study-overview',
        ext: 'md',
        mime: 'text/markdown',
        render: renderMarkdown,
        toastMessage: 'Downloaded the study overview as Markdown.',
      });

      addDownloadButton({
        label: 'Download study map (.svg)',
        fallbackName: 'study-map',
        ext: 'svg',
        mime: 'image/svg+xml',
        render: (freshDoc) => {
          const svg = buildDiagramSvg(buildDiagramLayout(freshDoc));
          const serialized = new XMLSerializer().serializeToString(svg);
          return `<?xml version="1.0" encoding="UTF-8"?>\n${serialized}`;
        },
        toastMessage: 'Downloaded the study map as SVG.',
      });

      addDownloadButton({
        label: 'Download file manifest (.csv)',
        fallbackName: 'study-manifest',
        ext: 'csv',
        mime: 'text/csv',
        render: renderCsv,
        toastMessage: 'Downloaded the file manifest as CSV.',
      });

      addDownloadButton({
        label: 'Download raw data (.json)',
        fallbackName: 'study-overview',
        ext: 'json',
        mime: 'application/json',
        render: renderJson,
        toastMessage: 'Downloaded the study overview as JSON.',
      });

      // "Export for your own LLM": a COPY button, not a download -- the
      // whole point is pasting it straight into whatever model the user
      // already has open (engine/render/llmprompt.js's header). A download
      // button is offered alongside for anyone who wants the file.
      const copyLlmBtn = document.createElement('button');
      copyLlmBtn.type = 'button';
      copyLlmBtn.className = 'copy-button';
      copyLlmBtn.textContent = 'Copy prompt for your own LLM';
      copyLlmBtn.title =
        'Copies an instruction preamble + this study as JSON + suggested questions. Paste it into ChatGPT/Claude/whatever you use -- nothing is sent from this app.';
      copyLlmBtn.addEventListener('click', async () => {
        const freshDoc = buildStudyDocument(store.get(), kb, NAMING_CONFIG, BASE_TEMPLATE);
        const ok = await copyToClipboard(renderLlmPrompt(freshDoc));
        if (showToast) {
          showToast(
            ok
              ? 'Copied the prompt -- paste it into your own LLM. Nothing was sent from this app.'
              : 'Could not copy automatically -- use "Download raw data (.json)" instead.'
          );
        }
      });
      actions.appendChild(copyLlmBtn);

      const printBtn = document.createElement('button');
      printBtn.type = 'button';
      printBtn.className = 'copy-button';
      printBtn.textContent = 'Print / Save as PDF';
      printBtn.addEventListener('click', () => window.print());
      actions.appendChild(printBtn);

      main.appendChild(actions);

      const doc = buildStudyDocument(store.get(), kb, NAMING_CONFIG, BASE_TEMPLATE);

      // The study map: the headline visual of this step, placed first. A
      // horizontal scroll container keeps a wide (many-assay) map from forcing
      // the whole page to scroll sideways.
      const mapSection = document.createElement('section');
      mapSection.className = 'study-map';
      const mapHeading = document.createElement('h2');
      mapHeading.className = 'overview-node-title';
      mapHeading.textContent = 'Study map';
      mapSection.appendChild(mapHeading);
      const mapScroll = document.createElement('div');
      mapScroll.className = 'study-map-scroll';
      mapScroll.appendChild(buildDiagramSvg(buildDiagramLayout(doc)));
      mapSection.appendChild(mapScroll);
      main.appendChild(mapSection);

      if (doc.study.researchQuestion) {
        appendLabeledNode(main, 'overview-node overview-research-question', doc.study.researchQuestion);
      }

      // The conformance gate: ONE "is this study ready?" verdict, composed
      // from checks the individual steps already run (engine/conformance.js).
      // Placed above the per-assay tree so the answer is the first thing
      // read, not something to reconstruct by scrolling every assay.
      const conformance = checkConformance(store.get(), kb, NAMING_CONFIG, BASE_TEMPLATE);
      const conformanceSection = document.createElement('section');
      conformanceSection.className = 'conformance';

      const conformanceHeading = document.createElement('h2');
      conformanceHeading.className = 'overview-node-title';
      conformanceHeading.textContent = 'Conformance check';
      conformanceSection.appendChild(conformanceHeading);

      const verdict = document.createElement('div');
      verdict.className = `conformance-verdict conformance-${conformance.pass ? 'pass' : 'fail'}`;
      verdict.textContent = conformance.pass
        ? `Passes: nothing blocking across ${conformance.assays.length} assay(s).`
        : 'Does not pass yet: at least one blocking problem below.';
      conformanceSection.appendChild(verdict);

      const conformanceIssues = conformance.assays.flatMap((a) => a.issues.map((i) => ({ ...i, label: a.label })));
      const allConformanceIssues = [...conformanceIssues, ...conformance.crossAssayIssues.map((i) => ({ ...i, label: 'Across assays' }))];
      if (allConformanceIssues.length === 0) {
        const clean = document.createElement('p');
        clean.className = 'panel-empty';
        clean.textContent = 'No issues found at all -- every check this app runs came back clean.';
        conformanceSection.appendChild(clean);
      } else {
        const list = document.createElement('ul');
        list.className = 'issues-list';
        for (const issue of allConformanceIssues) {
          const li = document.createElement('li');
          li.className = 'issue issue-' + issue.severity;
          li.textContent = `[${issue.section}] ${issue.label}: ${issue.message}`;
          list.appendChild(li);
        }
        conformanceSection.appendChild(list);
      }
      main.appendChild(conformanceSection);

      if (doc.crossAssayIssues.length > 0) {
        const issuesList = document.createElement('ul');
        issuesList.className = 'issues-list';
        for (const issue of doc.crossAssayIssues) {
          const li = document.createElement('li');
          li.className = 'issue issue-' + issue.severity;
          li.textContent = `${issue.field}: ${issue.message}`;
          issuesList.appendChild(li);
        }
        main.appendChild(issuesList);
      }

      // Rendered ONCE for the whole study -- see engine/studydoc.js's
      // stageNotes comment for why this moved out of the per-assay loop.
      renderLadderNode(main, doc.ladder);

      const tree = document.createElement('div');
      tree.className = 'overview-tree';
      for (const assay of doc.assays) {
        renderAssayNode(tree, assay, (assayForCard) => {
          const filename = `${(assayForCard.label || 'bench-card').replace(/[^A-Za-z0-9_-]+/g, '-')}-bench-card.md`;
          downloadTextFile(renderBenchCard(assayForCard), filename, 'text/markdown');
          if (showToast) showToast(`Downloaded the bench card for "${assayForCard.label}".`);
        });
      }
      main.appendChild(tree);
    },
  };
}

// Native, accessible fluorophore picker for the structured Color-panel editor.
// The library remains authoritative for known dyes; free text is deliberately
// available only behind one explicit "not in library" choice.

const fluorophorePickerCustomValue = '__micronaut_custom_fluorophore__';

function fluorophorePickerHasValue(options, value) {
  return options.some((option) => option.value === value);
}

function fluorophorePickerCreate({
  options = [],
  currentValue = '',
  libraryValue = '',
  isTagLigand = false,
  onChange,
} = {}) {
  const catalog = Array.isArray(options) ? options : [];
  const savedValue = typeof currentValue === 'string' ? currentValue : '';
  const matchedLibraryValue =
    typeof libraryValue === 'string' && fluorophorePickerHasValue(catalog, libraryValue)
      ? libraryValue
      : '';

  const wrapper = document.createElement('div');
  wrapper.className = 'panel-fluorophore-picker';
  wrapper.setAttribute('role', 'group');

  const label = document.createElement('span');
  label.className = 'panel-fluorophore-label';
  label.textContent = isTagLigand ? 'Ligand dye library' : 'Fluorophore library';
  wrapper.appendChild(label);
  wrapper.setAttribute('aria-label', label.textContent);

  const select = document.createElement('select');
  select.className = 'panel-row-text panel-fluorophore-select';
  select.setAttribute('aria-label', label.textContent);

  const prompt = document.createElement('option');
  prompt.value = '';
  prompt.textContent = 'Select a known fluorophore…';
  select.appendChild(prompt);

  const knownGroup = document.createElement('optgroup');
  knownGroup.label = `Known fluorophores (${catalog.length})`;
  for (const entry of catalog) {
    if (!entry || typeof entry.value !== 'string' || typeof entry.label !== 'string') continue;
    const option = document.createElement('option');
    option.value = entry.value;
    option.textContent = entry.label;
    knownGroup.appendChild(option);
  }
  select.appendChild(knownGroup);

  const customOption = document.createElement('option');
  customOption.value = fluorophorePickerCustomValue;
  customOption.textContent = isTagLigand
    ? 'Not in library — add new ligand dye…'
    : 'Not in library — add new fluorophore…';
  select.appendChild(customOption);

  const customInput = document.createElement('input');
  customInput.className = 'panel-row-text panel-fluorophore-custom';
  customInput.type = 'text';
  customInput.placeholder = isTagLigand ? 'New ligand dye name' : 'New fluorophore name';
  customInput.setAttribute('aria-label', customInput.placeholder);

  const startsCustom = !matchedLibraryValue && savedValue.trim().length > 0;
  select.value = startsCustom ? fluorophorePickerCustomValue : matchedLibraryValue;
  customInput.value = startsCustom ? savedValue : '';
  customInput.hidden = !startsCustom;

  // `isStructural` (second callback arg) tells the caller whether this
  // change resolved to a REAL library fluorophore -- safe, and necessary,
  // for a caller that derives other fields (a color/filter default) from
  // the fluorophore to fully re-render. `false` for anything that doesn't:
  // switching TO custom-entry mode (nothing recognized yet) and every
  // keystroke while typing the custom name both leave this component's OWN
  // customInput on screen expecting to keep focus -- a caller-triggered
  // structural re-render there would tear down and recreate that very
  // input out from under the `customInput.focus()` call below (or the
  // user's next keystroke), moving focus to <body> mid-edit. Defaults true
  // so a caller that ignores the flag (only reads `value`) keeps its
  // previous always-fine-to-rerender behavior for the common case this was
  // always safe for: a plain library pick.
  function fluorophorePickerEmit(value, isStructural = true) {
    if (typeof onChange === 'function') onChange(value, isStructural);
  }

  select.addEventListener('change', () => {
    if (select.value === fluorophorePickerCustomValue) {
      customInput.hidden = false;
      customInput.value = '';
      fluorophorePickerEmit('', false);
      customInput.focus();
      return;
    }
    customInput.hidden = true;
    customInput.value = '';
    fluorophorePickerEmit(select.value);
  });

  customInput.addEventListener('input', () => fluorophorePickerEmit(customInput.value, false));

  wrapper.appendChild(select);
  wrapper.appendChild(customInput);
  return wrapper;
}
  // ---- src/ui/spectralView.js ----

const spectralViewSvgNs = 'http://www.w3.org/2000/svg';
const spectralViewWidth = 720;
const spectralViewHeight = 316;
const spectralViewPlot = { left: 58, right: 18, top: 64, bottom: 50 };
const spectralViewSeriesCount = 8;

function spectralViewElement(name, className, text) {
  const element = document.createElement(name);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function spectralViewSvgElement(name, attributes, className, text) {
  const element = document.createElementNS(spectralViewSvgNs, name);
  if (className) element.setAttribute('class', className);
  for (const [key, value] of Object.entries(attributes || {})) element.setAttribute(key, String(value));
  if (text !== undefined) element.textContent = text;
  return element;
}

function spectralViewScale(value, domainMin, domainMax, rangeMin, rangeMax) {
  return rangeMin + ((value - domainMin) / (domainMax - domainMin)) * (rangeMax - rangeMin);
}

function spectralViewPath(curve, model) {
  const plotWidth = spectralViewWidth - spectralViewPlot.left - spectralViewPlot.right;
  const plotHeight = spectralViewHeight - spectralViewPlot.top - spectralViewPlot.bottom;
  return curve.points
    .map((point, index) => {
      const x = spectralViewScale(
        point.wavelengthNm,
        model.domain.minNm,
        model.domain.maxNm,
        spectralViewPlot.left,
        spectralViewPlot.left + plotWidth
      );
      const y = spectralViewPlot.top + (1 - point.intensity) * plotHeight;
      return `${index === 0 ? 'M' : 'L'}${x.toFixed(2)},${y.toFixed(2)}`;
    })
    .join(' ');
}

function spectralViewSeriesClass(index) {
  return `spectral-view-series-${index % spectralViewSeriesCount}`;
}

// Color-panel patch: a curve/filter with its own color (engine/
// spectralView.js's spectralViewValidColor -- the channel's user-picked or
// wavelength-derived color) renders in THAT color instead of the rotating
// series palette. Inline style, not a class, so it wins over
// .spectral-view-series-N's color/fill/stroke by specificity while leaving
// that class's stroke-dasharray untouched -- overlapping same-hued curves
// still read apart by dash pattern, not just hue.
function spectralViewApplyColor(element, color) {
  if (!color) return;
  element.style.color = color;
  element.style.fill = color;
  element.style.stroke = color;
}

function spectralViewFilterSeriesIndex(filter, model, fallbackIndex) {
  const matched = model.curves.findIndex(
    (curve) =>
      (filter.channelId && curve.channelId === filter.channelId) ||
      (!filter.channelId && filter.token && curve.token === filter.token)
  );
  return matched >= 0 ? matched : fallbackIndex;
}

function spectralViewItemKey(kind, item, index) {
  if (item.channelId) return `${kind}:channel:${item.channelId}`;
  const identity = item.canonical || item.token || `item-${index}`;
  const value = kind === 'curve' ? item.emissionPeakNm : `${item.centerNm}/${item.bandwidthNm}`;
  return `${kind}:${identity}:${value}`;
}

/** Create interaction state that survives renderer refreshes in one Color-panel visit. */
function spectralViewCreateState() {
  return { hiddenCurves: new Set(), hiddenFilters: new Set() };
}

function spectralViewStateSet(state, kind) {
  const key = kind === 'curve' ? 'hiddenCurves' : 'hiddenFilters';
  if (!state || !(state[key] instanceof Set)) return null;
  return state[key];
}

function spectralViewCurveRecords(model) {
  return model.curves.map((curve, index) => ({
    kind: 'curve',
    key: spectralViewItemKey('curve', curve, index),
    item: curve,
    seriesIndex: index,
    name: curve.token,
    summary: `Emission peak ${curve.emissionPeakNm} nm · schematic width ${curve.fwhmNm} nm.`,
  }));
}

function spectralViewFilterRecords(model) {
  return model.filters.map((filter, index) => {
    const token = filter.token.trim() || 'Unresolved channel';
    const clipped = filter.clipped ? ' · band clipped to the plotted range' : '';
    return {
      kind: 'filter',
      key: spectralViewItemKey('filter', filter, index),
      item: filter,
      seriesIndex: spectralViewFilterSeriesIndex(filter, model, index),
      name: `${token} filter`,
      summary:
        `${filter.centerNm}/${filter.bandwidthNm} nm center/bandwidth · ` +
        `${filter.startNm}–${filter.endNm} nm passband${clipped}.`,
    };
  });
}

function spectralViewAppendAxis(svg, model) {
  const plotBottom = spectralViewHeight - spectralViewPlot.bottom;
  const plotRight = spectralViewWidth - spectralViewPlot.right;
  svg.append(
    spectralViewSvgElement(
      'line',
      { x1: spectralViewPlot.left, y1: plotBottom, x2: plotRight, y2: plotBottom },
      'spectral-view-axis'
    )
  );
  for (let wavelength = 300; wavelength <= 900; wavelength += 100) {
    const x = spectralViewScale(
      wavelength,
      model.domain.minNm,
      model.domain.maxNm,
      spectralViewPlot.left,
      plotRight
    );
    svg.append(
      spectralViewSvgElement(
        'line',
        { x1: x, y1: spectralViewPlot.top, x2: x, y2: plotBottom },
        'spectral-view-grid'
      ),
      spectralViewSvgElement(
        'line',
        { x1: x, y1: plotBottom, x2: x, y2: plotBottom + 5 },
        'spectral-view-axis'
      ),
      spectralViewSvgElement(
        'text',
        { x, y: plotBottom + 20, 'text-anchor': 'middle' },
        'spectral-view-tick',
        `${wavelength}`
      )
    );
  }
  svg.append(
    spectralViewSvgElement(
      'text',
      { x: spectralViewWidth / 2, y: spectralViewHeight - 8, 'text-anchor': 'middle' },
      'spectral-view-axis-label',
      'Emission wavelength (nm)'
    )
  );
}

function spectralViewAppendFilters(svg, model, records) {
  const plotRight = spectralViewWidth - spectralViewPlot.right;
  const plotBottom = spectralViewHeight - spectralViewPlot.bottom;
  const labelLaneRightEdges = [];
  for (const record of records) {
    const filter = record.item;
    const x = spectralViewScale(
      filter.startNm,
      model.domain.minNm,
      model.domain.maxNm,
      spectralViewPlot.left,
      plotRight
    );
    const endX = spectralViewScale(
      filter.endNm,
      model.domain.minNm,
      model.domain.maxNm,
      spectralViewPlot.left,
      plotRight
    );
    const centerX = (x + endX) / 2;
    const labelText = `${filter.centerNm}/${filter.bandwidthNm} nm`;
    const labelHalfWidth = Math.max(24, labelText.length * 3.2);
    const labelX = Math.min(
      Math.max(centerX, spectralViewPlot.left + labelHalfWidth),
      plotRight - labelHalfWidth
    );
    const labelLeft = labelX - labelHalfWidth;
    const labelRight = labelX + labelHalfWidth;
    let labelLane = labelLaneRightEdges.findIndex((rightEdge) => labelLeft > rightEdge + 6);
    if (labelLane < 0) labelLane = labelLaneRightEdges.length;
    labelLaneRightEdges[labelLane] = labelRight;
    const group = spectralViewSvgElement(
      'g',
      {
        tabindex: 0,
        role: 'button',
        'aria-label': `${record.name}, ${record.summary} Press Enter or Space to toggle.`,
        'aria-pressed': 'true',
        'data-spectral-key': record.key,
      },
      `spectral-view-data spectral-view-filter-group ${spectralViewSeriesClass(record.seriesIndex)}`
    );
    group.append(
      spectralViewSvgElement('title', {}, '', `${record.name}: ${record.summary}`),
      spectralViewSvgElement(
        'rect',
        { x, y: spectralViewPlot.top, width: Math.max(0, endX - x), height: plotBottom - spectralViewPlot.top },
        'spectral-view-filter'
      ),
      spectralViewSvgElement(
        'text',
        { x: labelX, y: spectralViewPlot.top + 17 + labelLane * 16, 'text-anchor': 'middle' },
        'spectral-view-filter-label',
        labelText
      )
    );
    spectralViewApplyColor(group, filter.color);
    record.group = group;
    svg.append(group);
  }
}

function spectralViewAppendCurves(svg, model, records) {
  const plotBottom = spectralViewHeight - spectralViewPlot.bottom;
  const plotRight = spectralViewWidth - spectralViewPlot.right;
  for (const [index, record] of records.entries()) {
    const curve = record.item;
    const seriesClass = spectralViewSeriesClass(record.seriesIndex);
    const peakX = spectralViewScale(
      curve.emissionPeakNm,
      model.domain.minNm,
      model.domain.maxNm,
      spectralViewPlot.left,
      plotRight
    );
    const group = spectralViewSvgElement(
      'g',
      {
        tabindex: 0,
        role: 'button',
        'aria-label': `${record.name}, ${record.summary} Press Enter or Space to toggle.`,
        'aria-pressed': 'true',
        'data-spectral-key': record.key,
      },
      `spectral-view-data spectral-view-curve-group ${seriesClass}`
    );
    const label = spectralViewSvgElement(
      'text',
      { x: peakX, y: 18 + (index % 3) * 15, 'text-anchor': 'middle' },
      'spectral-view-peak-label'
    );
    label.append(
      spectralViewSvgElement('tspan', { x: peakX }, 'spectral-view-peak-name', curve.token),
      spectralViewSvgElement(
        'tspan',
        { x: peakX, dy: 12 },
        'spectral-view-peak-value',
        `${curve.emissionPeakNm} nm`
      )
    );
    group.append(
      spectralViewSvgElement('title', {}, '', `${record.name}: ${record.summary}`),
      spectralViewSvgElement('path', { d: spectralViewPath(curve, model) }, 'spectral-view-curve'),
      spectralViewSvgElement(
        'line',
        { x1: peakX, y1: spectralViewPlot.top, x2: peakX, y2: plotBottom },
        'spectral-view-peak'
      ),
      label
    );
    spectralViewApplyColor(group, curve.color);
    record.group = group;
    svg.append(group);
  }
}

function spectralViewAppendLegend(wrapper, records) {
  const legend = spectralViewElement('ul', 'spectral-view-legend');
  legend.setAttribute('aria-label', 'Spectrum visibility controls');
  for (const record of records) {
    const item = spectralViewElement('li', 'spectral-view-legend-item');
    const button = spectralViewElement('button', 'spectral-view-legend-button');
    button.type = 'button';
    button.setAttribute('aria-pressed', 'true');
    button.setAttribute('data-spectral-key', record.key);
    const sampleClass =
      record.kind === 'curve' ? 'spectral-view-legend-sample' : 'spectral-view-filter-sample';
    const sample = spectralViewElement(
      'span',
      `${sampleClass} ${spectralViewSeriesClass(record.seriesIndex)}`
    );
    sample.setAttribute('aria-hidden', 'true');
    spectralViewApplyColor(sample, record.item.color);
    const label =
      record.kind === 'curve'
        ? `${record.name} · ${record.item.emissionPeakNm} nm peak`
        : `${record.name} · ${record.item.centerNm}/${record.item.bandwidthNm} nm`;
    const state = spectralViewElement('span', 'spectral-view-legend-state', 'On');
    button.append(sample, spectralViewElement('span', 'spectral-view-legend-text', label), state);
    item.append(button);
    legend.append(item);
    record.button = button;
    record.stateLabel = state;
  }
  wrapper.append(legend);
}

function spectralViewWireInteractions(chart, records, details, tooltip, state) {
  const defaultName = 'Explore the spectrum';
  const defaultSummary = 'Hover, focus, or select a curve or filter. Click it to turn that element on or off.';
  const detailsName = details.querySelector('.spectral-view-details-name');
  const detailsSummary = details.querySelector('.spectral-view-details-summary');
  const tooltipName = tooltip.querySelector('.spectral-view-tooltip-name');
  const tooltipSummary = tooltip.querySelector('.spectral-view-tooltip-summary');
  let hoveredRecord = null;
  let focusedRecord = null;

  function setDetails(record) {
    detailsName.textContent = record ? record.name : defaultName;
    detailsSummary.textContent = record
      ? `${record.summary} ${spectralViewRecordIsHidden(record, state) ? 'Currently off.' : 'Currently on.'}`
      : defaultSummary;
  }

  function refreshActive() {
    const activeRecord = hoveredRecord || focusedRecord;
    for (const other of records) {
      const active = other === activeRecord;
      other.group.classList.toggle('spectral-view-active', active);
      other.button.classList.toggle('spectral-view-active', active);
      const muted = Boolean(activeRecord) && !active && !spectralViewRecordIsHidden(other, state);
      other.group.classList.toggle('spectral-view-muted', muted);
      other.button.classList.toggle('spectral-view-muted', muted);
    }
    setDetails(activeRecord);
  }

  function setHovered(record) {
    hoveredRecord = record;
    refreshActive();
  }

  function setFocused(record) {
    focusedRecord = record;
    refreshActive();
  }

  function showTooltip(record, event) {
    tooltipName.textContent = record.name;
    tooltipSummary.textContent = record.summary;
    tooltip.hidden = false;
    moveTooltip(event);
  }

  function moveTooltip(event) {
    if (tooltip.hidden || typeof event.clientX !== 'number') return;
    const bounds = chart.getBoundingClientRect();
    const left = Math.min(Math.max(event.clientX - bounds.left + 12, 8), Math.max(8, bounds.width - 250));
    const top = Math.min(Math.max(event.clientY - bounds.top + 12, 8), Math.max(8, bounds.height - 74));
    tooltip.style.left = `${left}px`;
    tooltip.style.top = `${top}px`;
  }

  function updateVisibility(record) {
    const hidden = spectralViewRecordIsHidden(record, state);
    record.group.classList.toggle('spectral-view-off', hidden);
    record.button.classList.toggle('spectral-view-off', hidden);
    record.group.setAttribute('aria-pressed', hidden ? 'false' : 'true');
    record.button.setAttribute('aria-pressed', hidden ? 'false' : 'true');
    record.stateLabel.textContent = hidden ? 'Off' : 'On';
    record.button.title = `${hidden ? 'Turn on' : 'Turn off'} ${record.name}`;
  }

  function toggle(record) {
    const hiddenSet = spectralViewStateSet(state, record.kind);
    if (hiddenSet) {
      if (hiddenSet.has(record.key)) hiddenSet.delete(record.key);
      else hiddenSet.add(record.key);
    }
    updateVisibility(record);
    setDetails(record);
  }

  for (const record of records) {
    updateVisibility(record);
    record.group.addEventListener('pointerenter', (event) => {
      setHovered(record);
      showTooltip(record, event);
    });
    record.group.addEventListener('pointermove', moveTooltip);
    record.group.addEventListener('pointerleave', () => {
      tooltip.hidden = true;
      if (hoveredRecord === record) setHovered(null);
    });
    record.group.addEventListener('focus', () => setFocused(record));
    record.group.addEventListener('blur', () => {
      if (focusedRecord === record) setFocused(null);
    });
    record.group.addEventListener('click', () => toggle(record));
    record.group.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggle(record);
      }
    });
    record.button.addEventListener('pointerenter', () => setHovered(record));
    record.button.addEventListener('pointerleave', () => {
      if (hoveredRecord === record) setHovered(null);
    });
    record.button.addEventListener('focus', () => setFocused(record));
    record.button.addEventListener('blur', () => {
      if (focusedRecord === record) setFocused(null);
    });
    record.button.addEventListener('click', () => toggle(record));
  }
  setDetails(null);
}

function spectralViewRecordIsHidden(record, state) {
  const hiddenSet = spectralViewStateSet(state, record.kind);
  return hiddenSet ? hiddenSet.has(record.key) : false;
}

/** Render a self-contained, schematic spectral comparison without network requests. */
function renderSpectralView(container, entries, overlapRules, interactionState) {
  if (!container || typeof container.replaceChildren !== 'function') return;
  const state = interactionState || spectralViewCreateState();
  const model = buildSpectralViewModel(entries, overlapRules);
  const curveRecords = spectralViewCurveRecords(model);
  const filterRecords = spectralViewFilterRecords(model);
  const records = [...curveRecords, ...filterRecords];
  const section = spectralViewElement('section', 'spectral-view');
  section.append(spectralViewElement('h2', 'spectral-view-heading', 'Spectral view'));
  section.append(
    spectralViewElement(
      'p',
      'spectral-view-caption',
      'Normalized Gaussian curves are schematic from each fluorophore’s emission peak and drafted width -- not measured spectra or quantitative bleed-through. Filter bands are user-entered.'
    )
  );

  if (!records.length) {
    section.append(
      spectralViewElement(
        'p',
        'spectral-view-empty',
        'Add a fluorophore with a known emission peak or enter a complete detection filter to display the spectrum view.'
      )
    );
    container.replaceChildren(section);
    return;
  }

  const chart = spectralViewElement('div', 'spectral-view-chart');
  const svg = spectralViewSvgElement(
    'svg',
    {
      viewBox: `0 0 ${spectralViewWidth} ${spectralViewHeight}`,
      role: 'group',
      'aria-labelledby': 'spectral-view-title spectral-view-description',
    },
    'spectral-view-svg'
  );
  svg.append(
    spectralViewSvgElement('title', { id: 'spectral-view-title' }, '', 'Interactive schematic emission curves and detection filters'),
    spectralViewSvgElement(
      'desc',
      { id: 'spectral-view-description' },
      '',
      `Normalized schematic emission curves for ${model.curves.length} fluorophore${
        model.curves.length === 1 ? '' : 's'
      } and ${model.filters.length} user-entered detection filter${
        model.filters.length === 1 ? '' : 's'
      }, across 300 to 900 nanometers. Each curve and filter can be focused and toggled.`
    )
  );
  spectralViewAppendFilters(svg, model, filterRecords);
  spectralViewAppendAxis(svg, model);
  spectralViewAppendCurves(svg, model, curveRecords);
  const tooltip = spectralViewElement('div', 'spectral-view-tooltip');
  tooltip.hidden = true;
  tooltip.setAttribute('aria-hidden', 'true');
  tooltip.append(
    spectralViewElement('strong', 'spectral-view-tooltip-name'),
    spectralViewElement('span', 'spectral-view-tooltip-summary')
  );
  chart.append(svg, tooltip);
  section.append(chart);

  const details = spectralViewElement('div', 'spectral-view-details');
  details.setAttribute('role', 'status');
  details.setAttribute('aria-live', 'polite');
  details.setAttribute('aria-atomic', 'true');
  details.append(
    spectralViewElement('strong', 'spectral-view-details-name'),
    spectralViewElement('span', 'spectral-view-details-summary')
  );
  section.append(details);
  spectralViewAppendLegend(section, records);
  spectralViewWireInteractions(chart, records, details, tooltip, state);
  container.replaceChildren(section);
}
  // ---- src/ui/steps/panel.js ----
// The Color panel step: a qualitative spectral-spillover advisor over the
// active assay's markers field, PLUS (Wave 2A, alpha-pilot-readiness) the
// structured panel assembly editor over the long-reserved panel.channels.
//
// TWO panels, deliberately not merged into one: the free-text markers field
// (naming.fields.markers) stays the quick path and the seed -- one line is
// enough to get a filename and a first spillover read, reusing
// engine/validation.js's splitMarkers rather than a second tokenizer. The
// structured channel editor below it is the altitude fix for what free text
// cannot express: WHICH conjugation mode a channel uses, specifically
// whether an antibody is involved -- see engine/panelAssembly.js's header
// and engine/studydoc.js, which prefers a filled-in panel.channels over the
// free-text derivation once at least one channel exists.
//
// The spectral content in web/kb/spectra.json is Claude-drafted, exactly
// like web/kb/advisor.json's 16 rules -- NOT a placeholder, but not yet
// reviewed by Daniel either. The persistent review banner below is the
// in-app half of that flag (ROADMAP.md's "Parked review" bullet is the
// doc-level half); it is deliberately not dismissible, matching advice.js's
// restraint rather than becoming a one-time toast nobody remembers.
//
// Five-state, never-silent rendering throughout (Decision 5): an empty
// markers field, a fully-resolved panel with zero flagged pairs, and a
// token this app cannot resolve all get their OWN explicit sentence, never
// a blank section that could be misread as "no risk here." A sixth,
// panel-level state ('no-markers-declared', see spectra.js) gets the same
// treatment: the app's own "NONE"/"N/A" sentinel is a declaration, not a
// typo, and must not render through the same path as an unrecognized token.


const STATE_LABELS = {
  unrecognized: 'Not recognized',
  'ambiguous-family': 'Which variant?',
  'no-intrinsic-spectrum': 'No intrinsic spectrum',
  'spectrum-unavailable': 'Spectrum not yet available',
  known: 'Known',
};

function stateSentence(entry) {
  switch (entry.state) {
    case 'unrecognized':
      return `"${entry.token}" isn't a marker this app recognizes yet -- check the spelling on the Naming step.`;
    case 'ambiguous-family':
      return `"${entry.token}" names a multi-color family -- specify which variant (e.g. "${entry.token} Red") to check it for spillover.`;
    case 'no-intrinsic-spectrum':
      return `"${entry.token}" has no spectrum of its own -- spillover depends on which dye it's conjugated to, not the tag itself.`;
    case 'spectrum-unavailable':
      return `"${entry.token}" is a recognized marker, but its spectrum isn't in this app's knowledge pack yet -- an honest gap, not a silent skip.`;
    default:
      return `"${entry.token}" -- excitation ${entry.excitationPeakNm} nm / emission ${entry.emissionPeakNm} nm.`;
  }
}

function appendRow(list, entry) {
  const row = document.createElement('div');
  row.className = `panel-row panel-row-${entry.state}`;

  const stateLabel = document.createElement('span');
  stateLabel.className = 'panel-state';
  stateLabel.textContent = STATE_LABELS[entry.state] || entry.state;
  row.appendChild(stateLabel);

  const text = document.createElement('span');
  text.className = 'panel-row-text';
  text.textContent = stateSentence(entry);
  row.appendChild(text);

  if (entry.state === 'known') {
    // Informational only here -- read-only, derived straight from the
    // emission peak (engine/color.js). The editable, overridable color lives
    // on the structured channel below, where there is somewhere to persist
    // an override; this free-text row has no per-token storage of its own.
    const swatch = document.createElement('span');
    swatch.className = 'panel-color-swatch';
    swatch.style.backgroundColor = wavelengthToColor(entry.emissionPeakNm) || 'transparent';
    swatch.title = `Color from ${entry.emissionPeakNm} nm emission peak`;
    row.appendChild(swatch);

    const badge = document.createElement('span');
    badge.className = 'panel-badge';
    badge.title = 'Spectral value drafted by Claude from common published references -- not yet reviewed by a microscopy specialist.';
    badge.textContent = entry.reviewStatus === 'claude-drafted' ? 'unreviewed' : entry.reviewStatus;
    row.appendChild(badge);
  }

  list.appendChild(row);
}

function summaryText(channels) {
  if (channels.length === 0) return 'No channels yet.';
  const antibodyCount = channels.filter((c) => ANTIBODY_CONJUGATION_MODES.has(c.conjugation)).length;
  const filled = channels.filter((c) => channelSpectralField(c).trim()).length;
  const filterCount = channels.filter(
    (c) => typeof c.filterCenterNm === 'number' && typeof c.filterBandwidthNm === 'number'
  ).length;
  return (
    `${channels.length} channel(s), ${filled} with a fluorophore named -- ` +
    (antibodyCount > 0
      ? `${antibodyCount} use an antibody (isotype/secondary-antibody controls will be recommended on Overview).`
      : 'none use an antibody.') +
    ` ${filterCount} detection filter(s) entered.`
  );
}

function createPanelStep(kb) {
  const fluorophoreOptions = panelFluorophoreOptions(kb.spectra);
  return {
    id: 'panel',
    title: 'Color panel',
    render(main, store, { advisor } = {}) {
      main.textContent = '';

      const heading = document.createElement('h1');
      heading.className = 'step-heading';
      heading.textContent = 'Color panel';
      main.appendChild(heading);

      const explainer = document.createElement('p');
      explainer.className = 'proposals-empty';
      explainer.textContent =
        'A qualitative check for spectral spillover across this assay’s fluorophores -- excitation/emission peak proximity only, not a spectral-overlap integral.';
      main.appendChild(explainer);

      const banner = document.createElement('div');
      banner.className = 'panel-review-banner';
      banner.textContent =
        'Spectral values below are drafted by Claude from common published references and have not yet been reviewed by a microscopy specialist -- treat exact peak numbers as approximate until reviewed.';
      main.appendChild(banner);

      // Commit 1 of the assay tier: caching activeAssayId once here is only
      // safe because the active assay never changes for the lifetime of one
      // render -- see naming.js's identical comment; main.js's assay-switch
      // handler forces a full re-render of whichever step is on screen.
      const assayId = store.get().activeAssayId;
      const view = assayView(store.get(), assayId);
      const markersText = (view.naming && view.naming.fields && view.naming.fields.markers) || '';

      const { panelState, entries } = resolvePanel(markersText, kb.index, kb.markersKb, kb.spectra);

      if (panelState === 'unanswered') {
        const empty = document.createElement('p');
        empty.className = 'panel-empty';
        empty.textContent = 'No markers entered yet -- fill in the markers field on the Naming step to see a color panel here.';
        main.appendChild(empty);
      } else if (panelState === 'no-markers-declared') {
        // A DECLARATION ("NONE", "N/A", "unstained", ...), not a typo -- see
        // spectra.js's NO_MARKERS_SENTINELS. Its own sentence, distinct from
        // 'unanswered' (nothing typed yet): the field was answered, and the
        // answer was "there are no fluorophores in this assay."
        const declared = document.createElement('p');
        declared.className = 'panel-empty';
        declared.textContent = 'This assay declares no markers/fluorophores -- nothing for a color panel to check here.';
        main.appendChild(declared);
      } else {
        const list = document.createElement('div');
        list.className = 'panel-list';
        for (const entry of entries) {
          appendRow(list, entry);
        }
        main.appendChild(list);

        const flags = flagPanelOverlaps(entries, kb.overlapRules);

        const flagsHeading = document.createElement('div');
        flagsHeading.className = 'proposals-heading';
        flagsHeading.textContent = 'Spillover flags';
        main.appendChild(flagsHeading);

        if (flags.length > 0) {
          const issuesList = document.createElement('ul');
          issuesList.className = 'issues-list';
          for (const flag of flags) {
            const li = document.createElement('li');
            li.className = 'issue issue-' + flag.severity;
            li.textContent = flag.message;
            issuesList.appendChild(li);
          }
          main.appendChild(issuesList);
        } else {
          const knownCount = entries.filter((e) => e.state === 'known').length;
          const noFlags = document.createElement('p');
          noFlags.className = 'panel-empty';
          noFlags.textContent =
            knownCount > 0
              ? `No spectral-proximity conflicts among ${knownCount} recognized fluorophore(s).`
              : 'No recognized fluorophores with spectral data yet -- see the states above.';
          main.appendChild(noFlags);
        }
      }

      // Curves are intentionally rendered from the same resolved entries as
      // the state rows above. Structured channels take over once present so
      // their user-entered filters can be overlaid; until then the free-text
      // markers remain the one quick-path source.
      const spectralHost = document.createElement('section');
      spectralHost.className = 'spectral-view-host';
      const spectralViewState = spectralViewCreateState();
      main.appendChild(spectralHost);

      // --- Structured panel assembly (Wave 2A) --------------------------
      const assemblyHeading = document.createElement('div');
      assemblyHeading.className = 'proposals-heading';
      assemblyHeading.textContent = 'Panel assembly (structured)';
      main.appendChild(assemblyHeading);

      const assemblyExplainer = document.createElement('p');
      assemblyExplainer.className = 'panel-empty';
      assemblyExplainer.textContent =
        'Optional: name each channel’s biological target and how its fluorophore is attached. More precise than the ' +
        'markers field above -- in particular, it is what tells the Overview step’s controls whether an antibody is ' +
        'actually involved, so it can recommend an isotype control only when one is warranted. Enter a detection ' +
        'filter as center/bandwidth nm to overlay it above. Drag channel handles or use the arrow buttons to reorder; ' +
        'ordering changes the saved channel list, never a fluorophore’s physical wavelength.';
      main.appendChild(assemblyExplainer);

      const channelsList = document.createElement('div');
      channelsList.className = 'panel-list';
      const summary = document.createElement('p');
      summary.className = 'panel-empty';
      const controlsRow = document.createElement('div');
      controlsRow.className = 'overview-actions';
      let draggedChannelId = null;

      function currentChannels() {
        const currentPanel = assayView(store.get(), assayId).panel;
        return normalizeChannels(currentPanel && currentPanel.channels);
      }

      function writeChannels(channels) {
        const { path, slotKey } = scopeWrite(store.get(), 'panel.channels', assayId);
        store.setPath(path, channels, 'user', { slotKey });
      }

      function writeChannelsData(channels) {
        writeChannels(channels);
        summary.textContent = summaryText(channels);
        refreshSpectralView();
      }

      function writeChannelsStructure(channels) {
        writeChannels(channels);
        renderChannelsList();
        refreshSpectralView();
      }

      function resolvedChannelEntry(channel) {
        const token = channelSpectralField(channel).trim();
        const resolved = token
          ? resolveMarkerToken(token, kb.index, kb.markersKb, kb.spectra)
          : { token: 'Unnamed channel', canonical: null, state: 'unrecognized' };
        // Same effective-color computation as the channel row's own swatch
        // (appendColorControls) -- the spectral view and the row it came
        // from can never show a channel in two different colors.
        const computedColor = resolved.state === 'known' ? wavelengthToColor(resolved.emissionPeakNm) : null;
        return {
          ...resolved,
          channelId: channel.id,
          filterCenterNm: channel.filterCenterNm,
          filterBandwidthNm: channel.filterBandwidthNm,
          color: effectiveChannelColor(channel, computedColor),
        };
      }

      function refreshSpectralView() {
        const channels = currentChannels();
        // The free-text path has no channel to override color on -- the
        // wavelength-derived default (same as its row's read-only swatch)
        // is the only color available, same posture as appendRow's swatch.
        const plotEntries =
          channels.length > 0
            ? channels.map(resolvedChannelEntry)
            : entries.map((entry) => ({
                ...entry,
                color: entry.state === 'known' ? wavelengthToColor(entry.emissionPeakNm) : null,
              }));
        renderSpectralView(spectralHost, plotEntries, kb.overlapRules, spectralViewState);
      }

      function channelField(input, className) {
        input.className = className;
        return input;
      }

      function appendChannelRow(channel, index) {
        const channelCard = document.createElement('div');
        channelCard.className = 'panel-channel-card';
        channelCard.dataset.channelId = channel.id;
        channelCard.addEventListener('dragover', (event) => {
          event.preventDefault();
          channelCard.classList.add('panel-channel-drop-target');
        });
        channelCard.addEventListener('dragleave', () => channelCard.classList.remove('panel-channel-drop-target'));
        channelCard.addEventListener('drop', (event) => {
          event.preventDefault();
          channelCard.classList.remove('panel-channel-drop-target');
          const transferred = event.dataTransfer ? event.dataTransfer.getData('text/plain') : '';
          const sourceId = transferred || draggedChannelId;
          draggedChannelId = null;
          writeChannelsStructure(reorderPanelChannels(currentChannels(), sourceId, channel.id));
        });

        const row = document.createElement('div');
        row.className = 'panel-row panel-channel-main';

        const dragHandle = document.createElement('button');
        dragHandle.type = 'button';
        dragHandle.className = 'panel-channel-drag';
        dragHandle.draggable = true;
        dragHandle.textContent = '↕';
        dragHandle.title = 'Drag to reorder this channel';
        dragHandle.setAttribute('aria-label', `Drag ${channelSpectralField(channel).trim() || 'unnamed channel'} to reorder`);
        dragHandle.addEventListener('dragstart', (event) => {
          draggedChannelId = channel.id;
          if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', channel.id);
          }
        });
        dragHandle.addEventListener('dragend', () => {
          draggedChannelId = null;
          for (const card of channelsList.querySelectorAll('.panel-channel-drop-target')) {
            card.classList.remove('panel-channel-drop-target');
          }
        });
        row.appendChild(dragHandle);

        // Color, per fluorophore (color-panel patch): a swatch computed from
        // the channel's own resolved emission peak (engine/color.js), with a
        // native color picker to override it and a reset link back to auto.
        // Resolved the SAME way the free-text list above does (spectra.js's
        // resolveMarkerToken) so this channel's default can never disagree
        // with what the Color panel's qualitative check already knows about
        // this fluorophore name.
        const channelSpectralValue = channelSpectralField(channel).trim();
        const channelResolved = channelSpectralValue
          ? resolveMarkerToken(channelSpectralValue, kb.index, kb.markersKb, kb.spectra)
          : null;
        const computedColor =
          channelResolved && channelResolved.state === 'known' ? wavelengthToColor(channelResolved.emissionPeakNm) : null;
        const effectiveColor = effectiveChannelColor(channel, computedColor);
        const isColorOverride = Boolean(channel.color);

        // A fixed-height wrapper, not loose siblings directly in `row`: the
        // row bottom-aligns its children (see .panel-channel-main's CSS
        // comment) so these small controls line up against the FLUOROPHORE
        // PICKER's select baseline, not against the row's own padded height
        // -- centering them on their own private box is what actually lines
        // their visual center up with the plain inputs' center.
        const colorControls = document.createElement('span');
        colorControls.className = 'panel-color-controls';
        row.appendChild(colorControls);

        const colorSwatch = document.createElement('span');
        colorSwatch.className = 'panel-color-swatch';
        colorSwatch.style.backgroundColor = effectiveColor || 'transparent';
        colorControls.appendChild(colorSwatch);

        const colorInput = document.createElement('input');
        colorInput.type = 'color';
        colorInput.className = 'panel-color-input';
        colorInput.value = effectiveColor || '#808080';
        colorInput.title = isColorOverride
          ? 'Your chosen color'
          : effectiveColor
            ? 'Default color, from this fluorophore’s emission peak -- pick one to override'
            : 'Pick a channel color';
        colorInput.addEventListener('input', () => {
          const next = currentChannels();
          next[index] = { ...next[index], color: colorInput.value };
          writeChannelsData(next);
          colorSwatch.style.backgroundColor = colorInput.value;
        });
        colorInput.addEventListener('change', () => {
          writeChannelsStructure(currentChannels()); // structural: reveals/hides the reset control
        });
        colorControls.appendChild(colorInput);

        if (isColorOverride) {
          const colorResetBtn = document.createElement('button');
          colorResetBtn.type = 'button';
          colorResetBtn.className = 'panel-color-reset';
          colorResetBtn.textContent = 'auto';
          colorResetBtn.title = 'Reset to the color computed from this fluorophore’s emission peak';
          colorResetBtn.addEventListener('click', () => {
            const next = currentChannels();
            next[index] = { ...next[index], color: '' };
            writeChannelsStructure(next);
          });
          colorControls.appendChild(colorResetBtn);
        }

        const targetInput = channelField(document.createElement('input'), 'panel-row-text');
        targetInput.type = 'text';
        targetInput.placeholder = 'Target (e.g. F-actin, Sox2)';
        targetInput.value = channel.target;
        targetInput.addEventListener('input', () => {
          const next = currentChannels();
          next[index] = { ...next[index], target: targetInput.value };
          writeChannelsData(next);
        });
        row.appendChild(targetInput);

        const conjugationSelect = document.createElement('select');
        conjugationSelect.className = 'panel-row-text';
        for (const mode of CONJUGATION_MODES) {
          const option = document.createElement('option');
          option.value = mode;
          option.textContent = CONJUGATION_LABELS[mode] || mode;
          if (mode === channel.conjugation) option.selected = true;
          conjugationSelect.appendChild(option);
        }
        conjugationSelect.addEventListener('change', () => {
          const next = currentChannels();
          next[index] = { ...next[index], conjugation: conjugationSelect.value };
          writeChannelsStructure(next); // structural: the dye/conjugate-dye input below depends on the mode
        });
        row.appendChild(conjugationSelect);

        const isTagLigand = channel.conjugation === 'tag-ligand';
        const savedSpectralValue = channelSpectralField(channel);
        const resolvedSpectralValue = savedSpectralValue.trim()
          ? resolveMarkerToken(savedSpectralValue, kb.index, kb.markersKb, kb.spectra)
          : null;
        const libraryValue =
          resolvedSpectralValue && resolvedSpectralValue.state === 'known'
            ? resolvedSpectralValue.variantKey || resolvedSpectralValue.canonical || ''
            : '';
        const dyePicker = fluorophorePickerCreate({
          options: fluorophoreOptions,
          currentValue: savedSpectralValue,
          libraryValue,
          isTagLigand,
          onChange(value, isStructural) {
            // Structural (a discrete library pick, not a custom-name
            // keystroke): the color swatch and the filter defaults below
            // both derive from the fluorophore field, so they need a real
            // re-render to pick up the new selection -- writeChannelsData
            // alone left them showing whatever the row resolved to before
            // this pick (often nothing, for a brand-new channel).
            const next = panelFluorophoreWriteValue(currentChannels(), channel.id, value);
            if (isStructural) writeChannelsStructure(next);
            else writeChannelsData(next);
          },
        });
        row.appendChild(dyePicker);

        const moveControls = document.createElement('span');
        moveControls.className = 'panel-channel-moves';
        for (const [label, delta, title] of [
          ['↑', -1, 'Move channel up'],
          ['↓', 1, 'Move channel down'],
        ]) {
          const moveButton = document.createElement('button');
          moveButton.type = 'button';
          moveButton.className = 'assay-pill-delete panel-channel-move';
          moveButton.textContent = label;
          moveButton.title = title;
          moveButton.setAttribute('aria-label', `${title}: ${channelSpectralField(channel).trim() || 'unnamed channel'}`);
          moveButton.disabled = index + delta < 0 || index + delta >= currentChannels().length;
          moveButton.addEventListener('click', () => {
            writeChannelsStructure(shiftPanelChannel(currentChannels(), channel.id, delta));
          });
          moveControls.appendChild(moveButton);
        }
        row.appendChild(moveControls);

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'assay-pill-delete';
        removeBtn.textContent = '×';
        removeBtn.title = 'Remove this channel';
        removeBtn.addEventListener('click', () => {
          const next = currentChannels().filter((c) => c.id !== channel.id);
          writeChannelsStructure(next);
        });
        row.appendChild(removeBtn);

        const filterRow = document.createElement('div');
        filterRow.className = 'panel-filter-row';

        function filterInput(labelText, placeholder, value, min, max) {
          const label = document.createElement('label');
          label.className = 'panel-filter-field';
          const labelSpan = document.createElement('span');
          labelSpan.textContent = labelText;
          label.appendChild(labelSpan);
          const input = document.createElement('input');
          input.type = 'number';
          input.min = String(min);
          input.max = String(max);
          input.step = '1';
          input.inputMode = 'numeric';
          input.placeholder = placeholder;
          input.value = typeof value === 'number' ? String(value) : '';
          label.appendChild(input);
          filterRow.appendChild(label);
          return input;
        }

        // Filters, upfront by default (color-panel patch): a channel whose
        // fluorophore resolves shows a pre-filled suggestion the moment it
        // resolves (engine/panelAssembly.js's defaultChannelFilterPair) --
        // never an empty pair of boxes waiting on the user to look up their
        // own numbers first. Nothing is written to the store until the user
        // actually edits a field (see writeFilterPair below); a channel with
        // an explicit, already-saved pair always shows exactly that, never
        // the computed default.
        const hasSavedFilterPair = typeof channel.filterCenterNm === 'number' && typeof channel.filterBandwidthNm === 'number';
        const computedFilterDefault =
          !hasSavedFilterPair && channelResolved && channelResolved.state === 'known'
            ? defaultChannelFilterPair(channelResolved.emissionPeakNm)
            : null;
        const displayedCenterNm = hasSavedFilterPair ? channel.filterCenterNm : computedFilterDefault ? computedFilterDefault.filterCenterNm : null;
        const displayedBandwidthNm = hasSavedFilterPair
          ? channel.filterBandwidthNm
          : computedFilterDefault
            ? computedFilterDefault.filterBandwidthNm
            : null;

        const centerInput = filterInput('Filter center (nm)', 'e.g. 525', displayedCenterNm, 300, 900);
        const bandwidthInput = filterInput('Bandwidth (nm)', 'e.g. 50', displayedBandwidthNm, 1, 300);
        const filterHint = document.createElement('span');
        filterHint.className = 'panel-filter-hint';
        filterHint.textContent = computedFilterDefault
          ? 'Suggested from this fluorophore’s emission peak -- edit to match the microscope’s actual detection filter values.'
          : 'Optional; both values are required. Use the microscope’s actual detection filter values.';
        filterRow.appendChild(filterHint);

        function writeFilterPair() {
          const center = centerInput.value.trim() === '' ? null : Number(centerInput.value);
          const bandwidth = bandwidthInput.value.trim() === '' ? null : Number(bandwidthInput.value);
          const valid =
            Number.isFinite(center) &&
            center >= 300 &&
            center <= 900 &&
            Number.isFinite(bandwidth) &&
            bandwidth > 0 &&
            bandwidth <= 300;
          const next = currentChannels();
          next[index] = {
            ...next[index],
            filterCenterNm: valid ? center : null,
            filterBandwidthNm: valid ? bandwidth : null,
          };
          writeChannelsData(next);
        }
        centerInput.addEventListener('input', writeFilterPair);
        bandwidthInput.addEventListener('input', writeFilterPair);

        channelCard.appendChild(row);
        channelCard.appendChild(filterRow);
        channelsList.appendChild(channelCard);
      }

      function renderChannelsList() {
        channelsList.textContent = '';
        const channels = currentChannels();
        channels.forEach((channel, index) => appendChannelRow(channel, index));
        summary.textContent = summaryText(channels);

        controlsRow.textContent = '';
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'copy-button';
        addBtn.textContent = '+ Add channel';
        addBtn.addEventListener('click', () => {
          writeChannelsStructure([...currentChannels(), emptyChannel(shortId())]);
        });
        controlsRow.appendChild(addBtn);

        if (channels.length > 1) {
          const sortBtn = document.createElement('button');
          sortBtn.type = 'button';
          sortBtn.className = 'copy-button';
          sortBtn.textContent = 'Order by emission wavelength';
          sortBtn.title = 'Known fluorophores left-to-right by emission peak; unresolved channels stay in their current relative order at the end.';
          sortBtn.addEventListener('click', () => {
            const sorted = sortPanelChannelsByEmission(currentChannels(), (candidate) => {
              const resolved = resolvedChannelEntry(candidate);
              return resolved.state === 'known' ? resolved.emissionPeakNm : null;
            });
            writeChannelsStructure(sorted);
          });
          controlsRow.appendChild(sortBtn);
        }

        // Seeding is a ONE-TIME bootstrap (engine/panelAssembly.js's own
        // header): only offered while channels is still empty, so it can
        // never silently overwrite in-progress structured edits.
        if (channels.length === 0 && panelState === 'has-entries') {
          const seedBtn = document.createElement('button');
          seedBtn.type = 'button';
          seedBtn.className = 'copy-button';
          seedBtn.textContent = 'Seed from markers field';
          seedBtn.title = 'Create one channel per marker in the free-text field above, with a best-guess conjugation to correct.';
          seedBtn.addEventListener('click', () => {
            const seeded = seedChannelsFromMarkers({ entries }, kb.markersKb, kbMarker, shortId);
            writeChannelsStructure(seeded);
          });
          controlsRow.appendChild(seedBtn);
        }
      }

      main.appendChild(channelsList);
      main.appendChild(summary);
      main.appendChild(controlsRow);
      renderChannelsList();
      refreshSpectralView();

      const advicePanel = createAdvicePanel(advisor || [], 'panel');
      main.appendChild(advicePanel.element);
      advicePanel.update(view);
    },
  };
}
