<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Micronaut Planner</title>
<style>
/* Micronaut Planner shell styles.
   Palette follows the custom-property + light/dark pattern proven in
   tools/cma-dashboard/index.html: a default :root palette, an
   @media (prefers-color-scheme) override, and explicit
   :root[data-theme="dark"|"light"] overrides so the in-app toggle always
   wins over the OS preference in both directions. */

:root {
  --bg: #0d1117;
  --panel: #161b22;
  --panel-2: #1c2128;
  --line: #2a313c;
  --ink: #e6edf3;
  --muted: #8b96a5;
  --accent: #2dd4bf;
  --accent-ink: #04302b;
  --danger: #f87171;
  --warn: #fbbf24;
  --ok: #34d399;
  --mono: ui-monospace, "Cascadia Code", Consolas, "SF Mono", monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f7f9fa;
    --panel: #ffffff;
    --panel-2: #ffffff;
    --line: #dfe4ea;
    --ink: #1a2027;
    --muted: #5b6572;
    --accent: #0f9c8c;
    --accent-ink: #ffffff;
    --danger: #dc2626;
    --warn: #b45309;
    --ok: #059669;
  }
}

:root[data-theme="dark"] {
  --bg: #0d1117;
  --panel: #161b22;
  --panel-2: #1c2128;
  --line: #2a313c;
  --ink: #e6edf3;
  --muted: #8b96a5;
  --accent: #2dd4bf;
  --accent-ink: #04302b;
  --danger: #f87171;
  --warn: #fbbf24;
  --ok: #34d399;
}

:root[data-theme="light"] {
  --bg: #f7f9fa;
  --panel: #ffffff;
  --panel-2: #ffffff;
  --line: #dfe4ea;
  --ink: #1a2027;
  --muted: #5b6572;
  --accent: #0f9c8c;
  --accent-ink: #ffffff;
  --danger: #dc2626;
  --warn: #b45309;
  --ok: #059669;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--sans);
}

#app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.shell-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 22px;
  border-bottom: 1px solid var(--line);
  background: var(--panel-2);
}

.shell-title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.theme-toggle {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}

.theme-toggle:hover {
  border-color: var(--accent);
}

.theme-toggle:focus-visible,
.nav-step:focus-visible,
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.shell-body {
  flex: 1;
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 0;
  min-height: 0;
}

.shell-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 16px 10px;
  border-right: 1px solid var(--line);
  background: var(--panel);
}

.nav-step {
  font: inherit;
  font-size: 14px;
  text-align: left;
  color: var(--muted);
  background: transparent;
  border: none;
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
}

.nav-step:hover {
  background: var(--panel-2);
  color: var(--ink);
}

.nav-step.active {
  background: var(--panel-2);
  color: var(--ink);
  box-shadow: inset 3px 0 0 var(--accent);
}

.shell-main {
  padding: 24px;
  overflow-y: auto;
  min-width: 0;
}

.shell-status {
  position: fixed;
  right: 20px;
  bottom: 20px;
  padding: 10px 16px;
  border-radius: 8px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  font-size: 13px;
  color: var(--ink);
  opacity: 0;
  transform: translateY(6px);
  pointer-events: none;
  transition: opacity 0.15s ease, transform 0.15s ease;
}

.shell-status.visible {
  opacity: 1;
  transform: translateY(0);
}

.step-heading {
  margin: 0 0 20px;
  font-size: 20px;
  font-weight: 600;
}

.naming-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.field-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-size: 12.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}

.field-input {
  font: inherit;
  font-size: 16px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  min-height: 44px;
}

.field-input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* The planned-names table. One row when there is no design (the standalone
   one-off name), N rows when a design is driving it -- same widget, so there
   is no visual mode-switch between "tool box" and "full workflow". */
.planned-box {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 20px;
  margin-bottom: 20px;
}

.planned-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}

.planned-label {
  font-size: 12.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}

.planned-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  /* A large design can plan hundreds of names; scroll the list rather than
     letting it push the field boxes and issues off-screen. */
  max-height: 340px;
  overflow-y: auto;
}

.planned-name {
  font-family: var(--mono);
  font-size: 15px;
  color: var(--accent);
  word-break: break-all;
}

.planned-empty {
  color: var(--muted);
  font-size: 14px;
  margin: 0;
}

.copy-button {
  font: inherit;
  font-size: 13px;
  color: var(--accent-ink);
  background: var(--accent);
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
  margin-left: auto;
}

.copy-button:hover {
  filter: brightness(1.05);
}

.copy-button:disabled {
  opacity: 0.5;
  cursor: default;
  filter: none;
}

/* The advice panel -- deliberately its OWN vocabulary, not a reuse of
   .issue/.issue-warning/.issue-error. Those are validation output; this is
   guidance. --danger/--warn stay reserved for validation alone, so a
   pitfall note is never mistakable for a warning just because it's amber. */
.advice-section {
  margin-bottom: 20px;
}

.advice-heading {
  font-size: 12.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 8px;
}

.advice-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.advice-note {
  border-radius: 8px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  background: var(--panel-2);
}

.advice-pitfall {
  border-left: 3px solid var(--accent);
}

.advice-tip {
  border-left: 3px solid var(--line);
}

.advice-kind {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}

/* The concept -- the phenomenon the note is about. Carries the accent
   colour because it, not the kind label, is what makes a stack of notes
   scannable ("this one is spillover, that one is photobleaching"). */
.advice-concept {
  color: var(--accent);
  font-weight: 600;
}

.advice-concept::before {
  content: "·";
  margin-right: 8px;
  color: var(--line);
  font-weight: 400;
}

.advice-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
}

.advice-body {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.4;
}

/* Visible by default -- a plain-English "why is this showing" clause,
   distinct from .advice-reason below (raw predicate syntax, debug-only). */
.advice-trigger {
  font-size: 12px;
  font-style: italic;
  color: var(--muted);
  margin-top: 6px;
}

.advice-reason {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 6px;
  opacity: 0.7;
}

.issues-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.issue {
  font-size: 13.5px;
  border-radius: 8px;
  padding: 8px 12px;
  border: 1px solid var(--line);
}

.issue-warning {
  color: var(--warn);
  border-color: var(--warn);
}

.issue-error {
  color: var(--danger);
  border-color: var(--danger);
}

.describe-textarea {
  width: 100%;
  min-height: 120px;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  resize: vertical;
  margin-bottom: 12px;
}

.describe-textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.read-button {
  font: inherit;
  font-size: 13px;
  color: var(--accent-ink);
  background: var(--accent);
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
  margin-bottom: 20px;
}

.read-button:hover {
  filter: brightness(1.05);
}

.proposals-heading,
.interview-heading,
.design-subheading {
  font-size: 12.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 20px 0 8px;
}

.proposals-empty,
.interview-empty,
.conditions-empty {
  color: var(--muted);
  font-size: 13.5px;
}

.proposals-list,
.interview-list,
.factors-list,
.conditions-table {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}

.proposal-row,
.question-row,
.factor-row,
.condition-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 14px;
}

.question-row {
  align-items: flex-start;
  flex-direction: column;
}

.proposal-text {
  flex: 1 1 260px;
}

.proposal-evidence {
  color: var(--muted);
  font-size: 12.5px;
}

.proposal-actions,
.question-actions {
  display: flex;
  gap: 8px;
  margin-left: auto;
}

.proposal-accept,
.question-answer {
  font: inherit;
  font-size: 13px;
  color: var(--accent-ink);
  background: var(--accent);
  border: none;
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
}

.proposal-dismiss,
.question-skip,
.remove-factor-button {
  font: inherit;
  font-size: 13px;
  color: var(--muted);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.reset-button:hover {
  border-color: var(--danger);
  color: var(--danger);
}

.answered-row {
  border-left: 3px solid var(--ok);
}

.question-current {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--ok);
}

.question-prompt {
  font-weight: 600;
}

.question-why {
  color: var(--muted);
  font-size: 13px;
}

.question-control {
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  min-width: 220px;
}

/* An allowOther choice question: the <select> and its free-text fallback
   stack as one visual unit rather than reading as two unrelated controls. */
.question-control-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.question-other-input {
  min-width: 220px;
}

.factor-name {
  flex: 1 1 160px;
}

.factor-levels {
  flex: 2 1 260px;
}

.add-factor-button {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 14px;
  cursor: pointer;
  margin-bottom: 20px;
}

.condition-summary {
  flex: 1 1 260px;
  font-size: 13.5px;
}

.base-name-box {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 10px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 12px;
}

.base-name-label {
  font-size: 12.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}

.base-name-value {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--ink);
  word-break: break-all;
}

.condition-sample-id {
  font-family: var(--mono);
  color: var(--muted);
  font-size: 13px;
}

.condition-filename {
  font-family: var(--mono);
  color: var(--accent);
  font-size: 13.5px;
  word-break: break-all;
}

@media print {
  .shell-header,
  .assay-switcher-bar,
  .shell-nav,
  .shell-status,
  .overview-actions {
    display: none;
  }

  .overview-assay {
    break-inside: avoid;
  }

  /* The map's fills/strokes are theme vars (dark by default); force a plain
     black-on-white rendering for paper so it never prints dark boxes. */
  .study-map,
  .study-map-svg {
    break-inside: avoid;
  }

  .study-map-scroll {
    border-color: #000;
    background: #fff;
    overflow: visible;
  }

  .study-map-box {
    fill: #fff;
    stroke: #000;
  }

  .study-map-node-study .study-map-box {
    fill: #eee;
    stroke: #000;
  }

  .study-map-caption,
  .study-map-value,
  .study-map-node-study .study-map-caption,
  .study-map-node-study .study-map-value {
    fill: #000;
  }

  .study-map-edge {
    stroke: #000;
  }

  .study-map-arrowhead {
    fill: #000;
  }

  .shell-body {
    display: block;
  }

  .shell-main {
    padding: 0;
    overflow: visible;
  }

  body {
    background: #fff;
    color: #000;
  }
}

.assay-switcher-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  overflow-x: auto;
}

.assay-pill {
  display: flex;
  align-items: center;
  gap: 4px;
  border-radius: 999px;
  background: transparent;
  border: 1px solid var(--line);
}

.assay-pill.active {
  background: var(--panel-2);
  border-color: var(--accent);
}

.assay-pill-label {
  font: inherit;
  font-size: 13px;
  color: var(--muted);
  background: transparent;
  border: none;
  border-radius: 999px 0 0 999px;
  padding: 6px 10px;
  cursor: pointer;
  white-space: nowrap;
}

.assay-pill.active .assay-pill-label {
  color: var(--ink);
}

.assay-pill-delete {
  font: inherit;
  font-size: 14px;
  line-height: 1;
  color: var(--muted);
  background: transparent;
  border: none;
  padding: 6px 10px 6px 0;
  cursor: pointer;
}

.assay-pill-delete:hover {
  color: var(--ink);
}

.assay-pill-add {
  font: inherit;
  font-size: 13px;
  color: var(--muted);
  background: transparent;
  border: 1px dashed var(--line);
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
  white-space: nowrap;
}

.assay-pill-add:hover {
  color: var(--ink);
  border-color: var(--accent);
}

.assay-pill-add:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.study-divergence {
  color: var(--muted);
  font-size: 13px;
  margin: 4px 0 12px;
}

.study-assay-row {
  align-items: center;
}

.study-assay-row .field-input {
  flex: 0 1 220px;
}

.study-assay-basename {
  flex: 1 1 260px;
  min-width: 0;
}

/* Grouped and pinned to the row's end (margin-left: auto here, not on each
   button) -- otherwise a button's horizontal position depends on how long
   THIS row's base name happens to be, which reads as buttons "moving"
   between rows as the base name's length varies. */
.overview-actions {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}

.overview-research-question {
  font-style: italic;
  color: var(--muted);
  margin: 4px 0 16px;
}

/* The study map (ui/steps/overview.js buildDiagramSvg over the pure layout
   in engine/render/svgDiagram.js). Themed entirely through the CSS vars so
   it tracks the light/dark toggle; print overrides live in @media print. */
.study-map {
  margin: 4px 0 20px;
}

.study-map-scroll {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  padding: 12px;
}

.study-map-svg {
  display: block;
  max-width: 100%;
  height: auto;
  font-family: var(--sans);
}

.study-map-box {
  fill: var(--panel-2);
  stroke: var(--line);
  stroke-width: 1.5;
}

.study-map-node-study .study-map-box {
  fill: var(--accent);
  stroke: var(--accent);
}

.study-map-node-assay .study-map-box {
  stroke: var(--accent);
  stroke-width: 2;
}

.study-map-caption {
  fill: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.study-map-value {
  fill: var(--ink);
  font-size: 12.5px;
  font-weight: 600;
}

.study-map-node-study .study-map-caption,
.study-map-node-study .study-map-value {
  fill: var(--accent-ink);
}

.study-map-edge {
  stroke: var(--muted);
  stroke-width: 1.5;
  fill: none;
}

.study-map-arrowhead {
  fill: var(--muted);
}

.overview-tree {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.overview-assay {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px 16px;
  background: var(--panel);
}

.overview-assay-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 8px;
}

.overview-node {
  font-size: 13.5px;
  color: var(--ink);
  margin: 4px 0;
}

.overview-node-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  margin: 14px 0 4px;
}

.overview-controls-empty {
  font-size: 13px;
  color: var(--muted);
  font-style: italic;
}

.overview-controls-group-label {
  font-size: 12.5px;
  color: var(--muted);
  margin: 6px 0 2px;
}

.overview-controls-list {
  margin: 0 0 4px;
  padding-left: 20px;
  font-size: 13px;
}

.overview-controls-list li {
  margin: 3px 0;
}

.overview-ladder-list {
  margin: 4px 0;
  padding-left: 20px;
}

.overview-ladder-list > li {
  margin: 8px 0;
}

.overview-ladder-title {
  font-weight: 600;
  font-size: 13.5px;
}

.overview-ladder-body {
  font-size: 13px;
  color: var(--muted);
  margin: 2px 0;
}

.overview-ladder-notes {
  margin: 4px 0;
  padding-left: 18px;
  font-size: 12.5px;
}

.study-assay-actions {
  display: flex;
  gap: 8px;
  margin-left: auto;
  flex-shrink: 0;
}

</style>
</head>
<body>
<div id="app"></div>
<script>
globalThis.__MICRONAUT_KB__ = {"advisor":{"rules":[{"body":"The depletion beam deposits far more energy per pixel than excitation alone, so a dye that looks bright on a confocal can bleach within a few STED frames. ATTO 647N and Abberior STAR dyes hold up; many Alexa dyes do not.","concept":"photobleaching","id":"sted-photostability","kind":"pitfall","priority":10,"surfaces":["describe","naming"],"title":"STED bleaches far faster than confocal -- pick dyes for photostability, not brightness","when":{"in":["acquisition.modality",["STED"]]}},{"body":"STED resolution is roughly 30-80 nm depending on depletion power and dye, well below a typical confocal pixel size. If the pixel size isn't set to Nyquist-sample that resolution, the extra resolution never reaches the data.","concept":"undersampling","id":"sted-pixel-nyquist","kind":"tip","priority":20,"surfaces":["design"],"title":"Undersampling throws away the resolution STED is buying you","when":{"in":["acquisition.modality",["STED"]]}},{"body":"A mismatched refractive index between the mounting medium and the objective's immersion oil introduces spherical aberration that visibly degrades STED resolution with depth. Use a high-RI, low-photobleaching mountant and a #1.5H coverslip with a high-NA oil objective.","concept":"spherical aberration","id":"sted-mounting","kind":"tip","priority":30,"surfaces":["describe"],"title":"Mounting medium and coverslip thickness matter more for STED than for confocal","when":{"in":["acquisition.modality",["STED"]]}},{"body":"The default pinhole size of 1 Airy Unit balances signal and out-of-focus light rejection. Opening it gathers more signal from a dim sample but lets in more out-of-focus blur, directly reducing your optical sectioning.","concept":"optical sectioning","id":"confocal-pinhole","kind":"tip","priority":10,"surfaces":["design"],"title":"Opening the pinhole trades optical sectioning for signal -- state it deliberately","when":{"in":["acquisition.modality",["confocal"]]}},{"body":"An undersampled pixel size throws away real optical resolution regardless of how good the objective is. The correct step size depends on numerical aperture and emission wavelength -- most acquisition software has a Nyquist calculator built in.","concept":"undersampling","id":"confocal-nyquist","kind":"tip","priority":20,"surfaces":["design"],"title":"Check your pixel size against Nyquist sampling before you commit to a design","when":{"in":["acquisition.modality",["confocal"]]}},{"body":"Simultaneous multi-laser scanning is faster but lets bleed-through between channels with overlapping emission masquerade as real colocalization. If your markers' emission spectra overlap, scan sequentially, one laser line at a time.","concept":"spectral spillover","id":"confocal-sequential-scanning","kind":"pitfall","priority":30,"surfaces":["design"],"title":"Overlapping emission spectra need sequential scanning, not simultaneous","when":{"in":["acquisition.modality",["confocal"]]}},{"body":"Out-of-focus light from every plane in the sample reaches the detector at once, since there is no pinhole to reject it. For anything much thicker than a monolayer, plan on deconvolution afterwards or switch to confocal or spinning-disk.","concept":"out-of-focus blur","id":"widefield-thick-sample-blur","kind":"pitfall","priority":10,"surfaces":["describe"],"title":"Widefield has no optical sectioning -- thick samples come out blurred","when":{"in":["acquisition.modality",["widefield"]]}},{"body":"Confocal's laser scanning delivers a much higher instantaneous light dose per pixel than widefield's wide-field illumination. For dim, photosensitive, or fast live-cell work, widefield's lower phototoxicity and higher frame rate can outperform confocal despite the missing optical sectioning.","concept":"phototoxicity","id":"widefield-live-cell-strength","kind":"tip","priority":20,"surfaces":["describe"],"title":"Widefield is often the RIGHT choice for dim or photosensitive live samples","when":{"in":["acquisition.modality",["widefield"]]}},{"body":"A mismatch between the sample, the mounting medium, and the chamber liquid shows up as visible smearing or striping in the data, not a subtle loss of quality. Confirm your clearing or mounting protocol actually matches the refractive index your instrument expects.","concept":"refractive-index mismatch","id":"lightsheet-refractive-index-matching","kind":"pitfall","priority":10,"surfaces":["describe"],"title":"Light-sheet imaging lives or dies on refractive-index matching","when":{"in":["acquisition.modality",["light-sheet"]]}},{"body":"Multi-view and multi-timepoint acquisition at light-sheet speeds generates data volumes that catch people off guard. Plan storage and downstream compute (registration, fusion, deconvolution) before the acquisition, not after the disk fills up.","concept":"data volume","id":"lightsheet-data-volume","kind":"tip","priority":20,"surfaces":["design"],"title":"Light-sheet datasets are routinely hundreds of GB to TB per sample","when":{"in":["acquisition.modality",["light-sheet"]]}},{"body":"Anything strongly absorbing or scattering in the light path (pigment, dense tissue, bubbles) casts a stripe artifact behind it when illuminated from one side. Dual-side illumination or pivot scanning removes most of it if your instrument supports either.","concept":"shadow striping","id":"lightsheet-shadow-stripes","kind":"tip","priority":30,"surfaces":["describe"],"title":"Single-sided illumination casts shadow stripes behind absorbing structures","when":{"in":["acquisition.modality",["light-sheet"]]}},{"body":"There is no fluorescence channel to name in electron microscopy. The MARKERS field is the right place for the contrast or staining agent instead -- uranyl acetate, osmium tetroxide, or immunogold, for example.","concept":"contrast agents","id":"em-markers-are-contrast-agents","kind":"tip","priority":10,"surfaces":["naming"],"title":"For SEM/TEM, MARKERS means contrast agents, not fluorophores","when":{"in":["acquisition.modality",["SEM","TEM"]]}},{"body":"Electron microscopy sample prep frequently produces one usable block or grid per condition rather than the parallel biological replicates a light-microscopy design assumes. Leave the replicate fields blank rather than forcing a count that doesn't reflect anything real.","concept":"replicate structure","id":"em-replicates-often-dont-apply","kind":"tip","priority":20,"surfaces":["design","naming"],"title":"SEM/TEM samples often don't have the usual biological/technical replicate structure","when":{"in":["acquisition.modality",["SEM","TEM"]]}},{"body":"SEM charging artifacts trace back to coating thickness and conductivity, and TEM contrast and resolution trace back to section thickness. Both are easy to forget to note once you're looking at finished micrographs -- record them while prepping, not after.","concept":"sample preparation","id":"em-prep-affects-image-quality","kind":"tip","priority":30,"surfaces":["describe"],"title":"Conductive coating and section thickness shape image quality as much as the microscope does","when":{"in":["acquisition.modality",["SEM","TEM"]]}},{"body":"There is no fluorophore panel to plan around, since Raman reads intrinsic vibrational signatures. In exchange, acquisition is slow -- seconds to minutes per spectrum or map point -- so scan area and point density become the real design tradeoff.","concept":"acquisition time","id":"raman-label-free-tradeoff","kind":"tip","priority":10,"surfaces":["describe"],"title":"Raman is label-free, but that speed cost shows up in acquisition time","when":{"in":["acquisition.modality",["Raman"]]}},{"body":"A stronger signal-to-noise ratio comes at the cost of local heating, which can damage biological or otherwise photosensitive material well before it's visibly obvious. Start at low power, check for damage, and only raise it once you've confirmed the sample tolerates it.","concept":"sample damage","id":"raman-laser-power-vs-damage","kind":"pitfall","priority":20,"surfaces":["design"],"title":"Higher Raman laser power improves signal but risks local heating and sample damage","when":{"in":["acquisition.modality",["Raman"]]}}],"version":1},"controls":{"rules":[{"id":"panel-unstained-control","kind":"panel","priority":10,"title":"Unstained / autofluorescence control","when":{"all":[{"exists":"naming.fields.markers"},{"ne":["naming.fields.markers","NONE"]}]},"why":"Fixed tissue and many cell types autofluoresce, especially in the green channel. Without an unstained sample imaged at the same settings, you cannot tell whether a dim signal is real stain or background autofluorescence."},{"id":"panel-single-stain-controls","kind":"panel","priority":20,"title":"Single-stain controls (one channel at a time)","when":{"all":[{"exists":"naming.fields.markers"},{"ne":["naming.fields.markers","NONE"]}]},"why":"When two or more fluorophores are imaged together, their emission spectra can overlap (spectral spillover/bleed-through). A sample stained with only ONE of the fluorophores, imaged on every channel, is what lets you tell real co-localization apart from spillover before you trust a multi-channel image."},{"id":"panel-secondary-only-control","kind":"panel","priority":30,"title":"Secondary-antibody-only control","when":{"all":[{"exists":"naming.fields.markers"},{"ne":["naming.fields.markers","NONE"]}]},"why":"For indirect immunofluorescence (primary antibody + fluorophore-conjugated secondary), the secondary can bind nonspecifically or the sample can autofluoresce at the secondary's wavelength. Omitting the primary but keeping the secondary isolates that background from real signal."},{"id":"panel-isotype-control","kind":"panel","priority":40,"title":"Isotype control","when":{"all":[{"exists":"naming.fields.markers"},{"ne":["naming.fields.markers","NONE"]}]},"why":"A primary antibody of the same host species and isotype but with no specificity for your target tests whether staining comes from genuine target binding or nonspecific antibody binding (e.g. Fc receptor binding)."},{"id":"viability-heat-killed-control","kind":"readout","priority":50,"title":"Heat-killed (dead) control","when":{"eq":["readout","bacterial-viability"]},"why":"SYTO9/PI viability staining reports percent-dead relative to a maximum-death reference. A heat-killed (or otherwise fully-killed) aliquot of the same culture, imaged the same way, calibrates the PI-positive gate -- without it, 'percent dead' has no anchor and drifts between imaging sessions."},{"id":"ros-positive-control","kind":"readout","priority":60,"title":"H2O2-treated positive control","when":{"eq":["readout","ros"]},"why":"A hydrogen-peroxide-treated sample gives DCF a known, strong oxidative signal, confirming the probe is loading and responding before you trust a subtler biological ROS increase."},{"id":"ros-negative-control","kind":"readout","priority":61,"title":"NAC-treated (antioxidant) negative control","when":{"eq":["readout","ros"]},"why":"N-acetylcysteine scavenges reactive oxygen species and should suppress the DCF signal. If it doesn't, the assay's readout may not actually be tracking oxidative stress in this experiment."},{"id":"cytoskeleton-untreated-reference","kind":"readout","priority":70,"title":"Untreated / vehicle reference","when":{"eq":["readout","macrophage-cytoskeleton"]},"why":"Phalloidin staining shows the actin architecture at a moment in time, which only means something in comparison to an untreated or vehicle-only baseline imaged under identical settings -- otherwise there is nothing to say the treated cytoskeleton changed."},{"id":"migration-baseline-reference","kind":"readout","priority":80,"title":"t=0 scratch reference image","when":{"eq":["readout","scratch-migration"]},"why":"Migration/closure is measured as a change in the wound area over time, so every scratch needs its own t=0 image taken immediately after scratching, before any of that area can already have started closing."},{"id":"migration-proliferation-control","kind":"readout","priority":81,"title":"Mitomycin C proliferation-blocked control","when":{"eq":["readout","scratch-migration"]},"why":"A scratch can close by cells migrating in OR by cells proliferating into the gap. Without a mitomycin-C-treated (proliferation-blocked) control closing more slowly, migration and proliferation are confounded and the assay cannot tell you which one you measured."}],"version":1},"markers":{"ambiguousInFreeText":["cerulean","citrine","clip","emerald","halo","snap","tomato","venus"],"markers":{"ALEXA405":{"aliases":["af405","alexa 405","alexa fluor 405","alexa405"],"class":"dye","freeTextAliases":["af405","alexa 405","alexa fluor 405","alexa405"],"isFamily":false,"variants":[]},"ALEXA430":{"aliases":["af430","alexa 430","alexa fluor 430","alexa430"],"class":"dye","freeTextAliases":["af430","alexa 430","alexa fluor 430","alexa430"],"isFamily":false,"variants":[]},"ALEXA488":{"aliases":["af488","alexa 488","alexa fluor 488","alexa488"],"class":"dye","freeTextAliases":["af488","alexa 488","alexa fluor 488","alexa488"],"isFamily":false,"variants":[]},"ALEXA514":{"aliases":["af514","alexa 514","alexa fluor 514","alexa514"],"class":"dye","freeTextAliases":["af514","alexa 514","alexa fluor 514","alexa514"],"isFamily":false,"variants":[]},"ALEXA532":{"aliases":["af532","alexa 532","alexa fluor 532","alexa532"],"class":"dye","freeTextAliases":["af532","alexa 532","alexa fluor 532","alexa532"],"isFamily":false,"variants":[]},"ALEXA546":{"aliases":["af546","alexa 546","alexa fluor 546","alexa546"],"class":"dye","freeTextAliases":["af546","alexa 546","alexa fluor 546","alexa546"],"isFamily":false,"variants":[]},"ALEXA555":{"aliases":["af555","alexa 555","alexa fluor 555","alexa555"],"class":"dye","freeTextAliases":["af555","alexa 555","alexa fluor 555","alexa555"],"isFamily":false,"variants":[]},"ALEXA568":{"aliases":["af568","alexa 568","alexa fluor 568","alexa568"],"class":"dye","freeTextAliases":["af568","alexa 568","alexa fluo ns":[{"field":"naming.fields.date","id":"date","priority":10,"prompt":"When was this acquired?","tag":"user","type":"text","why":"The date is the first token in every filename this tool renders, and sorts your files chronologically without you having to name them that way."},{"field":"naming.fields.exptype","id":"exptype","priority":20,"prompt":"What kind of experiment is this?","tag":"user","type":"text","why":"The experiment type groups related acquisitions together in a folder listing (e.g. CT for a control, G1G2 for a two-generation comparison)."},{"field":"naming.fields.sample","id":"sample","priority":30,"prompt":"What's the sample or specimen identifier?","tag":"user","type":"text","why":"This is what tells two files with the same date and experiment type apart -- it should be unique within that experiment."},{"field":"naming.fields.magnification","id":"magnification","priority":40,"prompt":"What magnification or objective was used?","tag":"user","type":"text","why":"Filtering by magnification later (e.g. finding every 63x acquisition) only works if it's in the filename."},{"field":"naming.fields.markers","id":"markers","priority":50,"prompt":"Which markers or fluorophores were imaged?","tag":"user","type":"text","why":"Markers are the main thing collaborators search filenames for -- worth getting into the name even if it's also in the metadata."},{"field":"specimen.organism","id":"organism","priority":60,"prompt":"What organism or cell line is this?","tag":"user","type":"text","why":"Groups this experiment with others on the same model system when you're searching later."},{"field":"specimen.sampleType","id":"sampleType","priority":70,"prompt":"What type of sample is it (e.g. tissue section, cell culture, whole mount)?","tag":"user","type":"text","why":"Sample type changes what acquisition settings and controls are typical -- later steps use this to tailor their suggestions."},{"askWhen":{"exists":"specimen.organism"},"field":"specimen.preparation","id":"preparation","priority":80,"prompt":"How was the sample prepared?","tag":"user","type":"text","why":"Fixation and mounting method affects which controls and settings make sense, and is easy to forget by the time you write the paper."},{"field":"acquisition.instrument","id":"instrument","priority":90,"prompt":"Which instrument did you use?","tag":"user","type":"text","why":"Ties this experiment to the instrument's known objectives, lasers, and detectors for later acquisition guidance."},{"allowOther":true,"field":"acquisition.modality","id":"modality","options":["confocal","widefield","STED","light-sheet","SEM","TEM","Raman"],"priority":100,"prompt":"What imaging modality is this?","tag":"user","type":"choice","why":"Modality drives modality-specific guidance later -- confocal, widefield and STED have different pitfalls worth flagging. Not every modality is optical: SEM/TEM/Raman samples typically have no biological or technical replicates in the usual sense, which is why those are separate, independently-optional questions."},{"allowOther":true,"field":"readoutText","id":"readout","options":["Bacterial viability","Macrophage cytoskeleton","Intracellular ROS","Scratch / migration"],"priority":15,"prompt":"What is this assay's readout?","tag":"user","type":"choice","why":"The readout drives the control guidance on the study overview -- a viability assay, a ROS assay, and a migration assay each need a different reference control, and the app can only suggest the right ones once it knows which you're running."},{"field":"design.biologicalReplicates","id":"biologicalReplicates","priority":110,"prompt":"How many biological replicates?","tag":"user","type":"number","why":"Determines how many condition rows the design expands into and whether the sample size is worth flagging as low."},{"field":"design.technicalReplicates","id":"technicalReplicates","priority":111,"prompt":"How many technical replicates per biological replicate, if any?","tag":"user","type":"number","why":"Technical replicates (repeat acquisitions of the same biological sample) get their own token in the filename, separate from biological replicates -- leave this blank if you didn't take any."},{"field":"naming.fields.notes","id":"notes","priority":120,"prompt":"Anything else worth noting about this acquisition?","tag":"user","type":"text","why":"A free-text escape hatch for anything the other questions didn't capture -- entirely optional."}],"readouts":{"readouts":{"bacterial-viability":{"aliases":["viability","live/dead","live dead","syto9","syto9/pi","syto9-pi"],"label":"Bacterial viability"},"macrophage-cytoskeleton":{"aliases":["cytoskeleton","phalloidin","actin","f-actin"],"label":"Macrophage cytoskeleton"},"ros":{"aliases":["reactive oxygen species","oxidative stress","dcf","dcfda","dcf-da"],"label":"Intracellular ROS"},"scratch-migration":{"aliases":["wound healing","wound-healing","migration","scratch assay","scratch"],"label":"Scratch / migration"}},"version":1},"stages":{"rules":[{"id":"pilot-sted-on-confocal-first","note":"STED sessions are slower, more bleach-prone, and typically shared-instrument time -- pilot your staining, dye choice, and mounting on a confocal first, then move to STED only once the biology and the sample prep are already validated.","priority":10,"stage":"pilot","when":{"eq":["acquisition.modality","STED"]}},{"id":"pilot-light-sheet-mounting","note":"Light-sheet imaging usually requires specific sample mounting or clearing that a standard confocal prep does not need -- confirm your mounting protocol is compatible before the first real light-sheet session, ideally by checking it under a confocal first.","priority":10,"stage":"pilot","when":{"eq":["acquisition.modality","light-sheet"]}},{"id":"pilot-em-fixation-irreversible","note":"EM fixation and processing are destructive and irreversible -- a failed fixation protocol destroys the sample it was tested on. Pilot the fixation protocol on a spare or lower-value sample, and confirm the biol // object shares one prototype, that one write corrupts every object in the

    } else if (raw.startsWith('[') && raw.endsWith(']')) {
      tokens.push({ kind: 'index', value: Number(raw.slice(1, -1)) });
    } else {
      if (DANGEROUS_KEYS.has(raw)) {

    if (token.kind === 'key') {
      current = current[token.value];
    } else if (token.kind === 'index') {
      current = current[token.value];
    } else {

  for (let i = 0; i < tokens.length - 1; i++) {
    const token = tokens[i];

    const key = token.value;
    if (current[key] === undefined || current[key] === null) {
      current[key] = next.kind === 'index' ? [] : {};
    }
    current = current[key];

  current[last.value] = value;
  return obj;

    if (remaining.length === 0) {
      return [prefix];

    const [token, ...rest] = remaining;
    if (token.kind === 'key') {
      const nextPrefix = prefix === '' ? token.value : `${prefix}.${token.value}`;
      const nextValue = current === undefined || current === null ? undefined : current[token.value];
      return expand(nextValue, nextPrefix, rest);
    }
    if (token.kind === 'index') {
      const nextPrefix = `${prefix}[${token.value}]`;
      const nextValue = current === undefined || current === null ? undefined : current[token.value];
      return expand(nextValue, nextPrefix, rest);
    }
    // wildcard
    if (!Array.isArray(current)) return [];
    const results = [];
    for (let i = 0; i < current.length; i++) {
      const nextPrefix = `${prefix}[${i}]`;
      results.push(...expand(current[i], nextPrefix, rest));
    }
    return results;

/**
 * Validate and normalize a raw KB object (the parsed contents of
 * web/kb/markers.json) into { kb, issues }.
 *
 * TOTAL: never throws on a malformed KB. A missing/wrong `version` is a
 * 'fatal' issue; a marker entry missing `aliases` is an 'error' issue naming
 * the marker and that entry is dropped. `kb` is always a usable (possibly
 * empty) { version, markers, ambiguousInFreeText } object even when
 * `issues` is non-empty, so a bad KB degrades to "no markers known" rather
 * than a white screen.

  if (!isPlainObject) {
    issues.push({ severity: 'fatal', message: 'knowledge pack is missing or is not an object' });
  } else if (source.version !== 1) {
    issues.push({
      severity: 'fatal',
      message: `knowledge pack version is ${JSON.stringify(source.version ?? null)}, expected 1`,

    source.markers !== null &&
    source.markers !== undefined &&
    typeof source.markers === 'object' &&
    !Array.isArray(source.markers)
      ? source.markers
      : {};

  const markers = {};
  for (const [canonical, entry] of Object.entries(rawMarkers)) {

      issues.push({ severity: 'error', message: `marker '${canonical}' entry is not an object` });

    if (!Array.isArray(entry.aliases)) {
      issues.push({ severity: 'error', message: `marker '${canonical}' is missing 'aliases'` });

      freeTextAliases: Array.isArray(entry.freeTextAliases)
        ? entry.freeTextAliases.filter((a) => typeof a === 'string')

/**
 * Evaluate `pred` against `experiment`. NEVER throws: any malformed node,
 * unknown operator, dangerous/missing path, bad regex source, or runaway
 * nesting yields `false`; `undefined` (no condition) yields `true`.
 */
function evaluatePredicate(pred, experiment) {
  try {
    return evalPredicateNode(pred, experiment, 0);
  } catch {
    // Catches PredicateDepthCapError, and acts as a defense-in-depth net for
    // anything else unforeseen -- this function must never throw.
    return false;
  }
}

function describePredicatePath(path) {
  return typeof path === 'string' && path.length > 0 ? path : 'value';
}

function describePredicateValue(value) {
  try {
    const json = JSON.stringify(value);
    return json === undefined ? String(value) : json;
  } catch {
    return String(value);
  }
}

function describeComparisonLeaf(arg, opWord) {
  if (!Array.isArray(arg) || arg.length !== 2) return 'an invalid condition';
  return `${describePredicatePath(arg[0])} ${opWord} ${describePredicateValue(arg[1])}`;
}

function describeInLeaf(arg) {
  if (!Array.isArray(arg) || arg.length !== 2 || !Array.isArray(arg[1])) return 'an invalid condition';
  const options = arg[1].map((v) => describePredicateValue(v)).join(', ');
  return `${describePredicatePath(arg[0])} is one of [${options}]`;
}

function describeMatchesLeaf(arg) {
  if (!Array.isArray(arg) || arg.length !== 2) return 'an invalid condition';
  return `${describePredicatePath(arg[0])} matches /${arg[1]}/`;
}

function describeBranchGroup(arg, joiner, depth) {
  if (!Array.isArray(arg)) return 'an invalid condition';
  if (arg.length === 0) return `${joiner} of (nothing)`;
  const parts = arg.map((child) => describePredicateNode(child, depth + 1));
  return `${joiner} of (${parts.join('; ')})`;
}

function describePredicateNode(node, depth) {
  if (depth > MAX_PREDICATE_DEPTH) return 'a condition nested too deeply to describe';
  if (node === undefined) return 'always (no condition)';
  if (typeof node === 'boolean') return node ? 'always true' : 'always false';
  if (node === null || typeof node !== 'object' || Array.isArray(node)) return 'an invalid condition';

  const keys = Object.keys(node);
  if (keys.length !== 1) return 'an invalid condition';
  const op = keys[0];
  const arg = node[op];

  switch (op) {
    case 'eq':
      return describeComparisonLeaf(arg, 'is');
    case 'ne':
      return describeComparisonLeaf(arg, 'is not');
    case 'in':
      return describeInLeaf(arg);
    case 'gt':
      return describeComparisonLeaf(arg, 'is greater than');
    case 'lt':
      return describeComparisonLeaf(arg, 'is less than');
    case 'exists':
      return `${describePredicatePath(arg)} is filled in`;
    case 'empty':
      return `${describePredicatePath(arg)} is empty`;
    case 'matches':
      return describeMatchesLeaf(arg);
    case 'all':
      return describeBranchGroup(arg, 'all', depth);
    case 'any':
      return describeBranchGroup(arg, 'any', depth);
    case 'not':
      return `not (${describePredicateNode(arg, depth + 1)})`;
    default:
      return `an unrecognized condition ('${String(op)}')`;
  }
}

/**
 * A short, human-readable rendering of `pred` for the UI's "why is this
 * question being asked" explanation. Total like evaluatePredicate: never
 * throws, always returns a non-empty string.
 */
function describePredicate(pred) {
  try {
    const text = describePredicateNode(pred, 0);
    return text && text.length > 0 ? text : 'a condition';
  } catch {
    return 'a condition';
  }
}

// Advisor rules: modality-specific (and later, panel/design-specific)
// guidance stored as DATA in web/kb/advisor.json and evaluated by the
// EXISTING predicate DSL (engine/predicate.js). This is the "why", not just
// the "what" -- see docs/plans/planner-web-mvp-usecases.md section 2: code
// may know the SHAPE of a rule; only data may know its CONTENT.
//
// Pure module: no DOM, no store, no globals. Imports only evaluatePredicate.
//
// Mirrors engine/interview.js's loadQuestions discipline deliberately: an
// explicit whitelist object, never a spread of the raw entry, so a new rule
// property is silently DROPPED here until it is added to this list by name.
// That is what makes an author's typo loud rather than a rule that loads
// clean and never does anything -- this project has shipped the opposite
// (a spread that silently dropped a new property) once already.


// Surfaces that have a live advice renderer TODAY. Deliberately NOT
// pre-authorizing a future surface (e.g. a panel/spillover page): a rule
// naming an unknown surface is dropped with an issue, not silently inert.
// Adding a surface later is one entry here plus one UI wire-up, in the same
// commit.
const ADVICE_SURFACES = ['describe', 'design', 'naming'];

const ADVICE_KINDS = ['pitfall', 'tip'];

const ADVICE_ID_PATTERN = /^[a-z0-9][a-z0-9-]*$/;
const MIN_ADVICE_BODY_LENGTH = 40;

// The complete set of keys a rule entry may carry. Checked against
// Object.keys(entry) so an unrecognized key (a typo like 'surface' for
// 'surfaces', or a leftover 'text' from copy-pasting a question-bank entry)
// is reported rather than silently ignored -- see the module-header comment.
const KNOWN_ADVISOR_RULE_KEYS = new Set([
  'id',
  'surfaces',
  'kind',
  'concept',
  'title',
  'body',
  'when',
  'priority',
]);

function advisorIssue(field, message) {
  return { field, message, severity: 'error' };
}

/**
 * Validate and normalize one raw rule entry. Returns `null` (with issues
 * pushed) if the rule cannot be shipped; otherwise the normalized rule.
 *
 * Unknown top-level keys are reported but do NOT drop the rule -- the direct
 * countermeasure to the silent-drop failure mode above: an author who
 * mistypes `surface` instead of `surfaces` gets told, rather than shipping a
 * rule with no surfaces that is quietly the SAME as skipping the whole thing.
 */
function normalizeAdvisorRule(entry, index, issues, seenIds) {
  if (entry === null || typeof entry !== 'object' || Array.isArray(entry)) {
    issues.push(advisorIssue(`[${index}]`, 'advisor rule is not an object'));
    return null;
  }

  // Reported here, before any field validation, so an unrecognized key is
  // flagged even on a rule that otherwise fails validation for an unrelated
  // reason -- an author fixing one problem should see all of them, not
  // discover the typo only after the first error is resolved.
  for (const key of Object.keys(entry)) {
    if (!KNOWN_ADVISOR_RULE_KEYS.has(key)) {
      issues.push(advisorIssue(`[${index}]`, `advisor rule has an unrecognized property '${key}' -- it will be ignored`));
    }
  }

  const id = typeof entry.id === 'string' ? entry.id.trim() : '';
  if (!id) {
    issues.push(advisorIssue(`[${index}]`, 'advisor rule is missing a non-empty id'));
    return null;
  }
  if (!ADVICE_ID_PATTERN.test(id)) {
    issues.push(advisorIssue(id, `advisor rule id '${id}' must match ${ADVICE_ID_PATTERN}`));
    return null;
  }
  if (seenIds.has(id)) {
    issues.push(advisorIssue(id, `duplicate advisor rule id '${id}'`));
    return null;
  }

  if (!ADVICE_KINDS.includes(entry.kind)) {
    issues.push(advisorIssue(id, `advisor rule 'kind' must be one of ${ADVICE_KINDS.join(', ')}, got '${String(entry.kind)}'`));
    return null;
  }

  // The underlying phenomenon this note is ABOUT -- 'spectral spillover',
  // 'photobleaching', 'phototoxicity'. Required, and deliberately NOT
  // derivable from `when`: the trigger condition (modality is confocal) says
  // when a note applies; the concept says why it exists at all, and only the
  // latter is the thing a user actually needs to recognize. Conflating the
  // two is what made an earlier version render "Shown because modality is
  // STED" as though that were a reason.
  const concept = typeof entry.concept === 'string' ? entry.concept.trim() : '';
  if (!concept) {
    issues.push(
      advisorIssue(id, "advisor rule is missing a non-empty concept (the phenomenon it is about, e.g. 'spectral spillover')")
    );
    return null;
  }

  const title = typeof entry.title === 'string' ? entry.title.trim() : '';
  if (!title) {
    issues.push(advisorIssue(id, 'advisor rule is missing a non-empty title'));
    return null;
  }

  const body = typeof entry.body === 'string' ? entry.body.trim() : '';
  if (body.length < MIN_ADVICE_BODY_LENGTH) {
    issues.push(
      advisorIssue(
        id,
        `advisor rule 'body' must be at least ${MIN_ADVICE_BODY_LENGTH} characters (the "why", not just the "what") -- got ${body.length}`
      )
    );
    return null;
  }

  if (!Array.isArray(entry.surfaces) || entry.surfaces.length === 0) {
    issues.push(advisorIssue(id, "advisor rule 'surfaces' must be a non-empty array"));
    return null;
  }
  const unknownSurface = entry.surfaces.find((s) => !ADVICE_SURFACES.includes(s));
  if (unknownSurface !== undefined) {
    // Drop the WHOLE rule, not just the bad entry -- dropping only the bad
    // surface would leave the rule alive but silently narrower than the
    // author intended, which is a harder bug to notice than an absent rule.
    issues.push(
      advisorIssue(id, `advisor rule references unknown surface '${String(unknownSurface)}' (known: ${ADVICE_SURFACES.join(', ')})`)
    );
    return null;
  }

  // `when` is REQUIRED and must not be the literal `true`.
  // evaluatePredicate(undefined, ...) returns true -- the DSL's own "no
  // condition given" default -- so an omitted `when` would silently produce
  // permanent, unconditional advice on every matching surface. A rule that
  // genuinely wants to fire everywhere still has to say so honestly with an
  // always-true predicate shape the author chose, not by omission.
  if (entry.when === undefined || entry.when === true) {
    issues.push(advisorIssue(id, "advisor rule 'when' is required and must not be the literal true"));
    return null;
  }

  seenIds.add(id);
  return {
    id,
    surfaces: entry.surfaces.slice(),
    kind: entry.kind,
    concept,
    title,
    body,
    when: entry.when,
    priority: typeof entry.priority === 'number' ? entry.priority : 0,
  };
}

/**
 * Validate and normalize a raw advisor pack into {rules, issues}.
 * TOTAL: never throws. A malformed rule is dropped and reported rather than
 * aborting the whole pack -- one bad rule must not silence every rule.
 *
 * `raw` is the parsed contents of web/kb/advisor.json: `{version, rules}`.
 * An absent pack (raw is undefined/null) is reported as its own issue rather
 * than degrading silently to an empty rule set -- a developer who edits
 * advisor.json and forgets to re-run tools/export_markers_kb.py sees a toast
 * naming the fix, not a blank panel with no clue why.
 */
function loadAdvisorRules(raw) {
  const issues = [];

  if (raw === undefined || raw === null) {
    issues.push(advisorIssue('advisor', 'advisor pack is missing -- run tools/export_markers_kb.py'));
    return { rules: [], issues };
  }
  if (typeof raw !== 'object' || Array.isArray(raw) || !Array.isArray(raw.rules)) {
    issues.push(advisorIssue('advisor', "advisor pack must be an object with a 'rules' array"));
    return { rules: [], issues };
  }

  const seenIds = new Set();
  const rules = [];
  raw.rules.forEach((entry, index) => {
    const rule = normalizeAdvisorRule(entry, index, issues, seenIds);
    if (rule) rules.push(rule);
  });

  return { rules, issues };
}

/**
 * The advice notes relevant to `surface` for the CURRENT `experiment`, in
 * ascending priority order (ties keep declaration order -- Array.prototype
 * .sort is stable).
 *
 * `surface === null` means "every surface" -- the hook a future aggregate
 * view (a nav badge, a summary page) would use; nothing in this slice calls
 * it that way yet.
 *
 * TOTAL like evaluatePredicate itself: a rule whose `when` somehow throws
 * (it cannot, by evaluatePredicate's own contract, but this function does
 * not trust that transitively) is treated as non-matching, never as a crash
 * that blanks the whole panel.
 */
function selectAdvice(rules, experiment, surface) {
  const matching = rules.filter((rule) => {
    if (surface !== null && !rule.surfaces.includes(surface)) return false;
    try {
      return evaluatePredicate(rule.when, experiment);
    } catch {
      return false;
    }
  });
  return matching
    .map((rule, index) => ({ rule, index }))
    .sort((a, b) => a.rule.priority - b.rule.priority || a.index - b.index)
    .map(({ rule }) => rule);
}

// Maps a predicate PATH to the plain-English field name summarizeTrigger
// uses. Deliberately small and curated -- covers only paths advisor rules
// actually reference today. An unmapped path makes summarizeTrigger return
// null (see below) rather than leaking a raw dotted path like
// 'acquisition.modality' into user-facing text.
const TRIGGER_FIELD_LABELS = { 'acquisition.modality': 'modality' };

/**
 * A short, plain-English rendering of a rule's APPLICABILITY condition --
 * "modality is STED", "modality is SEM or TEM".
 *
 * This is NOT the note's reason, and must never be presented as one. The
 * reason a note exists is its `concept` (spectral spillover, photobleaching)
 * -- authored content that no predicate encodes. This function only answers
 * "when does this apply", which is a useful but strictly secondary question:
 * it tells a reader the note is conditional on something they entered rather
 * than shown to everyone.
 *
 * Deliberately derived MECHANICALLY from the predicate rather than
 * hand-authored: a hand-written applicability string is a second,
 * independent rendering of the same fact `when` already encodes, and this
 * codebase has already shipped that exact defect shape twice (a display
 * column disagreeing with an embedded filename token, a value written under
 * one store path and read under another -- docs/cma-lessons.md lessons 49
 * and 50). Deriving from `rule.when` itself means this text CANNOT disagree
 * with the actual condition the engine evaluates, by construction. The
 * `concept`, by contrast, is NOT derivable and so is authored per rule.
 *
 * TOTAL: only the two simplest predicate shapes this pack currently uses
 * (`eq`, `in`, both on a single string path) are summarized. Anything else
 * -- composite `all`/`any`/`not`, `matches`, `gt`/`lt`, `exists`/`empty`, or
 * a path not in TRIGGER_FIELD_LABELS -- returns null. The caller omits the
 * clause entirely in that case rather than showing something misleading or
 * falling back to raw predicate syntax.
 */
function summarizeTrigger(predicate) {
  if (predicate === null || typeof predicate !== 'object' || Array.isArray(predicate)) return null;
  const keys = Object.keys(predicate);
  if (keys.length !== 1) return null;
  const [op] = keys;
  const arg = predicate[op];
  if ((op !== 'eq' && op !== 'in') || !Array.isArray(arg) || arg.length !== 2) return null;

  const [path, value] = arg;
  if (typeof path !== 'string') return null;
  const label = TRIGGER_FIELD_LABELS[path];
  if (!label) return null;

  if (op === 'eq') {
    if (typeof value !== 'string') return null;
    return `${label} is ${value}`;
  }
  // op === 'in'
  if (!Array.isArray(value) || value.length === 0 || !value.every((v) => typeof v === 'string')) return null;
  if (value.length === 1) return `${label} is ${value[0]}`;
  return `${label} is ${value.slice(0, -1).join(', ')} or ${value[value.length - 1]}`;
}

// Filename construction: token sanitization, reserved-stem repair,
// extension handling, and template rendering. Faithful port of
// src/microscopy_naming_assistant/naming.py — behaviour must stay
// identical; only the snake_case -> camelCase names changed.
//
// Leaf module: import nothing.

// Windows reserves these device names as a filename STEM (i.e. the base
// name before the extension) case-insensitively -- "CON", "con", and
// "CON.tif" are all unusable on a real Windows filesystem, even though
// "CONSOLE" is fine.
const RESERVED_WINDOWS_STEMS = new Set([
  'CON',
  'PRN',
  'AUX',
  'NUL',
  ...Array.from({ length: 9 }, (_, i) => `COM${i + 1}`),
  ...Array.from({ length: 9 }, (_, i) => `LPT${i + 1}`),
]);

// Appended to a stem that collides with a reserved Windows device name so
// the resulting filename is always creatable, while staying recognizably
// close to what the template originally produced.
const RESERVED_STEM_REPAIR_SUFFIX = '_FILE';

const COMPOUND_EXTENSIONS = ['.ome.tif', '.ome.tiff'];

/**
 * True if `stem` is a reserved Windows device name, case-insensitively.
 *
 * This checks the WHOLE stem (no extension), matching Windows' own rule:
 * "CON" and "con" are reserved, but "CONSOLE" and "ICON" are not.
 */
function isReservedWindowsStem(stem) {
  return RESERVED_WINDOWS_STEMS.has(String(stem).trim().toUpperCase());
}

/**
 * Return a filesystem-safe variant of `stem` if it is a reserved Windows
 * device name, otherwise return it unchanged.
 */
function repairReservedStem(stem) {
  if (isReservedWindowsStem(stem)) {
    return `${stem}${RESERVED_STEM_REPAIR_SUFFIX}`;
  }
  return stem;
}

function sanitizeToken(value, config) {
  const pattern = new RegExp(config.safeCharPattern, 'g');
  const cleaned = String(value).trim().replaceAll(' ', '_').replace(pattern, '');
  return cleaned || 'UNSPECIFIED';
}

function normalizeFields(fields, config) {
  const optional = config.optionalFields || [];
  const normalized = {};
  for (const [key, value] of Object.entries(fields)) {
    // An OPTIONAL field that carries no value renders as the empty string
    // rather than sanitizeToken's 'UNSPECIFIED' fallback. renderName's
    // existing `_{2,}` -> `_` collapse then removes the orphaned separator,
    // so the token disappears from the name entirely instead of padding it
    // with a placeholder for an axis this experiment simply does not use.
    if (optional.includes(key) && (value === undefined || value === null || value === '')) {
      normalized[key] = '';
      continue;
    }
    let token = sanitizeToken(String(value), config);
    if (config.uppercaseFields.includes(key)) {
      token = token.toUpperCase();
    }
    normalized[key] = token;
  }
  return normalized;
}

function basename(name) {
  const str = String(name);
  const idx = Math.max(str.lastIndexOf('/'), str.lastIndexOf('\\'));
  return idx >= 0 ? str.slice(idx + 1) : str;
}

/**
 * Compute the extension to use for `name`, preserving known compound
 * extensions.
 *
 * A naive last-dot split would collapse "foo.ome.tif" to ".tif", silently
 * dropping the ".ome" infix that marks the file as an OME-TIFF. Detect that
 * case (and its ".ome.tiff" sibling) explicitly and keep the compound,
 * lowercased. Everything else keeps the existing single-suffix behavior,
 * defaulting to ".tif" when there is no extension at all.
 */
function compoundExt(name) {
  const base = basename(name);
  const lower = base.toLowerCase();
  for (const compound of COMPOUND_EXTENSIONS) {
    if (lower.endsWith(compound)) return compound;
  }

  // Mirrors pathlib's Path.suffix: a leading dot with nothing before it
  // (e.g. ".hidden") is NOT treated as an extension.
  const dotIndex = base.lastIndexOf('.');
  const ext = dotIndex > 0 ? base.slice(dotIndex).toLowerCase() : '';
  if (!ext) return '.tif';
  return ext.startsWith('.') ? ext : `.${ext}`;
}

/**
 * Merge defaults with extracted fields, attach the extension, and
 * normalize.
 *
 * This is the single source of truth for the final field dict used both
 * for validation and for rendering the filename.
 */
function finalizeFields(sourceName, extracted, config) {
  const merged = { ...config.defaults, ...extracted };
  // Optional fields get NO default: config.defaults may still list one (so a
  // caller can opt a field back into being required by dropping it from
  // optionalFields), but an optional field the caller did not supply must
  // stay absent rather than inheriting a placeholder.
  for (const key of config.optionalFields || []) {
    const supplied = extracted && extracted[key];
    if (supplied === undefined || supplied === null || supplied === '') {
      merged[key] = '';
    }
  }
  const ext = compoundExt(sourceName);

  const normalized = normalizeFields(merged, config);
  normalized.ext = ext;
  return normalized;
}

function formatTemplate(template, fields) {
  return template.replace(/\{([^{}]+)\}/g, (match, key) => {
    if (!(key in fields)) {
      throw new Error(`Missing template field: ${key}`);
    }
    return String(fields[key]);
  });

/** Format an already-finalized field dict into a filename. */
function renderName(fields, config) {
  let rawName = formatTemplate(config.template, fields);

  // Collapse duplicate separators and strip separator around extension.
  rawName = rawName.replace(/_{2,}/g, '_');
  rawName = rawName.replaceAll('_.', '.');
  // An omitted OPTIONAL field at the very START of the template leaves a
  // leading separator, which the collapse above cannot see (there is only one
  // of it). Harmless today -- {date} leads and is required -- but a filename
  // must never begin with '_' if the template is ever reordered.
  rawName = rawName.replace(/^_+/, '');

  // Reject/repair Windows reserved device names as the filename STEM --
  // "CON.tif" is unusable on Windows exactly like bare "CON" is. Split off
  // the extension using fields.ext (not a naive suffix split, which would
  // collapse a compound extension like ".ome.tif" to ".tif") so the check
  // covers the true stem regardless of extension shape.
  let ext = fields.ext !== undefined && fields.ext !== null ? String(fields.ext) : '';
  let stemPart;
  if (ext && rawName.toLowerCase().endsWith(ext.toLowerCase())) {
    stemPart = rawName.slice(0, rawName.length - ext.length);
  } else {
    stemPart = rawName;
    ext = '';
  }
  const repairedStem = repairReservedStem(stemPart);
  if (repairedStem !== stemPart) {
    rawName = `${repairedStem}${ext}`;
  }
  return rawName;
}

// Condition matrix: arms x factors x replicates -> concrete condition rows
// -> group labels. Pure module: no DOM, no store, no globals.
//
// TWO KINDS OF AXIS, and the difference is the whole point of this module:
//
//   design.groups.levels -- the ARM axis. Mutually exclusive alternatives
//     (CT | NAM25MM | NAM50MM). A sample is exactly ONE of these. Singular by
//     construction, so it can never be crossed with itself.
//   design.factors[]     -- genuinely CROSSING axes (genotype, timepoint).
//     A sample really is both WT *and* 24h, so these do form a product.
//
// Arms DO cross with factors (WT/KO x CT/drug is a legitimate 2x2); they just
// never cross with each other. Expressing arms as two factors is what produced
// the nonsense 'CT-NAM50MM' -- a file that was somehow both the control and the
// 50 mM arm. Keeping the arm axis singular makes that unrepresentable rather
// than merely discouraged.
//
// ROW ORDER IS A CONTRACT. Downstream filename generation depends on the exact
// sequence produced by expandConditions: arm outermost (slowest-varying), then
// factors in declared order, then biological replicate, then technical
// replicate innermost (fastest-varying). Reordering this for "nicer" iteration
// silently reshuffles every filename downstream.


// Each replicate axis renders as a prefixed, zero-padded token (B01, T03).
// The prefix is what keeps the name parseable once tokens become optional:
// without it, '..._NAM50MM_E02_03' gives no way to tell which axis '03' is.
const REPLICATE_PAD = 2;
const MAX_PADDED_REPLICATE = 99; // 2 digits; see conditionIssues

// Refuse to materialize a cartesian product larger than this. A fat-fingered
// design (an extra factor, a huge replicate count) must fail fast with a
// visible issue rather than hang the browser building millions of rows.
const MAX_CONDITION_ROWS = 1000;

// Group segments are sanitized with the same safe-char policy naming.js's own
// filename tokens use by default. Exported so tests can build the identical
// sanitizeToken config rather than re-deriving/copying this string.
//
// Despite the name (kept for backward compatibility -- tests and design.js
// already reference it), this is used for the {group} template token and the
// "Group naming override" scheme, NOT for naming.fields.sample, which is a
// plain user-typed specimen id with its own validation (see naming.js's
// DEFAULT_PROFILE.samplePattern).
const SAMPLE_ID_SAFE_CHAR_PATTERN = '[^A-Za-z0-9_-]+';

const TEMPLATE_TOKEN_RE = /\{([^{}]+)\}/g;

function factorsOf(design) {
  return design && Array.isArray(design.factors) ? design.factors : [];
}

function levelsOf(factor) {
  return factor && Array.isArray(factor.levels) ? factor.levels : [];
}

function groupLevelsOf(design) {
  const groups = design && design.groups;
  return groups && Array.isArray(groups.levels) ? groups.levels : [];
}

/**
 * Resolve a raw replicate count (design.biologicalReplicates /
 * .technicalReplicates) to the count used for expansion.
 *
 * Unlike the old single `replicates` field, an explicit null/undefined here
 * means the axis is OMITTED, not "default to 1" -- not every experiment has
 * technical replicates, and some (SEM/TEM/Raman) may have neither axis at
 * all. Returns null for "omit this axis" and a positive integer count
 * otherwise; conditionIssues separately flags an explicit invalid value
 * (0, negative, non-integer) rather than silently coercing it.
 */
