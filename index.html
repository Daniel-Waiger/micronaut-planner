  // per the plan doc, it is deliberately the permanent home for "add an
  // assay," not just a control that appears once a second one already
  // exists. Lives here (not inside design.js or any step) because a
  // switcher inside a step would re-enter that step's render() from a
  // click handler whose own `main.textContent = ''` just destroyed the very
  // DOM the handler is running in -- shell.js already survives a step
  // change unscathed (see router.onChange below), so an assay switch is
  // just another nav, using a proven contract instead of a new one.
  const switcherBar = document.createElement('div');
  switcherBar.className = 'assay-switcher-bar';
  switcherBar.setAttribute('role', 'tablist');
  switcherBar.setAttribute('aria-label', 'Assays');

  function renderSwitcher(experiment) {
    switcherBar.textContent = '';
    const assays = Array.isArray(experiment.assays) ? experiment.assays : [];

    assays.forEach((assay, index) => {
      const pill = document.createElement('div');
      pill.className = 'assay-pill' + (assay.id === experiment.activeAssayId ? ' active' : '');

      const switchBtn = document.createElement('button');
      switchBtn.type = 'button';
      switchBtn.className = 'assay-pill-label';
      switchBtn.textContent = assay.label || `Assay ${index + 1}`;
      switchBtn.setAttribute('role', 'tab');
      switchBtn.setAttribute('aria-selected', String(assay.id === experiment.activeAssayId));

        // not the provenance-gated store.setPath every field write uses.
        // main.js's own store.subscribe detects this exact change and
        // re-renders whichever step is currently on screen.
        store.patch({ activeAssayId: assay.id });

      pill.appendChild(switchBtn);

      // Deleting the last assay would break every consumer's
      // `assays.length >= 1` assumption -- removeAssay itself refuses, but
      // hiding the control here means there is nothing to click that could
      // ever surface that refusal as a confusing no-op.
      if (assays.length > 1) {
        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'assay-pill-delete';
        deleteBtn.textContent = '×';
        deleteBtn.title = `Delete ${assay.label || `Assay ${index + 1}`}`;
        deleteBtn.addEventListener('click', (event) => {
          event.stopPropagation();
          const ok = window.confirm(
            `Delete "${assay.label || `Assay ${index + 1}`}" and all its design, panel, and naming data?\n\nThis cannot be undone.`
          );
          if (!ok) return;
          const result = removeAssay(store.get(), assay.id);
          if (result) store.patch(result);
        });
        pill.appendChild(deleteBtn);
      }

      switcherBar.appendChild(pill);
    });

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'assay-pill-add';
    addBtn.textContent = '+ Add assay';
    const atCap = assays.length >= MAX_STUDY_ROWS;
    addBtn.disabled = atCap;
    addBtn.title = atCap ? `A study cannot have more than ${MAX_STUDY_ROWS} assays.` : 'Add a new assay';
    addBtn.addEventListener('click', () => {
      const experimentNow = store.get();
      const id = shortId();
      const { assay, provenanceSlotKey, provenanceEntry } = seedAssayFromVocabulary(
        experimentNow.armVocabulary,
        id
      );
      // One atomic patch: the new assay, the active pointer, AND its one
      // provenance slot together -- an assay present in `assays` but
      // missing its slot would let the very first user edit to its seeded
      // arms be misjudged as overwriting nothing (see
      // seedAssayFromVocabulary's own docstring).
      store.patch((state) => ({
        assays: [...state.assays, assay],
        activeAssayId: id,
        provenance: {
          ...state.provenance,
          slots: { ...state.provenance.slots, [provenanceSlotKey]: provenanceEntry },
        },
      }));
    });
    switcherBar.appendChild(addBtn);
  }

  // Redraws on ANY store change, mirroring how the step nav below redraws on
  // any router change -- a rename or vocabulary edit made from the Study
  // step (a different module entirely) still needs the switcher's own
  // labels/pill set to stay current, with no extra plumbing between the two.
  store.subscribe((state) => renderSwitcher(state));
  renderSwitcher(store.get());

  const body = document.createElement('div');
  body.className = 'shell-body';

  const nav = document.createElement('nav');
  nav.className = 'shell-nav';
  nav.setAttribute('aria-label', 'Steps');

  const main = document.createElement('main');
  main.className = 'shell-main';

  body.appendChild(nav);
  body.appendChild(main);

  const status = document.createElement('div');
  status.className = 'shell-status';
  status.setAttribute('role', 'status');

  root.appendChild(header);
  root.appendChild(switcherBar);
  root.appendChild(body);
  root.appendChild(status);

  function renderNav(activeId) {
    nav.textContent = '';
    for (const step of router.steps) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'nav-step' + (step.id === activeId ? ' active' : '');
      btn.textContent = step.title || step.id;
      btn.addEventListener('click', () => router.navigate(step.id));
      nav.appendChild(btn);
    }
  }

  router.onChange((activeId) => renderNav(activeId));
  renderNav(router.current());

  let toastTimer = null;
  function showToast(message) {
    status.textContent = message;
    status.classList.add('visible');
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => status.classList.remove('visible'), 3000);
  }

  return { main, showToast };
}

// The advice panel: renders the modality-guidance notes engine/advisor.js
// selects, on any step that mounts one. Shared, not a step -- hence living
// in ui/ rather than ui/steps/.
//
// Deliberately its OWN visual vocabulary, not a reuse of `.issues-list`.
// Not for tone -- for shape: the {field, message, severity} issue record
// flattens to one line and has no room for a title AND a "why", which is
// the entire point of this feature. See docs/plans -- Advisor slice 1,
// Decision 3.
//
// The panel contains ZERO focusable elements. This is load-bearing, not
// cosmetic: it is what makes calling update() on every keystroke safe (no
// focus theft, no cursor jump in whatever field the user is typing in), and
// it is why there is no Dismiss button in this slice -- adding one later
// means revisiting the re-render seam, not just adding a button.
//
// No memoization anywhere in update(): store.patch() rebinds the experiment
// root (core/store.js), so any cached reference to a previous experiment is
// a live bug waiting to fire the moment a caller uses store.patch({}) as a
// notify-only no-op (describe.js does exactly that twice). With a single-
// digit rule count, evaluatePredicate's depth-capped tree walk is free;
// recomputing from scratch on every call is correct, not merely acceptable.


const ADVICE_KIND_LABELS = { pitfall: 'Pitfall', tip: 'Tip' };

// A note answers TWO different questions, and they must not be conflated:
//
//   WHY does this note exist?  -> its `concept` ("spectral spillover",
//     "photobleaching"). Authored content; no predicate encodes it. This is
//     the note's actual reason and the thing a reader needs to recognize.
//   WHEN does it apply?  -> summarizeTrigger(note.when) ("modality is
//     STED"). Derived mechanically from the predicate so it cannot drift.
//     Useful, but strictly secondary -- it only tells you the note is
//     conditional on something you entered rather than shown to everyone.
//
// An earlier version rendered only the second and labelled it "Shown
// because ...", which reads as a reason and is not one: "modality is STED"
// says nothing about why STED warrants the warning.
//
// The RAW predicate text (describePredicate, engine/predicate.js) is a
// THIRD, debug-only tier behind this flag -- mirrors shell.js's THEME_KEY
// pattern, read through a try/catch so a disabled/unavailable localStorage
// degrades to "off" rather than throwing. Unconditionally showing raw
// predicate syntax (`acquisition.modality is one of [...]`) would put
// developer-facing text in front of a scientist for no benefit beyond what
// the two tiers above already give; it stays reserved for whoever is
// authoring or debugging a rule.
const ADVISOR_DEBUG_KEY = 'micronaut.advisorDebug';

function advisorDebugEnabled() {
  try {
    return localStorage.getItem(ADVISOR_DEBUG_KEY) === '1';
  } catch {
    return false;
  }
}

function appendAdviceNote(list, note) {
  const item = document.createElement('div');
  item.className = `advice-note advice-${note.kind}`;

  // Kind ("Pitfall"/"Tip") and concept ("spectral spillover") on one line.
  // The CONCEPT is the note's actual reason for existing and is what makes a
  // list of notes scannable -- you can see at a glance that one is about
  // spillover and another about photobleaching, without reading either body.
  const kind = document.createElement('div');
  kind.className = 'advice-kind';
  const kindLabel = document.createElement('span');
  kindLabel.textContent = ADVICE_KIND_LABELS[note.kind] || note.kind;
  kind.appendChild(kindLabel);
  const concept = document.createElement('span');
  concept.className = 'advice-concept';
  concept.textContent = note.concept;
  kind.appendChild(concept);
  item.appendChild(kind);

  const title = document.createElement('div');
  title.className = 'advice-title';
  title.textContent = note.title;
  item.appendChild(title);

  const body = document.createElement('div');
  body.className = 'advice-body';
  body.textContent = note.body;
  item.appendChild(body);

  // "Applies when ...", NOT "Shown because ..." -- this is the note's
  // APPLICABILITY condition, not its reason. The reason is the concept
  // rendered above. Labelling a trigger condition as a reason is precisely
  // the mistake an earlier version of this file made.
  const trigger = summarizeTrigger(note.when);
  if (trigger) {
    const triggerEl = document.createElement('div');
    triggerEl.className = 'advice-trigger';
    triggerEl.textContent = `Applies when ${trigger}.`;
    item.appendChild(triggerEl);
  }

  if (advisorDebugEnabled()) {
    const reason = document.createElement('div');
    reason.className = 'advice-reason';
    reason.textContent = `shown because: ${describePredicate(note.when)}`;
    item.appendChild(reason);
  }

  list.appendChild(item);
}

/**
 * Build an advice panel scoped to one `surface` ('describe' | 'design' |
 * 'naming'). `advisor` is the loaded rule array from engine/kbpack.js's
 * shapeAppKb -- the SAME array for every panel on every step, since the
 * rules themselves are surface-agnostic content; only the surface filter
 * applied at select time differs per panel.
 *
 * Returns { element, update(experiment) }. Mount `element` once, at render
 * time, in the step's own DOM tree (main.textContent = '' wipes the whole
 * step on every navigation, so there is nothing to persist across renders --
 * a fresh panel is created and mounted every time the step itself renders).
 * Call `update(experiment)` explicitly, with the SAME experiment object the
 * step's own output is rendering from, at every point that experiment
 * could have changed -- there is no store subscription here (see the
 * module-header comment on caching).
 */
function createAdvicePanel(advisor, surface) {
  const section = document.createElement('div');
  section.className = 'advice-section';
  section.hidden = true; // no advice yet -- see update() below

  const heading = document.createElement('div');
  heading.className = 'advice-heading';
  heading.textContent = 'Guidance';
  section.appendChild(heading);

  const list = document.createElement('div');
  list.className = 'advice-list';
  section.appendChild(list);

  function update(experiment) {
    const notes = selectAdvice(advisor, experiment, surface);
    // Hidden rather than merely empty when there is nothing to show -- an
    // empty "Guidance" heading sitting above nothing is dead chrome, and
    // scarcity is what keeps this feature from becoming a cookie banner.
    section.hidden = notes.length === 0;
    list.textContent = '';
    for (const note of notes) {
      appendAdviceNote(list, note);
    }
  }

  return { element: section, update };
}
  // ---- src/ui/llmStatus.js ----
// Shared "cold start" messaging for every local-LLM call site (guidance.js's
// Ask, describe.js's Draft and Suggest buttons) -- one copy of the plain-
// language explanation and the ticking elapsed-time label, rather than three
// near-identical copies that drift apart.
//
// Why this exists: Ollama loads a model into memory on its first request
// after being idle (or after this app's own tab-close unload -- see
// llm/ollama.js's pagehide handler), and that load can take anywhere from a
// few seconds to roughly a minute depending on the model's size and the
// machine's GPU. Without this, a cold load reads as a frozen "Asking..."
// button with no explanation.

const COLD_START_HINT =
  "Heads up: if your local model hasn't answered anything recently, it has to load into " +
  'memory first -- that first response can take anywhere from a few seconds to around a ' +
  'minute, depending on the model’s size and your GPU. It then stays warm for as long ' +
  'as this tab stays open.';

/**
 * Starts overwriting `button.textContent` once a second with "`verb`… Ns" so
 * a slow cold-start load reads as "still working" rather than frozen.
 * Returns a stop() function -- callers MUST call it in their `finally` block
 * (same lifetime as the button's disabled flag) or the timer leaks.
 */
function startElapsedLabel(button, verb) {
  let seconds = 0;
  button.textContent = `${verb}… 0s`;
  const timer = setInterval(() => {
    seconds += 1;
    button.textContent = `${verb}… ${seconds}s`;
  }, 1000);
  return () => clearInterval(timer);
}
  // ---- src/ui/guidance.js ----
// The Guidance panel (local-llm-guidance, capability A): an opt-in "ask
// about this step" feature. OFF by default (llm/config.js) and, even when
// on, this panel NEVER writes to the store -- it sends the current step's
// questions plus the study drafted so far to whichever provider is
// configured (llm/provider.js) and renders the reply as plain text. There
// is no Accept/Apply button here; that is the entire difference between
// this panel and describe.js's Proposals list, which DOES write (through
// core/store.js, gated by provenance). Guidance is read-only by
// construction, matching how PREAMBLE/GUIDANCE_PREAMBLE keep the model from
// inventing domain facts on the copy-paste side.
//
// Two providers, same call site: with the local-model checkbox off (or the
// Ollama server unreachable), this degrades to the manual-paste provider --
// build the prompt text, let the user copy it to whatever LLM they already
// have open -- rather than erroring or doing nothing.
//
// Vanilla DOM only, no innerHTML with dynamic content -- same discipline as
// the rest of ui/ (shell.js's standing rule).


function buildProvider(config) {
  if (config.enabled && config.endpoint && config.model) {
    return createOllamaProvider({ endpoint: config.endpoint, model: config.model });
  }
  return createManualPasteProvider();
}

/**
 * `getContext()` is called fresh at ASK time, not captured once at mount --
 * the study and the current step's askable questions change under a panel
 * that stays mounted, and a stale snapshot would silently answer about an
 * experiment that no longer exists. Must return `{doc, questions}`: `doc`
 * is engine/studydoc.js's buildStudyDocument output, `questions` is
 * whatever question list (loadQuestions/nextQuestions/answeredQuestions
 * output) the current step wants explained.
 *
 * Returns {element, update()}. update() is a no-op today (there is no
 * per-render state besides the persisted settings, which are re-read on
 * every Ask) -- kept only so a step can mount this panel with the same
 * `{element, update}` shape as ui/advice.js's createAdvicePanel.
 *
 * `onConfigChange`, if given, is called after every settings edit (the
 * enabled checkbox, the endpoint, the model). describe.js uses this to fix a
 * real bug: its Draft/Suggest buttons used to read loadLlmConfig().enabled
 * once at render() time, so ticking this panel's checkbox did not reveal
 * them until the step re-rendered. This is NOT a full re-render hook --
 * describe.js's callback only updates button visibility, deliberately,
 * because a full re-render would lose the narrative textarea's caret
 * mid-typing.
 */
function createGuidancePanel(getContext, { onConfigChange } = {}) {
  const section = document.createElement('div');
  section.className = 'guidance-section';

  const heading = document.createElement('div');
  heading.className = 'guidance-heading';
  heading.textContent = 'Ask about this step';
  section.appendChild(heading);

  const hint = document.createElement('p');
  hint.className = 'guidance-hint';
  hint.textContent =
    'The model only sees this study’s data and the current questions -- it cannot invent a marker, control, or setting that is not already here.';
  section.appendChild(hint);

  const settingsRow = document.createElement('div');
  settingsRow.className = 'guidance-settings';

  const enabledLabel = document.createElement('label');
  enabledLabel.className = 'guidance-enabled-label';
  const enabledCheckbox = document.createElement('input');
  enabledCheckbox.type = 'checkbox';
  enabledLabel.appendChild(enabledCheckbox);
  enabledLabel.appendChild(document.createTextNode(' Use my local model (Ollama) instead of copy-paste'));
  settingsRow.appendChild(enabledLabel);

  const endpointInput = document.createElement('input');
  endpointInput.type = 'text';
  endpointInput.className = 'guidance-endpoint';
  endpointInput.placeholder = 'http://localhost:11434';
  settingsRow.appendChild(endpointInput);

  const modelInput = document.createElement('input');
  modelInput.type = 'text';
  modelInput.className = 'guidance-model';
  modelInput.placeholder = 'model name, e.g. llama3.1:8b';
  settingsRow.appendChild(modelInput);

  section.appendChild(settingsRow);

  // Set once, shown/hidden with the rest of the local-model settings: this
  // is the one place the endpoint/model config lives, so it's also the one
  // place a user checking the box will see the cold-start expectation
  // before clicking Ask (or, from describe.js, Draft/Suggest -- those reuse
  // this same persisted config rather than owning their own settings UI).
  const coldStartHint = document.createElement('p');
  coldStartHint.className = 'guidance-hint guidance-cold-start-hint';
  coldStartHint.textContent = COLD_START_HINT;
  section.appendChild(coldStartHint);

  function syncSettingsVisibility() {
    endpointInput.hidden = !enabledCheckbox.checked;
    modelInput.hidden = !enabledCheckbox.checked;
    coldStartHint.hidden = !enabledCheckbox.checked;
  }

  const config = loadLlmConfig();
  enabledCheckbox.checked = config.enabled;
  endpointInput.value = config.endpoint;
  modelInput.value = config.model;
  syncSettingsVisibility();

  function persistSettings() {
    saveLlmConfig({ enabled: enabledCheckbox.checked, endpoint: endpointInput.value, model: modelInput.value });
    syncSettingsVisibility();
    if (typeof onConfigChange === 'function') onConfigChange();
  }
  enabledCheckbox.addEventListener('change', persistSettings);
  endpointInput.addEventListener('change', persistSettings);
  modelInput.addEventListener('change', persistSettings);

  const questionInput = document.createElement('input');
  questionInput.type = 'text';
  questionInput.className = 'guidance-question';
  questionInput.placeholder = 'What is this step asking? What do these options mean?';
  section.appendChild(questionInput);

  const askButton = document.createElement('button');
  askButton.type = 'button';
  askButton.className = 'guidance-ask';
  askButton.textContent = 'Ask';
  section.appendChild(askButton);

  const replyBox = document.createElement('div');
  replyBox.className = 'guidance-reply';
  replyBox.hidden = true;
  section.appendChild(replyBox);

  // The manual-paste path: no model answered anything, so what's shown is
  // the exact text to copy, plus a way to copy it -- never rendered as if
  // it were already a reply.
  const pasteLabel = document.createElement('div');
  pasteLabel.className = 'guidance-paste-label';
  pasteLabel.textContent = 'Copy this into your own LLM:';
  pasteLabel.hidden = true;
  section.appendChild(pasteLabel);

  const pasteBox = document.createElement('textarea');
  pasteBox.className = 'guidance-paste-box';
  pasteBox.readOnly = true;
  pasteBox.hidden = true;
  section.appendChild(pasteBox);

  const copyButton = document.createElement('button');
  copyButton.type = 'button';
  copyButton.className = 'guidance-copy';
  copyButton.textContent = 'Copy';
  copyButton.hidden = true;
  section.appendChild(copyButton);

  function showReply(text) {
    pasteLabel.hidden = true;
    pasteBox.hidden = true;
    copyButton.hidden = true;
    replyBox.textContent = text;
    replyBox.hidden = false;
  }

  function showPaste(text) {
    replyBox.hidden = true;
    pasteBox.value = text;
    pasteLabel.hidden = false;
    pasteBox.hidden = false;
    copyButton.hidden = false;
  }

  async function ask() {
    const cfg = loadLlmConfig();
    const provider = buildProvider(cfg);
    const context = getContext() || {};
    const { system, user: contextBlock } = buildGuidanceMessages(context.doc, context.questions);
    const question = questionInput.value.trim();
    const user = question ? `${contextBlock}\n\n--- USER'S QUESTION ---\n${question}` : contextBlock;

    askButton.disabled = true;
    // Only Ollama has a real wait worth explaining -- manual-paste composes
    // text locally and resolves instantly, so ticking a label for it would
    // just flash "Asking… 0s" for a moment.
    const stopTicking = provider.id === 'ollama' ? startElapsedLabel(askButton, 'Asking') : null;
    if (!stopTicking) askButton.textContent = 'Asking...';
    try {
      const result = await provider.complete({ system, user });
      if (provider.id === 'manual-paste') {
        showPaste(result.text);
      } else {
        showReply(result.text || '(no reply)');
      }
    } catch (err) {
      // Degrade rather than fail: if the configured Ollama server is
      // unreachable, fall back to the always-available manual-paste
      // provider so the feature still delivers something rather than a
      // dead end -- see docs/plans (local-llm-guidance) verification.
      showReply(`Couldn't reach the local model (${err.message}). Falling back to copy-paste below.`);
      const fallback = createManualPasteProvider();
      const fb = await fallback.complete({ system, user });
      showPaste(fb.text);
    } finally {
      if (stopTicking) stopTicking();
      askButton.disabled = false;
      askButton.textContent = 'Ask';
    }
  }

  askButton.addEventListener('click', ask);
  copyButton.addEventListener('click', () => copyToClipboard(pasteBox.value));

  return { element: section, update() {} };
}

// Interim defaults until the P1 knowledge pack supplies a real profile and
// per-lab naming config -- mirrors microscopy_naming_assistant's
// default_config()/default_profile() so behaviour matches Classic today.
//
// Stage 1 (the base name, shared by every file in the experiment) is the
// leading {date}_{modality}_{exptype}_{markers}_{magnification}. Stage 2 is
// what distinguishes THIS file: {group}_{sample}_{biorep}_{techrep}. {notes}
// stays trailing. Kept byte-identical to schema.js's DEFAULT_NAMING_TEMPLATE
// -- see BASE_TEMPLATE below for the split point the Design step uses.
//
// {group}/{biorep}/{techrep}/{notes} are OPTIONAL: an experiment with no
// arms, or no technical replicates (common for SEM/TEM/Raman), omits that
// token entirely rather than padding the name with a placeholder -- see
// engine/naming.js's optionalFields handling.
const NAMING_CONFIG = {
  template:
    '{date}_{modality}_{exptype}_{markers}_{magnification}_{group}_{sample}_{biorep}_{techrep}_{notes}{ext}',
  defaults: {
    date: '1970-01-01',
    modality: 'UNKNOWN',
    exptype: 'UNKNOWN',
    markers: 'UNKNOWN',
    magnification: 'UNKNOWN',
    sample: 'UNKNOWN',
  },
  optionalFields: ['group', 'biorep', 'techrep', 'notes'],
  uppercaseFields: ['modality', 'exptype', 'sample', 'magnification', 'markers', 'group'],
  safeCharPattern: '[^A-Za-z0-9_-]+',
};

// Stage 1 on its own: NAMING_CONFIG.template up to (not including) the
// {group} slot, and without {ext}. The Design step renders this ONCE above
// the condition table -- it is the stem every file in the experiment shares
// -- so each row only has to show the part that actually distinguishes it.
// Rendering it through renderName with this template yields no extension
// (fields.ext won't match the tail), which is what we want for a stem.
const BASE_TEMPLATE = '{date}_{modality}_{exptype}_{markers}_{magnification}';

// DEFAULT_PROFILE itself now lives in engine/validation.js -- see its own
// comment there for why (one profile shared with engine/conformance.js,
// not a second local copy that could quietly diverge).

// Prefixes formatReplicateToken uses for the two number-typed replicate
// fields -- kept alongside FIELD_DEFS so currentRawFields() can look one up
// by key rather than hardcoding a branch per field.
const REPLICATE_PREFIXES = { biorep: 'B', techrep: 'T' };

// `hint` is a plain-language explanation for people who aren't sure what a
// field is asking for -- wired to the input's `title` attribute below, so it
// shows as the browser's native hover tooltip on top of (not instead of) the
// `placeholder` example text. Written for a biologist who has never touched
// this tool before, not for someone who already knows the naming jargon --
// no "token", "schema", "canonical". If a field's meaning depends on
// modality (e.g. markers meaning a contrast agent for SEM/TEM), say so in
// plain terms rather than assuming fluorescence imaging.
const FIELD_DEFS = [
  {
    key: 'date',
    label: 'Date',
    placeholder: 'YYYY-MM-DD',
    hint: 'The date you acquired these images. Keeps your files sorted in the order you took them.',
  },
  {
    key: 'modality',
    label: 'Modality',
    placeholder: 'e.g. CONFOCAL',
    hint: 'The type of microscope or imaging method you used -- for example confocal, widefield, or STED.',
  },
  {
    key: 'exptype',
    label: 'Experiment type',
    placeholder: 'e.g. CT',
    hint: 'A short label for what kind of experiment this is, so related files end up grouped together (for example "CT" for a control).',
  },
  {
    key: 'markers',
    label: 'Markers',
    placeholder: 'e.g. GFP-DAPI',
    hint: 'The stains, dyes, or fluorescent proteins you imaged, like DAPI or GFP. For SEM/TEM with no fluorescence, use this for your contrast agent instead (like uranyl acetate).',
  },
  {
    key: 'magnification',
    label: 'Magnification',
    placeholder: 'e.g. X90',
    hint: 'The zoom level or objective you used, like 40x or 100x.',
  },
  {
    key: 'group',
    label: 'Group',
    placeholder: 'e.g. CTL, OPP -- set per-row by the Design step, or type one here',
    hint: 'Which experimental group this file belongs to, such as your control or a treatment arm. Usually filled in for you from the Design page.',
  },
  {
    key: 'sample',
    label: 'Sample',
    placeholder: 'e.g. E02',
    hint: 'A unique ID for this specimen or animal, so two files from the same experiment never get mixed up.',
  },
  {
    key: 'biorep',
    label: 'Biological replicate #',
    placeholder: 'optional',
    type: 'number',
    hint: "Which biological replicate this is -- a repeat done with a different animal, dish, or sample. Leave blank if this doesn't apply to your experiment.",
  },
  {
    key: 'techrep',
    label: 'Technical replicate #',
    placeholder: 'optional',
    type: 'number',
    hint: "Which technical replicate this is -- a repeat measurement of the SAME sample. Leave blank if this doesn't apply.",
  },
  {
    key: 'notes',
    label: 'Notes',
    placeholder: 'optional',
    hint: 'Anything else worth remembering about this file. Totally optional.',
  },
];

const namingStep = {
  id: 'naming',
  title: 'Naming',
  render(main, store, { advisor } = {}) {
    main.textContent = '';

    // Commit 1 of the assay tier (schema v3): every experiment has exactly
    // one assay and no switcher exists yet, so the active assay never
    // changes for the lifetime of one render -- caching its id once here is
    // safe, matching this file's existing snapshot-per-render idiom.
    const assayId = store.get().activeAssayId;

    const heading = document.createElement('h1');
    heading.className = 'step-heading';
    heading.textContent = 'Name builder';
    main.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'naming-grid';
    main.appendChild(grid);

    const inputs = {};
    // Pre-fill through effectiveNamingFields, not raw naming.fields, so a
    // value the user already gave elsewhere (modality, collected by the
    // interview as acquisition.modality) shows up in the box it feeds rather
    // than leaving the box blank while the filename below quietly uses it.
    // assayView() hoists the active assay's slices flat, exactly the shape
    // effectiveNamingFields (an engine function that must never learn
    // assays exist) already expects.
    const prefill = effectiveNamingFields(assayView(store.get(), assayId));
    for (const field of FIELD_DEFS) {
      const row = document.createElement('label');
      row.className = 'field-row';

      const labelText = document.createElement('span');
      labelText.className = 'field-label';
      labelText.textContent = field.label;
      row.appendChild(labelText);

      const input = document.createElement('input');
      input.type = field.type || 'text';
      input.className = 'field-input';
      input.placeholder = field.placeholder;
      // Native browser tooltip, on top of (not instead of) the placeholder
      // example above -- shows on hover regardless of whether the field is
      // filled in yet.
      if (field.hint) input.title = field.hint;
      input.value = prefill[field.key] ?? '';
      input.addEventListener('input', () => {
        // scopeWrite translates the flat v2-shaped path into this assay's
        // real (index-addressed) object path plus its stable (id-addressed)
        // provenance slotKey -- see core/assay.js's module header on why
        // the two must differ for a per-assay field.
        const { path, slotKey } = scopeWrite(store.get(), `naming.fields.${field.key}`, assayId);
        // 'user_edited' when correcting an existing WEAK/PROVISIONAL value
        // (e.g. one filled in from an accepted free-text proposal), plain
        // 'user' for a first-ever entry or one already STRONG -- see
        // core/provenance.js editTagFor.
        const existingTag = store.get().provenance?.slots?.[slotKey]?.tag ?? null;
        store.setPath(path, input.value, editTagFor(existingTag), { slotKey });
        update();
      });
      inputs[field.key] = input;
      row.appendChild(input);
      grid.appendChild(row);
    }

    // The planned-names table. With a design this is every file the
    // experiment will produce; with no design at all it is exactly one row --
    // the single name the boxes above build. Same widget either way, so the
    // step works as a standalone one-off name tool OR as the end of the full
    // workflow, with nothing to switch between.
    const plannedBox = document.createElement('div');
    plannedBox.className = 'planned-box';

    const plannedHead = document.createElement('div');
    plannedHead.className = 'planned-head';

    const plannedLabel = document.createElement('div');
    plannedLabel.className = 'planned-label';
    plannedHead.appendChild(plannedLabel);

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'copy-button';
    copyBtn.textContent = 'Copy all';
    copyBtn.addEventListener('click', async () => {
      // One name per line: the shape that pastes straight into a lab
      // notebook, a spreadsheet column, or a shell loop.
      const ok = await copyToClipboard(currentFilenames().join('\n'));
      const original = copyBtn.textContent;
      copyBtn.textContent = ok ? 'Copied!' : 'Copy failed';
      window.setTimeout(() => {
        copyBtn.textContent = original;
      }, 1500);
    });
    plannedHead.appendChild(copyBtn);
    plannedBox.appendChild(plannedHead);

    const plannedList = document.createElement('div');
    plannedList.className = 'planned-list';
    plannedBox.appendChild(plannedList);
    main.appendChild(plannedBox);

    // advisor may be undefined (a caller that hasn't wired it, or a KB that
    // failed to load) -- createAdvicePanel([], ...) is a completely inert
    // panel (selectAdvice on an empty rule array is always empty), not a
    // missing-argument crash.
    const advicePanel = createAdvicePanel(advisor || [], 'naming');
    main.appendChild(advicePanel.element);

    const issuesList = document.createElement('ul');
    issuesList.className = 'issues-list';
    main.appendChild(issuesList);

    let lastPlanned = [];

    function currentFilenames() {
      return lastPlanned.filter((entry) => entry.filename).map((entry) => entry.filename);
    }

    function currentRawFields() {
      // Only include a field once the user has actually typed something --
      // finalizeFields merges {...config.defaults, ...raw}, so an included
      // blank string would OVERRIDE a sensible default (e.g. exptype's
      // 'UNKNOWN') with 'UNSPECIFIED' instead of leaving the default in
      // place until the field is genuinely filled in. For an OPTIONAL field
      // (group/biorep/techrep/notes) an omitted key is what makes the token
      // disappear from the name entirely -- see engine/naming.js.
      const raw = {};
      for (const field of FIELD_DEFS) {
        const value = inputs[field.key].value;
        if (!value) continue;
        const prefix = REPLICATE_PREFIXES[field.key];
        // biorep/techrep are stored as the raw typed NUMBER (so the number
        // input can redisplay it), formatted to 'B01'/'T03' only here, at the
        // boundary right before finalizeFields -- the single formatting
        // authority is formatReplicateToken, reused by the planner's per-row
        // rendering so the two paths can never format replicates differently.
        raw[field.key] = prefix ? formatReplicateToken(prefix, Number(value)) : value;
      }
      return raw;
    }

    // The single snapshot every consumer of "the current naming state" reads
    // from -- planFilenames below AND the advice panel. Reading the store
    // directly would lag by one keystroke on the very first character of a
    // field (setPath runs before update(), but a field the user has just
    // cleared must read as cleared already), and more importantly this is
    // what lets the table react to typing even when nothing has been
    // persisted yet. Extracted to one function specifically so the table and
    // the advice panel cannot evaluate two DIFFERENT experiments and quietly
    // disagree -- see docs/plans -- Advisor slice 1, Decision 4.
    function currentExperimentView() {
      const view = assayView(store.get(), assayId);
      return {
        ...view,
        naming: { ...(view.naming || {}), fields: currentRawFields() },
      };
    }

    function update() {
      const view = currentExperimentView();
      lastPlanned = planFilenames(view, NAMING_CONFIG);
      advicePanel.update(view);

      const count = lastPlanned.length;
      plannedLabel.textContent =
        count === 1 ? 'Planned filename' : `Planned filenames (${count} files)`;
      copyBtn.textContent = count === 1 ? 'Copy filename' : 'Copy all';
      copyBtn.disabled = currentFilenames().length === 0;

      plannedList.textContent = '';
      if (count === 0) {
        const empty = document.createElement('p');
        empty.className = 'planned-empty';
        empty.textContent = 'No names to show -- see the issues in the Design step.';
        plannedList.appendChild(empty);
      }
      for (const entry of lastPlanned) {
        const line = document.createElement('code');
        line.className = 'planned-name';
        line.textContent = entry.filename || `(${entry.error})`;
        plannedList.appendChild(line);
      }

      // Field-level validation runs against the fields as typed. The
      // path-length check runs per PLANNED NAME, deduped: with a design, the
      // longest row is the one that actually risks exceeding MAX_PATH, and N
      // equally-long rows should not produce N copies of one warning.
      const finalized = finalizeFields('experiment.tif', currentRawFields(), NAMING_CONFIG);
      const issues = validateFields(finalized, DEFAULT_PROFILE);
      const pathMessages = new Set();
      for (const name of currentFilenames()) {
        for (const issue of validateTargetPath(name)) pathMessages.add(issue.message);
      }

      issuesList.textContent = '';
      for (const issue of issues) {
        const li = document.createElement('li');
        li.className = 'issue issue-' + issue.severity;
        li.textContent = `${issue.field}: ${issue.message}`;
        issuesList.appendChild(li);
      }
      for (const message of pathMessages) {
        const li = document.createElement('li');
        li.className = 'issue issue-warning';
        li.textContent = `target_path: ${message}`;
        issuesList.appendChild(li);
      }
    }

    update();
  },
};
