      from: 'study',
      to: assayId,
      x1: studyCx,
      y1: studyBottom,
      x2: cx,
      y2: rowY(assayRowY, 0),
    });

    // The per-assay attribute chain, one node per row, each linked to the one above.
    let prevId = assayId;
    let prevRow = 0;
    ATTR_ROWS.forEach((kind, r) => {
      const rowIndex = r + 1;
      const { caption, value } = attrNodeContent(kind, assay);
      const nodeId = `${assayId}-${kind}`;
      nodes.push({
        id: nodeId,
        type: kind,
        x,
        y: rowY(assayRowY, rowIndex),
        w: NODE_W,
        h: NODE_H,
        caption,
        value,
      });
      edges.push({
        from: prevId,
        to: nodeId,
        x1: cx,
        y1: rowY(assayRowY, prevRow) + NODE_H,
        x2: cx,
        y2: rowY(assayRowY, rowIndex),
      });
      prevId = nodeId;
      prevRow = rowIndex;
    });
  });

  const height =
    cols > 0 ? rowY(assayRowY, ATTR_ROWS.length) + NODE_H + PAD : studyY + NODE_H + PAD;

  return { width, height, nodes, edges };
}
  // ---- src/engine/studydoc.js ----
// The study overview document model: ONE structured model that the HTML
// (in-app), Markdown (export), and mermaid (diagram) renderers all consume,
// built from the same functions every other step already uses --
// assayView, expandConditions/conditionIssues, planFilenames/
// studyNameIssues, selectControls, buildLadder. No engine change was
// needed to build this; that is the same "no engine changes" gate commit
// 1 of the assay tier held, evidence it still holds for a fourth consumer.
//
// WHY ONE MODEL, THREE RENDERERS: three independently-written renderings of
// the same facts is precisely the defect shape this codebase has shipped
// three times already (docs/cma-lessons.md lessons 49/50 -- a display
// column disagreeing with an embedded filename token, a value written under
// one path and read under another). Building the model once and handing it
// to thin renderers means the printed handout and the exported Markdown
// CANNOT disagree, by construction, not by discipline.
//
// DETERMINISM: calling this twice on the same experiment/kb/config yields
// byte-identical output (see web/tests/studydoc.test.js) -- everything here
// is pure computation over already-entered parameters and authored KB
// content. No module reachable from here touches an LLM, a clock, or
// Math.random.
//
// Pure module: no DOM. Imports only other pure engine/core modules.


function assayLabel(assay, index) {
  return (assay && typeof assay.label === 'string' && assay.label.trim()) || `Assay ${index + 1}`;
}

/**
 * The SINGLE resolved three(-plus-one)-state message for the readout-
 * specific controls section, or `null` when the fired `readout` list itself
 * is what should render. Computed ONCE here so both renderers (overview.js,
 * render/markdown.js) display a string rather than each re-deriving the
 * gating condition -- an adversarial verification pass on this exact commit
 * found the two renderers had drifted on this precise case (a recognized
 * readout with zero matching rules read as "not recognized" in one renderer
 * and "no guidance yet" in the other), which is lesson 49/50's failure shape
 * recurring inside the commit that names those lessons as its motivation.
 * Moving the text here removes the possibility structurally, not by
 * discipline -- see this module's header.
 *
 * Three real states plus the "known but nothing fired" case Decision 5
 * (docs/plans/planner-web-assay-tier.md) requires never render as silence:
 *   unanswered   -> prompt to answer the question
 *   unrecognized -> the readout doesn't match the vocabulary
 *   known, 0 rules -> genuinely no authored guidance for this readout yet
 *   known, >0 rules -> null; the caller renders the list itself
 */
function readoutMessageFor(state, readoutText, readoutLabel, readoutRuleCount) {
  if (state === 'unanswered') {
    return 'Readout not answered yet -- answer it on the Describe step to see readout-specific control guidance.';
  }
  if (state === 'unrecognized') {
    return `"${readoutText}" is not a readout this app recognizes -- controls here are yours to specify.`;
  }
  // state === 'known'
  return readoutRuleCount > 0 ? null : `No control guidance for ${readoutLabel} yet.`;
}

/**
 * Build the full study document. `kb` is the shaped knowledge pack
 * (engine/kbpack.js's shapeAppKb output: readouts, controlRules, stages,
 * stageRules). `config` is the naming config (ui/steps/naming.js's
 * NAMING_CONFIG) and `baseTemplate` its BASE_TEMPLATE -- both passed in
 * rather than imported, same reason engine/plan.js's studyNameIssues
 * already takes them: engine/ must never import from ui/.
 *
 * TOTAL: a malformed experiment degrades to a document with zero assays,
 * never a throw -- this is a read-only report, and a broken report must
 * not be the thing that crashes the app.
 */
function buildStudyDocument(experiment, kb, config, baseTemplate) {
  const exp = experiment && typeof experiment === 'object' ? experiment : {};
  const assays = Array.isArray(exp.assays) ? exp.assays : [];
  const readouts = (kb && kb.readouts) || {};
  const controlRules = (kb && kb.controlRules) || [];
  const stages = (kb && kb.stages) || [];
  const stageRules = (kb && kb.stageRules) || [];

  const assayDocs = assays.map((assay, index) => {
    const view = assayView(exp, assay.id);
    const design = view.design || {};
    const conditions = expandConditions(design);
    const designIssues = conditionIssues(design);
    const filenamePlan = planFilenames(view, config);

    const rState = readoutState(view.readoutText, readouts);
    const canonical = rState === 'known' ? view.readout : null;
    const readoutLabel = canonical && readouts[canonical] ? readouts[canonical].label : null;

    const firedControls = selectControls(controlRules, view);
    const readoutControls = firedControls
      .filter((r) => r.kind === 'readout')
      .map((r) => ({ id: r.id, title: r.title, why: r.why }));
    const controls = {
      state: rState,
      readoutText: view.readoutText || '',
      panel: firedControls.filter((r) => r.kind === 'panel').map((r) => ({ id: r.id, title: r.title, why: r.why })),
      readout: readoutControls,
      readoutMessage: readoutMessageFor(rState, view.readoutText || '', readoutLabel, readoutControls.length),
    };

    // Per-assay STUDY-SPECIFIC NOTES only -- the fixed 5-stage backbone
    // (title/body) is identical for every assay by construction (it is
    // static content from web/kb/stages.json, not derived from the
    // experiment), so it is hoisted to `doc.ladder` below and rendered
    // ONCE. Repeating five paragraphs of identical boilerplate per assay
    // was a real defect an adversarial pass caught: the oregano default
    // study's Markdown export showed the same "How to run this project"
    // section four times verbatim, in the document whose whole purpose is
    // being shown to a person. Only non-empty stages survive the filter --
    // an assay with no study-specific notes contributes nothing here,
    // which is correct (the ladder's fixed body already covers it once).
    const stageNotes = buildLadder(stages, stageRules, view)
      .filter((stage) => stage.notes.length > 0)
      .map((stage) => ({ stageId: stage.id, stageTitle: stage.title, notes: stage.notes }));

    return {
      id: assay.id,
      index: index + 1,
      label: assayLabel(assay, index),
      readout: { text: view.readoutText || '', state: rState, canonical, label: readoutLabel },
      modality: (view.acquisition && view.acquisition.modality) || '',
      specimen: {
        organism: (view.specimen && view.specimen.organism) || '',
        sampleType: (view.specimen && view.specimen.sampleType) || '',
        preparation: (view.specimen && view.specimen.preparation) || '',
      },
      design: {
        arms: (design.groups && Array.isArray(design.groups.levels) ? design.groups.levels : []).slice(),
        factors: (Array.isArray(design.factors) ? design.factors : []).map((f) => ({
          name: (f && f.name) || '',
          levels: (f && Array.isArray(f.levels) ? f.levels : []).slice(),
        })),
        biologicalReplicates: design.biologicalReplicates ?? null,
        technicalReplicates: design.technicalReplicates ?? null,
        conditionCount: conditions.length,
        issues: designIssues,
      },
      controls,
      stageNotes,
      namingFields: effectiveNamingFields(view),
      filenames: filenamePlan.map((entry) => ({
        groupLabel: entry.groupLabel,
        filename: entry.filename,
        error: entry.error || null,
      })),
    };
  });

  return {
    generatedFrom: 'Deterministic report: every fact below comes from parameters you entered or from authored knowledge-pack content -- nothing on this page is LLM-generated.',
    study: {
      title: (exp.meta && exp.meta.title) || '',
      researchQuestion: exp.researchQuestion || '',
      armVocabulary: (exp.armVocabulary && Array.isArray(exp.armVocabulary.levels) ? exp.armVocabulary.levels : []).slice(),
    },
    // The fixed 5-stage "how to run this project" backbone, ONCE for the
    // whole study -- see the stageNotes comment above for why this is
    // study-level rather than repeated per assay.
    ladder: stages.map((stage) => ({ id: stage.id, title: stage.title, body: stage.body })),
    assays: assayDocs,
    crossAssayIssues: studyNameIssues(exp, config, baseTemplate),
  };
}
  // ---- src/ui/shell.js ----
// App shell: header, an always-visible assay switcher, left step nav, main
// content mount, theme toggle, and a toast/status area. Vanilla DOM only --
// every node is built with createElement/textContent, never innerHTML with
// dynamic or user data.


const THEME_KEY = 'micronaut.theme';

function loadTheme() {
  try {
    return localStorage.getItem(THEME_KEY);
  } catch {
    return null;
  }
}

function saveTheme(theme) {
  try {
    localStorage.setItem(THEME_KEY, theme);
  } catch {
    // localStorage is a convenience; a failed write here only means the
    // toggle won't persist across reloads, which isn't worth surfacing.
  }
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
}

function osPrefersLight() {
  return typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: light)').matches;
}

function renderShell(root, store, router, { onReset, onNewBlank } = {}) {
  root.textContent = '';

  const header = document.createElement('header');
  header.className = 'shell-header';

  const title = document.createElement('div');
  title.className = 'shell-title';
  title.textContent = 'Micronaut Planner';
  header.appendChild(title);

  const themeToggle = document.createElement('button');
  themeToggle.type = 'button';
  themeToggle.className = 'theme-toggle';
  // Only stamp data-theme when the user has made an EXPLICIT choice before.
  // Stamping it unconditionally (even to 'dark', matching the app's own
  // :root default) would always win over the
  // @media (prefers-color-scheme: light) rule, so a first-time visitor on a
  // light-OS machine would always see dark regardless of their system
  // preference -- the toggle is meant to override the OS default, not
  // replace it before the user has ever touched it.
  const storedTheme = loadTheme();
  if (storedTheme) {
    applyTheme(storedTheme);
  }
  let currentTheme = storedTheme || (osPrefersLight() ? 'light' : 'dark');
  themeToggle.textContent = currentTheme === 'dark' ? 'Light mode' : 'Dark mode';
  themeToggle.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(currentTheme);
    saveTheme(currentTheme);
    themeToggle.textContent = currentTheme === 'dark' ? 'Light mode' : 'Dark mode';
  });
  const headerActions = document.createElement('div');
  headerActions.className = 'header-actions';

  // Everything is autosaved to localStorage, so a page refresh deliberately
  // RESTORES the previous session rather than clearing it. That is the right
  // default (nobody wants to lose a design to a stray F5) but it leaves no
  // way to start a genuinely new experiment -- hence explicit controls.
  // TWO distinct actions, because a first-time user lands on the seeded
  // oregano EXAMPLE study and needs an unambiguous way to plan their own:
  //   "New study"        -> a genuinely blank experiment they fill in
  //   "Reset to example" -> reload the oregano example (undo their edits)
  // Both are confirmed: they are destructive and unrecoverable.
  if (onNewBlank) {
    const newBtn = document.createElement('button');
    newBtn.type = 'button';
    newBtn.className = 'theme-toggle reset-button';
    newBtn.textContent = 'New study';
    newBtn.title = 'Start a blank study of your own (clears the current one)';
    newBtn.addEventListener('click', () => {
      const ok = window.confirm(
        'Start a new, blank study of your own?\n\nThis clears the current experiment (including the example study) and starts from an empty slate. It cannot be undone.'
      );
      if (ok) onNewBlank();
    });
    headerActions.appendChild(newBtn);
  }

  if (onReset) {
    const resetBtn = document.createElement('button');
    resetBtn.type = 'button';
    resetBtn.className = 'theme-toggle reset-button';
    resetBtn.textContent = 'Reset to example';
    // "the example study," not "an empty one" -- core/defaultStudy.js seeds
    // a fresh session with the oregano study's real research question and
    // 4 assays (weakly tagged, freely overwritable). "New study" above is
    // the blank-slate path; this one restores the example.
    resetBtn.title = 'Discard this experiment and reload the example (oregano) study';
    resetBtn.addEventListener('click', () => {
      const ok = window.confirm(
        'Discard the current experiment and reload the example (oregano) study?\n\nThis clears every answer, factor, and naming field. It cannot be undone.'
      );
      if (ok) onReset();
    });
    headerActions.appendChild(resetBtn);
  }

  headerActions.appendChild(themeToggle);
  header.appendChild(headerActions);

  // The assay switcher: ALWAYS visible, not gated on assays.length > 1 --
  // per the plan doc, it is deliberately the permanent home for "add an
  // assay," not just a control that appears once a second one already
  // exists. Lives here (not inside design.js or any step) because a
  // switcher inside a step would re-enter that step's render() from a
  // click handler whose own `main.textContent = ''` just destroyed the very
  // DOM the handler is running in -- shell.js already survives a step
  // change unscathed (see router.onChange below), so an assay switch is
  // just another nav, using a proven contract instead of a new one.
  const switcherBar = document.createElement('div');
  switcherBar.className = 'assay-switcher-bar';
  switcherBar.setAttribute('role', 'tablist');
  switcherBar.setAttribute('aria-label', 'Assays');

  function renderSwitcher(experiment) {
    switcherBar.textContent = '';
    const assays = Array.isArray(experiment.assays) ? experiment.assays : [];

    assays.forEach((assay, index) => {
      const pill = document.createElement('div');
      pill.className = 'assay-pill' + (assay.id === experiment.activeAssayId ? ' active' : '');

      const switchBtn = document.createElement('button');
      switchBtn.type = 'button';
      switchBtn.className = 'assay-pill-label';
      switchBtn.textContent = assay.label || `Assay ${index + 1}`;
      switchBtn.setAttribute('role', 'tab');
      switchBtn.setAttribute('aria-selected', String(assay.id === experiment.activeAssayId));
      switchBtn.addEventListener('click', () => {
        if (assay.id === store.get().activeAssayId) return;
        // Navigation state, not a fact about the experiment -- store.patch,
        // not the provenance-gated store.setPath every field write uses.
        // main.js's own store.subscribe detects this exact change and
        // re-renders whichever step is currently on screen.
        store.patch({ activeAssayId: assay.id });
      });
      pill.appendChild(switchBtn);

      // Deleting the last assay would break every consumer's
      // `assays.length >= 1` assumption -- removeAssay itself refuses, but
      // hiding the control here means there is nothing to click that could
      // ever surface that refusal as a confusing no-op.
      if (assays.length > 1) {
        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'assay-pill-delete';
        deleteBtn.textContent = '×';
        deleteBtn.title = `Delete ${assay.label || `Assay ${index + 1}`}`;
        deleteBtn.addEventListener('click', (event) => {
          event.stopPropagation();
          const ok = window.confirm(
            `Delete "${assay.label || `Assay ${index + 1}`}" and all its design, panel, and naming data?\n\nThis cannot be undone.`
          );
          if (!ok) return;
          const result = removeAssay(store.get(), assay.id);
          if (result) store.patch(result);
        });
        pill.appendChild(deleteBtn);
      }

      switcherBar.appendChild(pill);
    });

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'assay-pill-add';
    addBtn.textContent = '+ Add assay';
    const atCap = assays.length >= MAX_STUDY_ROWS;
    addBtn.disabled = atCap;
    addBtn.title = atCap ? `A study cannot have more than ${MAX_STUDY_ROWS} assays.` : 'Add a new assay';
    addBtn.addEventListener('click', () => {
      const experimentNow = store.get();
      const id = shortId();
      const { assay, provenanceSlotKey, provenanceEntry } = seedAssayFromVocabulary(
        experimentNow.armVocabulary,
        id
      );
      // One atomic patch: the new assay, the active pointer, AND its one
      // provenance slot together -- an assay present in `assays` but
      // missing its slot would let the very first user edit to its seeded
      // arms be misjudged as overwriting nothing (see
      // seedAssayFromVocabulary's own docstring).
      store.patch((state) => ({
        assays: [...state.assays, assay],
        activeAssayId: id,
        provenance: {
          ...state.provenance,
          slots: { ...state.provenance.slots, [provenanceSlotKey]: provenanceEntry },
        },
      }));
    });
    switcherBar.appendChild(addBtn);
  }

  // Redraws on ANY store change, mirroring how the step nav below redraws on
  // any router change -- a rename or vocabulary edit made from the Study
  // step (a different module entirely) still needs the switcher's own
  // labels/pill set to stay current, with no extra plumbing between the two.
  store.subscribe((state) => renderSwitcher(state));
  renderSwitcher(store.get());

  const body = document.createElement('div');
  body.className = 'shell-body';

  const nav = document.createElement('nav');
  nav.className = 'shell-nav';
  nav.setAttribute('aria-label', 'Steps');

  const main = document.createElement('main');
  main.className = 'shell-main';

  body.appendChild(nav);
  body.appendChild(main);

  const status = document.createElement('div');
  status.className = 'shell-status';
  status.setAttribute('role', 'status');

  root.appendChild(header);
  root.appendChild(switcherBar);
  root.appendChild(body);
  root.appendChild(status);

  function renderNav(activeId) {
    nav.textContent = '';
    for (const step of router.steps) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'nav-step' + (step.id === activeId ? ' active' : '');
      btn.textContent = step.title || step.id;
      btn.addEventListener('click', () => router.navigate(step.id));
      nav.appendChild(btn);
    }
  }

  router.onChange((activeId) => renderNav(activeId));
  renderNav(router.current());

  let toastTimer = null;
  function showToast(message) {
    status.textContent = message;
    status.classList.add('visible');
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => status.classList.remove('visible'), 3000);
  }

  return { main, showToast };
}
  // ---- src/ui/advice.js ----
// The advice panel: renders the modality-guidance notes engine/advisor.js
// selects, on any step that mounts one. Shared, not a step -- hence living
// in ui/ rather than ui/steps/.
//
// Deliberately its OWN visual vocabulary, not a reuse of `.issues-list`.
// Not for tone -- for shape: the {field, message, severity} issue record
// flattens to one line and has no room for a title AND a "why", which is
// the entire point of this feature. See docs/plans -- Advisor slice 1,
// Decision 3.
//
// The panel contains ZERO focusable elements. This is load-bearing, not
// cosmetic: it is what makes calling update() on every keystroke safe (no
// focus theft, no cursor jump in whatever field the user is typing in), and
// it is why there is no Dismiss button in this slice -- adding one later
// means revisiting the re-render seam, not just adding a button.
//
// No memoization anywhere in update(): store.patch() rebinds the experiment
// root (core/store.js), so any cached reference to a previous experiment is
// a live bug waiting to fire the moment a caller uses store.patch({}) as a
// notify-only no-op (describe.js does exactly that twice). With a single-
// digit rule count, evaluatePredicate's depth-capped tree walk is free;
// recomputing from scratch on every call is correct, not merely acceptable.


const ADVICE_KIND_LABELS = { pitfall: 'Pitfall', tip: 'Tip' };

// A note answers TWO different questions, and they must not be conflated:
//
//   WHY does this note exist?  -> its `concept` ("spectral spillover",
//     "photobleaching"). Authored content; no predicate encodes it. This is
//     the note's actual reason and the thing a reader needs to recognize.
//   WHEN does it apply?  -> summarizeTrigger(note.when) ("modality is
//     STED"). Derived mechanically from the predicate so it cannot drift.
//     Useful, but strictly secondary -- it only tells you the note is
//     conditional on something you entered rather than shown to everyone.
//
// An earlier version rendered only the second and labelled it "Shown
// because ...", which reads as a reason and is not one: "modality is STED"
// says nothing about why STED warrants the warning.
//
// The RAW predicate text (describePredicate, engine/predicate.js) is a
// THIRD, debug-only tier behind this flag -- mirrors shell.js's THEME_KEY
// pattern, read through a try/catch so a disabled/unavailable localStorage
// degrades to "off" rather than throwing. Unconditionally showing raw
// predicate syntax (`acquisition.modality is one of [...]`) would put
// developer-facing text in front of a scientist for no benefit beyond what
// the two tiers above already give; it stays reserved for whoever is
// authoring or debugging a rule.
const ADVISOR_DEBUG_KEY = 'micronaut.advisorDebug';

function advisorDebugEnabled() {
  try {
    return localStorage.getItem(ADVISOR_DEBUG_KEY) === '1';
  } catch {
    return false;
  }
}

function appendAdviceNote(list, note) {
  const item = document.createElement('div');
  item.className = `advice-note advice-${note.kind}`;

  // Kind ("Pitfall"/"Tip") and concept ("spectral spillover") on one line.
  // The CONCEPT is the note's actual reason for existing and is what makes a
  // list of notes scannable -- you can see at a glance that one is about
  // spillover and another about photobleaching, without reading either body.
  const kind = document.createElement('div');
  kind.className = 'advice-kind';
  const kindLabel = document.createElement('span');
  kindLabel.textContent = ADVICE_KIND_LABELS[note.kind] || note.kind;
  kind.appendChild(kindLabel);
  const concept = document.createElement('span');
  concept.className = 'advice-concept';
  concept.textContent = note.concept;
  kind.appendChild(concept);
  item.appendChild(kind);

  const title = document.createElement('div');
  title.className = 'advice-title';
  title.textContent = note.title;
  item.appendChild(title);

  const body = document.createElement('div');
  body.className = 'advice-body';
  body.textContent = note.body;
  item.appendChild(body);

  // "Applies when ...", NOT "Shown because ..." -- this is the note's
  // APPLICABILITY condition, not its reason. The reason is the concept
  // rendered above. Labelling a trigger condition as a reason is precisely
  // the mistake an earlier version of this file made.
  const trigger = summarizeTrigger(note.when);
  if (trigger) {
    const triggerEl = document.createElement('div');
    triggerEl.className = 'advice-trigger';
    triggerEl.textContent = `Applies when ${trigger}.`;
    item.appendChild(triggerEl);
  }

  if (advisorDebugEnabled()) {
    const reason = document.createElement('div');
    reason.className = 'advice-reason';
    reason.textContent = `shown because: ${describePredicate(note.when)}`;
    item.appendChild(reason);
  }

  list.appendChild(item);
}

/**
 * Build an advice panel scoped to one `surface` ('describe' | 'design' |
 * 'naming'). `advisor` is the loaded rule array from engine/kbpack.js's
 * shapeAppKb -- the SAME array for every panel on every step, since the
 * rules themselves are surface-agnostic content; only the surface filter
 * applied at select time differs per panel.
 *
 * Returns { element, update(experiment) }. Mount `element` once, at render
 * time, in the step's own DOM tree (main.textContent = '' wipes the whole
 * step on every navigation, so there is nothing to persist across renders --
 * a fresh panel is created and mounted every time the step itself renders).
 * Call `update(experiment)` explicitly, with the SAME experiment object the
 * step's own output is rendering from, at every point that experiment
 * could have changed -- there is no store subscription here (see the
 * module-header comment on caching).
 */
function createAdvicePanel(advisor, surface) {
  const section = document.createElement('div');
  section.className = 'advice-section';
  section.hidden = true; // no advice yet -- see update() below

  const heading = document.createElement('div');
  heading.className = 'advice-heading';
  heading.textContent = 'Guidance';
  section.appendChild(heading);

  const list = document.createElement('div');
  list.className = 'advice-list';
  section.appendChild(list);

  function update(experiment) {
    const notes = selectAdvice(advisor, experiment, surface);
    // Hidden rather than merely empty when there is nothing to show -- an
    // empty "Guidance" heading sitting above nothing is dead chrome, and
    // scarcity is what keeps this feature from becoming a cookie banner.
    section.hidden = notes.length === 0;
    list.textContent = '';
    for (const note of notes) {
      appendAdviceNote(list, note);
    }
  }

  return { element: section, update };
}
  // ---- src/ui/steps/describe.js ----

const INTERVIEW_LIMIT = 8;

/**
 * Render a value for display in a proposal row -- markers proposals carry
 * a joined canonical string, everything else is a plain scalar.
 */
function displayValue(value) {
  return value === undefined || value === null ? '' : String(value);
}

// Sentinel <option> value meaning "the user picked Other" -- internal only,
// never written to the store (getValue() below always resolves it to the
// free-text box's actual content, or '' if that box is still empty).
const OTHER_OPTION_VALUE = '__other__';

/**
 * Build the control for a question, pre-filled with `initialValue`. Returns
 * `{element, getValue()}` rather than a bare element: a choice question with
 * `allowOther` composes a <select> + a free-text fallback, and the two need
 * one seam a plain element's native `.value` can't express.
 *
 * Shared by the "ask" list and the "your answers" list so the two can never
 * drift apart -- an editable answer must offer exactly the same choices (and
 * the same Other escape hatch) the original question did, or editing
 * silently becomes a different question.
 */
function buildQuestionControl(question, initialValue) {
  if (question.type === 'choice' || question.type === 'multi') {
    const select = document.createElement('select');
    select.className = 'question-control';
    const blank = document.createElement('option');
    blank.value = '';
    blank.textContent = '-- choose --';
    select.appendChild(blank);
    for (const option of question.options || []) {
      const opt = document.createElement('option');
      opt.value = option;
      opt.textContent = option;
      select.appendChild(opt);
    }

    if (!question.allowOther) {
      if (initialValue !== undefined && initialValue !== null) select.value = initialValue;
      return { element: select, getValue: () => select.value };
    }

    // allowOther: a generic escape hatch for ANY choice question, not
    // special-cased to modality. Picking "Other..." reveals a free-text box;
    // getValue() always resolves through it, never the sentinel itself, so a
    // saved answer is the user's own text, indistinguishable from having
    // typed it into a plain text question.
    const otherOpt = document.createElement('option');
    otherOpt.value = OTHER_OPTION_VALUE;
    otherOpt.textContent = 'Other...';
    select.appendChild(otherOpt);

    const otherInput = document.createElement('input');
    otherInput.type = 'text';
    otherInput.className = 'question-control question-other-input';
    otherInput.placeholder = 'Type it in';
    otherInput.hidden = true;

    function syncOtherVisibility() {
      otherInput.hidden = select.value !== OTHER_OPTION_VALUE;
    }
    select.addEventListener('change', syncOtherVisibility);

    // A previously-saved value that is NOT one of the curated options means
    // the user already typed a custom answer -- reopen as Other with that
    // text prefilled, rather than silently failing to preselect anything
    // (a bare <select>.value = 'unknown option' just leaves it blank).
    if (initialValue !== undefined && initialValue !== null) {
      if ((question.options || []).includes(initialValue)) {
        select.value = initialValue;
      } else {
        select.value = OTHER_OPTION_VALUE;
        otherInput.value = initialValue;
      }
    }
    syncOtherVisibility();

    const wrapper = document.createElement('div');
    wrapper.className = 'question-control-group';
    wrapper.appendChild(select);
    wrapper.appendChild(otherInput);

    return {
      element: wrapper,
      getValue: () => (select.value === OTHER_OPTION_VALUE ? otherInput.value : select.value),
    };
  }

  const input = document.createElement('input');
  input.type = question.type === 'number' ? 'number' : 'text';
  input.className = 'question-control';
  if (initialValue !== undefined && initialValue !== null) {
    input.value = initialValue;
  }
  return { element: input, getValue: () => input.value };
}

/** Coerce a control's raw string back to the question's declared type. */
function coerceAnswer(question, raw) {
  return question.type === 'number' ? Number(raw) : raw;
}

/**
 * The `readout` question (web/kb/questions.json) is the one question that
 * needs a SECOND write alongside its own field: `field: 'readoutText'`
 * stores the user's verbatim pick (curated option or Other free text), and
 * `readout` stores the canonical id engine/controls.js's rules key on --
 * see docs/plans/planner-web-assay-tier.md Decision 5 ("readout is a
 * controlled vocabulary, and 'unknown' is never silence"). This is a
 * one-off special case, not a generic multi-field-question mechanism: no
 * other question needs it, and inventing one for a single caller would be
 * exactly the kind of premature abstraction this codebase avoids elsewhere.
 * Canonicalization happens HERE, at answer time, not as a runtime derivation
 * inside assayView -- core/assay.js is a pure leaf with no KB imports, and
 * this is the one place both the readouts KB and a live write are in scope
 * together.
 */
function writeReadoutCanonicalIfNeeded(store, question, readoutText, tag, assayId, kb) {
  if (question.id !== 'readout') return;
  const canonical = resolveReadoutCanonical(readoutText, kb.readouts) || '';
  const { path, slotKey } = scopeWrite(store.get(), 'readout', assayId);
  store.setPath(path, canonical, tag, { slotKey });
}

function createDescribeStep(kb) {
  const { questions: questionBank, issues: questionIssues } = loadQuestions(kb.questions);
  if (questionIssues.length > 0) {
    // The question bank is committed, curated data -- if it somehow ships
    // broken, fail loudly to the console rather than silently asking fewer
    // questions than intended. Never throws: the interview simply runs with
    // whatever subset of questions DID load.
    console.error('Question bank issues:', questionIssues);
  }

  return {
    id: 'describe',
    title: 'Describe',
    render(main, store, { showToast, advisor } = {}) {
      main.textContent = '';

      // Commit 1 of the assay tier (schema v3): every experiment has
      // exactly one assay and no switcher exists yet, so the active assay
      // never changes for the lifetime of one render -- caching its id once
      // here is safe, matching design.js/naming.js's identical idiom.
      const assayId = store.get().activeAssayId;

      const heading = document.createElement('h1');
      heading.className = 'step-heading';
      heading.textContent = 'Describe what you did';
      main.appendChild(heading);

      const textarea = document.createElement('textarea');
      textarea.className = 'describe-textarea';
      textarea.placeholder =
        'Paste or type a paragraph describing this experiment -- e.g. "Confocal of mouse cortex at 63x, stained with DAPI and Alexa 488, n=3, comparing WT vs KO."';
      textarea.value = store.getPath('narrative.text') || '';
      main.appendChild(textarea);

      const readButton = document.createElement('button');
      readButton.type = 'button';
      readButton.className = 'read-button';
      readButton.textContent = 'Read it';
      main.appendChild(readButton);

      // advisor may be undefined (a caller that hasn't wired it, or a KB
      // that failed to load) -- createAdvicePanel([], ...) is completely
      // inert, not a missing-argument crash. Guidance sits above the
      // Proposals section: something worth knowing before you start
      // answering, not after.
      const advicePanel = createAdvicePanel(advisor || [], 'describe');
      main.appendChild(advicePanel.element);
      function updateAdvice() {
        advicePanel.update(assayView(store.get(), assayId));
      }

      const proposalsHeading = document.createElement('div');
      proposalsHeading.className = 'proposals-heading';
      proposalsHeading.textContent = 'Proposals';
      main.appendChild(proposalsHeading);

      const proposalsList = document.createElement('div');
      proposalsList.className = 'proposals-list';
      main.appendChild(proposalsList);

      const interviewHeading = document.createElement('div');
      interviewHeading.className = 'interview-heading';
      interviewHeading.textContent = 'Questions';
      main.appendChild(interviewHeading);

      const interviewList = document.createElement('div');
      interviewList.className = 'interview-list';
      main.appendChild(interviewList);

      const answeredHeading = document.createElement('div');
      answeredHeading.className = 'interview-heading';
      answeredHeading.textContent = 'Your answers';
      main.appendChild(answeredHeading);

      const answeredList = document.createElement('div');
      answeredList.className = 'interview-list answered-list';
      main.appendChild(answeredList);

      // Proposals are held here (not written to the store) until the user
      // explicitly Accepts one -- a proposal is a suggestion, never applied
      // automatically. This repo has already shipped a silent-auto-apply
      // defect once (the T10 describer-override work); the fix here is
      // structural, not a reminder.
      let pendingProposals = [];

      function renderProposals() {
        proposalsList.textContent = '';
        if (pendingProposals.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'proposals-empty';
          empty.textContent = textarea.value
            ? 'Click "Read it" to scan the paragraph above.'
            : 'Nothing to scan yet.';
          proposalsList.appendChild(empty);
          return;
        }
        for (const proposal of pendingProposals) {
          const row = document.createElement('div');
          row.className = 'proposal-row';

          const text = document.createElement('div');
          text.className = 'proposal-text';
          const valueSpan = document.createElement('strong');
          valueSpan.textContent = displayValue(proposal.value);
          text.appendChild(valueSpan);
          const evidenceSpan = document.createElement('span');
          evidenceSpan.className = 'proposal-evidence';
          // A markers proposal can carry several distinct hits (e.g.
          // ATTO647N + ATTO647) folded into one joined `value` -- show
          // every match's evidence, not just the first, so the user can see
          // what actually justified each part of the proposed value.
          const evidenceText = Array.isArray(proposal.matches)
            ? proposal.matches.map((m) => `"${m.evidence}"`).join(', ')
            : `"${proposal.evidence}"`;
          evidenceSpan.textContent = ` -- from ${evidenceText}`;
          text.appendChild(evidenceSpan);
          row.appendChild(text);

          const actions = document.createElement('div');
          actions.className = 'proposal-actions';

          const acceptBtn = document.createElement('button');
          acceptBtn.type = 'button';
          acceptBtn.className = 'proposal-accept';
          acceptBtn.textContent = 'Accept';
          acceptBtn.addEventListener('click', () => {
            // proposal.path is a v2-shaped path from engine/freetext.js
            // (e.g. 'naming.fields.markers') -- assay-scoped like every
            // question field, so it needs scopeWrite too.
            const { path, slotKey } = scopeWrite(store.get(), proposal.path, assayId);
            const applied = store.setPath(path, proposal.value, proposal.tag, { slotKey });
            pendingProposals = pendingProposals.filter((p) => p !== proposal);
            renderProposals();
            renderInterview();
            renderAnswered();
            // setPath's return value is the ONLY signal that a write was
            // refused (a stronger value already occupies that slot) -- a
            // refused Accept must not look identical to a successful one.
            if (!applied && showToast) {
              showToast(
                `Couldn't apply "${displayValue(proposal.value)}" -- a stronger value is already set there.`
              );
            }
          });
          actions.appendChild(acceptBtn);

          const dismissBtn = document.createElement('button');
          dismissBtn.type = 'button';
          dismissBtn.className = 'proposal-dismiss';
          dismissBtn.textContent = 'Dismiss';
          dismissBtn.addEventListener('click', () => {
            pendingProposals = pendingProposals.filter((p) => p !== proposal);
            renderProposals();
          });
          actions.appendChild(dismissBtn);

          row.appendChild(actions);
          proposalsList.appendChild(row);
        }
      }

      function renderInterview() {
        // Called from both renderInterview and renderAnswered below (they
        // are always called in pairs at every call site today) rather than
        // at each individual call site -- fewer places to maintain, and it
        // stays correct even if a future call site calls only one of the two.
        updateAdvice();
        interviewList.textContent = '';
        // assayView() also carries the study-level provenance.skipped array
        // through unchanged (see core/assay.js's projectProvenance), so
        // nextQuestions' isSkipped check is unaffected by the assay scoping
        // below -- only the per-question field paths need it.
        const askable = nextQuestions(questionBank, assayView(store.get(), assayId), INTERVIEW_LIMIT);
        if (askable.length === 0) {
          const done = document.createElement('p');
          done.className = 'interview-empty';
          done.textContent = 'No more questions right now.';
          interviewList.appendChild(done);
          return;
        }

        for (const question of askable) {
          const row = document.createElement('div');
          row.className = 'question-row';

          const prompt = document.createElement('div');
          prompt.className = 'question-prompt';
          prompt.textContent = question.prompt;
          row.appendChild(prompt);

          const why = document.createElement('div');
          why.className = 'question-why';
          why.textContent = question.why;
          row.appendChild(why);

          const control = buildQuestionControl(question, question.suggestedDefault);
          row.appendChild(control.element);

          const actions = document.createElement('div');
          actions.className = 'question-actions';

          const answerBtn = document.createElement('button');
          answerBtn.type = 'button';
          answerBtn.className = 'question-answer';
          answerBtn.textContent = 'Answer';
          answerBtn.addEventListener('click', () => {
            const raw = control.getValue();
            if (!raw) return;
            const descriptor = recordAnswer(store.get(), question, coerceAnswer(question, raw));
            const { path, slotKey } = scopeWrite(store.get(), descriptor.path, assayId);
            store.setPath(path, descriptor.value, descriptor.tag, { slotKey });
            writeReadoutCanonicalIfNeeded(store, question, descriptor.value, descriptor.tag, assayId, kb);
            renderInterview();
            renderAnswered();
          });
          actions.appendChild(answerBtn);

          const skipBtn = document.createElement('button');
          skipBtn.type = 'button';
          skipBtn.className = 'question-skip';
          skipBtn.textContent = 'Skip';
          skipBtn.addEventListener('click', () => {
            skipQuestion(store.get(), question.id);
            store.patch({}); // no-op patch: triggers notify/autosave for the skip mutation above
            renderInterview();
            renderAnswered();
          });
          actions.appendChild(skipBtn);

          row.appendChild(actions);
          interviewList.appendChild(row);
        }
      }

      /**
       * The review list: everything already answered or skipped, each editable
       * in place. nextQuestions drops a question as soon as its slot goes
       * STRONG, so without this list an answer is write-once and invisible.
       */
      function renderAnswered() {
        updateAdvice(); // see the matching comment in renderInterview above
        answeredList.textContent = '';
        const reviewable = answeredQuestions(questionBank, assayView(store.get(), assayId));
        if (reviewable.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'interview-empty';
          empty.textContent = 'Nothing answered yet.';
          answeredList.appendChild(empty);
          return;
        }

        for (const question of reviewable) {
          const row = document.createElement('div');
          row.className = 'question-row answered-row';

          const prompt = document.createElement('div');
          prompt.className = 'question-prompt';
          prompt.textContent = question.prompt;
          row.appendChild(prompt);

          const current = document.createElement('div');
          current.className = 'question-current';
          current.textContent =
            question.status === 'skipped'
              ? 'Skipped'
              : `Currently: ${displayValue(question.currentValue)}`;
          row.appendChild(current);

          const control = buildQuestionControl(question, question.currentValue);
          row.appendChild(control.element);

          const actions = document.createElement('div');
          actions.className = 'question-actions';

          const saveBtn = document.createElement('button');
          saveBtn.type = 'button';
          saveBtn.className = 'question-answer';
          saveBtn.textContent = question.status === 'skipped' ? 'Answer it' : 'Update';
          saveBtn.addEventListener('click', () => {
            const raw = control.getValue();
            if (!raw) return;
            // A revised answer is 'user_edited' when it overwrites a weaker or
            // provisional value and plain 'user' otherwise -- same rule the
            // naming step uses, so provenance stays consistent no matter which
            // surface the correction was made from.
            const { path, slotKey } = scopeWrite(store.get(), question.field, assayId);
            const existingTag = store.get().provenance?.slots?.[slotKey]?.tag ?? null;
            // Un-skip first: a skipped question being answered here must stop
            // being skipped, or it stays out of the ask list forever.
            unskipQuestion(store.get(), question.id);
            const coerced = coerceAnswer(question, raw);
            const tag = editTagFor(existingTag);
            store.setPath(path, coerced, tag, { slotKey });
            writeReadoutCanonicalIfNeeded(store, question, coerced, tag, assayId, kb);
            renderInterview();
            renderAnswered();
          });
          actions.appendChild(saveBtn);

          // Re-asking clears the answer's STRONG tag by removing the slot, so
          // the question returns to the ask list above rather than lingering
          // here with a value the user no longer stands behind.
          const reaskBtn = document.createElement('button');
          reaskBtn.type = 'button';
          reaskBtn.className = 'question-skip';
          reaskBtn.textContent = 'Ask me again';
          reaskBtn.addEventListener('click', () => {
            const experiment = store.get();
            unskipQuestion(experiment, question.id);
            const { slotKey } = scopeWrite(experiment, question.field, assayId);
            if (experiment.provenance?.slots) {
              delete experiment.provenance.slots[slotKey];
            }
            store.patch({}); // notify/autosave for the in-place mutations above
            renderInterview();
            renderAnswered();
          });
          actions.appendChild(reaskBtn);

          row.appendChild(actions);
          answeredList.appendChild(row);
        }
      }

      textarea.addEventListener('input', () => {
        store.setPath('narrative.text', textarea.value, 'user');
        // narrative.text has no dedicated renderX() of its own -- without
        // this call, a rule keyed on the narrative would never update while
        // the user is actually typing it.
        updateAdvice();
      });

      readButton.addEventListener('click', () => {
        const result = parseFreeText(textarea.value, kb.index);
        pendingProposals = result.proposals;
        renderProposals();
        updateAdvice();
        if (showToast) {
          showToast(
            pendingProposals.length > 0
              ? `Found ${pendingProposals.length} proposal(s) to review.`
              : 'Nothing recognizable found in that text.'
          );
        }
      });

      renderProposals();
      renderInterview();
      renderAnswered();
    },
  };
}

// leading {date}_{modality}_{exptype}_{markers}_{magnification}. Stage 2 is
// what distinguishes THIS file: {group}_{sample}_{biorep}_{techrep}. {notes}

// arms, or no technical replicates (common for SEM/TEM/Raman), omits that
// token entirely rather than padding the name with a placeholder -- see

    markers: 'UNKNOWN',
