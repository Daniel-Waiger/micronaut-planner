<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Micronaut Planner</title>
<style>
/* Micronaut Planner shell styles.
   Palette follows the custom-property + light/dark pattern proven in
   tools/cma-dashboard/index.html: a default :root palette, an
   @media (prefers-color-scheme) override, and explicit
   :root[data-theme="dark"|"light"] overrides so the in-app toggle always
   wins over the OS preference in both directions. */

:root {
  color-scheme: dark;
  --bg: #0d1117;
  --panel: #161b22;
  --panel-2: #1c2128;
  --line: #2a313c;
  --ink: #e6edf3;
  --muted: #8b96a5;
  --accent: #2dd4bf;
  --accent-ink: #04302b;
  --danger: #f87171;
  --warn: #fbbf24;
  --ok: #34d399;
  --mono: ui-monospace, "Cascadia Code", Consolas, "SF Mono", monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f7f9fa;
    --panel: #ffffff;
    --panel-2: #ffffff;
    --line: #dfe4ea;
    --ink: #1a2027;
    --muted: #5b6572;
    --accent: #0f9c8c;
    --accent-ink: #ffffff;
    --danger: #dc2626;
    --warn: #b45309;
    --ok: #059669;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1117;
  --panel: #161b22;
  --panel-2: #1c2128;
  --line: #2a313c;
  --ink: #e6edf3;
  --muted: #8b96a5;
  --accent: #2dd4bf;
  --accent-ink: #04302b;
  --danger: #f87171;
  --warn: #fbbf24;
  --ok: #34d399;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f7f9fa;
  --panel: #ffffff;
  --panel-2: #ffffff;
  --line: #dfe4ea;
  --ink: #1a2027;
  --muted: #5b6572;
  --accent: #0f9c8c;
  --accent-ink: #ffffff;
  --danger: #dc2626;
  --warn: #b45309;
  --ok: #059669;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--sans);
}

#app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.shell-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 22px;
  border-bottom: 1px solid var(--line);
  background: var(--panel-2);
}

.shell-title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.theme-toggle {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}

.theme-toggle:hover {
  border-color: var(--accent);
}

.theme-toggle:focus-visible,
.nav-step:focus-visible,
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.shell-body {
  flex: 1;
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 0;
  min-height: 0;
}

.shell-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 16px 10px;
  border-right: 1px solid var(--line);
  background: var(--panel);
}

.nav-step {
  font: inherit;
  font-size: 14px;
  text-align: left;
  color: var(--muted);
  background: transparent;
  border: none;
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
}

.nav-step:hover {
  background: var(--panel-2);
  color: var(--ink);
}

.nav-step.active {
  background: var(--panel-2);
  color: var(--ink);
  box-shadow: inset 3px 0 0 var(--accent);
}

.shell-main {
  padding: 24px;
  overflow-y: auto;
  min-width: 0;
}

.shell-status {
  position: fixed;
  right: 20px;
  bottom: 20px;
  padding: 10px 16px;
  border-radius: 8px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  font-size: 13px;
  color: var(--ink);
  opacity: 0;
  transform: translateY(6px);
  pointer-events: none;
  transition: opacity 0.15s ease, transform 0.15s ease;
}

.shell-status.visible {
  opacity: 1;
  transform: translateY(0);
}

.step-heading {
  margin: 0 0 20px;
  font-size: 20px;
  font-weight: 600;
}

.naming-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.field-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-size: 12.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}

.field-input {
  font: inherit;
  font-size: 16px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  min-height: 44px;
}

.field-input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* The planned-names table. One row when there is no design (the standalone
   one-off name), N rows when a design is driving it -- same widget, so there
   is no visual mode-switch between "tool box" and "full workflow". */
.planned-box {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 20px;
  margin-bottom: 20px;
}

.planned-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}

.planned-label {
  font-size: 12.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}

.planned-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  /* A large design can plan hundreds of names; scroll the list rather than
     letting it push the field boxes and issues off-screen. */
  max-height: 340px;
  overflow-y: auto;
}

.planned-name {
  font-family: var(--mono);
  font-size: 15px;
  color: var(--accent);
  word-break: break-all;
}

.planned-empty {
  color: var(--muted);
  font-size: 14px;
  margin: 0;
}

.copy-button {
  font: inherit;
  font-size: 13px;
  color: var(--accent-ink);
  background: var(--accent);
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
  margin-left: auto;
}

.copy-button:hover {
  filter: brightness(1.05);
}

.copy-button:disabled {
  opacity: 0.5;
  cursor: default;
  filter: none;
}

/* The advice panel -- deliberately its OWN vocabulary, not a reuse of
   .issue/.issue-warning/.issue-error. Those are validation output; this is
   guidance. --danger/--warn stay reserved for validation alone, so a
   pitfall note is never mistakable for a warning just because it's amber. */
.advice-section {
  margin-bottom: 20px;
}

.advice-heading {
  font-size: 12.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 8px;
}

.advice-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.advice-note {
  border-radius: 8px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  background: var(--panel-2);
}

.advice-pitfall {
  border-left: 3px solid var(--accent);
}

.advice-tip {
  border-left: 3px solid var(--line);
}

.advice-kind {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}

/* The concept -- the phenomenon the note is about. Carries the accent
   colour because it, not the kind label, is what makes a stack of notes
   scannable ("this one is spillover, that one is photobleaching"). */
.advice-concept {
  color: var(--accent);
  font-weight: 600;
}

.advice-concept::before {
  content: "·";
  margin-right: 8px;
  color: var(--line);
  font-weight: 400;
}

.advice-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
}

.advice-body {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.4;
}

/* Visible by default -- a plain-English "why is this showing" clause,
   distinct from .advice-reason below (raw predicate syntax, debug-only). */
.advice-trigger {
  font-size: 12px;
  font-style: italic;
  color: var(--muted);
  margin-top: 6px;
}

.advice-reason {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 6px;
  opacity: 0.7;
}

/* Guidance panel (local-llm-guidance): opt-in "ask about this step".
   Deliberately its own visual vocabulary, one notch quieter than
   .advice-section -- this is a tool the user reaches for, not something
   that pushes itself in front of them the way advisor notes do. */
.guidance-section {
  margin-bottom: 20px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
}

.guidance-heading {
  font-size: 12.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 6px;
}

.guidance-hint {
  font-size: 12.5px;
  color: var(--muted);
  margin: 0 0 10px;
  line-height: 1.4;
}

.guidance-settings {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 13px;
  color: var(--muted);
}

.guidance-endpoint,
.guidance-model,
.guidance-question {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 10px;
}

.guidance-question {
  width: 100%;
  margin-bottom: 8px;
}

.guidance-ask,
.guidance-copy {
  font: inherit;
  font-size: 13px;
  color: var(--accent-ink);
  background: var(--accent);
  border: none;
  border-radius: 6px;
  padding: 6px 14px;
  cursor: pointer;
}

.guidance-ask:disabled {
  opacity: 0.6;
  cursor: default;
}

.guidance-reply {
  margin-top: 10px;
  font-size: 13.5px;
  color: var(--ink);
  line-height: 1.45;
  white-space: pre-wrap;
}

.guidance-paste-label {
  margin-top: 10px;
  font-size: 12px;
  color: var(--muted);
}

.guidance-paste-box {
  width: 100%;
  min-height: 140px;
  margin-top: 4px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px;
}

.draft-button {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 14px;
  margin-left: 8px;
  cursor: pointer;
}

.draft-button:disabled {
  opacity: 0.6;
  cursor: default;
}

/* Phase 1 (chat-LLM round trip): same card idiom as .guidance-section, kept
   as its own block rather than merged with it -- this is always visible
   (unlike guidance-section's Ollama settings), and a shared class would
   couple their visibility by accident. */
.chatllm-section {
  margin: 12px 0 20px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
}

.chatllm-heading {
  font-size: 12.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 6px;
}

.chatllm-hint {
  font-size: 12.5px;
  color: var(--muted);
  margin: 0 0 10px;
  line-height: 1.4;
}

.chatllm-scope,
.chatllm-copy,
.chatllm-target,
.chatllm-read-reply {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
}

.chatllm-copy,
.chatllm-target,
.chatllm-read-reply {
  color: var(--accent-ink);
  background: var(--accent);
  border: none;
  padding: 6px 14px;
  margin-right: 8px;
}

.chatllm-prompt-box,
.chatllm-reply-box {
  display: block;
  width: 100%;
  min-height: 100px;
  margin-top: 10px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px;
}

.chatllm-linkout-label {
  display: block;
  margin-top: 10px;
  font-size: 13px;
  color: var(--muted);
}

/* Deliberately NOT .issue-warning/var(--warn) -- see the .advice-section
   comment above: --warn/--danger stay reserved for validation output, so a
   privacy notice is never mistakable for "something is wrong with your
   data" just because it's the same amber. This is a consequence a user
   should notice, same category as .advice-pitfall, so it borrows THAT
   vocabulary (an accent left-border) instead of inventing a third one. */
.chatllm-linkout-warning {
  margin: 6px 0 0;
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  background: var(--panel-2);
  color: var(--ink);
  font-size: 12px;
  line-height: 1.4;
}

.chatllm-linkout-row {
  margin-top: 8px;
}

.chatllm-reply-label {
  margin-top: 10px;
  font-size: 12px;
  color: var(--muted);
}

.chatllm-repairs,
.chatllm-issues,
.chatllm-asks {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 12.5px;
  line-height: 1.4;
}

.chatllm-repairs p {
  margin: 0;
  color: var(--muted);
  font-style: italic;
}

/* Rows in .chatllm-issues carry .issue/.issue-error from ui/steps/
   describe.js -- this IS validation output (a dropped proposal, a paste
   that failed to parse), the exact category .issue-error already names, so
   it reuses that vocabulary rather than a fourth "amber-ish" style. */

.chatllm-asks p {
  margin: 0;
  padding: 6px 10px;
  border-left: 3px solid var(--line);
  color: var(--ink);
}

/* Which tier proposed a row. The deterministic scan matched literal text the
   user wrote; the model inferred from it. Same list, different warrant, so
   they must not read alike. */
.proposal-source {
  margin-left: 8px;
  padding: 1px 7px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font-size: 11px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}

.proposal-source-llm {
  border-color: var(--accent);
  color: var(--accent);
}

/* Accept is a STRONG write and can replace an existing value, so what would
   be lost is stated before the click, not discovered after it. */
.proposal-replaces {
  margin-top: 4px;
  font-size: 12px;
  color: var(--warn);
}

/* The one thing separating a model's guess from an answer the user gave --
   the control itself is pre-filled in both cases. */
.question-provisional {
  font-size: 12px;
  color: var(--accent);
  margin-bottom: 6px;
}

.issues-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.issue {
  font-size: 13.5px;
  border-radius: 8px;
  padding: 8px 12px;
  border: 1px solid var(--line);
}

.issue-warning {
  color: var(--warn);
  border-color: var(--warn);
}

.issue-error {
  color: var(--danger);
  border-color: var(--danger);
}

/* The Color panel step. .panel-review-banner is deliberately persistent, not
   a dismissible toast -- the content it flags (Claude-drafted spectral
   values) stays true for the lifetime of the page, so a one-time notice
   would stop being accurate the moment it's dismissed. */
.panel-review-banner {
  font-size: 13px;
  color: var(--warn);
  background: var(--panel-2);
  border: 1px solid var(--warn);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 16px;
}

.panel-empty {
  color: var(--muted);
  font-size: 13.5px;
}

.panel-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}

.panel-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 3px solid var(--line);
  border-radius: 8px;
  padding: 10px 14px;
}

.panel-state {
  font-size: 11px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--muted);
  flex: 0 0 auto;
}

/* Per-state accents (Decision 5's five states, never-silent): the state
   label and the row's left border both carry the color, so a panel with a
   mix of states is scannable at a glance without reading every sentence --
   'known' reads as resolved, 'unrecognized' and 'ambiguous-family' read as
   needing the user's attention, 'spectrum-unavailable' reads as a content
   gap (not the user's fault), 'no-intrinsic-spectrum' reads as neutral
   information rather than a problem. */
.panel-row-known {
  border-left-color: var(--ok);
}
.panel-row-known .panel-state {
  color: var(--ok);
}

.panel-row-unrecognized {
  border-left-color: var(--danger);
}
.panel-row-unrecognized .panel-state {
  color: var(--danger);
}

.panel-row-ambiguous-family {
  border-left-color: var(--warn);
}
.panel-row-ambiguous-family .panel-state {
  color: var(--warn);
}

.panel-row-spectrum-unavailable {
  border-left-color: var(--warn);
}
.panel-row-spectrum-unavailable .panel-state {
  color: var(--warn);
}

.panel-row-no-intrinsic-spectrum {
  border-left-color: var(--accent);
}
.panel-row-no-intrinsic-spectrum .panel-state {
  color: var(--accent);
}

.panel-row-text {
  flex: 1 1 260px;
  font-size: 13.5px;
  color: var(--ink);
}

/* Structured channel controls share .panel-row-text with the resolved-text
   spans above, so keep control styling explicitly element-scoped. This also
   prevents native light-theme defaults from producing white fields inside
   the dark panel. */
.panel-channel-main input.panel-row-text,
.panel-channel-main select.panel-row-text {
  min-width: 0;
  min-height: 36px;
  font: inherit;
  font-size: 13.5px;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 9px;
}

.panel-channel-main input.panel-row-text::placeholder {
  color: var(--muted);
  opacity: 1;
}

.panel-channel-main select.panel-row-text option {
  color: var(--ink);
  background: var(--panel);
}

.panel-channel-main input.panel-row-text:focus-visible,
.panel-channel-main select.panel-row-text:focus-visible {
  border-color: var(--accent);
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.panel-channel-main input.panel-row-text:disabled,
.panel-channel-main select.panel-row-text:disabled {
  color: var(--muted);
  background: var(--panel);
  opacity: 0.7;
}

.panel-fluorophore-picker {
  flex: 1 1 300px;
  min-width: min(100%, 260px);
  display: grid;
  gap: 5px;
  color: var(--muted);
}

.panel-fluorophore-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.panel-fluorophore-picker .panel-row-text {
  width: 100%;
  flex: none;
}

.panel-fluorophore-custom[hidden] {
  display: none;
}

.panel-badge {
  font-size: 11px;
  color: var(--warn);
  border: 1px solid var(--warn);
  border-radius: 6px;
  padding: 2px 8px;
  margin-left: auto;
  cursor: default;
}

/* Color-panel patch: per-fluorophore color swatches -- read-only on the
   free-text list above, editable/overridable via a native color picker on
   the structured channel row. */
.panel-color-swatch {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1px solid var(--line);
  flex: 0 0 auto;
  display: inline-block;
}

.panel-color-input {
  width: 30px;
  height: 26px;
  padding: 1px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel-2);
  cursor: pointer;
  flex: 0 0 auto;
}

.panel-color-reset {
  font: inherit;
  font-size: 11px;
  color: var(--muted);
  background: transparent;
  border: none;
  text-decoration: underline;
  cursor: pointer;
  padding: 0;
  flex: 0 0 auto;
}

.panel-color-reset:hover {
  color: var(--ink);
}

.describe-textarea {
  width: 100%;
  min-height: 120px;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  resize: vertical;
  margin-bottom: 12px;
}

.describe-textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.read-button {
  font: inherit;
  font-size: 13px;
  color: var(--accent-ink);

.proposals-heading,

.proposal-row,

.question-row {

}

.proposal-text {

}

.proposal-evidence {

}

.proposal-actions,
.question-actions {

}

.proposal-accept,
.question-answer {

  font-size: 13px;

  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
}

.proposal-dismiss,
.question-skip,
.remove-factor-button {
  font: inherit;
  font-size: 13px;
  color: var(--muted);
  background: var(--panel-2);
  border: 1px solid var(--line);

}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.reset-button:hover {

}

.answered-row {

}

.question-current {

  font-size: 13px;
  color: var(--ok);
}

.question-prompt {
  font-weight: 600;
}

.question-why {
  color: var(--muted);
  font-size: 13px;
}

.question-control {
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  min-width: 220px;
}

/* An allowOther choice question: the <select> and its free-text fallback
   stack as one visual unit rather than reading as two unrelated controls. */
.question-control-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.question-other-input {
  min-width: 220px;
}

.factor-name {
  flex: 1 1 160px;
}

.factor-levels {
  flex: 2 1 260px;
}

.add-factor-button {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 14px;

  margin-bottom: 20px;
}

.condition-summary {
  flex: 1 1 260px;
  font-size: 13.5px;
}

.base-name-box {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 10px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 12px;
}

.base-name-label {
  font-size: 12.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}

.base-name-value {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--ink);
  word-break: break-all;
}

.condition-sample-id {
  font-family: var(--mono);
  color: var(--muted);
  font-size: 13px;
}

.condition-filename {
  font-family: var(--mono);
  color: var(--accent);
  font-size: 13.5px;
  word-break: break-all;
}

@media print {
  .shell-header,
  .assay-switcher-bar,
  .shell-nav,
  .shell-status,
  .overview-actions,
  .overview-assay-benchcard-btn {
    display: none;
  }

  .overview-assay {
    break-inside: avoid;
  }

  /* The map's fills/strokes are theme vars (dark by default); force a plain
     black-on-white rendering for paper so it never prints dark boxes. */
  .study-map,
  .study-map-svg {
    break-inside: avoid;
  }

  .study-map-scroll {
    border-color: #000;
    background: #fff;
    overflow: visible;
  }

  .study-map-box {
    fill: #fff;
    stroke: #000;
  }

  .study-map-node-study .study-map-box {
    fill: #eee;
    stroke: #000;
  }

  .study-map-caption,
  .study-map-value,
  .study-map-node-study .study-map-caption,
  .study-map-node-study .study-map-value {
    fill: #000;
  }

  .study-map-edge {
    stroke: #000;
  }

  .study-map-arrowhead {
    fill: #000;
  }

  .shell-body {
    display: block;
  }

  .shell-main {
    padding: 0;
    overflow: visible;
  }

  body {
    background: #fff;
    color: #000;
  }
}

.assay-pill-add {

.assay-pill-add:hover {

.assay-pill-add:disabled {

.study-divergence {

}

.study-assay-row {

}

.study-assay-row .field-input {

}

.study-assay-basename {

}

/* Grouped and pinned to the row's end (margin-left: auto here, not on each
   button) -- otherwise a button's horizontal position depends on how long
   THIS row's base name happens to be, which reads as buttons "moving"
   between rows as the base name's length varies. */

  gap: 8px;

}

.overview-research-question {

.guide-para {

}

.guide-list {

}

.guide-list li {

}

.guide-deflist {

}

.guide-deflist dt {

.guide-deflist dd {

/* The study map (ui/steps/overview.js buildDiagramSvg over the pure layout
   in engine/render/svgDiagram.js). Themed entirely through the CSS vars so
   it tracks the light/dark toggle; print overrides live in @media print. */
.study-map {

}

.study-map-scroll {

}

.study-map-svg {

}

.study-map-box {

}

.study-map-node-study .study-map-box {

}

.study-map-node-assay .study-map-box {
  stroke: var(--accent);
  stroke-width: 2;
}

.study-map-caption {
  fill: var(--muted);
  font-size: 10px;

}

.study-map-value {
  fill: var(--ink);

}

.study-map-node-study .study-map-caption,
.study-map-node-study .study-map-value {

}

.study-map-edge {

.study-map-arrowhead {

.overview-assay {

.conformance-verdict {

.overview-ladder-body {

.overview-ladder-notes {

.study-assay-actions {

/* Interactive schematic spectral view: isolated because it is a compact
   explanatory graphic rather than a global charting system. Series classes
   pair a color with a dash pattern, and every data element also has a named,
   keyboard-operable visibility control. */
.spectral-view {
  margin: 20px 0;
  min-width: 0;
}

.spectral-view-heading {
  margin: 0 0 4px;
  font-size: 17px;
}

.spectral-view-caption,
.spectral-view-empty {
  max-width: 76ch;
  color: var(--muted);
  font-size: 13px;
  margin: 0 0 12px;
}

.spectral-view-empty {
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 12px;
  background: var(--panel);
}

.spectral-view-chart {
  position: relative;
  width: min(100%, 720px);
}

.spectral-view-svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  font-family: var(--sans);
}

.spectral-view-grid { stroke: var(--line); stroke-width: 1; opacity: 0.72; }
.spectral-view-axis { stroke: var(--ink); stroke-width: 1; opacity: 0.72; }
.spectral-view-tick,
.spectral-view-axis-label { fill: var(--ink); font-size: 12px; font-weight: 550; }
.spectral-view-axis-label { font-size: 12.5px; font-weight: 650; }
.spectral-view-data {
  cursor: pointer;
  opacity: 1;
  transition: opacity 120ms ease;
}
.spectral-view-filter { opacity: 0.2; }
.spectral-view-curve {
  fill: none;
  stroke-width: 3;
  transition: stroke-width 120ms ease, filter 120ms ease;
}
.spectral-view-peak { stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.8; }
.spectral-view-peak-label,
.spectral-view-filter-label {
  font-size: 11.5px;
  font-weight: 750;
  letter-spacing: 0.01em;
  paint-order: stroke fill;
  stroke: var(--panel);
  stroke-width: 4px;
  stroke-linejoin: round;
  pointer-events: none;
}
.spectral-view-peak-value { font-size: 10px; font-weight: 650; }
.spectral-view-filter-label { font-size: 10.5px; }
.spectral-view-data.spectral-view-active .spectral-view-curve {
  stroke-width: 5;
  filter: drop-shadow(0 0 3px currentColor);
}
.spectral-view-data.spectral-view-active .spectral-view-filter {
  opacity: 0.42;
  stroke-width: 2;
}
.spectral-view-data.spectral-view-muted { opacity: 0.2; }
.spectral-view-data.spectral-view-off { opacity: 0.08; }
.spectral-view-data.spectral-view-off.spectral-view-active { opacity: 0.55; }
.spectral-view-data:focus { outline: none; }
.spectral-view-data:focus .spectral-view-curve,
.spectral-view-data:focus .spectral-view-filter {
  filter: drop-shadow(0 0 4px currentColor);
}

.spectral-view-series-0 { color: var(--accent); fill: var(--accent); stroke: var(--accent); stroke-dasharray: none; }
.spectral-view-series-1 { color: var(--warn); fill: var(--warn); stroke: var(--warn); stroke-dasharray: 8 3; }
.spectral-view-series-2 { color: var(--danger); fill: var(--danger); stroke: var(--danger); stroke-dasharray: 3 3; }
.spectral-view-series-3 { color: var(--ok); fill: var(--ok); stroke: var(--ok); stroke-dasharray: 10 3 2 3; }
.spectral-view-series-4 { color: var(--ink); fill: var(--ink); stroke: var(--ink); stroke-dasharray: 1 3; }
.spectral-view-series-5 { color: var(--muted); fill: var(--muted); stroke: var(--muted); stroke-dasharray: 12 3; }
.spectral-view-series-6 { color: var(--accent); fill: var(--accent); stroke: var(--accent); stroke-dasharray: 5 2 1 2; }
.spectral-view-series-7 { color: var(--warn); fill: var(--warn); stroke: var(--warn); stroke-dasharray: 6 4; }

.spectral-view-tooltip {
  position: absolute;
  z-index: 3;
  display: grid;
  gap: 2px;
  width: max-content;
  max-width: min(250px, calc(100% - 16px));
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--ink);
  background: var(--panel-2);
  box-shadow: 0 6px 18px rgb(0 0 0 / 24%);
  font-size: 11.5px;
  line-height: 1.35;
  pointer-events: none;
}

.spectral-view-tooltip[hidden] { display: none; }
.spectral-view-tooltip-name { font-size: 13px; color: var(--ink); }
.spectral-view-tooltip-summary { color: var(--muted); }

.spectral-view-details {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  max-width: 720px;
  margin-top: 8px;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
  border-radius: 7px;
  color: var(--ink);
  background: var(--panel-2);
  font-size: 12.5px;
}

.spectral-view-details-name { color: var(--ink); }
.spectral-view-details-summary { color: var(--muted); }

.spectral-view-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  margin: 10px 0 0;
  padding: 0;
  list-style: none;
}

.spectral-view-legend-item {
  min-width: 0;
}

.spectral-view-legend-button {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  min-width: 0;
  padding: 5px 7px;
  border: 1px solid transparent;
  border-radius: 6px;
  color: var(--ink);
  background: transparent;
  font: inherit;
  font-size: 12px;
  text-align: left;
  cursor: pointer;
  transition: opacity 120ms ease, border-color 120ms ease, background 120ms ease;
}

.spectral-view-legend-button:hover,
.spectral-view-legend-button.spectral-view-active {
  border-color: var(--line);
  background: var(--panel-2);
}

.spectral-view-legend-button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.spectral-view-legend-button.spectral-view-muted { opacity: 0.38; }
.spectral-view-legend-button.spectral-view-off { opacity: 0.5; }
.spectral-view-legend-button.spectral-view-off.spectral-view-active { opacity: 1; }
.spectral-view-legend-text { min-width: 0; }

.spectral-view-legend-state {
  margin-left: auto;
  padding: 1px 6px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink);
  background: var(--panel);
  font-size: 10px;
  font-weight: 700;
}

.spectral-view-legend-sample {
  display: inline-block;
  flex: 0 0 26px;
  height: 0;
  border-top: 3px solid currentColor;
}

.spectral-view-legend-sample.spectral-view-series-1 { border-top-style: dashed; }
.spectral-view-legend-sample.spectral-view-series-2 { border-top-style: dotted; }
.spectral-view-legend-sample.spectral-view-series-3,
.spectral-view-legend-sample.spectral-view-series-5,
.spectral-view-legend-sample.spectral-view-series-6,
.spectral-view-legend-sample.spectral-view-series-7 { border-top-style: dashed; }

.spectral-view-filter-sample {
  width: 18px;
  height: 12px;
  border: 1px solid currentColor;
  background: color-mix(in srgb, currentColor 28%, transparent);
}

@media (max-width: 560px) {
  .spectral-view-svg { min-width: 0; }
  .spectral-view-peak-label { font-size: 9.5px; }
  .spectral-view-filter-label { font-size: 9px; }
  .spectral-view-legend { display: grid; grid-template-columns: 1fr; }
}

/* Structured Color-panel channel controls. The channel order is persisted;
   drag/drop is supplemented by explicit arrow buttons for keyboard users. */
.panel-channel-card {
  display: grid;
  gap: 0;
  border-radius: 8px;
  transition: outline-color 120ms ease, background 120ms ease;
}

.panel-channel-card.panel-channel-drop-target {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* The fluorophore picker stacks a label above its <select> (a taller,
   two-row control), so centering the row on .panel-row's default
   align-items: center leaves every plain single-row control (drag handle,
   target/conjugation inputs, color controls, move/remove buttons) floating
   above the picker's actual select box instead of lining up with it.
   Bottom-align the row so every control's baseline matches the picker's
   select baseline; the small round color swatch/picker/reset stay
   self-centered since bottom-aligning a 16-26px control against much taller
   siblings would read as its own, different kind of offset. */
.panel-channel-main {
  border-radius: 8px 8px 0 0;
  align-items: flex-end;
}

.panel-color-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 36px; /* matches .panel-channel-main input/select's min-height */
  flex: 0 0 auto;
}

.panel-channel-drag {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px 8px;
  color: var(--muted);
  background: var(--panel-2);
  cursor: grab;
  font: inherit;
}

.panel-channel-drag:active { cursor: grabbing; }

.panel-channel-moves {
  display: inline-flex;
  gap: 4px;
}

.panel-channel-move {
  font-size: 14px;
  line-height: 1;
}

.panel-channel-move:disabled {
  opacity: 0.35;
  cursor: default;
}

.panel-filter-row {
  display: grid;
  grid-template-columns: minmax(140px, 190px) minmax(140px, 190px) minmax(180px, 1fr);
  gap: 10px;
  align-items: end;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-top: 0;
  border-radius: 0 0 8px 8px;
  background: var(--panel-2);
}

.panel-filter-field {
  display: grid;
  gap: 3px;
  color: var(--muted);
  font-size: 11px;
}

.panel-filter-field input {
  min-width: 0;
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
  color: var(--ink);
  background: var(--panel);
  font: inherit;
  font-size: 13px;
}

/* Each .panel-filter-field stacks a label above its input (a taller,
   two-row control, same shape as the fluorophore picker's own label+select
   -- see .panel-channel-main's CSS comment). Centering the hint on the
   row's default align-items: end would still center it against that TALL
   field's full height, leaving it above the input boxes instead of level
   with them -- bottom-align it like every other row control instead. */
.panel-filter-hint {
  align-self: end;
  color: var(--muted);
  font-size: 11.5px;
}

@media (max-width: 700px) {
  .panel-filter-row { grid-template-columns: 1fr 1fr; }
  .panel-filter-hint { grid-column: 1 / -1; }
}

@media (max-width: 440px) {
  .panel-filter-row { grid-template-columns: 1fr; }
  .panel-filter-hint { grid-column: auto; }
}

</style>

<script>
globalThis.__MICRONAUT_KB__ = {"advisor":{"rules":[{"body":"The depletion beam deposits far more energy per pixel than excitation alone, so a dye that looks bright on a confocal can bleach within a few STED frames. ATTO 647N and Abberior STAR dyes hold up; many Alexa dyes do not.","concept":"photobleaching","id":"sted-photostability","kind":"pitfall","priority":10,"surfaces":["describe","naming"],"title":"STED bleaches far faster than confocal -- pick dyes for photostability, not brightness","when":{"in":["acquisition.modality",["STED"]]}},{"body":"STED resolution is roughly 30-80 nm depending on depletion power and dye, well below a typical confocal pixel size. If the pixel size isn't set to Nyquist-sample that resolution, the extra resolution never reaches the data.","concept":"undersampling","id":"sted-pixel-nyquist","kind":"tip","priority":20,"surfaces":["design"],"title":"Undersampling throws away the resolution STED is buying you","when":{"in":["acquisition.modality",["STED"]]}},{"body":"A mismatched refractive index between the mounting medium and the objective's immersion oil introduces spherical aberration that visibly degrades STED resolution with depth. Use a high-RI, low-photobleaching mountant and a #1.5H coverslip with a high-NA oil objective.","concept":"spherical aberration","id":"sted-mounting","kind":"tip","priority":30,"surfaces":["describe"],"title":"Mounting medium and coverslip thickness matter more for STED than for confocal","when":{"in":["acquisition.modality",["STED"]]}},{"body":"The default pinhole size of 1 Airy Unit balances signal and out-of-focus light rejection. Opening it gathers more signal from a dim sample but lets in more out-of-focus blur, directly reducing your optical sectioning.","concept":"optical sectioning","id":"confocal-pinhole","kind":"tip","priority":10,"surfaces":["design"],"title":"Opening the pinhole trades optical sectioning for signal -- state it deliberately","when":{"in":["acquisition.modality",["confocal"]]}},{"body":"An undersampled pixel size throws away real optical resolution regardless of how good the objective is. The correct step size depends on numerical aperture and emission wavelength -- most acquisition software has a Nyquist calculator built in.","concept":"undersampling","id":"confocal-nyquist","kind":"tip","priority":20,"surfaces":["design"],"title":"Check your pixel size against Nyquist sampling before you commit to a design","when":{"in":["acquisition.modality",["confocal"]]}},{"body":"Simultaneous multi-laser scanning is faster but lets bleed-through between channels with overlapping emission masquerade as real colocalization. If your markers' emission spectra overlap, scan sequentially, one laser line at a time.","concept":"spectral spillover","id":"confocal-sequential-scanning","kind":"pitfall","priority":30,"surfaces":["design","panel"],"title":"Overlapping emission spectra need sequential scanning, not simultaneous","when":{"in":["acquisition.modality",["confocal"]]}},{"body":"Out-of-focus light from every plane in the sample reaches the detector at once, since there is no pinhole to reject it. For anything much thicker than a monolayer, plan on deconvolution afterwards or switch to confocal or spinning-disk.","concept":"out-of-focus blur","id":"widefield-thick-sample-blur","kind":"pitfall","priority":10,"surfaces":["describe"],"title":"Widefield has no optical sectioning -- thick samples come out blurred","when":{"in":["acquisition.modality",["widefield"]]}},{"body":"Confocal's laser scanning delivers a much higher instantaneous light dose per pixel than widefield's wide-field illumination. For dim, photosensitive, or fast live-cell work, widefield's lower phototoxicity and higher frame rate can outperform confocal despite the missing optical sectioning.","concept":"phototoxicity","id":"widefield-live-cell-strength","kind":"tip","priority":20,"surfaces":["describe"],"title":"Widefield is often the RIGHT choice for dim or photosensitive live samples","when":{"in":["acquisition.modality",["widefield"]]}},{"body":"A mismatch between the sample, the mounting medium, and the chamber liquid shows up as visible smearing or striping in the data, not a subtle loss of quality. Confirm your clearing or mounting protocol actually matches the refractive index your instrument expects.","concept":"refractive-index mismatch","id":"lightsheet-refractive-index-matching","kind":"pitfall","priority":10,"surfaces":["describe"],"title":"Light-sheet imaging lives or dies on refractive-index matching","when":{"in":["acquisition.modality",["light-sheet"]]}},{"body":"Multi-view and multi-timepoint acquisition at light-sheet speeds generates data volumes that catch people off guard. Plan storage and downstream compute (registration, fusion, deconvolution) before the acquisition, not after the disk fills up.","concept":"data volume","id":"lightsheet-data-volume","kind":"tip","priority":20,"surfaces":["design"],"title":"Light-sheet datasets are routinely hundreds of GB to TB per sample","when":{"in":["acquisition.modality",["light-sheet"]]}},{"body":"Anything strongly absorbing or scattering in the light path (pigment, dense tissue, bubbles) casts a stripe artifact behind it when illuminated from one side. Dual-side illumination or pivot scanning removes most of it if your instrument supports either.","concept":"shadow striping","id":"lightsheet-shadow-stripes","kind":"tip","priority":30,"surfaces":["describe"],"title":"Single-sided illumination casts shadow stripes behind absorbing structures","when":{"in":["acquisition.modality",["light-sheet"]]}},{"body":"There is no fluorescence channel to name in electron microscopy. The MARKERS field is the right place for the contrast or staining agent instead -- uranyl acetate, osmium tetroxide, or immunogold, for example.","concept":"contrast agents","id":"em-markers-are-contrast-agents","kind":"tip","priority":10,"surfaces":["naming"],"title":"For SEM/TEM, MARKERS means contrast agents, not fluorophores","when":{"in":["acquisition.modality",["SEM","TEM"]]}},{"body":"Electron microscopy sample prep frequently produces one usable block or grid per condition rather than the parallel biological replicates a light-microscopy design assumes. Leave the replicate fields blank rather than forcing a count that doesn't reflect anything real.","concept":"replicate structure","id":"em-replicates-often-dont-apply","kind":"tip","priority":20,"surfaces":["design","naming"],"title":"SEM/TEM samples often don't have the usual biological/technical replicate structure","when":{"in":["acquisition.modality",["SEM","TEM"]]}},{"body":"SEM charging artifacts trace back to coating thickness and conductivity, and TEM contrast and resolution trace back to section thickness. Both are easy to forget to note once you're looking at finished micrographs -- record them while prepping, not after.","concept":"sample preparation","id":"em-prep-affects-image-quality","kind":"tip","priority":30,"surfaces":["describe"],"title":"Conductive coating and section thickness shape image quality as much as the microscope does","when":{"in":["acquisition.modality",["SEM","TEM"]]}},{"body":"There is no fluorophore panel to plan around, since Raman reads intrinsic vibrational signatures. In exchange, acquisition is slow -- seconds to minutes per spectrum or map point -- so scan area and point density become the real design tradeoff.","concept":"acquisition time","id":"raman-label-free-tradeoff","kind":"tip","priority":10,"surfaces":["describe"],"title":"Raman is label-free, but that speed cost shows up in acquisition time","when":{"in":["acquisition.modality",["Raman"]]}},{"body":"A stronger signal-to-noise ratio comes at the cost of local heating, which can damage biological or otherwise photosensitive material well before it's visibly obvious. Start at low power, check for damage, and only raise it once you've confirmed the sample tolerates it.","concept":"sample damage","id":"raman-laser-power-vs-damage","kind":"pitfall","priority":20,"surfaces":["design"],"title":"Higher Raman laser power improves signal but risks local heating and sample damage","when":{"in":["acquisition.modality",["Raman"]]}},{"body":"As a rule of thumb (not a strict requirement), sample at roughly 2 to 3 times finer than the smallest feature that matters -- Nyquist sampling. A common practical figure is about 2.3x the feature size, since the true optical resolution of a system is rarely known exactly at acquisition time. Undersampling throws away detail the optics can actually deliver; oversampling mostly costs storage and time.","concept":"undersampling","id":"smallest-feature-pixel-size","kind":"tip","priority":15,"surfaces":["describe","design"],"title":"Set your pixel size from the smallest feature you need to resolve, not the other way around","when":{"exists":"acquisition.smallestFeatureNm"}}],"version":1},"controls":{"rules":[{"id":"panel-unstained-control","kind":"panel","priority":10,"title":"Unstained / autofluorescence control","when":{"eq":["panel.derived.hasMarkersDeclared",true]},"why":"Fixed tissue and many cell types autofluoresce, especially in the green channel. Without an unstained sample imaged at the same settings, you cannot tell whether a dim signal is real stain or background autofluorescence."},{"id":"panel-single-stain-controls","kind":"panel","priority":20,"title":"Single-stain controls (one channel at a time)","when":{"all":[{"eq":["panel.derived.hasMarkersDeclared",true]},{"gt":["panel.derived.fluorophoreCount",1]}]},"why":"When two or more fluorophores are imaged together, their emission spectra can overlap (spectral spillover/bleed-through). A sample stained with only ONE of the fluorophores, imaged on every channel, is what lets you tell real co-localization apart from spillover before you trust a multi-channel image."},{"id":"panel-fmo-control","kind":"panel","priority":25,"title":"Fluorescence-minus-one (FMO) controls","when":{"all":[{"eq":["panel.derived.hasMarkersDeclared",true]},{"gt":["panel.derived.fluorophoreCount",2]}]},"why":"Once a panel passes about three colors, spectral spillover from every OTHER channel can shift where a real positive/negative boundary sits on a given channel -- a single-stain control alone does not show you that shifted boundary. An FMO sample (every fluorophore except the one you're gating on) does: it reproduces the real spillover background, so the gate you draw on the full panel is honest."},{"id":"panel-secondary-only-control","kind":"panel","priority":30,"title":"Secondary-antibody-only control","when":{"all":[{"eq":["panel.derived.hasMarkersDeclared",true]},{"eq":["panel.derived.hasAntibody",true]}]},"why":"For indirect immunofluorescence (primary antibody + fluorophore-conjugated secondary), the secondary can bind nonspecifically or the sample can autofluoresce at the secondary's wavelength. Omitting the primary but keeping the secondary isolates that background from real signal."},{"id":"panel-isotype-control","kind":"panel","priority":40,"title":"Isotype control","when":{"all":[{"eq":["panel.derived.hasMarkersDeclared",true]},{"eq":["panel.derived.hasAntibody",true]}]},"why":"A primary antibody of the same host species and isotype but with no specificity for your target tests whether staining comes from genuine target binding or nonspecific antibody binding (e.g. Fc receptor binding)."},{"id":"panel-antibody-specificity-control","kind":"panel","priority":41,"title":"Biological specificity control","when":{"all":[{"eq":["panel.derived.hasMarkersDeclared",true]},{"eq":["panel.derived.hasAntibody",true]}]},"why":"An isotype control rules out nonspecific ANTIBODY binding, but not whether the primary itself is truly specific to your intended target. A blocking-peptide competition, a knockdown/knockout of the target, or a known-negative sample/tissue confirms the signal tracks the biology, not just the reagent."},{"id":"viability-heat-killed-control","kind":"readout","priority":50,"title":"Heat-killed (dead) control","when":{"eq":["readout","bacterial-viability"]},"why":"SYTO9/PI viability staining reports percent-dead relative to a maximum-death reference. A heat-killed (or otherwise fully-killed) aliquot of the same culture, imaged the same way, calibrates the PI-positive gate -- without it, 'percent dead' has no anchor and drifts between imaging sessions."},{"id":"ros-positive-control","kind":"readout","priority":60,"title":"H2O2-treated positive control","when":{"eq":["readout","ros"]},"why":"A hydrogen-peroxide-treated sample gives DCF a known, strong oxidative signal, confirming the probe is loading and responding before you trust a subtler biological ROS increase."},{"id":"ros-negative-control","kind":"readout","priority":61,"title":"NAC-treated (antioxidant) negative control","when":{"eq":["readout","ros"]},"why":"N-acetylcysteine scavenges reactive oxygen species and should suppress the DCF signal. If it doesn't, the assay's readout may not actually be tracking oxidative stress in this experiment."},{"id":"cytoskeleton-untreated-reference","kind":"readout","priority":70,"title":"Untreated / vehicle reference","when":{"eq":["readout","macrophage-cytoskeleton"]},"why":"Phalloidin staining shows the actin architecture at a moment in time, which only means something in comparison to an untreated or vehicle-only baseline imaged under identical settings -- otherwise there is nothing to say the treated cytoskeleton changed."},{"id":"migration-baseline-reference","kind":"readout","priority":80,"title":"t=0 scratch reference image","when":{"eq":["readout","scratch-migration"]},"why":"Migration/closure is measured as a change in the wound area over time, so every scratch needs its own t=0 image taken immediately after scratching, before any of that area can already have started closing."},{"id":"migration-proliferation-control","kind":"readout","priority":81,"title":"Mitomycin C proliferation-blocked control","when":{"eq":["readout","scratch-migration"]},"why":"A scratch can close by cells migrating in OR by cells proliferating into the gap. Without a mitomycin-C-treated (proliferation-blocked) control closing more slowly, migration and proliferation are confounded and the assay cannot tell you which one you measured."}],"version":1},"markers":{"ambiguousInFreeText":["cerulean","citrine","clip","dir","emerald","halo","snap","tomato","venus"],"markers":{"7AAD":{"aliases":["7 aad","7-aad","7-aminoactinomycin d","7aad"],"class":"stain","freeTextAliases":["7 aad","7-aad","7-aminoactinomycin d","7aad"],"isFamily":false,"variants":[]},"ALEXA350":{"aliases":["af350","alexa 350","alexa fluor 350","alexa350"],"class":"dye","freeTextAliases":["af350","alexa 350","alexa fluor 350","alexa350"],"isFamily":false,"variants":[]},"ALEXA405":{"aliases":["af405","alexa 405","alexa fluor 405","alexa405"],"class":"dye","freeTextAliases":["af405","alexa 405","alexa fluor 405","alexa405"],"isFamily":false,"variants":[]},"ALEXA430":{"aliases":["af430","alexa 430","alexa fluor 430","alexa430"],"class":"dye","freeTextAliases":["af430","alexa 430","alexa fluor 430","alexa430"],"isFamily":false,"variants":[]},"ALEXA488":{"aliases":["af488","alexa 488","alexa fluor 488","alexa488"],"class":"dye","freeTextAliases":["af488","alexa 488","alexa fluor 488","alexa488"],"isFamily":false,"variants":[]},"ALEXA514":{"aliases":["af514","alexa 514","alexa fluor 514","alexa514"],"class":"dye","freeTextAliases":["af514","alexa 514","alexa fluor 514","alexa514"],"isFamily":false,"variants":[]},"ALEXA532":{"aliases":["af532","alexa 532","alexa fluor 532","alexa532"],"class":"dye","freeTextAliases":["af532","alexa 532","alexa fluor 532","alexa532"],"isFamily":false,"variants":[]},"ALEXA546":{"aliases":["af546","alexa 546","alexa fluor 546","alexa546"],"class":"dye","freeTextAliases":["af546","alexa 546","alexa fluor 546","alexa546"],"isFamily":false,"variants":[]},"ALEXA555":{"aliases":["af555","alexa 555","alexa fluor 555","alexa555"],"class":"dye","fre ce. Excitation proximity is secondary (warning-severity): standard laser lines are spaced 40-100+ nm apart specifically so one line excites one dye class. Each fluorophore now also carries its own emissionFwhmNm (claude-drafted, class-based: e.g. BODIPY dyes are famously narrow, PI/DRAQ5/7AAD/EthD-1/DAPI/Hoechst famously broad/red-tailed once DNA-bound) so the explanatory plot's curve widths differ by fluorophore instead of sharing one shape; schematicEmissionFwhmNm remains the fallback for any fluorophore that somehow lacks one. Neither is a measured spectrum -- still not a quantitative spillover integral.","reviewStatus":"claude-drafted","schematicEmissionFwhmNm":50},"version":1},"stages":{"rules":[{"id":"pilot-sted-on-confocal-first","note":"STED sessions are slower, more bleach-prone, and typically shared-instrument time -- pilot your staining, dye choice, and mounting on a confocal first, then move to STED only once the biology and the sample prep are already validated.","priority":10,"stage":"pilot","when":{"eq":["acquisition.modality","STED"]}},{"id":"pilot-light-sheet-mounting","note":"Light-sheet imaging usually requires specific sample mounting or clearing that a standard confocal prep does not need -- confirm your mounting protocol is compatible before the first real light-sheet session, ideally by checking it under a confocal first.","priority":10,"stage":"pilot","when":{"eq":["acquisition.modality","light-sheet"]}},{"id":"pilot-em-fixation-irreversible","note":"EM fixation and processing are destructive and irreversible -- a failed fixation protocol destroys the sample it was tested on. Pilot the fixation protocol on a spare or lower-value sample, and confirm the biology looks right under light microscopy first, before committing your real samples to EM processing.","priority":10,"stage":"pilot","when":{"in":["acquisition.modality",["SEM","TEM"]]}},{"id":"validate-viability-heat-killed-first","note":"Before imaging the full sample set, confirm the heat-killed control actually reads as fully PI-positive at your chosen settings -- if it doesn't, the viability gate is miscalibrated and every subsequent sample's percent-dead is unreliable.","priority":20,"stage":"validate-controls","when":{"eq":["readout","bacterial-viability"]}},{"id":"validate-migration-mitomycin-first","note":"Confirm the mitomycin-C-treated control actually shows slower closure than the untreated scratch in your pilot -- if it doesn't block proliferation as expected at your chosen dose, migration and proliferation stay confounded in the full study too.","priority":20,"stage":"validate-controls","when":{"eq":["readout","scratch-migration"]}},{"id":"acquisition-ros-photobleaching-budget","note":"ROS-sensitive probes like DCF are photolabile, and the excitation light itself can generate additional ROS -- fix laser power and exposure to the lowest setting that gives usable signal in the pilot, and use identical settings for every sample so the readout reflects biology, not variable photo-induced signal.","priority":20,"stage":"acquisition-settings","when":{"eq":["readout","ros"]}}],"stages":[{"body":"State the research question in one sentence, name the readout you are actually measuring (viability, cytoskeleton, ROS, migration -- whatever it is for this assay), and identify one modality you could reasonably run tomorrow, on equipment you already have access to. Everything below builds on committing to those three things first.","id":"idea","order":10,"title":"Idea & feasibility"},{"body":"Run a small pilot (n=1-2) on the cheapest, simplest microscope that can plausibly answer the question, before booking time on an advanced or shared instrument. A pilot's job is to catch a broken protocol or a wrong assumption while it is still cheap to fix.","id":"pilot","order":20,"title":"Pilot on the simplest sufficient scope"},{"body":"Run every control this assay needs (see the Controls section above) on the pilot samples, and confirm each one behaves as expected -- a heat-killed control should read as dead, an isotype control should read as background -- before spending time imaging the full sample set. A control that fails to behave as expected invalidates every sample imaged before it is fixed.","id":"validate-controls","order":30,"title":"Validate your controls"},{"body":"Lock exposure, gain, laser power, and pinhole size from the pilot data, then keep them fixed for every subsequent acquisition -- changing settings mid-study makes samples incomparable. Use the pilot's own variance to judge whether the planned number of biological replicates is enough to see the effect you are looking for, before committing to the full n.","id":"acquisition-settings","order":40,"title":"Fix acquisition settings & power the design"},{"body":"Once the pilot, the controls, and the acquisition settings are all locked, move to the advanced or specialized modality the study actually calls for (STED, light-sheet, EM) if one is needed -- not before, since advanced-instrument time is the most expensive place to discover a protocol problem.","id":"advanced-modality","order":50,"title":"Move to advanced or specialized microscopy"}],"version":1}};

<script>
(function () {
'use strict';
  // ---- src/core/assay.js ----
// The assay tier (schema v3): a study holds many assays, each an almost-
// complete v2 Experiment slice (specimen/design/panel/acquisition/controls/
// naming.fields). This module is the ONLY place that knows assays exist.
//
// Every engine module (predicate.js, conditions.js, plan.js, interview.js,
// validation.js, naming.js) and every KB file (advisor.json, questions.json)
// stays written against the FLAT v2 shape forever. assayView() builds a
// synthetic flat experiment from the active assay so those consumers never
// have to change; scopeWrite() translates a flat-shaped write into the real
// nested location. If a change to this design ever needs a file under
// web/src/engine/ to learn the word "assay", the abstraction has failed.
//
// Why not compose reads from a shared study-level axis (e.g. arms) into
// each assay? Tried and rejected -- see docs/plans (Advisor... the assay
// tier plan), Decision 1. A composed axis can never be MISSING from an
// assay, which makes "flag an assay with no groups" uncomputable. Per-assay
// data, seeded from a study-level VOCABULARY at creation time as a real,
// weak-tagged write, keeps that check possible while still making the
// common case (every assay uses the same arms) a one-click "apply to all".
//
// Pure module: no DOM, no store, no imports at all -- a true leaf.

// The v2 roots that move under each assay. `naming.fields` moves too but is
// handled separately below (naming.template/plannedNames stay study-level,
// so it isn't a whole top-level root).
const ASSAY_SCOPED_ROOTS = new Set(['specimen', 'design', 'panel', 'acquisition', 'controls']);

// Scalar fields that live DIRECTLY on the assay object rather than inside one
// of the container roots above -- 'label' (commit 2's rename), 'readout'/
// 'readoutText' (reserved on emptyAssay below for commit 3, not yet wired
// into assayView). Without this set, scopeWrite('label', assayId) falls
// through isAssayScopedPath as study-level and writes into a PHANTOM
// experiment.label at the study root -- setPath auto-vivifies a missing root
// on write with no error, exactly the hazard this module's header warns
// about, just for a path shape commit 1 never had to write to. Solved for all
// three scalar fields now so commit 3 does not have to revisit this
// predicate a second time.
const ASSAY_SCALAR_FIELDS = new Set(['label', 'readout', 'readoutText']);

// Matches the bare container ('naming.fields' itself, e.g. a future bulk
// write) AND any leaf beneath it ('naming.fields.sample'). Missing the bare
// case used to mean scopeWrite(exp, 'naming.fields', id) fell through as
// study-level and landed in a phantom naming.fields object at the study
// root -- exactly the auto-vivify-on-write hazard this module exists to
// prevent, just for the one scoped path that isn't a whole top-level root.
function isNamingFieldPath(path) {
  return typeof path === 'string' && (path === 'naming.fields' || path.startsWith('naming.fields.'));
}

/**
 * True if `path` addresses something that lives on an assay rather than the
 * study. Exported so every caller that needs this predicate -- scopeWrite
 * below, and schema.js's migration-time provenance rescoping -- shares the
 * ONE implementation. Two copies of this exact check once nearly happened
 * (see git history); a KB path's scoping and a migrated slot's scoping
 * disagreeing would be the same two-renderings-of-one-fact defect this
 * project has already shipped twice (lessons 49, 50).
 */
function isAssayScopedPath(path) {
  const root = typeof path === 'string' ? path.split(/[.[]/)[0] : '';
  return ASSAY_SCOPED_ROOTS.has(root) || ASSAY_SCALAR_FIELDS.has(root) || isNamingFieldPath(path);
}

/** A brand-new assay, empty except for its stable id. Mirrors the v2 slice of emptyExperiment() exactly -- see schema.js. */
function emptyAssay(id) {
  return {
    id,
    label: '',
    // readout/readoutText and the controls tier that reads them are
    // deliberately NOT wired into assayView below -- commit 1 (this module)
    // ships before web/kb/readouts.json exists. The fields are real schema,
    // just not yet consumed anywhere.
    readout: '',
    readoutText: '',
    specimen: { organism: '', sampleType: '', preparation: '', notes: '' },
    design: {
      groups: { levels: [] },
      factors: [],
      biologicalReplicates: null,
      technicalReplicates: null,
      idScheme: '',
      conditions: [],
    },
    panel: { targets: [], channels: [] },
    acquisition: {
      instrument: '',
      objective: '',
      magnification: '',
      modality: '',
      smallestFeatureNm: null,
      settings: {},
    },
    controls: { positive: [], negative: [], notes: '' },
    naming: { fields: {} },
  };
}

/**
 * The ARRAY INDEX of the assay with this id, or -1. The one place index
 * lookup happens -- every other function in this module and every caller
 * elsewhere should go through this or assayById, never `experiment.assays[n]`
 * with a hand-computed n. A stale/wrong index silently writes into or reads
 * from the wrong assay's data with no error (verified: setPath on an
 * out-of-range array index pads the array with null holes that survive a
 * JSON round-trip).
 */
function assayIndexById(experiment, assayId) {
  const assays = experiment && Array.isArray(experiment.assays) ? experiment.assays : [];
  return assays.findIndex((a) => a && a.id === assayId);
}

function assayById(experiment, assayId) {
  const index = assayIndexById(experiment, assayId);
  return index === -1 ? undefined : experiment.assays[index];
}

/** The first assay's id, or undefined for a malformed/empty experiment. Every real experiment has assays.length >= 1 by construction (schema.js), so this is only ever undefined for bad input. */
function firstAssayId(experiment) {
  const assays = experiment && Array.isArray(experiment.assays) ? experiment.assays : [];
  return assays.length > 0 ? assays[0].id : undefined;
}

/**
 * Project a v3 provenance record down to the slots ONE assay can see, with
 * assay-scoped keys stripped back to their bare v2-shaped form.
 *
 * A v3 slot key is either `assay:<id>.<path>` (written by a scoped field --
 * see scopeWrite) or a bare study-level path (narrative.text, and so on).
 * For the requested assay, a scoped key becomes the bare path
 * interview.js/describe.js already know how to look up; a DIFFERENT assay's
 * scoped key is dropped entirely, not merely left prefixed -- if it were
 * left in under its full key, a study-level bare-path collision could never
 * happen, but neither could interview.js ever find it (it looks up by the
 * bare field path), so keeping it would be dead weight, not a hazard. Still:
 * drop it explicitly rather than relying on that, since "unreachable" and
 * "provably safe" are not the same claim.
 */
function projectProvenance(provenance, assayId) {
  const src = provenance && typeof provenance === 'object' ? provenance : {};
  const slots = src.slots && typeof src.slots === 'object' ? src.slots : {};
  const prefix = `assay:${assayId}.`;
  const next = {};
  for (const [key, slot] of Object.entries(slots)) {
    if (key.startsWith('assay:')) {
      if (key.startsWith(prefix)) next[key.slice(prefix.length)] = slot;
      // else: another assay's slot -- not visible from this view.
    } else {
      next[key] = slot; // study-level, e.g. narrative.text
    }
  }
  return {
    slots: next,
    unanswered: Array.isArray(src.unanswered) ? src.unanswered : [],
    skipped: Array.isArray(src.skipped) ? src.skipped : [],
  };
}

/**
 * Build a SYNTHETIC FLAT experiment: `assayId`'s scoped slices hoisted to
 * the top level, exactly where every v2-shaped consumer already looks --
 * engine/predicate.js, engine/conditions.js, engine/plan.js,
 * engine/interview.js, engine/validation.js, and every web/kb/*.json path.
 *
 * Fields are enumerated explicitly, not spread, matching this codebase's
 * standing discipline (loadQuestions/loadAdvisorRules build whitelists
 * rather than spreading a raw object) -- a future v3 key added to
 * emptyExperiment() without a matching line here is a visible gap in this
 * function, not a silent leak through a spread.

 * `readout`/`readoutText` are wired in as of commit 3 (web/kb/readouts.json,
 * engine/controls.js) -- commit 1's header comment said these were
 * deliberately NOT included yet; they are now, verbatim from the assay, no
 * KB logic here (this module stays a leaf; canonicalization happens in
 * ui/steps/describe.js at answer time, where the readouts KB is available).

 */
function assayView(experiment, assayId) {
  const exp = experiment && typeof experiment === 'object' ? experiment : {};
  const assay = assayById(exp, assayId) || emptyAssay(assayId);
  const studyNaming = exp.naming && typeof exp.naming === 'object' ? exp.naming : {};
  const assayNaming = assay.naming && typeof assay.naming === 'object' ? assay.naming : {};

  return {
    schemaVersion: exp.schemaVersion,
    meta: exp.meta,
    researchQuestion: exp.researchQuestion,
    narrative: exp.narrative,
    readout: assay.readout,
    readoutText: assay.readoutText,

    const key = token.value;
    if (current[key] === undefined || current[key] === null) {
      current[key] = next.kind === 'index' ? [] : {};

      const nextPrefix = prefix === '' ? token.value : `${prefix}.${token.value}`;

      return expand(nextValue, nextPrefix, rest);

    if (token.kind === 'index') {
      const nextPrefix = `${prefix}[${token.value}]`;
      const nextValue = current === undefined || current === null ? undefined : current[token.value];

    if (!Array.isArray(current)) return [];
    const results = [];
    for (let i = 0; i < current.length; i++) {

// notification. Reads/writes address the object with the same dot/bracket
// path syntax as core/paths.js; setPath (the store method, not the paths.js
// helper of the same name -- see the aliasing below) is additionally gated

// stronger one.

   * from `path` (the object write address) for the assay tier (schema v3):

   * .modality`, from core/assay.js's scopeWrite), but an array index is not
   * a stable identity -- deleting assay 0 would silently repoint every
   * surviving slot at a different assay's value. `slotKey` stays id-based
   * (`assay:<id>.acquisition.modality`) so provenance tracks WHICH assay,
   * not WHERE in the array it currently sits. Callers outside the assay
   * tier never pass this and get the pre-v3 behaviour unchanged.
   *

   * it always succeeds, regardless of the existing tag, and is tagged
   * 'default' (WEAK) rather than whatever `tag` the caller passed. Without
   * this, clearing a field that once held a STRONG ('user') value would tag
   * the resulting emptiness STRONG too -- manufacturing false provenance
   * (the record would claim the user deliberately set the field to blank)
   * and permanently locking the slot, since canOverwrite would then refuse
   * every future WEAK/PROVISIONAL write (a KB default, an LLM suggestion)

// a half-applied mess that is neither the user's study nor the model's

// blast radius at all.

// draft and hand it to whatever import path exists. That must NOT happen --
// 'imported' is a STRONG tag (core/provenance.js), so routing a model draft

// codebase works hard to keep (see engine/conformance.js's split of
// "answered but invalid" from "not answered yet", and engine/spectra.js's

// carries needsReview, so the UI can render it as "confirm this" and a
// later real user edit always wins.

        // so canOverwrite always allows the first write) -- reported rather
        // than asserted, because a silent no-op here would look exactly like

    if (!KNOWN_ADVISOR_RULE_KEYS.has(key)) {
      issues.push(advisorIssue(`[${index}]`, `advisor rule has an unrecognized property '${key}' -- it will be ignored`));
    }
  }

  const id = typeof entry.id === 'string' ? entry.id.trim() : '';
  if (!id) {
    issues.push(advisorIssue(`[${index}]`, 'advisor rule is missing a non-empty id'));
    return null;
  }
  if (!ADVICE_ID_PATTERN.test(id)) {
    issues.push(advisorIssue(id, `advisor rule id '${id}' must match ${ADVICE_ID_PATTERN}`));
    return null;
  }
  if (seenIds.has(id)) {
    issues.push(advisorIssue(id, `duplicate advisor rule id '${id}'`));
    return null;
  }

  if (!ADVICE_KINDS.includes(entry.kind)) {
    issues.push(advisorIssue(id, `advisor rule 'kind' must be one of ${ADVICE_KINDS.join(', ')}, got '${String(entry.kind)}'`));
    return null;
  }

  // The underlying phenomenon this note is ABOUT -- 'spectral spillover',
  // 'photobleaching', 'phototoxicity'. Required, and deliberately NOT
  // derivable from `when`: the trigger condition (modality is confocal) says
  // when a note applies; the concept says why it exists at all, and only the
  // latter is the thing a user actually needs to recognize. Conflating the
  // two is what made an earlier version render "Shown because modality is
  // STED" as though that were a reason.
  const concept = typeof entry.concept === 'string' ? entry.concept.trim() : '';
  if (!concept) {
    issues.push(
      advisorIssue(id, "advisor rule is missing a non-empty concept (the phenomenon it is about, e.g. 'spectral spillover')")
    );
    return null;
  }

  const title = typeof entry.title === 'string' ? entry.title.trim() : '';
  if (!title) {
    issues.push(advisorIssue(id, 'advisor rule is missing a non-empty title'));
    return null;
  }

  const body = typeof entry.body === 'string' ? entry.body.trim() : '';
  if (body.length < MIN_ADVICE_BODY_LENGTH) {
    issues.push(
      advisorIssue(
        id,
        `advisor rule 'body' must be at least ${MIN_ADVICE_BODY_LENGTH} characters (the "why", not just the "what") -- got ${body.length}`
      )
    );
    return null;
  }

  if (!Array.isArray(entry.surfaces) || entry.surfaces.length === 0) {
    issues.push(advisorIssue(id, "advisor rule 'surfaces' must be a non-empty array"));
    return null;
  }
  const unknownSurface = entry.surfaces.find((s) => !ADVICE_SURFACES.includes(s));
  if (unknownSurface !== undefined) {
    // Drop the WHOLE rule, not just the bad entry -- dropping only the bad
    // surface would leave the rule alive but silently narrower than the
    // author intended, which is a harder bug to notice than an absent rule.
    issues.push(
      advisorIssue(id, `advisor rule references unknown surface '${String(unknownSurface)}' (known: ${ADVICE_SURFACES.join(', ')})`)
    );
    return null;
  }

  // `when` is REQUIRED and must not be the literal `true`.
  // evaluatePredicate(undefined, ...) returns true -- the DSL's own "no
  // condition given" default -- so an omitted `when` would silently produce
  // permanent, unconditional advice on every matching surface. A rule that
  // genuinely wants to fire everywhere still has to say so honestly with an
  // always-true predicate shape the author chose, not by omission.
  if (entry.when === undefined || entry.when === true) {
    issues.push(advisorIssue(id, "advisor rule 'when' is required and must not be the literal true"));
    return null;
  }

  seenIds.add(id);
  return {
    id,
    surfaces: entry.surfaces.slice(),
    kind: entry.kind,
    concept,
    title,
    body,
    when: entry.when,
    priority: typeof entry.priority === 'number' ? entry.priority : 0,
  };
}

 * TOTAL: never throws. A malformed rule is dropped and reported rather than
 * aborting the whole pack -- one bad rule must not silence every rule.
 *
 * `raw` is the parsed contents of web/kb/advisor.json: `{version, rules}`.
 * An absent pack (raw is undefined/null) is reported as its own issue rather

    issues.push(advisorIssue('advisor', 'advisor pack is missing -- run tools/export_markers_kb.py'));
    return { rules: [], issues };
  }
  if (typeof raw !== 'object' || Array.isArray(raw) || !Array.isArray(raw.rules)) {
    issues.push(advisorIssue('advisor', "advisor pack must be an object with a 'rules' array"));

  const seenIds = new Set();

 * view (a nav badge, a summary page) would use; nothing in this slice calls
 * it that way yet.
 *

 * not trust that transitively) is treated as non-matching, never as a crash

    } catch {

    .map((rule, index) => ({ rule, index }))
    .sort((a, b) => a.rule.priority - b.rule.priority || a.index - b.index)

// uses. Deliberately small and curated -- covers only paths advisor rules
// actually reference today. An unmapped path makes summarizeTrigger return
// null (see below) rather than leaking a raw dotted path like
// 'acquisition.modality' into user-facing text.

 * "modality is STED", "modality is SEM or TEM".

 * reason a note exists is its `concept` (spectral spillover, photobleaching)
 * -- authored content that no predicate encodes. This function only answers
 * "when does this apply", which is a useful but strictly secondary question:
 * it tells a reader the note is conditional on something they entered rather
 * than shown to everyone.

 * hand-authored: a hand-written applicability string is a second,
 * independent rendering of the same fact `when` already encodes, and this
 * codebase has already shipped that exact defect shape twice (a display
 * column disagreeing with an embedded filename token, a value written under
 * one store path and read under another -- docs/cma-lessons.md lessons 49

 * summarized. Anything else -- composite `all`/`any`/`not`, `matches`,

  const [op] = keys;

    if (typeof arg !== 'string') return null;
    const label = TRIGGER_FIELD_LABELS[arg];
    return label ? `${label} is set` : null;
  }

  if ((op !== 'eq' && op !== 'in') || !Array.isArray(arg) || arg.length !== 2) return null;

  const [path, value] = arg;
  if (typeof path !== 'string') return null;
  const label = TRIGGER_FIELD_LABELS[path];
  if (!label) return null;

  if (op === 'eq') {
    if (typeof value !== 'string') return null;
    return `${label} is ${value}`;
  }

  if (!Array.isArray(value) || value.length === 0 || !value.every((v) => typeof v === 'string')) return null;

  return `${label} is ${value.slice(0, -1).join(', ')} or ${value[value.length - 1]}`;
}

// Wavelength -> display-color mapping for the Color panel step: turns a

// e.g. DAPI's ~460 nm emission renders as a light sky blue, GFP's ~510 nm as
// a light green, Texas Red's ~615 nm as orange-red -- matching the
// conventional imaging/flow-cytometry idiom of coloring a channel by its
// emission color, not a spectrophotometer trace.
//
// Deliberately NOT a physically accurate CIE wavelength-to-RGB conversion:
// those render quite dark/desaturated near the violet and red edges of the
// visible range, which reads poorly as a small UI swatch and doesn't match
// how imaging software actually colors channels. Instead this is a
// piecewise-linear hue curve fit to the same rough spectral order, held at a
// fixed light/saturated HSL so every swatch stays legible on both this app's
// light and dark themes. Qualitative by design -- same posture as
// spectra.js's peak-proximity check, not a claim of colorimetric accuracy.
//
// Pure module: no DOM.

// [nm, hueDegrees], hue expressed as a continuous (non-wrapped) value so
// linear interpolation never has to special-case crossing 0/360 -- the final
// hueForWavelength() reduces mod 360 exactly once, at the end. Past the
// visible red edge (~650 nm) the curve keeps descending past 0 into
// negative/magenta territory, matching how deep-red/near-IR channels are
// conventionally rendered (a warm magenta/maroon, not a repeat of pure red).
const HUE_BREAKPOINTS = [
  [360, 280], // near-UV (Hoechst/DAPI excitation range) -- violet
  [440, 240], // blue
  [480, 200], // cyan-blue
  [510, 150], // green
  [550, 95], // yellow-green
  [580, 50], // orange-yellow
  [610, 20], // orange-red
  [650, -5], // red
  [700, -30], // deep red / near-IR, tipping toward magenta
  [900, -60], // far-IR (extrapolated) -- magenta
];

const DEFAULT_SATURATION_PCT = 72;
const DEFAULT_LIGHTNESS_PCT = 68;

function hueForWavelength(nm) {
  const minNm = HUE_BREAKPOINTS[0][0];
  const maxNm = HUE_BREAKPOINTS[HUE_BREAKPOINTS.length - 1][0];
  const clamped = Math.max(minNm, Math.min(maxNm, nm));

  for (let i = 0; i < HUE_BREAKPOINTS.length - 1; i++) {
    const [nmA, hueA] = HUE_BREAKPOINTS[i];
    const [nmB, hueB] = HUE_BREAKPOINTS[i + 1];
    if (clamped >= nmA && clamped <= nmB) {
      const frac = nmB === nmA ? 0 : (clamped - nmA) / (nmB - nmA);
      const hue = hueA + frac * (hueB - hueA);
      return ((hue % 360) + 360) % 360;

  // relying on the loop always finding a bracketing pair.
  return 0;

// needed for three channels.
function hslToHex(hueDeg, saturationPct, lightnessPct) {

  const a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const toHex = (x) => Math.round(255 * x).toString(16).padStart(2, '0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;

 * The default display color for a fluorophore with the given emission peak
 * (nm), as a `#rrggbb` hex string. Returns `null` for a non-finite/missing
 * peak -- callers (ui/steps/panel.js) fall back to a neutral placeholder

 * states: "no color computed" is a distinct, visible case, not a guess.

}

// "CON.tif" are all unusable on a real Windows filesystem, even though

    // existing `_{2,}` -> `_` collapse then removes the orphaned separator,
    // so the token disappears from the name entirely instead of padding it
    // with a placeholder for an axis this experiment simply does not use.
    if (optional.includes(key) && (value === undefined || value === null || value === '')) {
      normalized[key] = '';

    }
    let token = sanitizeToken(String(value), config);
