  if (raw === null || raw === undefined) return null;
  if (typeof raw === 'number' && Number.isInteger(raw) && raw >= 1) {
    return raw;
  }
  return 1; // an explicit-but-invalid value still expands (as 1 row); flagged separately
}

/** Total row count a design would expand to, without building any rows. */
function plannedRowCount(design) {
  const factors = factorsOf(design);
  const groupLevels = groupLevelsOf(design);
  let total = Math.max(groupLevels.length, 1); // 0 group levels -> a design with no arms defined yet
  for (const factor of factors) {
    total *= levelsOf(factor).length;
  }
  total *= effectiveReplicateCount(design && design.biologicalReplicates) ?? 1;
  total *= effectiveReplicateCount(design && design.technicalReplicates) ?? 1;
  return total;
}

/** Extract the `{token}` names referenced by a template string, in order. */
function templateTokens(template) {
  const tokens = [];
  String(template).replace(TEMPLATE_TOKEN_RE, (match, token) => {
    tokens.push(token);
    return match;
  });
  return tokens;
}

/**
 * Expand a design into concrete condition rows. See the module header for
 * the two-kinds-of-axis distinction and the row-order contract.
 *
 * Guardrails (never throws):
 *  - no arm levels defined -> the arm axis is simply omitted (group: null),
 *    same as zero factors -> one unconditioned sample.
 *  - zero factors -> the arm axis (if any) still expands on its own.
 *  - any factor with zero levels -> the product is mathematically zero, so
 *    this returns [] (conditionIssues separately reports why).
 *  - a design whose planned size exceeds MAX_CONDITION_ROWS returns []
 *    WITHOUT attempting the expansion (conditionIssues reports the cap).
 */
function expandConditions(design) {
  const total = plannedRowCount(design);
  if (total === 0 || total > MAX_CONDITION_ROWS) {
    return [];
  }

  const groupLevels = groupLevelsOf(design);
  const factors = factorsOf(design);
  const bioCount = effectiveReplicateCount(design && design.biologicalReplicates);
  const techCount = effectiveReplicateCount(design && design.technicalReplicates);

  // Arm is OUTERMOST and, critically, its own single axis -- never crossed
  // with itself the way two `factors` entries would be. An empty group axis
  // (no arms in use) is one pass with group: null, mirroring "zero factors"
  // below.
  let combos = (groupLevels.length > 0 ? groupLevels : [null]).map((group) => ({
    group,
    factorLevels: {},
  }));

  for (const factor of factors) {
    const name = factor && factor.name;
    const levels = levelsOf(factor);
    const next = [];
    for (const combo of combos) {
      for (const level of levels) {
        next.push({ ...combo, factorLevels: { ...combo.factorLevels, [name]: level } });
      }
    }
    combos = next;
  }

  const rows = [];
  for (const combo of combos) {
    // bioCount/techCount null -> that axis is omitted: one pass with rep null,
    // not a loop of 1..1, so the row never carries a fabricated '1'.
    const bioValues = bioCount === null ? [null] : range(1, bioCount);
    const techValues = techCount === null ? [null] : range(1, techCount);
    for (const bioRep of bioValues) {
      for (const techRep of techValues) {
        rows.push({
          id: rows.length,
          group: combo.group,
          factorLevels: combo.factorLevels,
          bioRep,
          techRep,
        });
      }
    }
  }
  return rows;
}

function range(start, end) {
  const out = [];
  for (let i = start; i <= end; i += 1) out.push(i);
  return out;
}

function makeConditionIssue(field, message, severity = 'error') {
  return { field, message, severity };
}

/**
 * Validate a design and report every problem as a {field, message, severity}
 * issue -- the same shape engine/validation.js validationIssue uses, so the
 * UI can render design problems and naming problems through one list.
 *
 * This never throws; a malformed design (missing arrays, non-object
 * factors, etc.) degrades to "as many issues as can be determined", not a
 * crash.
 */
// Token names reserved by the engine itself (the arm axis and the two
// replicate axes). A factor sharing one of these names would silently shadow
// (or be shadowed by) the reserved value when a custom id scheme or the
// uniqueness check renders it -- see buildSampleId's fields map below.
const RESERVED_TOKEN_NAMES = new Set(['group', 'biorep', 'techrep']);

function isUsableLevel(level) {
  return (
    (typeof level === 'string' && level.length > 0) ||
    (typeof level === 'number' && Number.isFinite(level))
  );
}

/** Validate one replicate axis (biological or technical). Never throws. */
function replicateIssues(field, rawValue) {
  if (rawValue === null || rawValue === undefined) return []; // omitted axis: legal
  const issues = [];
  const isValid = typeof rawValue === 'number' && Number.isInteger(rawValue) && rawValue >= 1;
  if (!isValid) {
    issues.push(
      makeConditionIssue(field, `Must be a positive integer; got ${JSON.stringify(rawValue)}.`)
    );
  } else if (rawValue > MAX_PADDED_REPLICATE) {
    issues.push(
      makeConditionIssue(
        field,
        `${rawValue} exceeds the ${MAX_PADDED_REPLICATE}-replicate cap for a ${REPLICATE_PAD}-digit token.`
      )
    );
  }
  return issues;
}

function conditionIssues(design) {
  const issues = [];
  const factors = factorsOf(design);
  const groupLevels = groupLevelsOf(design);

  const seenNames = new Set();
  const flaggedDuplicates = new Set();
  for (const factor of factors) {
    const name = factor && factor.name;
    if (seenNames.has(name)) {
      if (!flaggedDuplicates.has(name)) {
        issues.push(makeConditionIssue('factors', `Duplicate factor name '${name}'.`));
        flaggedDuplicates.add(name);
      }
    } else {
      seenNames.add(name);
    }
    if (RESERVED_TOKEN_NAMES.has(name)) {
      issues.push(
        makeConditionIssue(
          'factors',
          `Factor cannot be named '${name}' -- that name is reserved by the engine.`
        )
      );
    }
  }

  for (const factor of factors) {
    const name = factor && factor.name;
    const levels = levelsOf(factor);
    if (levels.length === 0) {
      issues.push(makeConditionIssue('factors', `Factor '${name}' has zero levels.`));
      continue;
    }
    // A level that isn't a genuine non-empty value can't be substituted into
    // an id-scheme token: buildSampleId would throw "Unknown token" for it
    // (see its `fields[token] === undefined` check), which is a misleading
    // message for "the token IS known, its value just isn't usable" -- and
    // conditionIssues is supposed to be the thing that catches this BEFORE
    // buildSampleId ever runs, not just for genuinely unknown tokens.
    levels.forEach((level, index) => {
      if (!isUsableLevel(level)) {
        issues.push(
          makeConditionIssue(
            'factors',
            `Factor '${name}' has an invalid level at position ${index} (must be a non-empty value).`
          )
        );
      }
    });
  }

  // Arm levels get the same non-empty-value check factor levels do, but NOT
  // the zero-levels check: an empty groups.levels means "this design has no
  // arms", which is legal (mirrors zero factors), not an authoring mistake.
  groupLevels.forEach((level, index) => {
    if (!isUsableLevel(level)) {
      issues.push(
        makeConditionIssue('groups', `Group has an invalid level at position ${index} (must be a non-empty value).`)
      );
    }
  });

  issues.push(...replicateIssues('biologicalReplicates', design && design.biologicalReplicates));
  issues.push(...replicateIssues('technicalReplicates', design && design.technicalReplicates));

  const total = plannedRowCount(design);
  if (total > MAX_CONDITION_ROWS) {
    issues.push(
      makeConditionIssue(
        'factors',
        `Design expands to ${total} rows, exceeding the cap of ${MAX_CONDITION_ROWS}.`
      )
    );
  }

  const idScheme = design && design.idScheme;
  if (idScheme) {
    // A reserved token is "known" for scheme validation ONLY when its axis is
    // actually in use on this design -- mirroring how a factor name is only
    // known if it exists in design.factors. Without this gate, a scheme
    // referencing {biorep} on a design with no technical replicates would
    // pass static validation here and then throw "Unknown token" at render
    // time on every single row, which is a confusing way to fail.
    const knownTokens = new Set(factors.map((factor) => factor && factor.name));
    if (groupLevels.length > 0) knownTokens.add('group');
    if (design && design.biologicalReplicates !== null && design.biologicalReplicates !== undefined) {
      knownTokens.add('biorep');
    }
    if (design && design.technicalReplicates !== null && design.technicalReplicates !== undefined) {
      knownTokens.add('techrep');
    }
    for (const token of templateTokens(idScheme)) {
      if (!knownTokens.has(token)) {
        issues.push(makeConditionIssue('idScheme', `Unknown token '{${token}}' in id scheme.`));
      }
    }
  }

  // Filename-uniqueness gate: nothing in this engine checked this before.
  // Within one design, the base name (date/modality/exptype/markers/
  // magnification) and SAMPLE are constant across every row -- ONLY the group
  // label + replicate tokens vary -- so checking that triple for collisions
  // is sufficient to guarantee every row's filename is distinct.
  if (total > 0 && total <= MAX_CONDITION_ROWS) {
    const seenKeys = new Map();
    const flaggedKeys = new Set();
    for (const row of expandConditions(design)) {
      let label;
      try {
        label = idScheme ? buildSampleId(row, idScheme) : buildGroupLabel(row, design);
      } catch {
        continue; // a bad scheme is already reported above; do not double-report here
      }
      const key = [
        label,
        formatReplicateToken('B', row.bioRep),
        formatReplicateToken('T', row.techRep),
      ].join('|');
      if (seenKeys.has(key) && !flaggedKeys.has(key)) {
        issues.push(
          makeConditionIssue(
            'factors',
            `Multiple condition rows produce the identical name segment '${key.replace(/\|/g, '')}' -- they would overwrite each other.`
          )
        );
        flaggedKeys.add(key);
      }
      seenKeys.set(key, row.id);
    }
  }

  return issues;
}

// Separator BETWEEN group segments. Deliberately '-', not '_': '_' already
// separates TEMPLATE FIELDS in a filename, so joining group segments with it
// too would erase the boundary between "where the fields end" and "where the
// group description begins". '-' is the existing within-a-field convention
// (markers already render as DAPI-GFP-PHALLOIDIN) and is in the safe-char set.
const GROUP_SEGMENT_SEPARATOR = '-';

/**
 * Render one replicate axis as its prefixed, zero-padded token (B01, T03), or
 * '' if the axis is omitted (value null/undefined). The prefix is what keeps
 * the name parseable now that BOTH replicate axes are optional and share the
 * same {biorep}/{techrep} template slots -- without it, a bare '03' gives no
 * way to tell which axis it belongs to once the other is omitted.
 */
function formatReplicateToken(prefix, value) {
  if (value === null || value === undefined) return '';
  return `${prefix}${String(value).padStart(REPLICATE_PAD, '0')}`;
}

/**
 * Split a condition row into its ordered GROUP SEGMENTS: the row's single ARM
 * level (if this design uses one), followed by one segment per CROSSING
 * factor in the design's declared order.
 *
 * This is stage 2 of the two-stage name. Stage 1 (the base name) says what the
 * whole experiment is and is identical for every file; these segments say
 * which arm x factor combination this particular file belongs to.
 *
 * Each segment is sanitized INDIVIDUALLY and returned as its own array
 * element. That is the whole point: joining unsanitized "CT" and "NAM 50mM"
 * with no separator produced 'CTNAM50MM', where the boundary between the
 * control arm and the treatment arm is simply gone. Segments cannot merge,
 * because the separator is applied by the joiner AFTER each part has been
 * sanitized on its own -- and because the arm is a SINGLE value (design.groups
 * is singular, not a second factors[] entry), there is exactly one arm segment
 * per row, never two arm segments crossed against each other.
 *
 * Replicate numbers are NOT included here -- they render through their own
 * {biorep}/{techrep} template tokens (see formatReplicateToken), not as part
 * of the group label.
 */
function buildGroupSegments(row, design) {
  const sanitizeConfig = { safeCharPattern: SAMPLE_ID_SAFE_CHAR_PATTERN };
  const levels = (row && row.factorLevels) || {};
  const segments = [];

  // Whitespace INSIDE a level is removed, not turned into '_' as sanitizeToken
  // would do on its own ('NAM 50mM' -> 'NAM50mM', not 'NAM_50mM'). That keeps
  // the filename grammar unambiguous: '_' separates template fields, '-'
  // separates group segments, and neither ever appears inside a segment by
  // accident. A stray '_' mid-segment makes it impossible to see, by eye,
  // where the group description starts and ends.
  const segmentize = (value) => sanitizeToken(String(value).replace(/\s+/g, ''), sanitizeConfig);

  if (row && row.group !== null && row.group !== undefined) {
    segments.push(segmentize(row.group));
  }

  // Iterate the DESIGN's factor order, not Object.keys(levels): key order
  // happens to match today (expandConditions inserts in factor order) but the
  // declared order is the actual contract, and a row rebuilt from persisted
  // JSON has no guarantee of preserving it.
  for (const factor of factorsOf(design)) {
    const name = factor && factor.name;
    if (!Object.prototype.hasOwnProperty.call(levels, name)) continue;
    segments.push(segmentize(levels[name]));
  }

  return segments;
}

/**
 * Join a row's group segments into the single label that occupies the
 * filename's {group} slot. Never concatenates two segments without a
 * separator.
 */
function buildGroupLabel(row, design) {
  return buildGroupSegments(row, design).join(GROUP_SEGMENT_SEPARATOR);
}

/**
 * Render a condition row through a custom "group naming override" template
 * (the same `{token}` syntax as engine/naming.js's filename template) and
 * sanitize it with naming.js's sanitizeToken -- REUSED, not reimplemented, so
 * this can never silently diverge from how filename tokens are built.
 *
 * Available tokens: every crossing factor by name, plus the reserved 'group',
 * 'biorep', 'techrep' -- but ONLY when that axis actually has a value on this
 * row (an omitted axis has no token to substitute, so referencing it throws
 * the same "Unknown token" a genuinely misspelled name would).
 *
 * An unknown token is a genuine authoring error in the scheme; it throws
 * rather than silently rendering an empty segment. conditionIssues is the
 * place a caller should check BEFORE calling this, so the problem is visible
 * as a design issue rather than only surfacing as a thrown error.
 */
function buildSampleId(row, scheme) {
  const fields = { ...(row && row.factorLevels) };
  if (row) {
    if (row.group !== null && row.group !== undefined) fields.group = row.group;
    if (row.bioRep !== null && row.bioRep !== undefined) fields.biorep = row.bioRep;
    if (row.techRep !== null && row.techRep !== undefined) fields.techrep = row.techRep;
  }
  const rendered = String(scheme).replace(TEMPLATE_TOKEN_RE, (match, token) => {
    // hasOwnProperty, not `token in fields`: the `in` operator also matches
    // inherited Object.prototype members ('toString', 'constructor',
    // 'valueOf', ...), so a scheme like '{toString}' would silently render
    // that function's own source instead of being rejected as an unknown
    // token -- the same prototype-chain class of bug as paths.js's
    // __proto__ hole, recurring one module over.
    if (!Object.prototype.hasOwnProperty.call(fields, token) || fields[token] === undefined) {
      throw new Error(`Unknown token '{${token}}' in id scheme '${scheme}'.`);
    }
    return String(fields[token]);
  });
  return sanitizeToken(rendered, { safeCharPattern: SAMPLE_ID_SAFE_CHAR_PATTERN });
}
  // ---- src/engine/controls.js ----
// Controls tier (assay-tier commit 3): panel-derived and readout-specific
// control guidance, stored as DATA in web/kb/readouts.json + web/kb/controls.json
// and evaluated by the EXISTING predicate DSL (engine/predicate.js) -- the
// third independent use of that engine (question askWhen, advisor, this),
// each one that needs no engine change is evidence the "rules are data"
// resolution from docs/plans/planner-web-mvp-usecases.md section 2 holds.
//
// Two loaders live here because they are tightly coupled: a control rule's
// `when: {eq: ['readout', ...]}` can only be evaluated once readoutText has
// been resolved to a canonical id via the readouts vocabulary, and nothing
// else in the app needs that vocabulary.
//
// Pure module: no DOM, no store. Imports only evaluatePredicate.
//
// Mirrors engine/advisor.js's loader discipline deliberately: an explicit
// whitelist object, never a spread of the raw entry, so a new rule property
// is silently DROPPED here until it is added to this list by name -- see
// advisor.js's own header for why (this project has shipped the opposite
// failure once already).


const CONTROL_KINDS = ['panel', 'readout'];

const CONTROL_ID_PATTERN = /^[a-z0-9][a-z0-9-]*$/;
const MIN_WHY_LENGTH = 40;

const KNOWN_CONTROL_RULE_KEYS = new Set(['id', 'kind', 'title', 'why', 'when', 'priority']);

function controlIssue(field, message) {
  return { field, message, severity: 'error' };
}

/**
 * Validate and normalize one raw control-rule entry. Returns `null` (with
 * issues pushed) if the rule cannot be shipped; otherwise the normalized
 * rule. Mirrors advisor.js's normalizeAdvisorRule field-by-field.
 */
function normalizeControlRule(entry, index, issues, seenIds) {
  if (entry === null || typeof entry !== 'object' || Array.isArray(entry)) {
    issues.push(controlIssue(`[${index}]`, 'control rule is not an object'));
    return null;
  }

  for (const key of Object.keys(entry)) {
    if (!KNOWN_CONTROL_RULE_KEYS.has(key)) {
      issues.push(controlIssue(`[${index}]`, `control rule has an unrecognized property '${key}' -- it will be ignored`));
    }
  }

  const id = typeof entry.id === 'string' ? entry.id.trim() : '';
  if (!id) {
    issues.push(controlIssue(`[${index}]`, 'control rule is missing a non-empty id'));
    return null;
  }
  if (!CONTROL_ID_PATTERN.test(id)) {
    issues.push(controlIssue(id, `control rule id '${id}' must match ${CONTROL_ID_PATTERN}`));
    return null;
  }
  if (seenIds.has(id)) {
    issues.push(controlIssue(id, `duplicate control rule id '${id}'`));
    return null;
  }

  if (!CONTROL_KINDS.includes(entry.kind)) {
    issues.push(controlIssue(id, `control rule 'kind' must be one of ${CONTROL_KINDS.join(', ')}, got '${String(entry.kind)}'`));
    return null;
  }

  const title = typeof entry.title === 'string' ? entry.title.trim() : '';
  if (!title) {
    issues.push(controlIssue(id, 'control rule is missing a non-empty title'));
    return null;
  }

  // The rationale, required and at least a real sentence -- per the standing
  // rule-of-thumb (planner-web-mvp-usecases.md section 2): "a control the
  // user does not understand is a control they will delete."
  const why = typeof entry.why === 'string' ? entry.why.trim() : '';
  if (why.length < MIN_WHY_LENGTH) {
    issues.push(
      controlIssue(id, `control rule 'why' must be at least ${MIN_WHY_LENGTH} characters (the rationale, not just the name) -- got ${why.length}`)
    );
    return null;
  }

  // `when` is REQUIRED and must not be the literal `true`, for the same
  // reason as advisor.js: evaluatePredicate(undefined, ...) is true, so an
  // omitted `when` would silently make a control fire for every assay.
  if (entry.when === undefined || entry.when === true) {
    issues.push(controlIssue(id, "control rule 'when' is required and must not be the literal true"));
    return null;
  }

  seenIds.add(id);
  return {
    id,
    kind: entry.kind,
    title,
    why,
    when: entry.when,
    priority: typeof entry.priority === 'number' ? entry.priority : 0,
  };
}

/**
 * Validate and normalize a raw controls pack into {rules, issues}. TOTAL:
 * never throws. A malformed rule is dropped and reported rather than
 * aborting the whole pack.
 */
function loadControlRules(raw) {
  const issues = [];

  if (raw === undefined || raw === null) {
    issues.push(controlIssue('controls', 'controls pack is missing -- run tools/export_markers_kb.py'));
    return { rules: [], issues };
  }
  if (typeof raw !== 'object' || Array.isArray(raw) || !Array.isArray(raw.rules)) {
    issues.push(controlIssue('controls', "controls pack must be an object with a 'rules' array"));
    return { rules: [], issues };
  }

  const seenIds = new Set();
  const rules = [];
  raw.rules.forEach((entry, index) => {
    const rule = normalizeControlRule(entry, index, issues, seenIds);
    if (rule) rules.push(rule);
  });

  return { rules, issues };
}

/**
 * The control rules relevant to the CURRENT `experiment` (an assayView, like
 * every other engine consumer), in ascending priority order, ties in
 * declaration order. TOTAL like evaluatePredicate itself.
 */
function selectControls(rules, experiment) {
  const matching = rules.filter((rule) => {
    try {
      return evaluatePredicate(rule.when, experiment);
    } catch {
      return false;
    }
  });
  return matching
    .map((rule, index) => ({ rule, index }))
    .sort((a, b) => a.rule.priority - b.rule.priority || a.index - b.index)
    .map(({ rule }) => rule);
}

// --- Readout vocabulary ------------------------------------------------
//
// A controlled vocabulary, not free text: engine/validation.js's
// compileFullMatch has no case-insensitive flag, so a `matches`-based
// control rule would fire on one person's spelling of "viability" and
// nobody else's. Structurally mirrors core/kb.js's markers.json
// canonical+aliases pattern, without the isFamily/variants complexity
// markers need and readouts don't.

const READOUT_ID_PATTERN = /^[a-z0-9][a-z0-9-]*$/;

/**
 * Validate and normalize a raw readouts pack into {readouts, issues}.
 * TOTAL: never throws. `readouts` is always a usable (possibly empty)
 * { canonicalId: {label, aliases} } object.
 */
function loadReadouts(raw) {
  const issues = [];
  const isPlainObject = raw !== null && typeof raw === 'object' && !Array.isArray(raw);
  const source = isPlainObject ? raw : {};

  if (!isPlainObject) {
    issues.push(controlIssue('readouts', 'readouts pack is missing or is not an object'));
  } else if (source.version !== 1) {
    issues.push(controlIssue('readouts', `readouts pack version is ${JSON.stringify(source.version ?? null)}, expected 1`));
  }

  const rawReadouts =
    source.readouts !== null && source.readouts !== undefined && typeof source.readouts === 'object' && !Array.isArray(source.readouts)
      ? source.readouts
      : {};

  const readouts = {};
  for (const [canonical, entry] of Object.entries(rawReadouts)) {
    if (!READOUT_ID_PATTERN.test(canonical)) {
      issues.push(controlIssue('readouts', `readout id '${canonical}' must match ${READOUT_ID_PATTERN}`));
      continue;
    }
    if (entry === null || typeof entry !== 'object' || Array.isArray(entry)) {
      issues.push(controlIssue('readouts', `readout '${canonical}' entry is not an object`));
      continue;
    }
    const label = typeof entry.label === 'string' ? entry.label.trim() : '';
    if (!label) {
      issues.push(controlIssue('readouts', `readout '${canonical}' is missing a non-empty label`));
      continue;
    }
    readouts[canonical] = {
      label,
      aliases: Array.isArray(entry.aliases) ? entry.aliases.filter((a) => typeof a === 'string') : [],
    };
  }

  return { readouts, issues };
}

/**
 * Resolve free text (what the user picked or typed for the readout
 * question) to a canonical readout id, or `null` if it matches nothing.
 * Case-insensitive EXACT match against each readout's label or aliases --
 * deliberately not fuzzy/substring, so "ROS in macrophages" does not
 * silently resolve to "ros" and fire rules the user never confirmed.
 *
 * Plain string comparison, not a `matches` regex -- this is a curated pick
 * from a `<select>` (or its literal Other free-text), not prose scanning,
 * so the case-insensitivity gap in compileFullMatch (the reason readout
 * needed a controlled vocabulary at all) never applies here.
 */
function resolveReadoutCanonical(text, readouts) {
  if (typeof text !== 'string' || text.trim().length === 0) return null;
  const needle = text.trim().toLowerCase();
  const table = readouts && typeof readouts === 'object' ? readouts : {};
  for (const [canonical, entry] of Object.entries(table)) {
    if (entry.label.toLowerCase() === needle) return canonical;
    if (entry.aliases.some((alias) => alias.toLowerCase() === needle)) return canonical;
  }
  return null;
}

/**
 * The three-state readout resolution for the controls panel (Decision 5,
 * docs/plans/planner-web-assay-tier.md): an empty controls list must NEVER
 * render as "I don't know" -- silence reads as "this assay needs no
 * controls," the most dangerous false negative a controls advisor can
 * produce. Returns one of:
 *   'unanswered'   -- readoutText is empty; nothing to resolve yet.
 *   'unrecognized' -- readoutText is filled in but matches no known readout
 *                     (typically a free-text "Other" answer).
 *   'known'        -- resolved to a canonical readout id.
 */
function readoutState(readoutText, readouts) {
  if (typeof readoutText !== 'string' || readoutText.trim().length === 0) return 'unanswered';
  return resolveReadoutCanonical(readoutText, readouts) === null ? 'unrecognized' : 'known';
}
  // ---- src/engine/freetext.js ----
// Deterministic free-text ingest: scan a pasted paragraph for markers,
// replicate counts, magnification, and an ISO date -- with the LLM off.
// See docs/plans/planner-web-p1-task-graph.json, task C1-4.
//
// Every proposal is tagged 'freetext' (WEAK). This module NEVER writes to
// the store -- C0-2's canOverwrite then structurally guarantees a re-parse
// can never clobber a value the user actually typed.
//
// Leaf module: import nothing (the KB `index` is passed in, from C1-1's
// indexKb, rather than read from a global here).

const REPLICATE_PATTERNS = [
  { re: /\bn\s*=\s*(\d+)\b/i, value: (m) => Number(m[1]) },
  { re: /\b(\d+)\s*replicates?\b/i, value: (m) => Number(m[1]) },
  { re: /\btriplicate\b/i, value: () => 3 },
  { re: /\bduplicate\b/i, value: () => 2 },
];

// Keyword-anchored first (most specific -- "Magnification: 63" is safe even
// next to unrelated numbers), then unit-anchored on a trailing x ("63x",
// "63 X" -- mirrors field_map.py's _MAGNIFICATION_UNIT, which anchors on the
// unit rather than "the first digit run anywhere" for exactly this reason),
// then unit-anchored on a leading x ("x63", "X 63" -- mirrors
// metadata.py's _extract_magnification allow_bare_x form). Trying all three
// is what makes '63x'/'63X'/'x63' normalize identically, per this task's
// spec.
const MAGNIFICATION_KEYWORD_RE = /(?:MAGNIFICATION|OBJECTIVE|ZOOM)[^0-9]{0,10}(\d{1,3}(?:\.\d+)?)/i;
const MAGNIFICATION_TRAILING_X_RE = /\b(\d{1,3}(?:\.\d+)?)\s?[xX]\b/;
const MAGNIFICATION_LEADING_X_RE = /\b[xX]\s?(\d{1,3}(?:\.\d+)?)\b/;

// The trailing-x form ("63x") is a deliberate EXTENSION beyond metadata.py's
// own prose path, which never enables the bare-x forms outside a filename
// stem (allow_bare_x=False by default) -- its own comment explains why:
// "dimension strings like '512 x 512' would be misread as a magnification".
// Allowing '63x' in free-flowing prose (this task's own spec) reopens
// exactly that hole, so a trailing-x match immediately followed by ANOTHER
// number ("512 x 512", "100x100") is rejected as a dimension pair rather
// than a magnification. A genuine magnification mention is never
// immediately followed by a second number.
function isDimensionPair(text, matchEndIndex) {
  return /^\s*\d/.test(text.slice(matchEndIndex));
}

// Mirror check for the leading-x form: in "512 x 512", rejecting the
// trailing-x half ("512 x") as a dimension pair still leaves the SECOND
// half ("x 512") matchable by the leading-x pattern on its own -- so that
// match must equally be rejected when it is immediately preceded by another
// number.
function isPrecededByNumber(text, matchStartIndex) {
  return /\d\s*$/.test(text.slice(0, matchStartIndex));
}

// ISO form only (YYYY-MM-DD). Deliberately does NOT attempt ambiguous
// formats like '03/04/2026', whose meaning (day-first vs month-first)
// differs by locale -- guessing wrong would silently mislabel data, which
// is worse than not proposing a date at all.
const ISO_DATE_RE = /\b((?:19|20)\d{2})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])\b/;

function freeTextProposal(path, value, match, extra) {
  return {
    path,
    value,
    tag: 'freetext',
    evidence: match[0],
    index: match.index,
    confidence: 0.7,
    ...extra,
  };
}

function proposeReplicates(text) {
  for (const { re, value } of REPLICATE_PATTERNS) {
    const match = re.exec(text);
    if (match) {
      // 'n=3' / 'triplicate' / 'X replicates' in a methods paragraph mean
      // BIOLOGICAL replicates by convention -- schema v2 split the old
      // single design.replicates into biologicalReplicates/technicalReplicates
      // (this path is the schema's real field; writing to the old
      // 'design.replicates' would silently propose into a slot that no
      // longer exists anywhere the store or the UI reads from).
      return freeTextProposal('design.biologicalReplicates', value(match), match);
    }
  }
  return null;
}

function proposeMagnification(text) {
  const keywordMatch = MAGNIFICATION_KEYWORD_RE.exec(text);
  if (keywordMatch) {
    const number = Number.parseFloat(keywordMatch[1]);
    if (Number.isFinite(number) && number > 0) {
      return freeTextProposal('naming.fields.magnification', `X${Math.trunc(number)}`, keywordMatch);
    }
  }

  const trailingMatch = MAGNIFICATION_TRAILING_X_RE.exec(text);
  if (trailingMatch && !isDimensionPair(text, trailingMatch.index + trailingMatch[0].length)) {
    const number = Number.parseFloat(trailingMatch[1]);
    if (Number.isFinite(number) && number > 0) {
      return freeTextProposal('naming.fields.magnification', `X${Math.trunc(number)}`, trailingMatch);
    }
  }

  const leadingMatch = MAGNIFICATION_LEADING_X_RE.exec(text);
  if (leadingMatch && !isPrecededByNumber(text, leadingMatch.index)) {
    const number = Number.parseFloat(leadingMatch[1]);
    if (Number.isFinite(number) && number > 0) {
      return freeTextProposal('naming.fields.magnification', `X${Math.trunc(number)}`, leadingMatch);
    }
  }

  return null;
}

function proposeDate(text) {
  const match = ISO_DATE_RE.exec(text);
  if (!match) return null;
  return freeTextProposal('naming.fields.date', match[0], match);
}

/**
 * Longest-match-wins, non-overlapping alias scan over `text`, using ONLY
 * `freeTextAliasToCanonical` -- never `aliasToCanonical` -- because C1-1's
 * exporter has already stripped every alias in `ambiguousInFreeText`
 * ("snap", "halo", "clip", "venus", "citrine", "emerald", "cerulean",
 * "tomato": real marker spellings that are ALSO common English words) out
 * of `freeTextAliases`. Scanning the wrong map here would defeat the entire
 * point of that exclusion list.
 *
 * Faithful port of metadata.py::_extract_markers's overlap resolution:
 * every whole-word occurrence of every alias is found (finditer, not
 * search -- B2/B3's fix, since one-match-per-alias silently drops a real
 * second occurrence of the SAME alias later in the text), candidates are
 * sorted by (start, -length) so a longer alias is considered first at a
 * shared start position, and a candidate is kept only if its span does not
 * overlap an already-accepted span. This is what makes 'ATTO 647-N' resolve
 * to ATTO647N rather than ATTO647 plus a dangling N.
 */
function scanMarkers(text, freeTextAliasToCanonical) {
  const candidates = [];
  for (const [alias, canonical] of freeTextAliasToCanonical.entries()) {
    const pattern = new RegExp(`\\b${escapeRegExp(alias)}\\b`, 'gi');
    let match;
    while ((match = pattern.exec(text)) !== null) {
      candidates.push({ start: match.index, end: match.index + match[0].length, canonical, evidence: match[0] });
      // A zero-length alias can't happen (aliases are non-empty strings),
      // so no lastIndex nudge is needed to avoid an infinite loop here.
    }
  }

  candidates.sort((a, b) => (a.start !== b.start ? a.start - b.start : b.end - b.start - (a.end - a.start)));

  const accepted = [];
  for (const candidate of candidates) {
    const overlaps = accepted.some((a) => candidate.start < a.end && candidate.end > a.start);
    if (!overlaps) accepted.push(candidate);
  }

  accepted.sort((a, b) => a.start - b.start);
  return accepted;
}

function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function proposeMarkers(text, index) {
  const freeTextAliasToCanonical = index && index.freeTextAliasToCanonical instanceof Map
    ? index.freeTextAliasToCanonical
    : new Map();
  const accepted = scanMarkers(text, freeTextAliasToCanonical);
  if (accepted.length === 0) return null;

  const seen = new Set();
  const canonicalsInOrder = [];
  const matches = [];
  for (const hit of accepted) {
    matches.push({ canonical: hit.canonical, evidence: hit.evidence, index: hit.start });
    if (!seen.has(hit.canonical)) {
      seen.add(hit.canonical);
      canonicalsInOrder.push(hit.canonical);
    }
  }

  const first = accepted[0];
  return {
    path: 'naming.fields.markers',
    value: canonicalsInOrder.join('-'),
    tag: 'freetext',
    evidence: first.evidence,
    index: first.start,
    confidence: 0.7,
    matches,
  };
}

/**
 * Parse `text` and return { proposals, unmatched }. `index` is C1-1's
 * indexKb(...) output. TOTAL with respect to malformed input: an
 * empty/non-string text or a missing/malformed index simply yields no
 * proposals, never a throw.
 *
 * NEVER writes to any store -- returns proposals only.
 */
function parseFreeText(text, index) {
  const safeText = typeof text === 'string' ? text : '';
  const proposals = [];
  const unmatched = [];

  const markers = proposeMarkers(safeText, index);
  if (markers) proposals.push(markers);
  else unmatched.push('markers');

  const replicates = proposeReplicates(safeText);
  if (replicates) proposals.push(replicates);
  else unmatched.push('replicates');

  const magnification = proposeMagnification(safeText);
  if (magnification) proposals.push(magnification);
  else unmatched.push('magnification');

  const date = proposeDate(safeText);
  if (date) proposals.push(date);
  else unmatched.push('date');

  proposals.sort((a, b) => a.index - b.index);
  return { proposals, unmatched };
}
  // ---- src/engine/interview.js ----
// Interview engine: question bank loading, next-question selection, and
// answer recording. See docs/plans/planner-web-p1-task-graph.json, task
// C1-3.
//
// This module NEVER writes to the store: recordAnswer returns a
// {path, value, tag} write DESCRIPTOR rather than performing the write, so
// core/store.js stays the single writer and its provenance gate (C0-2)
// stays the single gatekeeper for what may overwrite what.


const KNOWN_QUESTION_TYPES = new Set(['text', 'choice', 'number', 'multi']);
const DEFAULT_ANSWER_TAG = 'user';
const STRONG_TAGS = new Set(['user', 'user_edited', 'imported']);

function interviewIssue(field, message) {
  return { field, message, severity: 'error' };
}

/**
 * Validate and normalize a raw question-bank array into {questions, issues}.
 * TOTAL: never throws. A malformed entry is dropped and reported by id (or
 * by index, if it has no usable id) rather than aborting the whole load.
 */
function loadQuestions(raw) {
  const issues = [];
  if (!Array.isArray(raw)) {
    return { questions: [], issues: [interviewIssue('questions', 'question bank is not an array')] };
  }

  const seenIds = new Set();
  const questions = [];

  raw.forEach((entry, index) => {
    if (entry === null || typeof entry !== 'object' || Array.isArray(entry)) {
      issues.push(interviewIssue(`[${index}]`, 'question entry is not an object'));
      return;
    }
    const id = typeof entry.id === 'string' ? entry.id.trim() : '';
    if (!id) {
      issues.push(interviewIssue(`[${index}]`, 'question is missing a non-empty id'));
      return;
    }
    if (seenIds.has(id)) {
      issues.push(interviewIssue(id, `duplicate question id '${id}'`));
      return;
    }
    const field = typeof entry.field === 'string' ? entry.field.trim() : '';
    if (!field) {
      issues.push(interviewIssue(id, 'question is missing a non-empty field'));
      return;
    }
    if (!KNOWN_QUESTION_TYPES.has(entry.type)) {
      issues.push(interviewIssue(id, `unknown question type '${String(entry.type)}'`));
      return;
    }
    if ((entry.type === 'choice' || entry.type === 'multi') && (!Array.isArray(entry.options) || entry.options.length === 0)) {
      issues.push(interviewIssue(id, `question type '${entry.type}' requires a non-empty 'options' array`));
      return;
    }

    seenIds.add(id);
    questions.push({
      id,
      prompt: typeof entry.prompt === 'string' ? entry.prompt : '',
      why: typeof entry.why === 'string' ? entry.why : '',
      field,
      type: entry.type,
      options: Array.isArray(entry.options) ? entry.options.slice() : undefined,
      // Whether an 'Other...' free-text fallback is offered alongside the
      // curated options -- meaningless for non-choice types, so coerced to a
      // real boolean rather than passed through, the same normalize-not-copy
      // treatment every other field here gets. loadQuestions builds an
      // explicit whitelist object rather than spreading `entry`, so a new
      // question-bank property (this one included, when it was first added)
      // is silently DROPPED here unless it is added to this list by name --
      // that is deliberate (unknown properties should not leak into the
      // engine unexamined), but it means every new property needs this line.
      allowOther: entry.allowOther === true,
      askWhen: entry.askWhen,
      priority: typeof entry.priority === 'number' ? entry.priority : 0,
      tag: typeof entry.tag === 'string' && entry.tag ? entry.tag : DEFAULT_ANSWER_TAG,
    });
  });

  return { questions, issues };
}

function slotTag(experiment, path) {
  const slot = experiment && experiment.provenance && experiment.provenance.slots;
  return slot ? slot[path]?.tag ?? null : null;
}

function isSkipped(experiment, questionId) {
  const skipped = experiment && experiment.provenance && experiment.provenance.skipped;
  return Array.isArray(skipped) && skipped.includes(questionId);
}

/** Record `questionId` as skipped. Mutates `experiment.provenance.skipped` in place. */
function skipQuestion(experiment, questionId) {
  if (!experiment.provenance) {
    experiment.provenance = { slots: {}, unanswered: [], skipped: [] };
  }
  if (!Array.isArray(experiment.provenance.skipped)) {
    experiment.provenance.skipped = [];
  }
  if (!experiment.provenance.skipped.includes(questionId)) {
    experiment.provenance.skipped.push(questionId);
  }
  return experiment;
}

/**
 * The askable questions, in ascending priority order, capped at `limit`.
 *
 * A question is askable when: its askWhen predicate passes (evaluatePredicate
 * is total, so a malformed predicate simply excludes the question rather
 * than throwing); it has not been skipped; and its target slot is not
 * already filled by a STRONG source (user/user_edited/imported).
 *
 * A slot filled only by a WEAK 'freetext' tag IS still askable -- but the
 * returned question carries that existing value as `suggestedDefault`, so
 * the UI can render it as "confirm this" rather than a blank field. This is
 * the entire reason the free-text tier (C1-4) and this interview compose:
 * the parser fills WEAK slots, the interview then asks about exactly those,
 * pre-filled.
 */
function nextQuestions(questions, experiment, limit) {
  const cap = typeof limit === 'number' && limit >= 0 ? limit : Infinity;
  const askable = [];
  const sorted = questions.slice().sort((a, b) => a.priority - b.priority);

  for (const question of sorted) {
    if (askable.length >= cap) break;
    if (isSkipped(experiment, question.id)) continue;
    if (!evaluatePredicate(question.askWhen, experiment)) continue;

    const tag = slotTag(experiment, question.field);
    if (STRONG_TAGS.has(tag)) continue;

    if (tag === 'freetext') {
      const currentValue = getPath(experiment, question.field);
      if (currentValue !== undefined) {
        askable.push({ ...question, suggestedDefault: currentValue });
        continue;
      }
    }
    askable.push(question);
  }

  return askable;
}

/** Un-skip `questionId`, making it askable again. Mutates in place. */
function unskipQuestion(experiment, questionId) {
  const provenance = experiment && experiment.provenance;
  if (provenance && Array.isArray(provenance.skipped)) {
    provenance.skipped = provenance.skipped.filter((id) => id !== questionId);
  }
  return experiment;
}

/**
 * The exact complement of nextQuestions: every question the user has already
 * DEALT WITH -- answered (its slot now carries a STRONG tag) or explicitly
 * skipped -- carrying the value currently stored for it.
 *
 * This exists because nextQuestions deliberately drops a question the moment
 * its slot goes STRONG, which is correct for "what should I ask next" and
 * wrong as a whole UI: without this, answering a question makes it vanish with
 * no way to see what you said, let alone change it. An interview the user
 * cannot revise is a data-entry trap, not an interview.
 *
 * Returned in the question bank's own order (not priority order) so the review
 * list stays stable as answers change -- a list that reshuffles under the
 * user's cursor while they are editing it is unusable.
 */
function answeredQuestions(questions, experiment) {
  const reviewable = [];
  for (const question of questions) {
    const skipped = isSkipped(experiment, question.id);
    const tag = slotTag(experiment, question.field);
    const answered = STRONG_TAGS.has(tag);
    if (!skipped && !answered) continue;

    reviewable.push({
      ...question,
      currentValue: answered ? getPath(experiment, question.field) : undefined,
      status: skipped ? 'skipped' : 'answered',
      tag,
    });
  }
  return reviewable;
}

/**
 * Return the write descriptor for answering `question` with `value`. Does
 * NOT touch `experiment` in any way -- the store is the only writer, so it
 * alone decides (via provenance) whether this write is actually applied.
 */
function recordAnswer(experiment, question, value) {
  return { path: question.field, value, tag: question.tag || DEFAULT_ANSWER_TAG };
}

function interviewProgress(questions, experiment) {
  let answered = 0;
  let skipped = 0;
  for (const question of questions) {
    if (isSkipped(experiment, question.id)) {
      skipped += 1;
      continue;
    }
    if (STRONG_TAGS.has(slotTag(experiment, question.field))) {
      answered += 1;
    }
  }
  const askable = nextQuestions(questions, experiment, questions.length).length;
  return { answered, askable, skipped, total: questions.length };
}

// The staged progression ladder (idea -> pilot -> validate controls -> fix
// acquisition settings -> advanced modality): a genuinely new knowledge type
// that appears in NO planning document anywhere -- unlike the advisor and
// controls tiers, which are the remaining pieces of an already-scoped plan
// (docs/plans/planner-web-assay-tier.md), this is new scope from the user's
// own request for a deterministic "how to run this project" walkthrough.
//
// Same discipline as engine/advisor.js and engine/controls.js: rules are
// DATA in web/kb/stages.json, evaluated by the existing predicate engine --
// code knows a rule's SHAPE (it has a `stage` and a `when`); only data knows
// its CONTENT (e.g. "STED is bleach-prone, pilot on confocal first"). A
// STED study is told to pilot on confocal/widefield BY RULE, not by fixed
// prose that can't see what the user actually entered.
//
// Two kinds of content here, unlike advisor/controls' single flat rule
// list: a fixed BACKBONE of five stages (every study sees the same ladder,
// in the same order -- the ladder itself is not conditional, only which
// EXTRA notes attach to each rung), and a rule list that adds study-specific
// notes onto individual stages.
//
// Pure module: no DOM, no store. Imports only evaluatePredicate.


const STAGE_ID_PATTERN = /^[a-z0-9][a-z0-9-]*$/;
const MIN_STAGE_BODY_LENGTH = 40;
const MIN_NOTE_LENGTH = 40;

const KNOWN_STAGE_KEYS = new Set(['id', 'order', 'title', 'body']);
const KNOWN_STAGE_RULE_KEYS = new Set(['id', 'stage', 'when', 'note', 'priority']);

function stageIssue(field, message) {
  return { field, message, severity: 'error' };
}

/** Mirrors advisor.js's normalizeAdvisorRule field-by-field, for one stage entry. */
function normalizeStage(entry, index, issues, seenIds) {
  if (entry === null || typeof entry !== 'object' || Array.isArray(entry)) {
    issues.push(stageIssue(`stages[${index}]`, 'stage entry is not an object'));
    return null;
  }
  for (const key of Object.keys(entry)) {
    if (!KNOWN_STAGE_KEYS.has(key)) {
      issues.push(stageIssue(`stages[${index}]`, `stage entry has an unrecognized property '${key}' -- it will be ignored`));
    }
  }

  const id = typeof entry.id === 'string' ? entry.id.trim() : '';
  if (!id) {
    issues.push(stageIssue(`stages[${index}]`, 'stage entry is missing a non-empty id'));
    return null;
  }
  if (!STAGE_ID_PATTERN.test(id)) {
    issues.push(stageIssue(id, `stage id '${id}' must match ${STAGE_ID_PATTERN}`));
    return null;
  }
  if (seenIds.has(id)) {
    issues.push(stageIssue(id, `duplicate stage id '${id}'`));
    return null;
  }

  const order = typeof entry.order === 'number' && Number.isFinite(entry.order) ? entry.order : null;
  if (order === null) {
    issues.push(stageIssue(id, "stage 'order' must be a finite number"));
    return null;
  }

  const title = typeof entry.title === 'string' ? entry.title.trim() : '';
  if (!title) {
    issues.push(stageIssue(id, 'stage entry is missing a non-empty title'));
    return null;
  }

  const body = typeof entry.body === 'string' ? entry.body.trim() : '';
  if (body.length < MIN_STAGE_BODY_LENGTH) {
    issues.push(stageIssue(id, `stage 'body' must be at least ${MIN_STAGE_BODY_LENGTH} characters -- got ${body.length}`));
    return null;
  }

  seenIds.add(id);
  return { id, order, title, body };
}

/** Mirrors normalizeStage; `knownStageIds` is the set of stage ids already loaded from the SAME pack. */
function normalizeStageRule(entry, index, issues, seenIds, knownStageIds) {
  if (entry === null || typeof entry !== 'object' || Array.isArray(entry)) {
    issues.push(stageIssue(`rules[${index}]`, 'stage rule is not an object'));
    return null;
  }
  for (const key of Object.keys(entry)) {
    if (!KNOWN_STAGE_RULE_KEYS.has(key)) {
      issues.push(stageIssue(`rules[${index}]`, `stage rule has an unrecognized property '${key}' -- it will be ignored`));
    }
  }

  const id = typeof entry.id === 'string' ? entry.id.trim() : '';
  if (!id) {
    issues.push(stageIssue(`rules[${index}]`, 'stage rule is missing a non-empty id'));
    return null;
  }
  if (!STAGE_ID_PATTERN.test(id)) {
    issues.push(stageIssue(id, `stage rule id '${id}' must match ${STAGE_ID_PATTERN}`));
    return null;
  }
  if (seenIds.has(id)) {
    issues.push(stageIssue(id, `duplicate stage rule id '${id}'`));
    return null;
  }

  const stage = typeof entry.stage === 'string' ? entry.stage.trim() : '';
  if (!stage || !knownStageIds.has(stage)) {
    issues.push(stageIssue(id, `stage rule references unknown stage '${stage}' (known: ${[...knownStageIds].join(', ')})`));
    return null;
  }

  // Same reasoning as advisor.js/controls.js: `when` is required and must
  // not be the literal `true`, since evaluatePredicate(undefined, ...) is
  // true and would silently make a note appear for every study.
  if (entry.when === undefined || entry.when === true) {
    issues.push(stageIssue(id, "stage rule 'when' is required and must not be the literal true"));
    return null;
  }

  const note = typeof entry.note === 'string' ? entry.note.trim() : '';
  if (note.length < MIN_NOTE_LENGTH) {
    issues.push(stageIssue(id, `stage rule 'note' must be at least ${MIN_NOTE_LENGTH} characters -- got ${note.length}`));
    return null;
  }

  seenIds.add(id);
  return {
    id,
    stage,
    when: entry.when,
    note,
    priority: typeof entry.priority === 'number' ? entry.priority : 0,
  };
}

/**
 * Validate and normalize a raw stages pack into {stages, rules, issues}.
 * `stages` is sorted by `order` ascending. TOTAL: never throws.
 */
function loadStages(raw) {
  const issues = [];

  if (raw === undefined || raw === null) {
    issues.push(stageIssue('stages', 'stages pack is missing -- run tools/export_markers_kb.py'));
    return { stages: [], rules: [], issues };
  }
  if (typeof raw !== 'object' || Array.isArray(raw) || !Array.isArray(raw.stages) || !Array.isArray(raw.rules)) {
    issues.push(stageIssue('stages', "stages pack must be an object with 'stages' and 'rules' arrays"));
    return { stages: [], rules: [], issues };
  }

  const seenStageIds = new Set();
  const stages = [];
  raw.stages.forEach((entry, index) => {
    const stage = normalizeStage(entry, index, issues, seenStageIds);
    if (stage) stages.push(stage);
  });
  stages.sort((a, b) => a.order - b.order);

  const knownStageIds = new Set(stages.map((s) => s.id));
  const seenRuleIds = new Set();
  const rules = [];
  raw.rules.forEach((entry, index) => {
    const rule = normalizeStageRule(entry, index, issues, seenRuleIds, knownStageIds);
    if (rule) rules.push(rule);
  });

  return { stages, rules, issues };
}

/**
 * The stage rules relevant to the CURRENT `experiment`, in ascending
 * priority order, ties in declaration order. TOTAL like evaluatePredicate.
 * Kept separate from buildLadder below so a caller (or a test) can inspect
 * which notes fired without needing a full stage backbone in hand.
 */
function selectStageNotes(rules, experiment) {
  const matching = rules.filter((rule) => {
    try {
      return evaluatePredicate(rule.when, experiment);
    } catch {
      return false;
    }
  });
  return matching
    .map((rule, index) => ({ rule, index }))
    .sort((a, b) => a.rule.priority - b.rule.priority || a.index - b.index)
    .map(({ rule }) => rule);
}

/**
 * Build the full ladder for `experiment`: every stage, in order, with its
 * fixed `body` plus the study-specific `notes` (selectStageNotes, scoped to
 * that one stage) that fired for it. Every stage is always present, even
 * with zero notes -- the ladder's backbone is not conditional, only its
 * per-stage extras are.
 */
function buildLadder(stages, rules, experiment) {
  const fired = selectStageNotes(rules, experiment);
  return stages.map((stage) => ({
    ...stage,
    notes: fired.filter((rule) => rule.stage === stage.id).map((rule) => rule.note),
  }));
}
  // ---- src/engine/kbpack.js ----
// Shapes the raw globalThis.__MICRONAUT_KB__ object into what the app
// actually consumes: the marker index, the raw question bank, and the
// loaded advisor rules.
//
// This exists so that "did we remember to wire up a new KB key" stops being
// an untestable claim. Before this module, that wiring lived inline inside
// main.js's loadAppKb, and main.js calls init() at module scope -- so
// loadAppKb could never be imported by a test. The project has already
// shipped the failure mode this structurally prevents: a new question-bank

 * deliberately types a different modality into the Name builder keeps it.

 *   { row, groupLabel: '', filename: null, error }  if the id scheme is broken
 *

 * only where the design actually has an opinion. That asymmetry is the whole
 * point: with a design, the arm/replicate columns come from the design and
 * vary per row; with NO design (zero arms, zero factors, no replicates),

        ? buildSampleId(row, design.idScheme)
        : buildGroupLabel(row, design);
    } catch (err) {

      // it per-row too rather than throwing, so one bad scheme cannot blank
      // the entire table.
      return { row, groupLabel: '', filename: null, error: err.message };

    const raw = { ...namingFields };

    if (row.techRep !== null && row.techRep !== undefined) {

// A fat-fingered "Add assay" click cannot hang the browser building an
// unbounded switcher/list -- mirrors conditions.js's MAX_CONDITION_ROWS
// discipline. Not a realistic ceiling; a real study has single-digit to
// low-tens of assays.
const MAX_STUDY_ROWS = 50;

/**
 * Detect filename collisions ACROSS assays: two assays whose base name
 * (date/modality/exptype/markers/magnification) renders identically would
 * silently overwrite each other's files on disk, even though conditionIssues
 * (which only ever sees ONE assay, via assayView) structurally cannot catch
 * this -- see docs/plans/planner-web-assay-tier.md, Decision 4.
 *
 * Takes the RAW experiment (not an assayView), since cross-assay comparison
 * is the one thing that view deliberately cannot do -- and `baseTemplate`
 * as a parameter for the same reason `config` already is (see this file's
 * header): BASE_TEMPLATE lives in ui/steps/naming.js, and engine/ must never
 * import from ui/.

 * This also organically covers "exptype is required once assays.length > 1"
 * (also Decision 4) without a separate rule: two assays that both leave
 * exptype blank both render the SAME 'UNKNOWN' base name and collide exactly
 * like two assays that typed the same value would.
 *

 * determined," matching conditions.js's conditionIssues discipline.

function studyNameIssues(experiment, config, baseTemplate) {
  const assays = experiment && Array.isArray(experiment.assays) ? experiment.assays : [];
  const issues = [];

  if (assays.length > MAX_STUDY_ROWS) {
    issues.push({
      field: 'assays',
      message: `Study has ${assays.length} assays, exceeding the cap of ${MAX_STUDY_ROWS}.`,
      severity: 'error',
    });
  }

  // A collision needs at least two assays to compare; with zero or one,
  // there is nothing to collide WITH.
  if (assays.length <= 1) return issues;

  const baseConfig = { ...config, template: baseTemplate };
  const byBaseName = new Map(); // base name -> [assay labels]
  assays.forEach((assay, index) => {
    const view = assayView(experiment, assay.id);
    const finalized = finalizeFields(PLAN_SOURCE_NAME, effectiveNamingFields(view), config);
    const base = renderName(finalized, baseConfig);
    // Same fallback every other assay-list surface uses (ui/shell.js's
    // switcher, ui/steps/study.js's list): a raw shortId would be
    // technically correct but unreadable in an issue message meant for a
    // person, not a debugger.
    const label = (assay && assay.label) || `Assay ${index + 1}`;
    if (!byBaseName.has(base)) byBaseName.set(base, []);
    byBaseName.get(base).push(label);

  for (const [base, labels] of byBaseName) {
    if (labels.length > 1) {
      issues.push({
        field: 'exptype',
        message: `Assays ${labels.join(', ')} all produce the identical base name '${base}' -- give them different experiment types, or every file in one will overwrite the other.`,
        severity: 'error',
      });
    }
  }

  return issues;
}

// Renders a study document (engine/studydoc.js) to a mermaid flowchart
// SOURCE STRING -- Study branching to every Assay, each Assay branching to
// its readout/modality, design axis, controls, and planned-filename count.
// This is "all the branches" the user asked to visualize: every assay and
// every imaging group in one diagram, sized to what they actually entered.
//
// This module renders TEXT, not a diagram -- no mermaid library is loaded
// (the app is one self-contained file with zero deps, so mermaid cannot run
// inside it). The text is embedded in a ```mermaid fenced block by
// render/markdown.js, where GitHub/Notion/the Artifact viewer render it.
//
// GitHub's mermaid dialect is stricter than some renderers: every label is
// quoted, and quotes/newlines inside a label are escaped rather than passed
// through raw -- see mermaidLabel below.
//
// Pure module: no DOM. Takes the studydoc model, nothing else.

/** Quote and escape one label for a mermaid node/edge. Never throws. */
function mermaidLabel(text) {
  const raw = text === null || text === undefined ? '' : String(text);
  // Collapse newlines (a multi-line narrative or note would otherwise break
  // the diagram's line-oriented syntax) and escape the one character that
  // would end the quoted label early.
  const flat = raw.replace(/\s+/g, ' ').trim().replace(/"/g, "'");
  return `"${flat}"`;

/** A safe, unique mermaid node id -- alnum/underscore only, mermaid IDs cannot contain spaces or punctuation. */
function nodeId(...parts) {
  return parts.join('_').replace(/[^A-Za-z0-9_]/g, '_');
}

function truncate(text, max) {
  return text.length > max ? `${text.slice(0, max - 1)}…` : text;
}

function designSummary(design) {
  const parts = [];
  if (design.arms.length > 0) parts.push(`${design.arms.length} arm(s)`);
  for (const factor of design.factors) {
    parts.push(`${factor.name || 'factor'} × ${factor.levels.length}`);
  }
  if (design.biologicalReplicates) parts.push(`${design.biologicalReplicates} bio rep(s)`);
  if (design.technicalReplicates) parts.push(`${design.technicalReplicates} tech rep(s)`);
  return parts.length > 0 ? parts.join(', ') : 'no design axes set yet';
}

/**
 * Render `doc` (buildStudyDocument's output) to a mermaid flowchart source
 * string. TOTAL: a document with zero assays still renders a valid (if
 * sparse) diagram -- an empty flowchart is not an error, just an empty study.
 */
function renderMermaid(doc) {
  const lines = ['flowchart TD'];
  const studyTitle = doc.study.title || doc.study.researchQuestion || 'Study';
  lines.push(`  STUDY[${mermaidLabel(truncate(studyTitle, 80))}]`);

  for (const assay of doc.assays) {
    const aId = nodeId('assay', assay.index);
    lines.push(`  STUDY --> ${aId}[${mermaidLabel(assay.label)}]`);

    const readoutId = nodeId(aId, 'readout');
    const readoutText =
      assay.readout.state === 'known'
        ? `Readout: ${assay.readout.label}`
        : assay.readout.state === 'unrecognized'
          ? `Readout: ${assay.readout.text} (unrecognized)`
          : 'Readout: not answered yet';
    lines.push(`  ${aId} --> ${readoutId}(${mermaidLabel(readoutText)})`);

    const modId = nodeId(aId, 'modality');
    lines.push(`  ${aId} --> ${modId}(${mermaidLabel(`Modality: ${assay.modality || 'not answered yet'}`)})`);

    const designId = nodeId(aId, 'design');
    lines.push(`  ${aId} --> ${designId}[${mermaidLabel(designSummary(assay.design))}]`);

    const controlsId = nodeId(aId, 'controls');
    const controlCount = assay.controls.panel.length + assay.controls.readout.length;
    lines.push(`  ${designId} --> ${controlsId}{${mermaidLabel(`${controlCount} control(s)`)}}`);

    const filesId = nodeId(aId, 'files');
    lines.push(`  ${controlsId} --> ${filesId}([${mermaidLabel(`${assay.filenames.length} planned filename(s)`)}])`);
  }

  return lines.join('\n');
}
  // ---- src/engine/render/markdown.js ----
// Renders a study document (engine/studydoc.js) to a Markdown string,
// embedding the mermaid diagram (render/mermaid.js) as a fenced code block.
// This is the deterministic, no-LLM textual walkthrough: idea -> pilot ->
// validate controls -> fix acquisition settings -> advanced modality, per
// assay, built entirely from the SAME model the in-app HTML view renders --
// see studydoc.js's header for why that matters.
//
// Every sentence in the output either restates a parameter the user entered
// (modality, readout, design axes) or an authored KB string (a control's
// `why`, a stage's `body`/`note`) -- nothing here is generated text.
//
// Pure module: no DOM. Takes the studydoc model plus the mermaid renderer.


function heading(level, text) {
  return `${'#'.repeat(level)} ${text}`;
}

function bulletList(items) {
  return items.map((item) => `- ${item}`).join('\n');
}

function readoutSection(readout) {
  if (readout.state === 'known') return `**Readout:** ${readout.label}`;
  if (readout.state === 'unrecognized') {
    return `**Readout:** "${readout.text}" -- not a readout this app recognizes yet; controls for it are yours to specify.`;
  }
  return '**Readout:** not answered yet.';
}

function designSection(design) {
  const lines = [];
  lines.push(`**Design:** ${design.conditionCount} planned condition row(s).`);
  if (design.arms.length > 0) lines.push(`- Arm (mutually exclusive): ${design.arms.join(', ')}`);
  for (const factor of design.factors) {
    lines.push(`- Crossing factor "${factor.name}": ${factor.levels.join(', ')}`);
  }
  if (design.biologicalReplicates) lines.push(`- Biological replicates: ${design.biologicalReplicates}`);
  if (design.technicalReplicates) lines.push(`- Technical replicates: ${design.technicalReplicates}`);
  if (design.issues.length > 0) {
    lines.push('- **Design issues:**');
    for (const issue of design.issues) lines.push(`  - (${issue.severity}) ${issue.field}: ${issue.message}`);
  }
  return lines.join('\n');
}

/**
 * Controls section: the three(-plus-one)-state rendering is mandatory
 * (Decision 5, docs/plans/planner-web-assay-tier.md) -- an empty list must
 * never render as silence, since silence reads as "this assay needs no
 * controls," the most dangerous false negative a controls advisor can
 * produce. `controls.readoutMessage` is the SINGLE resolved string for
 * whichever state applies (studydoc.js's readoutMessageFor) -- read here

 * pass on an earlier version of this commit found exactly that divergence).

  const lines = ['**Controls:**'];
  if (controls.panel.length > 0) {
    lines.push('- Panel-derived:');
    for (const c of controls.panel) lines.push(`  - **${c.title}** -- ${c.why}`);
  }
  lines.push('- Readout-specific:');
  if (controls.readout.length > 0) {
    for (const c of controls.readout) lines.push(`  - **${c.title}** -- ${c.why}`);

  return lines.join('\n');

/** The fixed 5-stage backbone, rendered ONCE for the whole study -- see studydoc.js's stageNotes comment for why. */
function ladderSection(ladder) {
  const lines = [];
  for (const stage of ladder) {
    lines.push(heading(3, stage.title));
    lines.push(stage.body);
    lines.push('');
  }
  return lines.join('\n').trimEnd();
}

/** Per-assay STUDY-SPECIFIC notes only -- omitted entirely when an assay has none, per studydoc.js's stageNotes. */
function stageNotesSection(stageNotes) {
  if (stageNotes.length === 0) return null;
  const lines = ['**Notes for this assay:**'];
  for (const stage of stageNotes) {
    lines.push(`- ${stage.stageTitle}:`);
    for (const note of stage.notes) lines.push(`  - ${note}`);
  }
  return lines.join('\n');

function filenamesSection(filenames) {
  if (filenames.length === 0) return '_No planned filenames yet -- fill in the naming fields on the Naming step._';
  return '```\n' + filenames.map((f) => f.filename || `(${f.error})`).join('\n') + '\n```';

/** Render `doc` (buildStudyDocument's output) to a Markdown string. TOTAL: never throws on a well-formed doc. */
function renderMarkdown(doc) {
  const sections = [];

  sections.push(heading(1, doc.study.title || 'Study overview'));
  sections.push(`_${doc.generatedFrom}_`);
  if (doc.study.researchQuestion) {
    sections.push(heading(2, 'Research question'));
    sections.push(doc.study.researchQuestion);
  }
  if (doc.study.armVocabulary.length > 0) {
    sections.push(`**Study-wide arm vocabulary:** ${doc.study.armVocabulary.join(', ')}`);
  }

  sections.push(heading(2, 'Study diagram'));
  sections.push('```mermaid\n' + renderMermaid(doc) + '\n```');

  if (doc.crossAssayIssues.length > 0) {
    sections.push(heading(2, 'Cross-assay issues'));
    sections.push(bulletList(doc.crossAssayIssues.map((i) => `(${i.severity}) ${i.field}: ${i.message}`)));
  }

  // Rendered ONCE for the whole study, not per assay -- see studydoc.js's
  // stageNotes comment. Assay-specific extras follow inside each assay's
  // own section below.
  sections.push(heading(2, 'How to run this project'));
  sections.push(ladderSection(doc.ladder));

  for (const assay of doc.assays) {
    sections.push(heading(2, `Assay ${assay.index}: ${assay.label}`));
    sections.push(readoutSection(assay.readout));
    sections.push(`**Modality:** ${assay.modality || 'not answered yet'}`);
    const specimenBits = [assay.specimen.organism, assay.specimen.sampleType, assay.specimen.preparation].filter(Boolean);
    if (specimenBits.length > 0) sections.push(`**Specimen:** ${specimenBits.join(', ')}`);

    sections.push(designSection(assay.design));
    sections.push(controlsSection(assay.controls));

    const notes = stageNotesSection(assay.stageNotes);
    if (notes) sections.push(notes);

    sections.push(heading(3, 'Planned filenames'));
    sections.push(filenamesSection(assay.filenames));
  }

  return sections.join('\n\n') + '\n';
}

//

// zero libraries (the app is one self-contained file, no npm deps, and
// bundling mermaid would blow the build's 2 MB size gate). Returning a pure

// layer (ui/steps/overview.js) build real SVG DOM with createElementNS +
// textContent -- never innerHTML with user data, matching shell.js's rule.
//

// per assay (Study -> each Assay -> Readout -> Modality -> Design ->

const COL_GAP = 22;

function clip(text, max) {

  for (const factor of Array.isArray(d.factors) ? d.factors : []) {
    parts.push(`${(factor && factor.name) || 'factor'} ×${(factor && factor.levels ? factor.levels.length : 0)}`);

  if (d.biologicalReplicates) parts.push(`${d.biologicalReplicates} bio`);

/**
 * Build the diagram layout model for `doc` (buildStudyDocument's output).

 * study is a valid, if sparse, map, never a throw (matching the mermaid

 *

 *   node  = { id, type, x, y, w, h, caption, value }

function buildDiagramLayout(doc) {
  const study = (doc && doc.study) || {};
  const assays = doc && Array.isArray(doc.assays) ? doc.assays : [];

  const studyBottom = studyY + NODE_H;

      id: assayId,

      value: clip(assay.label || `Assay ${i + 1}`, 22),
