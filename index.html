/**
 * Copy `text` to the clipboard. navigator.clipboard can be restricted under
 * file:// or by permissions policy even when it exists, so fall back to the
 * classic hidden-textarea + execCommand('copy') trick.
 */
async function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      // fall through to the execCommand fallback
    }
  }
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  let ok = false;
  try {
    ok = document.execCommand('copy');
  } catch {
    ok = false;
  }
  document.body.removeChild(textarea);
  return ok;
}

const namingStep = {
  id: 'naming',
  title: 'Naming',
  render(main, store, { advisor } = {}) {
    main.textContent = '';

    // Commit 1 of the assay tier (schema v3): every experiment has exactly
    // one assay and no switcher exists yet, so the active assay never
    // changes for the lifetime of one render -- caching its id once here is
    // safe, matching this file's existing snapshot-per-render idiom.
    const assayId = store.get().activeAssayId;

    const heading = document.createElement('h1');
    heading.className = 'step-heading';
    heading.textContent = 'Name builder';
    main.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'naming-grid';
    main.appendChild(grid);

    const inputs = {};
    // Pre-fill through effectiveNamingFields, not raw naming.fields, so a
    // value the user already gave elsewhere (modality, collected by the
    // interview as acquisition.modality) shows up in the box it feeds rather
    // than leaving the box blank while the filename below quietly uses it.
    // assayView() hoists the active assay's slices flat, exactly the shape
    // effectiveNamingFields (an engine function that must never learn
    // assays exist) already expects.
    const prefill = effectiveNamingFields(assayView(store.get(), assayId));
    for (const field of FIELD_DEFS) {
      const row = document.createElement('label');
      row.className = 'field-row';

      const labelText = document.createElement('span');
      labelText.className = 'field-label';
      labelText.textContent = field.label;
      row.appendChild(labelText);

      const input = document.createElement('input');
      input.type = field.type || 'text';
      input.className = 'field-input';
      input.placeholder = field.placeholder;
      // Native browser tooltip, on top of (not instead of) the placeholder
      // example above -- shows on hover regardless of whether the field is
      // filled in yet.
      if (field.hint) input.title = field.hint;
      input.value = prefill[field.key] ?? '';
      input.addEventListener('input', () => {
        // scopeWrite translates the flat v2-shaped path into this assay's
        // real (index-addressed) object path plus its stable (id-addressed)
        // provenance slotKey -- see core/assay.js's module header on why
        // the two must differ for a per-assay field.
        const { path, slotKey } = scopeWrite(store.get(), `naming.fields.${field.key}`, assayId);
        // 'user_edited' when correcting an existing WEAK/PROVISIONAL value
        // (e.g. one filled in from an accepted free-text proposal), plain
        // 'user' for a first-ever entry or one already STRONG -- see
        // core/provenance.js editTagFor.
        const existingTag = store.get().provenance?.slots?.[slotKey]?.tag ?? null;
        store.setPath(path, input.value, editTagFor(existingTag), { slotKey });
        update();
      });
      inputs[field.key] = input;
      row.appendChild(input);
      grid.appendChild(row);
    }

    // The planned-names table. With a design this is every file the
    // experiment will produce; with no design at all it is exactly one row --
    // the single name the boxes above build. Same widget either way, so the
    // step works as a standalone one-off name tool OR as the end of the full
    // workflow, with nothing to switch between.
    const plannedBox = document.createElement('div');
    plannedBox.className = 'planned-box';

    const plannedHead = document.createElement('div');
    plannedHead.className = 'planned-head';

    const plannedLabel = document.createElement('div');
    plannedLabel.className = 'planned-label';
    plannedHead.appendChild(plannedLabel);

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'copy-button';
    copyBtn.textContent = 'Copy all';
    copyBtn.addEventListener('click', async () => {
      // One name per line: the shape that pastes straight into a lab
      // notebook, a spreadsheet column, or a shell loop.
      const ok = await copyToClipboard(currentFilenames().join('\n'));
      const original = copyBtn.textContent;
      copyBtn.textContent = ok ? 'Copied!' : 'Copy failed';
      window.setTimeout(() => {
        copyBtn.textContent = original;
      }, 1500);
    });
    plannedHead.appendChild(copyBtn);
    plannedBox.appendChild(plannedHead);

    const plannedList = document.createElement('div');
    plannedList.className = 'planned-list';
    plannedBox.appendChild(plannedList);
    main.appendChild(plannedBox);

    // advisor may be undefined (a caller that hasn't wired it, or a KB that
    // failed to load) -- createAdvicePanel([], ...) is a completely inert
    // panel (selectAdvice on an empty rule array is always empty), not a
    // missing-argument crash.
    const advicePanel = createAdvicePanel(advisor || [], 'naming');
    main.appendChild(advicePanel.element);

    const issuesList = document.createElement('ul');
    issuesList.className = 'issues-list';
    main.appendChild(issuesList);

    let lastPlanned = [];

    function currentFilenames() {
      return lastPlanned.filter((entry) => entry.filename).map((entry) => entry.filename);
    }

    function currentRawFields() {
      // Only include a field once the user has actually typed something --
      // finalizeFields merges {...config.defaults, ...raw}, so an included
      // blank string would OVERRIDE a sensible default (e.g. exptype's
      // 'UNKNOWN') with 'UNSPECIFIED' instead of leaving the default in
      // place until the field is genuinely filled in. For an OPTIONAL field
      // (group/biorep/techrep/notes) an omitted key is what makes the token
      // disappear from the name entirely -- see engine/naming.js.
      const raw = {};
      for (const field of FIELD_DEFS) {
        const value = inputs[field.key].value;
        if (!value) continue;
        const prefix = REPLICATE_PREFIXES[field.key];
        // biorep/techrep are stored as the raw typed NUMBER (so the number
        // input can redisplay it), formatted to 'B01'/'T03' only here, at the
        // boundary right before finalizeFields -- the single formatting
        // authority is formatReplicateToken, reused by the planner's per-row
        // rendering so the two paths can never format replicates differently.
        raw[field.key] = prefix ? formatReplicateToken(prefix, Number(value)) : value;
      }
      return raw;
    }

    // The single snapshot every consumer of "the current naming state" reads
    // from -- planFilenames below AND the advice panel. Reading the store
    // directly would lag by one keystroke on the very first character of a
    // field (setPath runs before update(), but a field the user has just
    // cleared must read as cleared already), and more importantly this is
    // what lets the table react to typing even when nothing has been
    // persisted yet. Extracted to one function specifically so the table and
    // the advice panel cannot evaluate two DIFFERENT experiments and quietly
    // disagree -- see docs/plans -- Advisor slice 1, Decision 4.
    function currentExperimentView() {
      const view = assayView(store.get(), assayId);
      return {
        ...view,
        naming: { ...(view.naming || {}), fields: currentRawFields() },
      };
    }

    function update() {
      const view = currentExperimentView();
      lastPlanned = planFilenames(view, NAMING_CONFIG);
      advicePanel.update(view);

      const count = lastPlanned.length;
      plannedLabel.textContent =
        count === 1 ? 'Planned filename' : `Planned filenames (${count} files)`;
      copyBtn.textContent = count === 1 ? 'Copy filename' : 'Copy all';
      copyBtn.disabled = currentFilenames().length === 0;

      plannedList.textContent = '';
      if (count === 0) {
        const empty = document.createElement('p');
        empty.className = 'planned-empty';
        empty.textContent = 'No names to show -- see the issues in the Design step.';
        plannedList.appendChild(empty);
      }
      for (const entry of lastPlanned) {
        const line = document.createElement('code');
        line.className = 'planned-name';
        line.textContent = entry.filename || `(${entry.error})`;
        plannedList.appendChild(line);
      }

      // Field-level validation runs against the fields as typed. The
      // path-length check runs per PLANNED NAME, deduped: with a design, the
      // longest row is the one that actually risks exceeding MAX_PATH, and N
      // equally-long rows should not produce N copies of one warning.
      const finalized = finalizeFields('experiment.tif', currentRawFields(), NAMING_CONFIG);
      const issues = validateFields(finalized, DEFAULT_PROFILE);
      const pathMessages = new Set();
      for (const name of currentFilenames()) {
        for (const issue of validateTargetPath(name)) pathMessages.add(issue.message);
      }

      issuesList.textContent = '';
      for (const issue of issues) {
        const li = document.createElement('li');
        li.className = 'issue issue-' + issue.severity;
        li.textContent = `${issue.field}: ${issue.message}`;
        issuesList.appendChild(li);
      }
      for (const message of pathMessages) {
        const li = document.createElement('li');
        li.className = 'issue issue-warning';
        li.textContent = `target_path: ${message}`;
        issuesList.appendChild(li);
      }
    }

    update();
  },
};
  // ---- src/ui/steps/design.js ----

// Exported so ui/steps/study.js's arm-vocabulary input parses its
// comma-separated levels list with the identical rule this step's own arm
// input uses -- one implementation, not a second copy that could quietly
// diverge on trimming/empty-filtering behavior.
function parseLevels(text) {
  return String(text)
    .split(',')
    .map((s) => s.trim())
    .filter((s) => s.length > 0);
}

/**
 * Stage 1: the stem every file in this experiment shares. Rendered once, above
 * the condition table, so the reader can see what is common before scanning
 * what differs.
 *
 * Uses effectiveNamingFields (not raw naming.fields) so the base name shows
 * the modality the interview collected as acquisition.modality, matching what
 * the per-row filenames below actually embed.
 */
function baseNameFor(store, assayId) {
  const finalized = finalizeFields(
    'experiment.tif',
    effectiveNamingFields(assayView(store.get(), assayId)),
    NAMING_CONFIG
  );
  return renderName(finalized, { ...NAMING_CONFIG, template: BASE_TEMPLATE });
}

const designStep = {
  id: 'design',
  title: 'Design',
  render(main, store, { advisor } = {}) {
    main.textContent = '';

    // Commit 1 of the assay tier (schema v3): every experiment has exactly
    // one assay and no switcher exists yet, so the active assay never
    // changes for the lifetime of one render -- caching its id once here is
    // safe, matching naming.js's identical snapshot-per-render idiom.
    const assayId = store.get().activeAssayId;

    const heading = document.createElement('h1');
    heading.className = 'step-heading';
    heading.textContent = 'Experimental design';
    main.appendChild(heading);

    function currentDesign() {
      return (
        assayView(store.get(), assayId).design || {
          groups: { levels: [] },
          factors: [],
          biologicalReplicates: null,
          technicalReplicates: null,
          idScheme: '',
          conditions: [],
        }
      );
    }

    // Every write below goes through scopeWrite: the real object address is
    // this assay's index-addressed slot (assays[n].design....), but
    // provenance tracks the stable, id-addressed slotKey -- see
    // core/assay.js's module header on why an array index is not a safe
    // provenance identity.

    // Two write paths, deliberately: editing a factor's name/levels text
    // must NOT rebuild factorsList's DOM (that would destroy the very input
    // the user is mid-keystroke in, losing focus and cursor position on
    // every character). Only a structural change -- add/remove a factor --
    // needs the list rebuilt.
    function writeFactorsData(factors) {
      const { path, slotKey } = scopeWrite(store.get(), 'design.factors', assayId);
      store.setPath(path, factors, 'user', { slotKey });
      renderConditions();
    }

    function writeFactorsStructure(factors) {
      const { path, slotKey } = scopeWrite(store.get(), 'design.factors', assayId);
      store.setPath(path, factors, 'user', { slotKey });
      renderFactors();
      renderConditions();
    }

    // The arm axis is ONE input (a comma-separated levels list, same
    // convention as a factor's levels), not a repeated row -- there is
    // nothing structural to add/remove, so unlike factors there is only ever
    // one write path and no stale-closure risk from a sibling control.
    function writeGroups(levels) {
      const { path, slotKey } = scopeWrite(store.get(), 'design.groups', assayId);
      store.setPath(path, { levels }, 'user', { slotKey });
      renderConditions();
    }

    const groupsHeading = document.createElement('div');
    groupsHeading.className = 'design-subheading';
    groupsHeading.textContent = 'Groups (arms)';
    main.appendChild(groupsHeading);

    const groupsRow = document.createElement('label');
    groupsRow.className = 'field-row';
    const groupsLabel = document.createElement('span');
    groupsLabel.className = 'field-label';
    groupsLabel.textContent = 'Mutually exclusive arms, comma-separated';
    groupsRow.appendChild(groupsLabel);
    const groupsInput = document.createElement('input');
    groupsInput.type = 'text';
    groupsInput.className = 'field-input';
    // Deliberately NOT "e.g. CT, NAM25MM, treatment": that phrasing is what
    // caused 'CT' and 'NAM50MM' to be entered as two SEPARATE factors and
    // crossed against each other in the first place. Every level here is one
    // ARM; a sample belongs to exactly one.
    groupsInput.placeholder = 'e.g. CTL, OPP -- a sample is exactly ONE of these';
    // Native browser tooltip, on top of the placeholder example above.
    groupsInput.title =
      'Your experimental groups, such as control vs. treated. Every sample belongs to exactly one -- list them separated by commas.';
    groupsInput.addEventListener('input', () => {
      writeGroups(parseLevels(groupsInput.value));
    });
    groupsRow.appendChild(groupsInput);
    main.appendChild(groupsRow);

    const factorsHeading = document.createElement('div');
    factorsHeading.className = 'design-subheading';
    factorsHeading.textContent = 'Factors';
    main.appendChild(factorsHeading);

    const factorsList = document.createElement('div');
    factorsList.className = 'factors-list';
    main.appendChild(factorsList);

    const addFactorBtn = document.createElement('button');
    addFactorBtn.type = 'button';
    addFactorBtn.className = 'add-factor-button';
    addFactorBtn.textContent = 'Add factor';
    addFactorBtn.addEventListener('click', () => {
      const design = currentDesign();
      writeFactorsStructure([...(design.factors || []), { name: '', levels: [] }]);
    });
    main.appendChild(addFactorBtn);

    // Two INDEPENDENT axes, each optional -- not every sample has both kinds
    // of replicate, and some (SEM/TEM/Raman) commonly have neither. Blank on
    // either input means that axis is omitted, not "default to 1".
    function makeReplicatesRow(label, storePath, hint) {
      const row = document.createElement('label');
      row.className = 'field-row';
      const labelEl = document.createElement('span');
      labelEl.className = 'field-label';
      labelEl.textContent = label;
      row.appendChild(labelEl);
      const input = document.createElement('input');
      input.type = 'number';
      input.className = 'field-input';
      input.min = '1';
      input.placeholder = 'blank = not used';
      input.title = hint;
      input.addEventListener('input', () => {
        const raw = input.value;
        const { path, slotKey } = scopeWrite(store.get(), storePath, assayId);
        store.setPath(path, raw === '' ? null : Number(raw), 'user', { slotKey });
        renderConditions();
      });
      row.appendChild(input);
      main.appendChild(row);
      return input;
    }

    const bioRepInput = makeReplicatesRow(
      'Biological replicates',
      'design.biologicalReplicates',
      "How many biological replicates you have -- different animals, dishes, or samples. Leave blank if this doesn't apply to your experiment."
    );
    const techRepInput = makeReplicatesRow(
      'Technical replicates',
      'design.technicalReplicates',
      "How many technical replicates you have -- repeat measurements of the SAME sample. Leave blank if this doesn't apply."
    );

    const idSchemeRow = document.createElement('label');
    idSchemeRow.className = 'field-row';
    const idSchemeLabel = document.createElement('span');
    idSchemeLabel.className = 'field-label';
    idSchemeLabel.textContent = 'Group naming override (optional)';
    idSchemeRow.appendChild(idSchemeLabel);
    const idSchemeInput = document.createElement('input');
    idSchemeInput.type = 'text';
    idSchemeInput.className = 'field-input';
    // The old placeholder ('{genotype}R{replicate}') actively TAUGHT the
    // merge: adjacent tokens with no separator between them. Leave this blank
    // and the arm plus each factor gets its own segment automatically --
    // replicates are NOT part of this label; they render through their own
    // {biorep}/{techrep} slots regardless of this override.
    idSchemeInput.placeholder = 'Blank = one segment per arm/factor (e.g. CTL-OPP). Tokens: {group} {biorep} {techrep} + factor names';
    idSchemeInput.title = 'Advanced, optional: customize how your group name gets built into the filename. Most people can leave this blank.';
    idSchemeRow.appendChild(idSchemeInput);
    main.appendChild(idSchemeRow);

    // advisor may be undefined (a caller that hasn't wired it, or a KB that
    // failed to load) -- createAdvicePanel([], ...) is completely inert, not
    // a missing-argument crash.
    const advicePanel = createAdvicePanel(advisor || [], 'design');
    main.appendChild(advicePanel.element);

    const issuesList = document.createElement('ul');
    issuesList.className = 'issues-list';
    main.appendChild(issuesList);

    const conditionsHeading = document.createElement('div');
    conditionsHeading.className = 'design-subheading';
    conditionsHeading.textContent = 'Condition rows';
    main.appendChild(conditionsHeading);

    // Stage 1, shown once: the stem every file below shares. Without this the
    // reader has to diff two long filenames character by character to work out
    // which part identifies the experiment and which part identifies the group.
    const baseNameBox = document.createElement('div');
    baseNameBox.className = 'base-name-box';
    const baseNameLabel = document.createElement('span');
    baseNameLabel.className = 'base-name-label';
    baseNameLabel.textContent = 'Every file starts with';
    const baseNameValue = document.createElement('code');
    baseNameValue.className = 'base-name-value';
    baseNameBox.appendChild(baseNameLabel);
    baseNameBox.appendChild(baseNameValue);
    main.appendChild(baseNameBox);

    const conditionsTable = document.createElement('div');
    conditionsTable.className = 'conditions-table';
    main.appendChild(conditionsTable);

    function renderFactors() {
      const design = currentDesign();
      const factors = design.factors || [];
      factorsList.textContent = '';

      factors.forEach((factor, index) => {
        const row = document.createElement('div');
        row.className = 'factor-row';

        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.className = 'field-input factor-name';
        nameInput.placeholder = 'Factor name (e.g. genotype)';
        nameInput.title =
          'Something in your experiment that varies on its own, separate from your groups above -- for example genotype or timepoint.';
        nameInput.value = factor.name || '';
        nameInput.addEventListener('input', () => {
          // Read the CURRENT store state, not the `factors` snapshot this
          // closure was created with -- writeFactorsData deliberately does
          // NOT rebuild factorsList (to keep focus while typing), so that
          // snapshot goes stale the moment the OTHER input on this same row
          // fires first. Mapping over a stale array would silently clobber
          // whichever field was edited first with its pre-edit value.
          const latest = currentDesign().factors || [];
          const next = latest.map((f, i) => (i === index ? { ...f, name: nameInput.value } : f));
          writeFactorsData(next);
        });
        row.appendChild(nameInput);

        const levelsInput = document.createElement('input');
        levelsInput.type = 'text';
        levelsInput.className = 'field-input factor-levels';
        levelsInput.placeholder = 'Levels, comma-separated (e.g. WT, KO)';
        levelsInput.title =
          'The different values this factor can take, separated by commas -- for example WT, KO for a genotype factor.';
        levelsInput.value = (factor.levels || []).join(', ');
        levelsInput.addEventListener('input', () => {
          const latest = currentDesign().factors || [];
          const next = latest.map((f, i) =>
            i === index ? { ...f, levels: parseLevels(levelsInput.value) } : f
          );
          writeFactorsData(next);
        });
        row.appendChild(levelsInput);

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-factor-button';
        removeBtn.textContent = 'Remove';
        removeBtn.addEventListener('click', () => {
          // Same reason as the name/levels handlers above: read the CURRENT
          // store state, not the `factors` snapshot from this renderFactors()
          // call. Any name/levels edit made on ANOTHER row since this row was
          // drawn used writeFactorsData (no rebuild), so this closure's
          // `factors` array is stale and filtering it would silently discard
          // those edits when written back.
          const latest = currentDesign().factors || [];
          writeFactorsStructure(latest.filter((_, i) => i !== index));
        });
        row.appendChild(removeBtn);

        factorsList.appendChild(row);
      });
    }

    function renderConditions() {
      const design = currentDesign();
      const issues = conditionIssues(design);

      // renderConditions() is the verified funnel EVERY write path in this
      // step actually calls -- factor edits, arm/replicate edits, the id
      // scheme input, and mount via renderAll() (which itself calls this).
      // renderAll() is called exactly once, at mount, so hooking the advice
      // panel there instead would render it once and silently never update
      // again. Reading store.get() fresh on every call (never a cached
      // snapshot) matters because store.patch() rebinds the experiment
      // root. assayView() hoists this assay's slices flat -- advisor rules
      // read acquisition.modality etc. and must never learn assays exist.
      advicePanel.update(assayView(store.get(), assayId));

      issuesList.textContent = '';
      for (const issue of issues) {
        const li = document.createElement('li');
        li.className = 'issue issue-' + issue.severity;
        li.textContent = `${issue.field}: ${issue.message}`;
        issuesList.appendChild(li);
      }

      baseNameValue.textContent = baseNameFor(store, assayId);

      conditionsTable.textContent = '';
      // The SAME planner the Name builder renders its table from, so the two
      // steps cannot drift: one implementation, two views of it.
      const planned = planFilenames(assayView(store.get(), assayId), NAMING_CONFIG);
      if (planned.length === 0) {
        // With zero factors AND zero arm levels this design still expands to
        // exactly one unconditioned row (see conditions.js), so an empty
        // TABLE here always means a real issue is already listed above (a
        // factor/arm with zero usable levels, or the row cap) -- there is no
        // separate "you haven't added anything yet" case to explain.
        const empty = document.createElement('p');
        empty.className = 'conditions-empty';
        empty.textContent = 'No rows to show -- see the issues above.';
        conditionsTable.appendChild(empty);
        return;
      }

      const pathMessages = new Set();
      for (const entry of planned) {
        const row = entry.row;
        const rowEl = document.createElement('div');
        rowEl.className = 'condition-row';

        const summary = document.createElement('span');
        summary.className = 'condition-summary';
        const parts = [];
        if (row.group !== null && row.group !== undefined) parts.push(`group=${row.group}`);
        parts.push(...Object.entries(row.factorLevels).map(([k, v]) => `${k}=${v}`));
        const bioToken = formatReplicateToken('B', row.bioRep);
        const techToken = formatReplicateToken('T', row.techRep);
        if (bioToken) parts.push(`bio=${bioToken}`);
        if (techToken) parts.push(`tech=${techToken}`);
        summary.textContent = parts.join(', ') || '(unconditioned)';
        rowEl.appendChild(summary);

        const sampleIdEl = document.createElement('code');
        sampleIdEl.className = 'condition-sample-id';
        sampleIdEl.textContent = entry.groupLabel;
        const filenameEl = document.createElement('code');
        filenameEl.className = 'condition-filename';
        // planFilenames never throws for a bad id scheme -- it returns the
        // message per row -- so one malformed scheme cannot blank the table.
        filenameEl.textContent = entry.filename || `(${entry.error})`;
        if (entry.filename) {
          // The Design step is where MANY names are generated at once, so it
          // is where a long base name actually bites. validateTargetPath is
          // reused unchanged, never reimplemented.
          for (const issue of validateTargetPath(entry.filename)) {
            pathMessages.add(issue.message);
          }
        }
        rowEl.appendChild(sampleIdEl);
        rowEl.appendChild(filenameEl);

        conditionsTable.appendChild(rowEl);
      }

      // Rendered as its own trailing group rather than interleaved with the
      // design issues above: a path-length warning is about the FILENAME
      // (and where it will land on disk), not the design's own structure, and
      // deduping identical messages keeps N identically-long rows from
      // producing N copies of the same warning.
      for (const message of pathMessages) {
        const li = document.createElement('li');
        li.className = 'issue issue-warning';
        li.textContent = `target_path: ${message}`;
        issuesList.appendChild(li);
      }
    }

    function renderAll() {
      const design = currentDesign();
      groupsInput.value = (design.groups && design.groups.levels ? design.groups.levels : []).join(', ');
      bioRepInput.value = design.biologicalReplicates ?? '';
      techRepInput.value = design.technicalReplicates ?? '';
      idSchemeInput.value = design.idScheme || '';
      renderFactors();
      renderConditions();
    }

    idSchemeInput.addEventListener('input', () => {
      const { path, slotKey } = scopeWrite(store.get(), 'design.idScheme', assayId);
      store.setPath(path, idSchemeInput.value, 'user', { slotKey });
      renderConditions();
    });

    renderAll();
  },
};
  // ---- src/ui/steps/overview.js ----
// The Overview step: the shareable study diagram + the deterministic,
// no-LLM textual walkthrough (engine/studydoc.js -- one document model,
// three renderers: this HTML tree, the Markdown export, and the mermaid
// diagram embedded inside it). Last in main.js's steps array -- everything
// it shows is a READ over the other steps' data, never a place new facts
// are entered.
//
// The study map at the top is a self-drawn inline SVG (buildDiagramSvg
// below, over engine/render/svgDiagram.js's pure layout) -- no diagramming
// library, since the app is one self-contained file with zero npm deps and
// a strict no-external-asset rule (bundling mermaid would also blow the
// build's 2 MB size gate). The Markdown export additionally embeds a
// ```mermaid block, the exact-branching form GitHub/Notion/the Artifact
// viewer render natively; the in-app SVG is the at-a-glance visual. Both are
// renderers over the one studydoc model, so they cannot disagree.
//
// No advice panel here, matching study.js's own reasoning: every advisor
// rule keys on a per-assay fact already shown on Describe/Design/Naming;
// this step summarizes, it does not re-surface guidance a second time.


const SVG_NS = 'http://www.w3.org/2000/svg';

/**
 * Paint the diagram layout (engine/render/svgDiagram.js) into a real SVG
 * element via createElementNS + textContent -- never innerHTML with the
 * user's own study title / labels (shell.js's standing rule). The returned
 * <svg> is self-contained (its own xmlns + viewBox), so serializing it for
 * the download button below yields a valid standalone .svg file.
 */
function buildDiagramSvg(layout) {
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('xmlns', SVG_NS);
  svg.setAttribute('viewBox', `0 0 ${layout.width} ${layout.height}`);
  svg.setAttribute('width', String(layout.width));
  svg.setAttribute('height', String(layout.height));
  svg.setAttribute('class', 'study-map-svg');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Study map: the study branching to each assay and its readout, modality, design, controls, and planned filenames.');

  // One arrowhead marker, referenced by every edge.
  const defs = document.createElementNS(SVG_NS, 'defs');
  const marker = document.createElementNS(SVG_NS, 'marker');
  marker.setAttribute('id', 'study-map-arrow');
  marker.setAttribute('viewBox', '0 0 10 10');
  marker.setAttribute('refX', '9');
  marker.setAttribute('refY', '5');
  marker.setAttribute('markerWidth', '6');
  marker.setAttribute('markerHeight', '6');
  marker.setAttribute('orient', 'auto-start-reverse');
  const arrowPath = document.createElementNS(SVG_NS, 'path');
  arrowPath.setAttribute('d', 'M 0 0 L 10 5 L 0 10 z');
  arrowPath.setAttribute('class', 'study-map-arrowhead');
  marker.appendChild(arrowPath);
  defs.appendChild(marker);
  svg.appendChild(defs);

  // Edges first, so nodes paint on top of the lines.
  for (const edge of layout.edges) {
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', String(edge.x1));
    line.setAttribute('y1', String(edge.y1));
    line.setAttribute('x2', String(edge.x2));
    line.setAttribute('y2', String(edge.y2));
    line.setAttribute('class', 'study-map-edge');
    line.setAttribute('marker-end', 'url(#study-map-arrow)');
    svg.appendChild(line);
  }

  for (const node of layout.nodes) {
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('class', `study-map-node study-map-node-${node.type}`);

    const rect = document.createElementNS(SVG_NS, 'rect');
    rect.setAttribute('x', String(node.x));
    rect.setAttribute('y', String(node.y));
    rect.setAttribute('width', String(node.w));
    rect.setAttribute('height', String(node.h));
    rect.setAttribute('rx', '8');
    rect.setAttribute('class', 'study-map-box');
    g.appendChild(rect);

    const caption = document.createElementNS(SVG_NS, 'text');
    caption.setAttribute('x', String(node.x + node.w / 2));
    caption.setAttribute('y', String(node.y + 18));
    caption.setAttribute('text-anchor', 'middle');
    caption.setAttribute('class', 'study-map-caption');
    caption.textContent = node.caption;
    g.appendChild(caption);

    const value = document.createElementNS(SVG_NS, 'text');
    value.setAttribute('x', String(node.x + node.w / 2));
    value.setAttribute('y', String(node.y + 36));
    value.setAttribute('text-anchor', 'middle');
    value.setAttribute('class', 'study-map-value');
    value.textContent = node.value;
    g.appendChild(value);

    svg.appendChild(g);
  }

  return svg;
}

function readoutLine(readout) {
  if (readout.state === 'known') return `Readout: ${readout.label}`;
  if (readout.state === 'unrecognized') return `Readout: "${readout.text}" (not recognized yet)`;
  return 'Readout: not answered yet';
}

function designLine(design) {
  const parts = [];
  if (design.arms.length > 0) parts.push(`arms: ${design.arms.join(', ')}`);
  for (const factor of design.factors) parts.push(`${factor.name}: ${factor.levels.join(', ')}`);
  if (design.biologicalReplicates) parts.push(`${design.biologicalReplicates} bio rep(s)`);
  if (design.technicalReplicates) parts.push(`${design.technicalReplicates} tech rep(s)`);
  const base = parts.length > 0 ? parts.join(' · ') : 'no design axes set yet';
  return `${design.conditionCount} planned row(s) — ${base}`;
}

function appendLabeledNode(parent, className, text) {
  const node = document.createElement('div');
  node.className = className;
  node.textContent = text;

}

/**
 * The controls sub-tree: THREE(-plus-one)-STATE rendering is mandatory
 * (Decision 5, docs/plans/planner-web-assay-tier.md) -- an empty controls
 * list must never look identical to "nothing to show", since silence there
 * reads as "this assay needs no controls," the most dangerous false
 * negative a controls advisor can produce. `controls.readoutMessage` is the
 * SINGLE resolved string for whichever state applies
 * (engine/studydoc.js's readoutMessageFor) -- read here verbatim, never
 * re-derived, so this can never disagree with render/markdown.js's
 * rendering of the identical fact. An adversarial pass on an earlier
 * version of this commit found exactly that divergence (a recognized
 * readout with zero matching rules read as "not recognized" in one
 * renderer and "no guidance yet" in the other) -- lesson 49/50's failure
 * shape recurring inside the commit that names those lessons as its
 * motivation. This is the structural fix, not a second discipline.
 */
function renderControlsNode(parent, controls) {

    const list = document.createElement('ul');
    list.className = 'overview-controls-list';
    for (const control of controls.panel) {
      const li = document.createElement('li');
      const strong = document.createElement('strong');
      strong.textContent = control.title;
      li.appendChild(strong);
      li.appendChild(document.createTextNode(` — ${control.why}`));
      list.appendChild(li);
    }
    box.appendChild(list);
  }

  const readoutLabel = document.createElement('div');
  readoutLabel.className = 'overview-controls-group-label';
  readoutLabel.textContent = 'Readout-specific';
  box.appendChild(readoutLabel);

  if (controls.readout.length > 0) {

      li.appendChild(document.createTextNode(` — ${control.why}`));

function renderAssayNode(parent, assay) {

  appendLabeledNode(box, 'overview-node', `Modality: ${assay.modality || 'not answered yet'}`);
  const specimenBits = [assay.specimen.organism, assay.specimen.sampleType, assay.specimen.preparation].filter(Boolean);
  if (specimenBits.length > 0) {
    appendLabeledNode(box, 'overview-node', `Specimen: ${specimenBits.join(', ')}`);

  appendLabeledNode(box, 'overview-node', designLine(assay.design));

    line.textContent = entry.filename || `(${entry.error})`;
    filesList.appendChild(line);
  }
  box.appendChild(filesList);

  parent.appendChild(box);
}

// The Study step: the one study-level surface, sitting above every assay.
// First in main.js's steps array -- the landing page, and the
// discoverability surface for "this app can model more than one assay,"
// per docs/plans/planner-web-assay-tier.md's commit-2 sequencing.
//
// Rename, arm-vocabulary authoring, and the cross-assay collision check all
// live here rather than in the always-visible switcher (ui/shell.js), which
// only owns switch/add/delete -- this step is where a user reviews and
// corrects study SHAPE, not just navigates it.
//
// No advice panel: every advisor rule keys on a per-assay fact
// (acquisition.modality, etc.); study shape is not a guidance surface the KB
// models today.


/**
 * "N of M assays use LEVEL, LEVEL" -- how many assays' current arm axis
 * matches the study's vocabulary verbatim. Order-sensitive (JSON.stringify
 * on the array): a vocabulary and an assay that list the same arms in a
 * different order are NOT considered converged, since order is part of what
 * "matches the template" means here, not incidental.
 *
 * Returns null when the vocabulary is empty -- there is nothing for an
 * assay's arms to converge TO yet, so there is nothing useful to report.
 */
function armDivergenceSummary(experiment) {
  const vocabLevels =
    experiment.armVocabulary && Array.isArray(experiment.armVocabulary.levels)
      ? experiment.armVocabulary.levels
      : [];
  if (vocabLevels.length === 0) return null;

  const assays = Array.isArray(experiment.assays) ? experiment.assays : [];
  const vocabKey = JSON.stringify(vocabLevels);
  const matching = assays.filter((assay) => {
    const levels = assay.design && assay.design.groups && assay.design.groups.levels;
    return JSON.stringify(Array.isArray(levels) ? levels : []) === vocabKey;
  }).length;

  const total = assays.length;
  return `${matching} of ${total} assay${total === 1 ? '' : 's'} use ${vocabLevels.join(', ')}`;
}

/**
 * Mirrors design.js's baseNameFor exactly, for one assay by id. Named
 * differently (studyAssayBaseName, not baseNameFor) because the
 * single-file inliner (tools/build_single_file.py) concatenates every
 * module's top-level names into ONE shared scope -- two modules each
 * declaring a private `baseNameFor` would collide the moment they're
 * flattened together, even though each is module-private in source.
 */
function studyAssayBaseName(store, assayId) {
  const finalized = finalizeFields(
    'experiment.tif',
    effectiveNamingFields(assayView(store.get(), assayId)),
    NAMING_CONFIG
  );
  return renderName(finalized, { ...NAMING_CONFIG, template: BASE_TEMPLATE });
}

const studyStep = {
  id: 'study',
  title: 'Study',
  render(main, store, { showToast, router } = {}) {
    main.textContent = '';

    const heading = document.createElement('h1');
    heading.className = 'step-heading';
    heading.textContent = 'Study';
    main.appendChild(heading);

    // --- Research question -------------------------------------------
    const rqRow = document.createElement('label');
    rqRow.className = 'field-row';
    const rqLabel = document.createElement('span');

    rqInput.type = 'text';
    rqInput.className = 'field-input';
    rqInput.placeholder = 'e.g. Does an oregano-plasma coating reduce bacterial load on wound dressings?';
    rqInput.title = 'What the whole study is trying to answer -- every assay below exists in service of this one question.';
    rqInput.value = store.get().researchQuestion || '';
    rqInput.addEventListener('input', () => {
      // Study-level, unscoped -- same one-liner pattern describe.js already
      // uses for narrative.text. Nothing else ever writes this field, so a
      // plain 'user' tag is harmless.
      store.setPath('researchQuestion', rqInput.value, 'user');
    });
    rqRow.appendChild(rqInput);

    // --- Arm vocabulary -------------------------------------------------

    vocabHeading.className = 'design-subheading';
    vocabHeading.textContent = 'Arm vocabulary';

    const vocabRow = document.createElement('label');

    const vocabLabel = document.createElement('span');
    vocabLabel.className = 'field-label';
    vocabLabel.textContent = 'Default arms for new assays, comma-separated';
    vocabRow.appendChild(vocabLabel);
    const vocabInput = document.createElement('input');
    vocabInput.type = 'text';
    vocabInput.className = 'field-input';
    vocabInput.placeholder = 'e.g. CTL, OPP';
    vocabInput.title =
      'A TEMPLATE, not a shared axis -- each assay gets its own copy when created, and can diverge from it freely. Used to seed new assays and by "Apply to all assays" below.';
    vocabInput.value = (store.get().armVocabulary && store.get().armVocabulary.levels || []).join(', ');
    vocabInput.addEventListener('input', () => {
      // Study-level, unscoped -- like researchQuestion above, nothing else
      // ever writes this field, so scopeWrite would only pass it through

      // through a no-op.
      store.setPath('armVocabulary', { levels: parseLevels(vocabInput.value) }, 'user');

    applyBtn.addEventListener('click', () => {
      const experiment = store.get();
      const levels = (experiment.armVocabulary && experiment.armVocabulary.levels) || [];
      const assays = Array.isArray(experiment.assays) ? experiment.assays : [];
      let applied = 0;
      let skipped = 0;
      for (const assay of assays) {
        const { path, slotKey } = scopeWrite(store.get(), 'design.groups', assay.id);
        // setPath refuses (returns false) when this assay's groups already
        // carry a STRONG ('user'/'user_edited') tag -- so this is naturally
        // "fill in the assays that haven't customized their arms yet," never
        // a blind overwrite. See core/store.js's setValueAtPath docstring.
        const ok = store.setPath(path, { levels: [...levels] }, 'kb-default', { slotKey });
        if (ok) applied += 1;
        else skipped += 1;
      }
      if (showToast) {
        showToast(
          skipped > 0
            ? `Applied to ${applied} assay(s); skipped ${skipped} that already have custom arms.`

      assays.forEach((assay, index) => {

        labelInput.value = assay.label || '';
        labelInput.addEventListener('input', () => {
          const { path, slotKey } = scopeWrite(store.get(), 'label', assay.id);
          store.setPath(path, labelInput.value, 'user', { slotKey });
          // Only the issues list, NOT renderAssayList() -- rebuilding this
          // row's own DOM mid-keystroke would destroy the very input the
          // user is typing in, losing focus and cursor position on every
          // character (the same stale-render hazard design.js's factor

          renderIssues();
        });
        row.appendChild(labelInput);

        const baseNameEl = document.createElement('code');
        baseNameEl.className = 'base-name-value study-assay-basename';
        baseNameEl.textContent = studyAssayBaseName(store, assay.id);
        row.appendChild(baseNameEl);

        // Grouped and pinned to the row's end (margin-left: auto on the
        // group, not the individual buttons) -- otherwise each button's

        const actions = document.createElement('div');
        actions.className = 'study-assay-actions';

        gotoBtn.type = 'button';
        gotoBtn.className = 'question-answer';

        gotoBtn.addEventListener('click', () => {
          store.patch({ activeAssayId: assay.id });
          if (router) router.navigate('design');
        });
        actions.appendChild(gotoBtn);

        if (assays.length > 1) {
          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.className = 'remove-factor-button';
          removeBtn.textContent = 'Delete';
          removeBtn.addEventListener('click', () => {
            const ok = window.confirm(
              `Delete "${assay.label || `Assay ${index + 1}`}" and all its design, panel, and naming data?\n\nThis cannot be undone.`
            );
            if (!ok) return;
            const result = removeAssay(store.get(), assay.id);
            if (result) {
              store.patch(result);
              renderAssayList();
              renderDivergence();
              renderIssues();
            }
          });
          actions.appendChild(removeBtn);
        }

        assayList.appendChild(row);
      });
    }

    const addAssayHint = document.createElement('p');
    addAssayHint.className = 'proposals-empty';
    const assayCount = Array.isArray(store.get().assays) ? store.get().assays.length : 0;

      assayCount >= MAX_STUDY_ROWS

    // --- Cross-assay collision check --------------------------------------

    issuesHeading.className = 'design-subheading';
    issuesHeading.textContent = 'Study-wide issues';
    main.appendChild(issuesHeading);

    issuesList.className = 'issues-list';
    main.appendChild(issuesList);

    function renderIssues() {
      const issues = studyNameIssues(store.get(), NAMING_CONFIG, BASE_TEMPLATE);
      issuesList.textContent = '';
      for (const issue of issues) {
        const li = document.createElement('li');
        li.className = 'issue issue-' + issue.severity;
        li.textContent = `${issue.field}: ${issue.message}`;
        issuesList.appendChild(li);
      }
    }

    renderDivergence();
    renderAssayList();
    renderIssues();
  },
};

const AUTOSAVE_DEBOUNCE_MS = 500;

/**
 * Read the knowledge pack from the ONE place its global is read, then hand
 * it to shapeAppKb (engine/kbpack.js) for the actual shaping -- that part is
 * a pure function and is what's under test; this wrapper is the one line
 * that is allowed to touch globalThis.
 *
 * globalThis.__MICRONAUT_KB__ is embedded by tools/build_single_file.py
 * (release) or web/kb.dev.js (dev, generated by tools/export_markers_kb.py)
 * -- both aggregate web/kb/*.json by filename stem. TOTAL: an absent/
 * malformed KB degrades to "no markers known, no questions, no advice"
 * (surfaced via the shell's toast), never a white screen.
 */
function loadAppKb() {
  const rawKb = typeof globalThis !== 'undefined' ? globalThis.__MICRONAUT_KB__ : undefined;
  return shapeAppKb(rawKb);
}

/**
 * The thin wrapper around core/persist.js's loadMostRecentRecoverable that
 * supplies main.js's own console.error logging and the createDefaultStudy()
 * fallback -- persist.js deliberately doesn't know what a fresh study looks
 * like, so `experiment: null` means "start fresh" here. Only fires when
 * NO usable autosave exists at all (true first run, or every ring slot was
 * corrupted) -- an existing in-progress study is never touched.
 */
function loadInitialExperiment() {
  const { experiment, skippedCount, totalSaved } = loadMostRecentRecoverable({
    onUnreadable: (id, err) =>
      console.error(`Discarding an unreadable autosave (slot ${id}), trying the next one:`, err),
  });
  return { experiment: experiment || createDefaultStudy(), skippedCount, totalSaved };
}

// Bootstrap, not top-level await -- the single-file inliner forbids
// top-level await since the released artifact is one classic (non-module,
// non-async) IIFE.
function init() {
  const { experiment: initialExperiment, skippedCount, totalSaved } = loadInitialExperiment();
  const store = createStore(initialExperiment);

  const kb = loadAppKb();
  const describeStep = createDescribeStep(kb);
  const overviewStep = createOverviewStep(kb);
  // Study first: it is the study-level surface sitting above every assay,
  // and the discoverability point for "this app can model more than one
  // assay" -- the router lands on steps[0] by default, so this is also the
  // new landing step. See docs/plans/planner-web-assay-tier.md, commit 2.
  // Overview last: it is a pure READ over every other step's data (the
  // shareable diagram + deterministic walkthrough), never a place new facts
  // are entered -- see ui/steps/overview.js's module header.
  const steps = [studyStep, describeStep, designStep, namingStep, overviewStep];
  const router = createRouter(steps);

  const root = document.getElementById('app');
  const { main, showToast } = renderShell(root, store, router, {
    // Clear persisted state BEFORE reloading. Resetting the in-memory store
    // instead would immediately trip the autosave subscription below and write
    // the empty experiment back as a NEW ring entry, leaving the old slots in
    // place for listSaved() to resurrect on the next load.
    onReset: () => {
      clearAll();
      window.location.reload();
    },
    // "New study": start from a genuinely blank experiment, not the oregano
    // example. Clear the autosave ring, persist the blank as the newest entry
    // so the reload restores IT (loadInitialExperiment would otherwise fall
    // straight back to createDefaultStudy when it finds no save), then reload
    // through the same clean path onReset uses.
    onNewBlank: () => {
      clearAll();
      saveExperiment(emptyExperiment());
      window.location.reload();
    },
  });

  if (kb.issues.length > 0) {
    showToast(
      `Knowledge pack loaded with ${kb.issues.length} issue(s) -- some markers or guidance may be unavailable.`
    );
  }

  // Shown AFTER the KB toast (shell.js's showToast is a single status
  // element, not a queue -- the later call wins the visible window), since
  // a possible-data-loss message is rarer and more consequential than a
  // KB-content issue.
  if (skippedCount > 0) {
    showToast(
      skippedCount < totalSaved
        ? `Recovered your work -- skipped ${skippedCount} unreadable autosave(s) and used an older one instead.`
        : `Couldn't read any of your ${totalSaved} saved experiment(s) -- starting fresh. Nothing was deleted.`
    );
  }

  function renderActiveStep(id) {
    const step = steps.find((s) => s.id === id) || steps[0];
    step.render(main, store, { showToast, advisor: kb.advisor, router });
  }

  router.onChange(renderActiveStep);
  renderActiveStep(router.current());

  // Every step's render() caches activeAssayId ONCE and documents that this
  // is only safe because the active assay never changes for the lifetime of
  // one render (see e.g. design.js's identical comment). The assay switcher
  // (shell.js) now makes that untrue, so switching assays must force a full
  // re-render of whichever step is on screen -- same as a route change,
  // because every closure inside render() (currentDesign(), prefill, etc.)
  // was built from the OLD assayId. Guarded on an actual change so ordinary
  // per-keystroke field edits (which also flow through this same
  // store.subscribe channel via the autosave one below) never trigger it.
  let lastActiveAssayId = store.get().activeAssayId;
  store.subscribe((state) => {
    if (state.activeAssayId !== lastActiveAssayId) {
      lastActiveAssayId = state.activeAssayId;
      renderActiveStep(router.current());
    }
  });

  // Debounced: saving on every keystroke would fill the 5-slot ring buffer
  // with near-duplicate snapshots of the last few characters typed, rather
  // than the last 5 genuinely distinct states the ring buffer exists to
  // preserve as history.
  let saveTimer = null;
  store.subscribe(() => {
    if (saveTimer) window.clearTimeout(saveTimer);
    saveTimer = window.setTimeout(() => {
      saveExperiment(store.get(), {
        onQuotaExceeded: () => {
          showToast('Storage is full -- changes are not being saved automatically. Export to a file.');
        },
      });
    }, AUTOSAVE_DEBOUNCE_MS);
  });
}

init();
})();
</script>
</body>
</html>
